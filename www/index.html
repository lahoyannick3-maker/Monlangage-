      // IMPORTANT : toute erreur qui remonte ici est enveloppee dans une ErreurLangage pour lui
      // attacher le numero de ligne (utilise pour l'affichage "Erreur ligne X: ..." si elle
      // n'est interceptee par aucun essai/attrape). Si l'erreur d'origine est une ErreurCode
      // (voir la hierarchie de classes plus haut), on DOIT recopier son .code sur la nouvelle
      // erreur : sinon essai/attrape(msg, code) ne verrait jamais que "SYNTAXE", meme pour une
      // division par zero, un fichier introuvable, etc. -- le code serait silencieusement perdu
      // a chaque rethrow alors qu'il vient tout juste d'etre leve plus bas dans la pile.
      let erreurLigne = new ErreurLangage(e.message, ligneActuelle);
      if (e instanceof ErreurCode) erreurLigne.code = e.code;
      throw erreurLigne;
    }
  }
  return { index: index, signal: null };
}

/* ===================== SAUVEGARDE / OUVERTURE ===================== */
function sauvegarderCode() {
  mettreAJourOngletDepuisEditeur();
  let onglet = trouverOnglet(ongletActifId);
  if (onglet) localStorage.setItem('monlangage_code', onglet.contenu);
}

/* ===================== NAVIGATEUR DE FICHIERS INTEGRE ===================== */
// Remplace les selecteurs systeme Android : navigation dans les dossiers du
// stockage, dans le style de l'app, pour Enregistrer (choisir nom + emplacement)
// et Ouvrir (choisir un fichier existant).
let navFichiersChemin = null;
let navFichiersMode = null; // "enregistrer" | "ouvrir"
let navFichiersRacine = "/storage/emulated/0";
let navFichiersOnValide = null;
// Callback appele UNIQUEMENT si l'utilisateur annule (bouton ANNULER), jamais apres une
// validation reussie -- permet a un appelant comme ecrire.fichier()/lire.fichier() (des
// promesses) de rejeter proprement au lieu de rester bloque indefiniment.
let navFichiersOnAnnule = null;
// Extension ajoutee automatiquement au nom de fichier en mode "enregistrer" (".mlg" pour
// les scripts, mais ecrire.fichier() par exemple utilise ".mld") -- affichee a cote du
// champ de saisie du nom.
let navFichiersExtension = ".mlg";

function ouvrirNavigateurFichiers(mode, options) {
  options = options || {};
  if (!(window.MonLangage && typeof window.MonLangage.listerDossier === "function")) {
    alert("Le navigateur de fichiers integre necessite l'app native (rebuild requis).");
    if (options.onAnnule) options.onAnnule();
    return;
  }
  if (typeof window.MonLangage.permissionStockageAccordee === "function" &&
      !window.MonLangage.permissionStockageAccordee()) {
    alert("MonLangage a besoin de l'acces au stockage pour " +
      (mode === "enregistrer" ? "enregistrer" : "ouvrir") + " des fichiers.\n\n" +
      "Sur l'ecran qui va s'ouvrir, active \"Autoriser l'acces a tous les fichiers\", " +
      "puis reviens dans l'app et reessaie.");
    if (typeof window.MonLangage.demanderPermissionStockage === "function") {
      window.MonLangage.demanderPermissionStockage();
    }
    if (options.onAnnule) options.onAnnule();
    return;
  }

  navFichiersMode = mode;
  navFichiersOnValide = options.onValide || null;
  navFichiersOnAnnule = options.onAnnule || null;
  navFichiersExtension = options.extension || ".mlg";
  navFichiersRacine = (typeof window.MonLangage.dossierRacine === "function")
    ? (window.MonLangage.dossierRacine() || navFichiersRacine) : navFichiersRacine;

  modalFichiersNomLigne.classList.toggle("visible", mode === "enregistrer");
  modalFichiersNom.value = options.nomDefaut || "";
  modalFichiersExtension.textContent = navFichiersExtension;
  modalFichiersValider.style.display = mode === "enregistrer" ? "" : "none";
  modalFichiersValider.textContent = "ENREGISTRER";

  chargerDossierNavigateur(navFichiersRacine);
  modalFichiers.classList.add("ouvert");
}

function fermerNavigateurFichiers() {
  modalFichiers.classList.remove("ouvert");
  navFichiersOnValide = null;
  navFichiersOnAnnule = null;
}

function chargerDossierNavigateur(chemin) {
  navFichiersChemin = chemin;
  modalFichiersChemin.textContent = chemin;

  let elements = [];
  try { elements = JSON.parse(window.MonLangage.listerDossier(chemin) || "[]"); } catch (_) { elements = []; }

  modalFichiersListe.innerHTML = "";

  let visibles = elements.filter(el => navFichiersMode === "ouvrir" || el.dossier);
  if (visibles.length === 0) {
    let vide = document.createElement("div");
    vide.className = "modalFichiersVide";
    vide.textContent = "Dossier vide";
    modalFichiersListe.appendChild(vide);
    return;
  }

  visibles.forEach(el => {
    let ligne = document.createElement("div");
    ligne.className = "modalFichiersLigne";

    let icone = document.createElement("span");
    icone.className = "icone";
    icone.textContent = el.dossier ? "📁" : "📄";

    let nom = document.createElement("span");
    nom.className = "nom";
    nom.textContent = el.nom;

    ligne.appendChild(icone);
    ligne.appendChild(nom);

    ligne.addEventListener("click", () => {
      let cheminEnfant = chemin.replace(/\/+$/, "") + "/" + el.nom;
      if (el.dossier) {
        chargerDossierNavigateur(cheminEnfant);
      } else {
        validerNavigateurFichiers(cheminEnfant);
      }
    });

    modalFichiersListe.appendChild(ligne);
  });
}

function validerNavigateurFichiers(cheminComplet) {
  let cb = navFichiersOnValide;
  fermerNavigateurFichiers();
  if (cb) cb(cheminComplet);
}

modalFichiersRetour.addEventListener("click", () => {
  if (!navFichiersChemin || navFichiersChemin === navFichiersRacine) return;
  let parent = navFichiersChemin.replace(/\/[^\/]+\/?$/, "");
  if (!parent || parent.length < navFichiersRacine.length) parent = navFichiersRacine;
  chargerDossierNavigateur(parent);
});

modalFichiersAnnuler.addEventListener("click", () => {
  let cbAnnule = navFichiersOnAnnule;
  fermerNavigateurFichiers();
  if (cbAnnule) cbAnnule();
});

modalFichiersValider.addEventListener("click", () => {
  if (navFichiersMode !== "enregistrer") return;
  let ext = navFichiersExtension || "";
  let regexExt = new RegExp(ext.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "$", "i");
  let nom = (modalFichiersNom.value || "").trim().replace(regexExt, "");
  if (!nom) { alert("Entre un nom de fichier."); return; }
  let cheminComplet = navFichiersChemin.replace(/\/+$/, "") + "/" + nom + ext;
  validerNavigateurFichiers(cheminComplet);
});

function ouvrirFichierMlg(fichier) {
  if (!fichier) return;
  let lecteur = new FileReader();
  lecteur.onload = () => {
    chargerFichierDansNouvelOnglet(lecteur.result, fichier.name);
  };
  lecteur.onerror = () => alert("Impossible de lire ce fichier.");
  lecteur.readAsText(fichier);
}

btnSauver.addEventListener("click", enregistrerFichierMlg);

// Menu regroupant les actions "Nouveau" et "Ouvrir" pour alléger la barre du haut.
btnOuvrir.addEventListener("click", (e) => {
  e.stopPropagation();
  menuOuvrir.classList.toggle("ouvert");
});

btnMenuNouvelOnglet.addEventListener("click", () => {
  nouvelOnglet();
  menuOuvrir.classList.remove("ouvert");
});

btnMenuOuvrirFichier.addEventListener("click", () => {
  menuOuvrir.classList.remove("ouvert");
  if (window.MonLangage && typeof window.MonLangage.listerDossier === "function") {
    ouvrirNavigateurFichiers("ouvrir", {
      onValide: (cheminComplet) => {
        let texte = window.MonLangage.lireFichier(cheminComplet);
        if (texte === null || texte === undefined) {
          alert("Impossible de lire ce fichier.");
          return;
        }
        let nom = cheminComplet.substring(cheminComplet.lastIndexOf("/") + 1);
        let dossier = cheminComplet.substring(0, cheminComplet.lastIndexOf("/"));
        chargerFichierDansNouvelOnglet(texte, nom, dossier);
      }
    });
    return;
  }
  if (window.MonLangage && typeof window.MonLangage.openFile === "function") {
    window.MonLangage.openFile();
    return;
  }
  inputOuvrir.click();
});

inputOuvrir.addEventListener("change", () => {
  ouvrirFichierMlg(inputOuvrir.files[0]);
  inputOuvrir.value = "";
});

document.addEventListener("click", (e) => {
  if (!e.target.closest(".menuOuvrir")) menuOuvrir.classList.remove("ouvert");
});

/* ===================== BOUTON RETOUR MATERIEL ANDROID ===================== */
// Ordre de priorite : on referme d'abord ce qui est ouvert par-dessus l'editeur
// (navigateur de fichiers, menu Ouvrir, console), et on ne quitte VRAIMENT l'app
// que si on est deja sur l'ecran de l'editeur sans aucune fenetre active.
if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
  window.Capacitor.Plugins.App.addListener("backButton", () => {
    if (modalFichiers.classList.contains("ouvert")) {
      fermerNavigateurFichiers();
      return;
    }
    if (menuOuvrir.classList.contains("ouvert")) {
      menuOuvrir.classList.remove("ouvert");
      return;
    }
    if (ecranConsole.classList.contains("actif")) {
      quitterConsole();
      return;
    }
    if (ecranSpecification.classList.contains("actif")) {
      fermerSpecification();
      return;
    }
    // Vraiment dans l'editeur, aucune fenetre active : on quitte l'app.
    window.Capacitor.Plugins.App.exitApp();
  });
}

/*
 * Appelee par MainActivity.java quand un fichier est choisi avec le selecteur
 * Android ou quand un .mlg est ouvert depuis le gestionnaire de fichiers.
 * Chaque ouverture cree un nouvel onglet : aucun onglet existant n'est ecrase.
 */
window.chargerFichierExterne = function(texte, nom) {
  chargerFichierDansNouvelOnglet(texte, nom || "sans titre");
};

function majNumeros() {
  let n = codeArea.value.split('\n').length;
  let html = "";
  for (let i = 1; i <= n; i++) html += i + (i < n ? "\n" : "");
  numeros.textContent = html;
}

// Coloration syntaxique en direct dans l'editeur : recalcule la couche coloree
// (derriere le textarea, dont le texte est rendu transparent) a chaque frappe.
function majSurbrillance() {
  // Une ligne totalement vide (rien entre deux "\n", ou apres le tout dernier "\n") ne
  // contient aucun caractere : certains moteurs de rendu mobiles ne lui attribuent alors
  // aucune hauteur de ligne dans ce <div>, alors que le textarea, lui, affiche toujours
  // une ligne pour chaque retour a la ligne (y compris le tout dernier, meme vide). Ce
  // manque de hauteur decalait tout le reste du calque colore d'une ligne par rapport au
  // textarea et a la colonne des numeros, precisement au niveau d'une ligne vide. On force
  // donc chaque ligne vide a contenir un caractere invisible (espace de largeur nulle),
  // qui donne une vraie hauteur de ligne sans rien changer visuellement.
  let valeurProtegee = codeArea.value.split('\n').map(l => l === "" ? "\u200B" : l).join('\n');
  codeHighlight.innerHTML = genererHTMLColore(valeurProtegee);
}

// Resynchronise la colonne des numeros de ligne et le calque de coloration sur le
// defilement du textarea. Appelee au 'scroll', mais AUSSI apres chaque frappe et apres
// un redimensionnement (voir plus bas) : le defilement automatique du curseur (quand on
// tape en bas de l'ecran, ou quand le clavier virtuel s'ouvre/se ferme) deplace parfois le
// scroll du textarea SANS declencher l'evenement 'scroll' du navigateur, ce qui pouvait
// decaler durablement la colonne des numeros par rapport au code (voir aussi
// requestAnimationFrame ci-dessous, pour rattraper un ajustement de scroll survenant
// apres coup, au frame suivant).
function synchroniserScrollEditeur() {
  numeros.scrollTop = codeArea.scrollTop;
  codeHighlight.scrollTop = codeArea.scrollTop;
  codeHighlight.scrollLeft = codeArea.scrollLeft;
  majLigneActive();
}

// Surligne la ligne ou se trouve le curseur (translateY plutot que top : evite de
// forcer un recalcul de mise en page a chaque frappe/scroll, juste un deplacement de
// calque). Appelee depuis synchroniserScrollEditeur, donc suit deja tous les evenements
// qui peuvent deplacer le curseur ou faire defiler (frappe, clic, scroll, tactile...).
function majLigneActive() {
  // Ne depend plus d'une hauteur de ligne codee en dur : sur Android/WebView,
  // la hauteur reelle peut varier legerement selon le zoom, la police ou le clavier.
  // On utilise les valeurs reellement appliquees au textarea pour que le bandeau
  // bleu reste exactement sur la ligne du curseur.
  let avantCurseur = codeArea.value.slice(0, codeArea.selectionStart);
  let ligneIndex = avantCurseur.split('\n').length - 1;
  let style = window.getComputedStyle(codeArea);
  let lineHeight = parseFloat(style.lineHeight) || 23;
  let paddingTop = parseFloat(style.paddingTop) || 0;
  let decalage = paddingTop + ligneIndex * lineHeight - codeArea.scrollTop;
  ligneActiveEl.style.height = lineHeight + 'px';
  ligneActiveEl.style.transform = 'translateY(' + decalage + 'px)';
}

codeArea.addEventListener('input', () => {
  majNumeros(); majSurbrillance(); sauvegarderCode();
  synchroniserScrollEditeur();
  requestAnimationFrame(synchroniserScrollEditeur);
  planifierHistorique();
});
codeArea.addEventListener('scroll', synchroniserScrollEditeur);
codeArea.addEventListener('click', () => requestAnimationFrame(synchroniserScrollEditeur));
codeArea.addEventListener('keyup', () => {
  requestAnimationFrame(() => {
    synchroniserScrollEditeur();
    sauvegarderPositionEtEtat();
  });
});
codeArea.addEventListener('mouseup', () => requestAnimationFrame(sauvegarderPositionEtEtat));
codeArea.addEventListener('touchend', () => requestAnimationFrame(sauvegarderPositionEtEtat), { passive: true });
// selectionchange couvre notamment les deplacements de curseur effectues par Android.
document.addEventListener('selectionchange', () => {
  if (document.activeElement === codeArea) {
    memoriserPositionEditeur();
    clearTimeout(window.__sauvegardeCurseurTimer);
    window.__sauvegardeCurseurTimer = setTimeout(sauvegarderEtatOnglets, 40);
  }
});
// Le clavier virtuel qui s'ouvre/se ferme redimensionne la zone visible et peut deplacer
// le scroll du textarea sans evenement 'scroll' associe.
window.addEventListener('resize', () => requestAnimationFrame(synchroniserScrollEditeur));

// Sauvegarde de securite avant que l'application ou l'aperçu soit masque/quitte.
// visibilitychange est le plus fiable sur Android WebView, tandis que pagehide couvre
// aussi la navigation/fermeture de la page.
function sauvegarderAvantSortie() {
  memoriserPositionEditeur();
  sauvegarderEtatOnglets();
}
document.addEventListener('visibilitychange', sauvegarderAvantSortie);
window.addEventListener('pagehide', sauvegarderAvantSortie);
window.addEventListener('beforeunload', sauvegarderAvantSortie);

// Sur mobile, un defilement au doigt continue par inertie (momentum) bien apres le
// relachement du doigt, et l'evenement 'scroll' du navigateur ne se declenche pas assez
// souvent pour suivre ce mouvement en continu : la colonne des numeros prenait du retard
// et restait durablement decalee une fois l'inertie stabilisee. On resynchronise donc a
// CHAQUE frame d'affichage (requestAnimationFrame) pendant tout le defilement tactile, et
// on prolonge cette boucle un court instant apres le relachement du doigt pour couvrir
// l'inertie residuelle.
let synchroContinueActive = false;
let arretSynchroContinueMinuteur = null;
function boucleSynchroContinue() {
  synchroniserScrollEditeur();
  if (synchroContinueActive) requestAnimationFrame(boucleSynchroContinue);
}
function demarrerSynchroContinue() {
  if (arretSynchroContinueMinuteur) { clearTimeout(arretSynchroContinueMinuteur); arretSynchroContinueMinuteur = null; }
  if (!synchroContinueActive) { synchroContinueActive = true; boucleSynchroContinue(); }
}
function arreterSynchroContinueApresDelai(delaiMs = 600) {
  if (arretSynchroContinueMinuteur) clearTimeout(arretSynchroContinueMinuteur);
  arretSynchroContinueMinuteur = setTimeout(() => { synchroContinueActive = false; synchroniserScrollEditeur(); }, delaiMs);
}
codeArea.addEventListener('touchstart', demarrerSynchroContinue, { passive: true });
codeArea.addEventListener('touchmove', demarrerSynchroContinue, { passive: true });
codeArea.addEventListener('touchend', () => arreterSynchroContinueApresDelai(), { passive: true });
codeArea.addEventListener('touchcancel', () => arreterSynchroContinueApresDelai(), { passive: true });

/* ===================== HISTORIQUE ANNULER / RETABLIR (maison) ===================== */
// L'undo/redo natif du navigateur ne suffit pas ici : on reassigne nous-memes
// codeArea.value a plusieurs endroits (changement d'onglet, collage, etc.), ce qui vide
// son historique natif a chaque fois. Un historique maison, par onglet (stocke dans
// onglet.historique -- voir creerOnglet), survit a tout ca.
const HISTORIQUE_MAX = 100;
const HISTORIQUE_DEBOUNCE_MS = 500;
let minuteurHistorique = null;

function empilerHistorique(onglet, force = false) {
  if (!onglet) return;
  if (!onglet.historique) onglet.historique = { piles: [codeArea.value], index: 0 };
  let h = onglet.historique;
  let valeurActuelle = codeArea.value;
  if (h.piles[h.index] === valeurActuelle) return; // rien de nouveau depuis le dernier point
  // Ecrit une nouvelle modification : coupe le "futur" (les etats de retablissement
  // deviennent inaccessibles, comme dans n'importe quel editeur).
  h.piles = h.piles.slice(0, h.index + 1);
  h.piles.push(valeurActuelle);
  if (h.piles.length > HISTORIQUE_MAX) h.piles.shift();
  h.index = h.piles.length - 1;
  majEtatBoutonsHistorique();
}

// Plutot que d'empiler un point d'historique a CHAQUE caractere tape (bruyant, un undo
// n'annulerait qu'une lettre a la fois), on attend une pause de frappe avant d'enregistrer
// un point -- comme la plupart des editeurs de texte.
function planifierHistorique() {
  if (minuteurHistorique) clearTimeout(minuteurHistorique);
  minuteurHistorique = setTimeout(() => empilerHistorique(trouverOnglet(ongletActifId)), HISTORIQUE_DEBOUNCE_MS);
}

function majEtatBoutonsHistorique() {
  let onglet = trouverOnglet(ongletActifId);
  let h = onglet && onglet.historique;
  btnAnnuler.disabled = !h || h.index <= 0;
  btnRefaire.disabled = !h || h.index >= h.piles.length - 1;
}

function restaurerDepuisHistorique(h) {
  codeArea.value = h.piles[h.index];
  codeArea.selectionStart = codeArea.selectionEnd = codeArea.value.length;
  majNumeros(); majSurbrillance(); sauvegarderCode();
  requestAnimationFrame(synchroniserScrollEditeur);
  majEtatBoutonsHistorique();
}

function annulerEdition() {
  let onglet = trouverOnglet(ongletActifId);
  if (!onglet) return;
  if (minuteurHistorique) { clearTimeout(minuteurHistorique); minuteurHistorique = null; }
  empilerHistorique(onglet); // fige la frappe en cours avant de reculer, sinon elle serait perdue
  let h = onglet.historique;
  if (!h || h.index <= 0) return;
  h.index--;
  restaurerDepuisHistorique(h);
}

function refaireEdition() {
  let onglet = trouverOnglet(ongletActifId);
  let h = onglet && onglet.historique;
  if (!h || h.index >= h.piles.length - 1) return;
  h.index++;
  restaurerDepuisHistorique(h);
}

btnAnnuler.addEventListener('click', annulerEdition);
btnRefaire.addEventListener('click', refaireEdition);

/* ===================== DEPLACEMENT DU CURSEUR (boutons ◀ ▶) ===================== */
// Vise precisement un point entre deux caracteres au doigt est difficile sur mobile,
// surtout pour se replacer dans du code dense (parentheses/textes |...| imbriques). Ces
// deux boutons deplacent le curseur d'un caractere, sans avoir a re-toucher l'ecran.
function deplacerCurseur(delta) {
  // Les boutons ne doivent pas prendre le focus a la place de l'editeur.
  // On conserve donc la position actuelle, deplace le curseur, puis resynchronise
  // immediatement la ligne active.
  codeArea.focus({ preventScroll: true });
  let position = codeArea.selectionStart === codeArea.selectionEnd
    ? codeArea.selectionStart
    : (delta < 0 ? codeArea.selectionStart : codeArea.selectionEnd); // collapse une selection vers le bon bord
  let nouvellePosition = Math.max(0, Math.min(codeArea.value.length, position + delta));
  codeArea.selectionStart = codeArea.selectionEnd = nouvellePosition;

  // Quand le curseur quitte la zone actuellement visible, le simple changement de
  // selection ne suffit pas toujours sur Android/WebView (surtout parce que le bouton
  // de la barre d'outils conserve le focus logique). On ramene donc explicitement la
  // ligne du curseur dans la zone visible avant de redessiner la ligne active.
  assurerLigneVisible(nouvellePosition);

  memoriserPositionEditeur();
  sauvegarderEtatOnglets();
  majLigneActive();
  requestAnimationFrame(() => {
    assurerLigneVisible(nouvellePosition);
    synchroniserScrollEditeur();
  });
}

// Sur Android, certains WebView refocalisent le bouton au moment du toucher.
// Empeche ce changement de focus pour que le curseur de l'editeur reste la reference.
[btnCurseurGauche, btnCurseurDroite].forEach(btn => {
  btn.addEventListener('pointerdown', e => e.preventDefault());
});
// Un clic deplace d'un caractere. Un appui prolonge repete le meme deplacement
// automatiquement, comme les fleches d'un clavier. On attend un court delai avant
// le premier deplacement du maintien afin qu'un simple clic ne deplace pas deux fois.
const DELAI_APPUI_PROLONGE_CURSEUR = 280;
const INTERVALLE_APPUI_PROLONGE_CURSEUR = 65;
let repetitionCurseurMinuteur = null;
let repetitionCurseurIntervalle = null;
let repetitionCurseurLongue = false;
let repetitionCurseurSupprimerClic = false;

function arreterRepetitionCurseur() {
  if (repetitionCurseurMinuteur !== null) {
    clearTimeout(repetitionCurseurMinuteur);
    repetitionCurseurMinuteur = null;
  }
  if (repetitionCurseurIntervalle !== null) {
    clearInterval(repetitionCurseurIntervalle);
    repetitionCurseurIntervalle = null;
  }
}

function demarrerRepetitionCurseur(delta) {
  arreterRepetitionCurseur();
  repetitionCurseurLongue = false;
  repetitionCurseurSupprimerClic = false;

  repetitionCurseurMinuteur = setTimeout(() => {
    repetitionCurseurMinuteur = null;
    repetitionCurseurLongue = true;
    repetitionCurseurSupprimerClic = true;
    deplacerCurseur(delta);
    repetitionCurseurIntervalle = setInterval(() => {
      deplacerCurseur(delta);
    }, INTERVALLE_APPUI_PROLONGE_CURSEUR);
  }, DELAI_APPUI_PROLONGE_CURSEUR);
}

[
  [btnCurseurGauche, -1],
  [btnCurseurDroite, 1]
].forEach(([btn, delta]) => {
  btn.addEventListener('pointerdown', e => {
    // Conserve le focus logique de l'editeur et demarre la detection du maintien.
    e.preventDefault();
    try { btn.setPointerCapture(e.pointerId); } catch (_) {}
    demarrerRepetitionCurseur(delta);
  });

  const terminer = e => {
    arreterRepetitionCurseur();
    // Si l'appui a ete assez long, le deplacement a deja ete fait par la repetition.
    // On empeche donc le click genere au relachement de faire un caractere de plus.
    if (repetitionCurseurLongue) {
      e.preventDefault();
    }
  };

  btn.addEventListener('pointerup', terminer);
  btn.addEventListener('pointercancel', terminer);
  btn.addEventListener('lostpointercapture', () => arreterRepetitionCurseur());
  btn.addEventListener('click', () => {
    // Clic court uniquement : un appui long a deja ete traite.
    if (repetitionCurseurSupprimerClic) {
      repetitionCurseurSupprimerClic = false;
      repetitionCurseurLongue = false;
      return;
    }
    deplacerCurseur(delta);
  });
});

/* ===================== RECHERCHE DANS LE CODE ===================== */
let rechercheResultats = [];
let rechercheIndexActuel = -1;

function ouvrirRecherche() {
  barreRechercheEl.classList.add('visible');
  rechercheTexteEl.focus();
  rechercheTexteEl.select();
}
function fermerRecherche() {
  barreRechercheEl.classList.remove('visible');
  rechercheResultats = [];
  rechercheIndexActuel = -1;
  codeArea.focus();
}
function majCompteRecherche() {
  rechercheCompteEl.textContent = !rechercheTexteEl.value ? ""
    : (rechercheResultats.length ? (rechercheIndexActuel + 1) + "/" + rechercheResultats.length : "0/0");
}
// Assure que la ligne visee est visible dans le textarea (setSelectionRange seul ne fait
// pas toujours defiler la vue sur mobile) : ajuste scrollTop manuellement si la ligne
// tombe hors de la fenetre actuellement visible.
function assurerLigneVisible(position) {
  let ligne = codeArea.value.slice(0, position).split('\n').length - 1;
  let style = window.getComputedStyle(codeArea);
  let lineHeight = parseFloat(style.lineHeight) || 23;
  let paddingTop = parseFloat(style.paddingTop) || 0;
  let paddingBottom = parseFloat(style.paddingBottom) || 0;
  let yLigne = paddingTop + ligne * lineHeight;
  let hauteurUtile = Math.max(lineHeight, codeArea.clientHeight - paddingTop - paddingBottom);
  let vueHaut = codeArea.scrollTop + paddingTop;
  let vueBas = codeArea.scrollTop + codeArea.clientHeight - paddingBottom - lineHeight;

  // Laisser une petite marge rend le suivi plus confortable lorsque le curseur
  // arrive sur la première ou la dernière ligne visible.
  let marge = Math.min(lineHeight, Math.max(4, hauteurUtile * 0.08));
  if (yLigne < vueHaut + marge) {
    codeArea.scrollTop = Math.max(0, yLigne - marge - paddingTop);
  } else if (yLigne > vueBas - marge) {
    codeArea.scrollTop = Math.max(0, yLigne - codeArea.clientHeight + paddingBottom + lineHeight + marge);
  }

  synchroniserScrollEditeur();
}
function rechercherDansCode() {
  let terme = rechercheTexteEl.value;
  rechercheResultats = [];
  rechercheIndexActuel = -1;
  if (terme) {
    let texte = codeArea.value.toLowerCase();
    let t = terme.toLowerCase();
    let i = 0;
    while (true) {
      let pos = texte.indexOf(t, i);
      if (pos === -1) break;
      rechercheResultats.push({ debut: pos, fin: pos + terme.length });
      i = pos + 1;
    }
    if (rechercheResultats.length) { rechercheIndexActuel = 0; allerAOccurrence(0); return; }
  }
  majCompteRecherche();
}
function allerAOccurrence(index) {
  if (!rechercheResultats.length) return;
  rechercheIndexActuel = ((index % rechercheResultats.length) + rechercheResultats.length) % rechercheResultats.length;
  let r = rechercheResultats[rechercheIndexActuel];

  // IMPORTANT : ne pas appeler codeArea.focus() ici. Sur Android, cela fait sortir
  // le curseur du champ de recherche des qu'une occurrence est trouvee. Le caractere
  // tape ensuite remplace alors le terme de recherche au lieu de le completer.
  // setSelectionRange() fonctionne sans donner le focus au textarea : la recherche
  // reste donc active et le clavier continue de saisir dans #rechercheTexte.
  codeArea.setSelectionRange(r.debut, r.fin);
  assurerLigneVisible(r.debut);
  majLigneActive();
  majCompteRecherche();

  // Si l'utilisateur vient d'appuyer sur ↑/↓, le bouton ne doit pas devenir le
  // champ de saisie actif : on rend le focus au champ de recherche.
  if (document.activeElement !== rechercheTexteEl) rechercheTexteEl.focus({ preventScroll: true });
}
rechercheTexteEl.addEventListener('input', rechercherDansCode);
rechercheTexteEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); allerAOccurrence(rechercheIndexActuel + (e.shiftKey ? -1 : 1)); }
  else if (e.key === 'Escape') { fermerRecherche(); }
});
btnRechercheSuivant.addEventListener('click', () => allerAOccurrence(rechercheIndexActuel + 1));
btnRecherchePrecedent.addEventListener('click', () => allerAOccurrence(rechercheIndexActuel - 1));
btnRechercheFermer.addEventListener('click', fermerRecherche);
btnRechercheOutil.addEventListener('click', () => {
  if (barreRechercheEl.classList.contains('visible')) fermerRecherche(); else ouvrirRecherche();
});

/* ===================== COLLAGE (natif + bouton dedie) ===================== */
// Un gros collage (texte long copie depuis ailleurs) declenche majNumeros()/majSurbrillance()
// comme une frappe normale. Mais pour un texte tres long, ce recalcul (surtout la coloration
// syntaxique, qui reconstruit tout le HTML colore) peut prendre un instant perceptible,
// pendant lequel rien ne montre que le collage a bien ete pris en compte : l'ecran semble
// fige, comme si l'appui n'avait rien fait. En dessous du seuil, insertion immediate, sans
// badge (deja instantane). Au-dessus, le badge "Collage en cours" s'affiche AVANT de lancer
// le recalcul couteux : le decouper en deux requestAnimationFrame laisse le temps au
// navigateur de peindre le badge a l'ecran avant que le calcul (synchrone, donc bloquant)
// ne demarre. Fonction commune au collage natif (bulle "Coller"/Ctrl+V) et au bouton dedie
// de la barre d'outils du bas, pour que les deux passent par le meme historique annuler/retablir.
const SEUIL_INDICATEUR_COLLAGE = 500; // caracteres
function collerTexteDansEditeur(texte) {
  if (!texte) return;
  let debut = codeArea.selectionStart;
  let fin = codeArea.selectionEnd;
  function inserer() {
    let valeurActuelle = codeArea.value;
    codeArea.value = valeurActuelle.slice(0, debut) + texte + valeurActuelle.slice(fin);
    let nouvellePosition = debut + texte.length;
    codeArea.selectionStart = codeArea.selectionEnd = nouvellePosition;
    majNumeros(); majSurbrillance(); sauvegarderCode();
    synchroniserScrollEditeur();
    empilerHistorique(trouverOnglet(ongletActifId));
    indicateurAttenteEl.classList.remove('visible');
  }
  if (texte.length >= SEUIL_INDICATEUR_COLLAGE) {
    indicateurAttenteEl.classList.add('visible');
    texteIndicateurAttenteEl.textContent = 'Collage en cours…';
    requestAnimationFrame(() => requestAnimationFrame(inserer));
  } else {
    inserer();
  }
}
codeArea.addEventListener('paste', (evenement) => {
  let presseFeuille = evenement.clipboardData || window.clipboardData;
  let texteColle = presseFeuille ? presseFeuille.getData('text') : '';
  if (!texteColle) return;
  evenement.preventDefault();
  collerTexteDansEditeur(texteColle);
});
// Bouton dédié : le bouton reste disponible pour coller depuis le presse-papiers.
// Les actions natives Copier/Couper/Coller de l'interface sont bloquées séparément
// plus bas : cela n'empêche donc pas le clic normal sur ce bouton.
btnCollerOutil.addEventListener('click', async () => {
  codeArea.focus();
  let texte = null;
  try {
    if (navigator.clipboard && navigator.clipboard.readText) texte = await navigator.clipboard.readText();
  } catch (e) { /* permission refusée ou API indisponible : on tente le repli */ }
  if (texte) { collerTexteDansEditeur(texte); return; }
  let ok = false;
  try { ok = document.execCommand('paste'); } catch (e) { ok = false; }
  if (!ok) afficherToastEnregistrement(false, "Collage indisponible ici -- utilise l'appui long > Coller");
});
/* ===================== LANCEMENT DU SCRIPT ===================== */
let scriptEnArrierePlan = false;
// VRAI seulement quand le script courant a ete envoye AU SERVICE (bouton FOND). Un script lance
// avec RUN tourne dans la console visible : la synchronisation avec le service (resultat publie,
// arret) ne doit alors JAMAIS le toucher.
let executionViaService = false;
let dernierIdServiceVu = 0;
let resultatServiceAffiche = new Set();

function serviceDisponible() {
  return !!(window.MonLangage && typeof window.MonLangage.envoyerScriptService === "function");
}

function serviceScriptActif() {
  try {
    return !!(window.MonLangage && typeof window.MonLangage.serviceScriptEnCours === "function" && window.MonLangage.serviceScriptEnCours());
  } catch (_) { return false; }
}

function arreterScriptEnCours() {
  demandeArret = true;
  if (annulerSaisieEnCours) annulerSaisieEnCours();
  // Reveil immediat d'un attendre() en cours : sans ca, l'arret n'est constate qu'au
  // declenchement naturel du timer (jusqu'a plusieurs secondes de retard). Meme reveil
  // que celui utilise par arreterExecutionExterne(...).
  annulerAttenteEnCoursMLG();
  arreterIndicateurAttente();
  if (executionViaService && serviceDisponible() && typeof window.MonLangage.arreterScriptService === "function") {
    try { window.MonLangage.arreterScriptService(); } catch (_) {}
  }
  executionViaService = false;
  executionEnCours = false;
  scriptEnArrierePlan = false;
  btnArretUrgence.hidden = true;
  btnRun.disabled = false;
}

// Le resultat publie par le service est une simple chaine de texte : les classes CSS
// ("erreur" en rouge) appliquees par print() pendant l'execution locale ne survivent pas
// a la traversee du pont natif. On les retrouve donc ligne par ligne, en reconnaissant les
// memes formats de message que ceux produits par executerScriptLocal(...) ci-dessous
// ("Erreur ligne X: ...", "Erreur: ...", "Erreur de syntaxe ligne X: ...", "=== EXECUTION
// ARRETEE ===", etc.), pour que ces lignes ressortent en rouge comme le reste de la console.
const REGEX_LIGNE_ERREUR_SERVICE = /^(Erreur(:| ligne \d+:| de syntaxe ligne \d+:)|=== EXECUTION ARRETEE ===|\.\.\. et \d+ autre\(s\) erreur\(s\) de syntaxe|Le script n'a pas ete execute : aucune instruction n'a ete lancee\.)/;
function imprimerResultatService(resultat) {
  for (const ligne of String(resultat).split("\n")) {
    print(ligne, REGEX_LIGNE_ERREUR_SERVICE.test(ligne) ? "erreur" : "");
  }
}

function synchroniserEtatService() {
  // Le bouton FOND n'existe que dans l'application Android (le pont natif peut apparaitre un
  // peu apres le chargement de la page : on le re-teste ici, toutes les 500 ms).
  btnRunFond.hidden = !serviceDisponible();
  if (!serviceDisponible() || typeof window.MonLangage.serviceScriptEnCours !== "function") return;
  let actif = serviceScriptActif();
  if (actif) {
    executionViaService = true;
    executionEnCours = true;
    btnRun.disabled = true;
    if (ecranConsole.classList.contains("actif")) btnArretUrgence.hidden = false;
    return;
  }
  // Script lance avec RUN (console visible) : rien a synchroniser avec le service.
  if (!executionEnCours || !executionViaService) return;

  let dernierId = 0;
  let resultat = "";
  try { dernierId = Number(window.MonLangage.dernierResultatServiceId()) || 0; } catch (_) {}
  try { resultat = window.MonLangage.dernierResultatService() || ""; } catch (_) {}

  // Si le service n'est plus actif mais n'a pas encore publie un nouveau resultat,
  // l'execution peut simplement etre en cours de demarrage. Ne remettons donc PAS RUN
  // a zero trop tot. La fin est reconnue par l'apparition d'un nouvel id d'execution.
  if (dernierId <= dernierIdServiceVu) return;

  dernierIdServiceVu = dernierId;
  if (!resultatServiceAffiche.has(dernierId) && ecranConsole.classList.contains("actif")) {
    resultatServiceAffiche.add(dernierId);
    if (resultat) imprimerResultatService(resultat);
    print("=== FIN ===");
    // Le service ne manipule pas la console visible de MainActivity. Une fois le script
    // termine, on recree donc explicitement l'invite que l'execution locale affichait
    // auparavant. Le curseur redevient ainsi disponible comme avant l'ajout du service.
    printInvite();
  }
  executionViaService = false;
  executionEnCours = false;
  scriptEnArrierePlan = false;
  demandeArret = false;
  btnRun.disabled = false;
  btnArretUrgence.hidden = true;
  arreterIndicateurAttente();
}

// RUN : execute le script dans la console VISIBLE de l'application -- interactive (entr(),
// entr.secret()..., trac()), sortie affichee en direct, arret d'urgence. Ne passe JAMAIS par le
// service : l'utilisateur n'a rien autorise. Pour mettre ensuite un script en arriere-plan :
// "Retour" pendant l'execution ouvre le dialogue de confirmation (oui / non), ou bouton FOND.
async function runScript() {
  if (serviceScriptActif()) {
    afficherConsole();
    print("Un script tourne deja en arriere-plan (service Android) : arrete-le avec le bouton d'arret d'urgence, ou avec « Arreter » dans la notification « MonLangage actif », avant de lancer RUN.", "erreur");
    return;
  }
  if (executionEnCours) {
    afficherConsole();
    print("Script en cours", "erreur");
    return;
  }
  scriptEnArrierePlan = false;
  executionViaService = false;
  await executerScriptLocal(codeArea.value);
}

// FOND : choix EXPLICITE de l'utilisateur. Le script est remis au service Android, qui possede sa
// propre WebView sans interface et reste vivant meme quand l'application est fermee. Pas de
// console : entr() est donc indisponible (erreur claire), la sortie s'affiche a la fin.
async function runScriptArrierePlan() {
  if (!serviceDisponible()) {
    afficherConsole();
    print("Execution en arriere-plan indisponible ici (application Android requise).", "erreur");
    return;
  }
  if (serviceScriptActif() || executionEnCours) {
    afficherConsole();
    print("Script en cours", "erreur");
    return;
  }
  let script = codeArea.value;
  if (!script.trim()) {
    afficherConsole();
    print("Aucun script à exécuter.", "erreur");
    return;
  }
  try {
    dernierIdServiceVu = Number(window.MonLangage.dernierResultatServiceId()) || 0;
    // L'utilisateur vient de choisir l'arriere-plan : pas de seconde confirmation au "Retour".
    scriptEnArrierePlan = true;
    executionViaService = true;
    executionEnCours = true;
    demandeArret = false;
    afficherConsole();
    // Ne pas effacer la console lors d'un nouveau lancement : les sorties des executions
    // precedentes doivent rester visibles. L'effacement est reserve a effa().
    print("=== EXECUTION EN ARRIERE-PLAN ===");
    print("(sortie affichee a la fin du script ; entr() indisponible)");
    btnRun.disabled = true;
    btnArretUrgence.hidden = false;
    demarrerIndicateurAttente();
    window.MonLangage.envoyerScriptService(script);
    // Le service fait lui-meme le controle anti-double-lancement. On resynchronise
    // rapidement l'etat pour couvrir la petite fenetre entre l'envoi et sa reception.
    setTimeout(synchroniserEtatService, 100);
  } catch (e) {
    executionViaService = false;
    scriptEnArrierePlan = false;
    executionEnCours = false;
    btnRun.disabled = false;
    btnArretUrgence.hidden = true;
    print("Erreur: impossible de démarrer le service: " + e.message, "erreur");
  }
}

async function executerScriptLocal(script, options = {}) {
  const afficherConsoleExecution = options.afficherConsoleExecution !== false;
  const afficherMarqueursExecution = options.afficherMarqueursExecution !== false;
  const afficherInviteExecution = options.afficherInviteExecution !== false;

  // Le prechauffage silencieux (voir tout en bas du fichier) touche le meme etat global
  // (scopes/fonctions/modules) qu'une vraie execution. S'il est encore en cours -- console
  // ET service partagent ce risque, le service pouvant recevoir un script des l'instant ou
  // sa WebView headless est prete, independamment de l'etat du prechauffage -- on attend
  // qu'il se termine plutot que d'ecraser son etat en plein milieu (resultats faux des deux
  // cotes, temps de CETTE execution fausse par la concurrence).
  if (_prechauffagePromise) await _prechauffagePromise;

  scopes = [{}];
  profondeurAppel = 0;
  PROFONDEUR_APPEL_MAX = PROFONDEUR_APPEL_MAX_DEFAUT;
  fonctions = {};
  modules = {};
  pileImportEnCours = [];
  enregistrerFonctionsBase();
  if (afficherConsoleExecution) afficherConsole();
  if (afficherMarqueursExecution) print("=== EXECUTION ===");
  btnRun.disabled = true;
  // Execution dans la console visible (RUN) : le bouton d'arret d'urgence doit etre disponible
  // (boucles infinies...). Dans le service (aucune interface), il reste masque.
  btnArretUrgence.hidden = !afficherConsoleExecution;
  demandeArret = false;
  executionEnCours = true;
  demarrerIndicateurAttente();
  try {
    let tokens = parser(script);
    // Verification de syntaxe de TOUT le script avant d'executer quoi que ce soit (y compris
    // avant le pre-enregistrement des imports, qui charge et execute des modules).
    let erreursSyntaxe = verifierSyntaxeSansRisque(script, tokens);
    if (erreursSyntaxe.length > 0) throw new ErreurSyntaxeProgramme(erreursSyntaxe);
    preRegistrerFonctions(tokens);
    await preRegistrerClasses(tokens);
    await preRegistrerImports(tokens);
    await executerTokens(tokens);
    if (afficherMarqueursExecution) print("=== FIN ===");
  } catch (e) {
    if (e instanceof ExecutionInterrompue) print("=== EXECUTION ARRETEE ===", "erreur");
    else if (e instanceof ErreurSyntaxeProgramme) {
      const MAX_ERREURS_AFFICHEES = 10;
      for (const er of e.erreurs.slice(0, MAX_ERREURS_AFFICHEES)) print("Erreur de syntaxe ligne " + er.ligne + ": " + er.message, "erreur");
      if (e.erreurs.length > MAX_ERREURS_AFFICHEES) print("... et " + (e.erreurs.length - MAX_ERREURS_AFFICHEES) + " autre(s) erreur(s) de syntaxe", "erreur");
      print("Le script n'a pas ete execute : aucune instruction n'a ete lancee.", "erreur");
    }
    else if (e instanceof ErreurLangage) print("Erreur ligne " + e.ligne + ": " + e.message, "erreur");
    else print("Erreur: " + e.message, "erreur");
  }
  arreterIndicateurAttente();
  executionEnCours = false;
  demandeArret = false;
  scriptEnArrierePlan = false;
  btnRun.disabled = false;
  btnArretUrgence.hidden = true;
  if (afficherInviteExecution && afficherConsoleExecution) printInvite();
}

window.executerScriptExterne = async function(code) {
  let codeOriginal = codeArea.value;
  codeArea.value = code;
  let debutSortie = outputDiv.children.length;
  let resultat = "";
  try {
    // Le service possede sa propre console interne. Ses marqueurs EXECUTION/FIN et son
    // invite ne doivent pas etre renvoyes a la console de l'application, sinon on obtient
    // deux "=== EXECUTION ===" et aucun invite utilisable. Le service ne remonte ici que
    // la sortie reelle produite par le script.
    await executerScriptLocal(code, {
      afficherConsoleExecution: false,
      afficherMarqueursExecution: false,
      afficherInviteExecution: false
    });
    let lignes = Array.from(outputDiv.children).slice(debutSortie);
    resultat = lignes.map(el => el.innerText).join("\n");
    return resultat;
  } finally {
    codeArea.value = codeOriginal;
    if (window.MonLangageServiceNative && typeof window.MonLangageServiceNative.executionTerminee === "function") {
      try { window.MonLangageServiceNative.executionTerminee(resultat); } catch (_) {}
    }
  }
};

window.arreterExecutionExterne = function() {
  demandeArret = true;
  if (annulerSaisieEnCours) annulerSaisieEnCours();
  // Reveil immediat d'un attendre() en cours : aucun polling, aucun timer decoupe.
  annulerAttenteEnCoursMLG();
  arreterIndicateurAttente();
};

// Arret d'urgence = clic court uniquement. Il arrete le script courant,
// sans arreter le service Android. Comme dans l'execution locale historique,
// l'arret rend immediatement la console de nouveau utilisable en recreant l'invite #.
btnArretUrgence.addEventListener("click", () => {
  // Script lance avec RUN (execution locale en JS, pas via le service) : l'arret est
  // asynchrone -- demandeArret n'est constate qu'au prochain point de controle
  // (respirer()). C'est alors executerScriptLocal(...) lui-meme qui affichera
  // "=== EXECUTION ARRETEE ===" et recreera l'invite une fois l'interruption
  // effectivement traitee. L'afficher aussi ici produirait deux invites a la suite.
  const executionLocaleEnCours = executionEnCours && !executionViaService;
  arreterScriptEnCours();
  if (!executionLocaleEnCours && ecranConsole.classList.contains("actif")) {
    print("=== EXECUTION ARRETEE ===", "erreur");
    printInvite();
  }
});

document.getElementById("btnDialogueOui").addEventListener("click", confirmerArrierePlanOui);
document.getElementById("btnDialogueNon").addEventListener("click", confirmerArrierePlanNon);

setInterval(synchroniserEtatService, 500);
// Sur mobile, toucher la poignee du curseur ferme le clavier sans declencher
// de blur() : le champ reste "actif" cote DOM mais visuellement inerte, et un
// simple focus() ne fait alors plus rien (deja l'element actif). Un tap
// n'importe ou dans la console force donc un cycle blur+focus pour rouvrir
// le clavier, sauf si du texte est en cours de selection (copier/coller).
//
// Bug reel signale par Yannick et corrige : ce blur+focus systematique cassait le
// long appui pour copier du texte dans la console. Cause : sur certaines WebView
// Android, un "click" arrive quand meme a la fin d'un long appui de selection (avant
// meme que window.getSelection() ne soit mise a jour avec le mot selectionne) -- le
// controle "if (sel.toString().length>0) return;" ci-dessous arrivait donc TROP TOT,
// voyait une selection encore vide, et refocalisait aussitot le champ de saisie --
// ce qui fait perdre la selection en cours d'apparition (bulle "Copier" jamais vue,
// ou disparaissant instantanement). Corrige en mesurant en plus la DUREE de l'appui
// (touchstart -> click) : au-dela de 350ms, c'est un geste de selection (long appui),
// jamais un simple tap pour rouvrir le clavier -- on l'ignore d'office, meme si
// getSelection() est encore vide a cet instant precis.
let dernierTouchstartOutput = 0;
outputDiv.addEventListener("touchstart", function(e) {
  dernierTouchstartOutput = Date.now();
}, { passive: true });
outputDiv.addEventListener("click", function(e) {
  if (Date.now() - dernierTouchstartOutput > 350) return;
  let sel = window.getSelection();
  if (sel && sel.toString().length > 0) return;
  let saisies = outputDiv.querySelectorAll(".cmdInput, .entrInput");
  let derniereSaisie = saisies.length ? saisies[saisies.length - 1] : null;
  if (!derniereSaisie) return;
  if (document.activeElement === derniereSaisie) derniereSaisie.blur();
  focaliserSaisieConsole();
});

outputDiv.addEventListener("keydown", async function(e) {
  let target = e.target;
  if (target.className !== "cmdInput") return;
  if (e.key === "Enter" && !enTrainDeTaper) {
    e.preventDefault();
    enTrainDeTaper = true;
    let cmd = target.innerText;
    target.contentEditable = "false";
    if (cmd.trim() !== "") {
      modeConsoleCommande = true;
      demandeArret = false;
      executionEnCours = true;
      demarrerIndicateurAttente();
      try {
      enregistrerFonctionsBase();
        let tokensCmd = parser(cmd);
        preRegistrerFonctions(tokensCmd);
        await executerTokens(tokensCmd);
      } catch (e) {
        if (e instanceof ExecutionInterrompue) print("=== EXECUTION ARRETEE ===", "erreur");
        else if (e instanceof ErreurLangage) print("Erreur ligne " + e.ligne + ": " + e.message, "erreur");
        else print("Erreur: " + e.message, "erreur");
      } finally {
        arreterIndicateurAttente();
        modeConsoleCommande = false;
        executionEnCours = false;
        demandeArret = false;
      }
    }
    printInvite();
    enTrainDeTaper = false;
  }
});

/* ===================== COLORATION EN DIRECT DE LA LIGNE DE COMMANDE CONSOLE ===================== */
// Position du curseur exprimee en nombre de caracteres depuis le debut de l'element.
function obtenirDecalageCurseur(element) {
  let sel = window.getSelection();
  if (!sel.rangeCount) return 0;
  let plage = sel.getRangeAt(0);
  let plageAvant = plage.cloneRange();
  plageAvant.selectNodeContents(element);
  plageAvant.setEnd(plage.endContainer, plage.endOffset);
  return plageAvant.toString().length;
}
// Replace le curseur au decalage (en caracteres) donne, en parcourant les noeuds texte.
function definirDecalageCurseur(element, decalage) {
  let sel = window.getSelection();
  let plage = document.createRange();
  let compte = 0, trouve = false;
  (function parcourir(noeud) {
    if (trouve) return;
    if (noeud.nodeType === 3) {
      let suivant = compte + noeud.textContent.length;
      if (decalage <= suivant) {
        plage.setStart(noeud, decalage - compte);
        plage.collapse(true);
        trouve = true;
        return;
      }
      compte = suivant;
    } else {
      for (let enfant of noeud.childNodes) { parcourir(enfant); if (trouve) return; }
    }
  })(element);
  if (!trouve) { plage.selectNodeContents(element); plage.collapse(false); }
  sel.removeAllRanges();
  sel.addRange(plage);
}
outputDiv.addEventListener("input", function(e) {
  let target = e.target;
  if (target.className !== "cmdInput") return;
  let texte = target.innerText;
  let decalage = obtenirDecalageCurseur(target);
  target.innerHTML = genererHTMLColore(texte);
  definirDecalageCurseur(target, decalage);
});

// ===================== Prechauffage du moteur JS =====================
// Le moteur JS de la WebView (console ET service, meme index.html charge des deux
// cotes) est nettement plus lent tant qu'il n'a pas vu un morceau de code tourner
// plusieurs fois (compilation/optimisation progressive) -- constate sur le tout
// PREMIER script execute apres l'ouverture de l'app ou apres la creation de la
// WebView headless du service. Les executions suivantes, dans la MEME webview,
// sont plus rapides sans que rien n'ait change dans le code lui-meme.
// On paie donc ce cout une fois, silencieusement, sur du code JETABLE (jamais
// affiche, jamais melange a l'etat de l'utilisateur), juste apres le chargement
// de la page plutot que sur le premier vrai script.
//
// Deux volets :
// 1) evalExprSansEntreeSync isole (contexte jetable local, aucune variable globale
//    touchee) -- le poste le plus couteux mesure par benchmark_cascade.mlg.
// 2) executerCommandeSimple + mecanique de boucle + parsing complet, via un vrai
//    script jetable execute a travers TOUT le pipeline (tokeniser/parser/
//    verifierSyntaxeSansRisque/executerTokens) -- comme executerScriptLocal, mais
//    sans aucune interaction UI (pas de print/afficherConsole/btnRun/indicateur
//    d'attente). Ce volet TOUCHE l'etat global (scopes/fonctions/modules), mais
//    executerScriptLocal les reinitialise de toute facon inconditionnellement au
//    debut de CHAQUE execution reelle -- rien ne peut donc "fuiter" vers le
//    premier vrai script de l'utilisateur. Seul risque reel : une collision si un
//    vrai script demarre PENDANT que ce volet tourne encore (fenetre minuscule,
//    juste apres le chargement de page) -- gardee par la verification de
//    executionEnCours avant de toucher quoi que ce soit.
async function _executerScriptSilencieux(script) {
  if (executionEnCours) return; // un vrai script a deja demarre : on n'y touche pas.
  scopes = [{}];
  profondeurAppel = 0;
  PROFONDEUR_APPEL_MAX = PROFONDEUR_APPEL_MAX_DEFAUT;
  fonctions = {};
  modules = {};
  pileImportEnCours = [];
  enregistrerFonctionsBase();
  demandeArret = false;
  executionEnCours = true;
  try {
    let tokens = parser(script);
    let erreursSyntaxe = verifierSyntaxeSansRisque(script, tokens);
    if (erreursSyntaxe.length === 0) {
      preRegistrerFonctions(tokens);
      await preRegistrerClasses(tokens);
      await preRegistrerImports(tokens);
      await executerTokens(tokens);
    }
  } catch (e) {
    // Prechauffage : seul le passage du code compte, le resultat n'a aucune importance.
  }
  executionEnCours = false;
  demandeArret = false;
}

setTimeout(function () {
  if (executionEnCours) return; // l'utilisateur a deja lance un vrai script avant meme le debut du prechauffage.
  btnRun.disabled = true;
  btnRunFond.disabled = true;
  _prechauffagePromise = (async function () {
    try {
      let scopeJetable = { i: 0, x: 0, v: [1, 2, 3, 4, 5] };
      let ctxJetable = { getVar: (nom) => scopeJetable[nom] };
      for (let n = 0; n < 3000; n++) {
        scopeJetable.i = n % 100;
        scopeJetable.x = evalExprSansEntreeSync("i*2+1", ctxJetable);
        evalExprSansEntreeSync("i<50 et x>0", ctxJetable);
        evalExprSansEntreeSync("v[1]+v[2]-i", ctxJetable);
        evalExprSansEntreeSync("(i+1)^2", ctxJetable);
      }
    } catch (e) {
      // Le prechauffage ne doit jamais faire echouer le chargement de la page.
    }
    await _executerScriptSilencieux(
      "pou(i,1,2000){\n" +
      "  x~i*2\n" +
      "  si(x>1000) { y~x-1 }\n" +
      "  sinon { y~x+1 }\n" +
      "}\n" +
      "v~c(1,2,3)\n" +
      "z~v[1]+v[2]\n" +
      "fonc double(n){ retour n*2 }\n" +
      "w~double(5)\n"
    );
  })().finally(function () {
    _prechauffagePromise = null;
    btnRun.disabled = false;
    btnRunFond.disabled = false;
  });
}, 0);
// Désactive les actions natives Copier/Couper/Coller sur les éléments d'interface
// (barres d'outils, en-têtes, onglets et barres de navigation), sans toucher aux
// champs dans lesquels l'utilisateur doit pouvoir saisir/rechercher du texte.

    '#barreSpecification',

  ].map(sel => document.querySelector(sel)).filter(Boolean);

  zonesInterface.forEach(zone => {

    zone.addEventListener('cut', e => e.preventDefault());
    zone.addEventListener('paste', e => e.preventDefault());
    zone.addEventListener('selectstart', e => e.preventDefault());
  });
})();
