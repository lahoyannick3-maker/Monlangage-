  let R = m.nlig, C = m.ncol;
  let donnees = new Array(R * C);
  for (let j = 0; j < R; j++) {     // j : ligne d'origine (0..R-1) -> devient colonne dans la transposee
    for (let i = 0; i < C; i++) {   // i : colonne d'origine (0..C-1) -> devient ligne dans la transposee
      donnees[j * C + i] = m.donnees[i * R + j];
    }
  }
  return { __type: "matrice", nlig: C, ncol: R, donnees: donnees };
}

// nom.ajout(...) : ajoute des elements a un vecteur/une matrice EXISTANTS, sans rien ecraser.
// Pour une matrice : ajoute comme nouvelle(s) colonne(s) (coherent avec le remplissage par
// colonne par defaut) -- le nombre d'elements doit etre un multiple du nombre de lignes.
function ajouterVecteur(v, elements) {
  v.push(...elements);
  let coherent = unifierTypeVecteur(v);
  for (let i = 0; i < v.length; i++) v[i] = coherent[i];
}
// nom.ajout(...) sur une liste : chaque argument est pousse TEL QUEL (pas de fusion/
// aplatissement comme pour un vecteur), pas d'unification de type : c'est tout l'interet
// de liste() par rapport a c().
function ajouterListe(li, elements) {
  li.elements.push(...elements);
}
// nom.supri(...) sur une liste : supprime, pour chaque valeur donnee, sa PREMIERE
// occurrence trouvee (comparaison par egalite simple, comme pour un vecteur).
function supprimerListe(li, elements) {
  for (let el of elements) {
    let idx = li.elements.findIndex(x => x === el);
    if (idx === -1) {
      throw new Error(".supri(...) : la valeur " + JSON.stringify(el) + " n'a pas ete trouvee dans la liste");
    }
    li.elements.splice(idx, 1);
  }
}


// nom.supri(...) : supprime des elements d'un vecteur/une matrice EXISTANTS (inverse de .ajout()).
// Pour un vecteur : supprime, pour chaque valeur donnee, sa PREMIERE occurrence trouvee
// (v~c(2,3,2,5) ; v.supri(2,3) -> reste c(2,5)).
function supprimerVecteur(v, elements) {
  for (let el of elements) {
    let idx = v.findIndex(x => x === el);
    if (idx === -1) {
      throw new Error(".supri(...) : la valeur " + JSON.stringify(el) + " n'a pas ete trouvee dans le vecteur");
    }
    v.splice(idx, 1);
  }
}
// Pour une matrice : meme logique que .ajout(), mais en sens inverse -- les elements
// donnes (par groupe de nlig, comme pour l'ajout) doivent correspondre exactement a
// une colonne existante, qui est alors supprimee (la premiere trouvee qui correspond).
function supprimerMatrice(m, elements) {
  if (elements.length % m.nlig !== 0) {
    throw new Error(".supri(...) sur une matrice : le nombre d'elements donnes (" + elements.length + ") doit etre un multiple du nombre de lignes (" + m.nlig + "), car la suppression se fait par colonne(s) entiere(s)");
  }
  for (let i = 0; i < elements.length; i += m.nlig) {
    let bloc = elements.slice(i, i + m.nlig);
    let colTrouvee = -1;
    for (let c = 0; c < m.ncol; c++) {
      let colonne = m.donnees.slice(c * m.nlig, c * m.nlig + m.nlig);
      if (colonne.every((v, j) => v === bloc[j])) { colTrouvee = c; break; }
    }
    if (colTrouvee === -1) {
      throw new Error(".supri(...) sur une matrice : aucune colonne ne correspond exactement aux valeurs donnees (" + bloc.join(",") + ")");
    }
    m.donnees.splice(colTrouvee * m.nlig, m.nlig);
    m.ncol -= 1;
  }
}

// Agrandit une matrice existante a nligCible x ncolCible (>= dimensions actuelles), en
// remplissant les nouvelles cases avec 0. Reconstruit les donnees en respectant le
// format en colonne utilise partout ailleurs dans le langage. Utilisee pour permettre
// l'agrandissement automatique lors d'une affectation m[ligne,colonne] ~ valeur qui
// depasse les dimensions actuelles (comme si on "remplissait" au-dela du bord).
function agrandirMatrice(m, nligCible, ncolCible) {
  let nouvelles = new Array(nligCible * ncolCible).fill(0);
  for (let c = 0; c < m.ncol; c++) {
    for (let l = 0; l < m.nlig; l++) {
      nouvelles[c * nligCible + l] = m.donnees[c * m.nlig + l];
    }
  }
  m.donnees = nouvelles;
  m.nlig = nligCible;
  m.ncol = ncolCible;
}

// Calcule le plus grand indice numerique demande par un descripteur d'indice (nombre,
// vecteur d'indices, ou null pour "tout"). Renvoie 0 si l'indexation est logique (un
// vecteur de booleens) ou vide, cas ou l'agrandissement automatique n'a pas de sens
// (la taille doit deja correspondre a l'existant).
function calculerIndiceMax(idx) {
  if (idx === null) return 0;
  if (typeof idx === 'number') return idx;
  let plat = estMatrice(idx) ? idx.donnees : idx;
  if (!estVecteur(plat)) return 0;
  if (plat.length > 0 && typeof plat[0] === 'boolean') return 0;
  let mx = 0;
  for (let n of plat) if (typeof n === 'number' && n > mx) mx = n;
  return mx;
}

// v[indice] -- indices a partir de 1, comme en R.
// Tire x elements au hasard, sans remise, parmi un tableau JS plat (melange partiel de
// Fisher-Yates, sans copier tout le tableau plus d'une fois). Utilise par alea(...).
function tirerAuHasardSansRemise(tableau, x) {
  let copie = tableau.slice();
  let n = copie.length;
  for (let i = 0; i < x; i++) {
    let j = i + Math.floor(Math.random() * (n - i));
    let tmp = copie[i]; copie[i] = copie[j]; copie[j] = tmp;
  }
  return copie.slice(0, x);
}

// Tire x elements au hasard, AVEC remise (chaque tirage est independant, un meme
// element peut ressortir plusieurs fois). Utilise par ralea(...).
function tirerAuHasardAvecRemise(tableau, x) {
  let resultat = [];
  for (let i = 0; i < x; i++) resultat.push(tableau[Math.floor(Math.random() * tableau.length)]);
  return resultat;
}

function verifierIndiceEntier(v, nom) {
  if (typeof v !== 'number' || !Number.isInteger(v)) throw new ErreurIndexHorsLimite("Indice invalide pour " + nom);
  return v;
}

// Resout un indice (nombre, vecteur d'indices, ou vecteur logique) en tableau de positions 0-based.
function resoudreIndicesVecteur(idx, tailleMax, nom) {
  if (estMatrice(idx)) idx = idx.donnees;
  if (!estVecteur(idx)) throw new ErreurIndexHorsLimite("Indice invalide pour " + nom);
  if (idx.length > 0 && typeof idx[0] === 'boolean') {
    if (idx.length !== tailleMax) throw new Error("Indexation logique pour " + nom + " : longueur " + idx.length + " differente de " + tailleMax);
    let res = [];
    for (let i = 0; i < tailleMax; i++) if (idx[i] === true) res.push(i);
    return res;
  }
  let res = [];
  for (let n of idx) {
    verifierIndiceEntier(n, nom);
    if (n < 1 || n > tailleMax) throw new Error("Indice " + n + " hors limites pour " + nom + " (taille " + tailleMax + ")");
    res.push(n - 1);
  }
  return res;
}

// Resout un indice de dimension (ligne ou colonne) : null (tout), nombre, ou vecteur/logique.
function resoudreIndicesDim(idx, tailleMax, nom) {
  if (idx === null) { let r = []; for (let i = 0; i < tailleMax; i++) r.push(i); return r; }
  if (typeof idx === 'number') {
    verifierIndiceEntier(idx, nom);
    if (idx < 1 || idx > tailleMax) throw new Error("Indice " + idx + " hors limites pour " + nom + " (taille " + tailleMax + ")");
    return [idx - 1];
  }
  return resoudreIndicesVecteur(idx, tailleMax, nom);
}

// v[indice] -- indices a partir de 1, comme en R.
// indice peut etre : vide (tout le vecteur), un nombre (un seul element), un vecteur
// d'indices (ex: c(2,5) ou 2:4), ou un vecteur logique de meme taille (ex: v[v>3]).
function accederVecteur(v, indice, nom) {
  if (!estVecteur(v)) throw new ErreurTypeInvalide(nom + " n'est pas un vecteur");
  if (indice === null) return v.slice();
  if (typeof indice === 'number') {
    verifierIndiceEntier(indice, nom);
    if (indice < 1 || indice > v.length) throw new Error("Indice " + indice + " hors limites pour " + nom + " (taille " + v.length + ")");
    return v[indice - 1];
  }
  let positions = resoudreIndicesVecteur(indice, v.length, nom);
  return positions.map(p => v[p]);
}

// Indexation a un seul crochet, valable pour un vecteur OU une matrice (traitee "a plat",
// en ordre colonne, comme en R). Utile pour l'indexation logique : B[B==5].
// texte[indice] -- indices a partir de 1, comme pour un vecteur, mais le resultat reste
// TOUJOURS du texte : un seul caractere pour un indice simple, un sous-texte reconstruit
// (join) pour une plage/un vecteur d'indices/un vecteur logique -- jamais une liste() ou un
// vecteur de caracteres, pour rester coherent avec ce qu'on attend de "texte[...]".
function accederTexte(v, indice, nom) {
  if (indice === null) return v;
  if (typeof indice === 'number') {
    verifierIndiceEntier(indice, nom);
    if (indice < 1 || indice > v.length) throw new Error("Indice " + indice + " hors limites pour " + nom + " (longueur " + v.length + ")");
    return v[indice - 1];
  }
  let positions = resoudreIndicesVecteur(indice, v.length, nom);
  return positions.map(p => v[p]).join("");
}
function accederUnique(v, indice, nom) {
  if (typeof v === 'string') return accederTexte(v, indice, nom);
  if (estListe(v)) {
    let elements = v.elements;
    if (indice === null) return { __type: "liste", elements: elements.slice() };
    if (typeof indice === 'number') {
      verifierIndiceEntier(indice, nom);
      if (indice < 1 || indice > elements.length) throw new Error("Indice " + indice + " hors limites pour " + nom + " (taille " + elements.length + ")");
      return elements[indice - 1];
    }
    let positionsListe = resoudreIndicesVecteur(indice, elements.length, nom);
    return { __type: "liste", elements: positionsListe.map(p => elements[p]) };
  }
  let plat = estMatrice(v) ? v.donnees : (estVecteur(v) ? v : null);
  if (plat === null) throw new ErreurTypeInvalide(nom + " n'est pas un vecteur ou une matrice");
  if (indice === null) return plat.slice();
  if (typeof indice === 'number') {
    verifierIndiceEntier(indice, nom);
    if (indice < 1 || indice > plat.length) throw new Error("Indice " + indice + " hors limites pour " + nom + " (taille " + plat.length + ")");
    return plat[indice - 1];
  }
  let positions = resoudreIndicesVecteur(indice, plat.length, nom);
  return positions.map(p => plat[p]);
}

// m[ligne, colonne] -- indices a partir de 1, comme en R.
// ligne/colonne : vide (tout), nombre (un seul), ou vecteur/logique (plusieurs) -> sous-matrice.
// Comme en R (drop=TRUE par defaut) : si une des deux dimensions du resultat vaut 1,
// le resultat est simplifie en simple vecteur plutot qu'en matrice a une ligne/colonne.
function accederMatrice(m, ligne, colonne, nom) {
  if (typeof m === 'string') throw new Error(nom + " est du texte (une seule dimension) : utilise " + nom + "[i] au lieu de " + nom + "[l,c]");
  if (!estMatrice(m)) throw new ErreurTypeInvalide(nom + " n'est pas une matrice");

  // Cas historique : deux indices numeriques simples -> une seule valeur.
  if (typeof ligne === 'number' && typeof colonne === 'number') {
    verifierIndiceEntier(ligne, nom); verifierIndiceEntier(colonne, nom);
    if (ligne < 1 || ligne > m.nlig || colonne < 1 || colonne > m.ncol) {
      throw new Error("Indice [" + ligne + "," + colonne + "] hors limites pour " + nom + " (" + m.nlig + "x" + m.ncol + ")");
    }
    return m.donnees[(colonne - 1) * m.nlig + (ligne - 1)];
  }

  let lignesIdx = resoudreIndicesDim(ligne, m.nlig, nom);
  let colsIdx = resoudreIndicesDim(colonne, m.ncol, nom);
  let donnees = [];
  for (let c of colsIdx) for (let l of lignesIdx) donnees.push(m.donnees[c * m.nlig + l]);
  let nligRes = lignesIdx.length, ncolRes = colsIdx.length;

  if (nligRes === 1 || ncolRes === 1) return donnees; // "drop" comme en R
  return { __type: "matrice", nlig: nligRes, ncol: ncolRes, donnees: donnees };
}

// v[indice] ~ valeur -- un indice au-dela de la taille actuelle agrandit automatiquement
// le vecteur (comme en R), en remplissant les cases intermediaires avec 0.
// v[] ~ valeur remplace tout le vecteur (meme taille, ou une seule valeur repetee partout).
// Ecriture a un seul crochet, valable pour un vecteur OU une matrice (traitee "a plat").
// Utile pour l'ecriture avec indexation logique : B[B>15] ~ 0.
// texte[indice] ~ valeur -- contrairement a affecterUnique (vecteur/liste), le texte est
// immuable en JS : impossible de muter "v" en place. Cette fonction renvoie donc le texte
// ENTIER reconstruit avec la modification appliquee ; c'est a l'appelant (executerCommandeSimple)
// de reecrire la variable/l'attribut avec ce nouveau texte via assignerCheminValeur.
// Un indice au-dela de la longueur actuelle agrandit le texte avec des espaces (meme logique
// que les vecteurs, qui s'agrandissent avec des 0).
function affecterTexte(v, indice, valeur, nom) {
  if (typeof valeur !== 'string') throw new ErreurTypeInvalide(nom + "[...] ~ ... attend du texte (un texte reste du texte)");
  let cars = v.split("");
  if (indice === null) return valeur; // texte[] ~ valeur : remplace tout le texte
  if (typeof indice === 'number') {
    verifierIndiceEntier(indice, nom);
    if (indice < 1) throw new ErreurIndexHorsLimite("Indice " + indice + " invalide pour " + nom);
    if (valeur.length !== 1) throw new Error(nom + "[" + indice + "] ~ ... attend un seul caractere, recu \"" + valeur + "\" (longueur " + valeur.length + ")");
    while (cars.length < indice) cars.push(" ");
    cars[indice - 1] = valeur;
    return cars.join("");
  }
  let positions = resoudreIndicesVecteur(indice, cars.length, nom);
  let valeurs = valeur.split("");
  if (valeurs.length !== positions.length && valeurs.length !== 1) {
    throw new Error(nom + "[...] ~ ... attend " + positions.length + " caractere(s) (ou un seul repete), recu " + valeurs.length);
  }
  for (let i = 0; i < positions.length; i++) cars[positions[i]] = valeurs[i % valeurs.length];
  return cars.join("");
}
function affecterUnique(v, indice, valeur, nom) {
  if (estListe(v)) {
    let elements = v.elements;
    if (indice === null) {
      if (estListe(valeur)) {
        if (valeur.elements.length !== elements.length) throw new ErreurTypeInvalide(nom + "[] ~ ... attend une liste de meme taille (" + elements.length + ")");
        for (let i = 0; i < elements.length; i++) elements[i] = valeur.elements[i];
      } else {
        for (let i = 0; i < elements.length; i++) elements[i] = valeur;
      }
      return;
    }
    if (typeof indice === 'number') {
      verifierIndiceEntier(indice, nom);
      if (indice < 1) throw new ErreurIndexHorsLimite("Indice " + indice + " invalide pour " + nom);
      while (elements.length < indice) elements.push(undefined);
      elements[indice - 1] = valeur;
      return;
    }
    let positionsListe = resoudreIndicesVecteur(indice, elements.length, nom);
    let valeursListe = estListe(valeur) ? valeur.elements : [valeur];
    if (valeursListe.length !== positionsListe.length && valeursListe.length !== 1) {
      throw new Error(nom + "[...] ~ ... attend " + positionsListe.length + " valeur(s) (ou une seule repetee), recu " + valeursListe.length);
    }
    for (let i = 0; i < positionsListe.length; i++) elements[positionsListe[i]] = valeursListe[i % valeursListe.length];
    return;
  }
  if (estMatrice(v)) {
    let positions;
    if (indice === null) { positions = []; for (let i = 0; i < v.donnees.length; i++) positions.push(i); }
    else if (typeof indice === 'number') {
      verifierIndiceEntier(indice, nom);
      if (indice < 1 || indice > v.donnees.length) throw new Error("Indice " + indice + " hors limites pour " + nom + " (taille " + v.donnees.length + ")");
      positions = [indice - 1];
    } else {
      positions = resoudreIndicesVecteur(indice, v.donnees.length, nom);
    }
    let elements = estVecteur(valeur) ? valeur : [valeur];
    if (elements.length !== positions.length && elements.length !== 1) {
      throw new Error(nom + "[...] ~ ... attend " + positions.length + " valeur(s) (ou une seule repetee), recu " + elements.length);
    }
    for (let i = 0; i < positions.length; i++) v.donnees[positions[i]] = elements[i % elements.length];
    let coherent = unifierTypeVecteur(v.donnees);
    for (let i = 0; i < v.donnees.length; i++) v.donnees[i] = coherent[i];
    return;
  }
  if (estVecteur(v)) { affecterVecteur(v, indice, valeur, nom); return; }
  throw new ErreurTypeInvalide(nom + " n'est pas un vecteur ou une matrice");
}

function affecterVecteur(v, indice, valeur, nom) {
  if (!estVecteur(v)) throw new ErreurTypeInvalide(nom + " n'est pas un vecteur");
  let positions;
  if (indice === null) {
    positions = []; for (let i = 0; i < v.length; i++) positions.push(i);
  } else if (typeof indice === 'number') {
    verifierIndiceEntier(indice, nom);
    if (indice < 1) throw new ErreurIndexHorsLimite("Indice " + indice + " invalide pour " + nom + " (doit etre >= 1)");
    // Agrandissement automatique (comme en R) : un indice au-dela de la taille actuelle
    // etend le vecteur, en remplissant les nouvelles cases intermediaires avec 0.
    while (v.length < indice) v.push(0);
    positions = [indice - 1];
  } else {
    // Agrandissement automatique aussi pour une indexation multiple (ex: v[c(2,5,8)] ~ ...),
    // sauf pour l'indexation logique (v[v>3] ~ ...) ou la taille doit deja correspondre.
    let indiceMax = calculerIndiceMax(indice);
    while (v.length < indiceMax) v.push(0);
    positions = resoudreIndicesVecteur(indice, v.length, nom);
  }
  let elements = estVecteur(valeur) ? valeur : [valeur];
  if (elements.length !== positions.length && elements.length !== 1) {
    throw new Error(nom + "[...] ~ ... attend " + positions.length + " valeur(s) (ou une seule repetee), recu " + elements.length);
  }
  for (let i = 0; i < positions.length; i++) v[positions[i]] = elements[i % elements.length];
  let coherent = unifierTypeVecteur(v);
  for (let i = 0; i < v.length; i++) v[i] = coherent[i];
}

// m[ligne,colonne] ~ valeur -- comme en R, un indice omis modifie toute la ligne/colonne :
// B[,4] ~ c(0,0,0)  remplace la colonne 4.   B[2,] ~ c(0,0,0)  remplace la ligne 2.
// Un indice numerique au-dela des dimensions actuelles agrandit automatiquement la
// matrice (nouvelles lignes/colonnes remplies de 0), pour permettre le remplissage
// progressif comme pour les vecteurs.
function affecterMatrice(m, ligne, colonne, valeur, nom) {
  if (!estMatrice(m)) throw new ErreurTypeInvalide(nom + " n'est pas une matrice");
  let ligneMax = calculerIndiceMax(ligne);
  let colMax = calculerIndiceMax(colonne);
  if (ligneMax > m.nlig || colMax > m.ncol) {
    agrandirMatrice(m, Math.max(ligneMax, m.nlig), Math.max(colMax, m.ncol));
  }
  let lignesIdx = resoudreIndicesDim(ligne, m.nlig, nom);
  let colsIdx = resoudreIndicesDim(colonne, m.ncol, nom);
  let positions = [];
  for (let c of colsIdx) for (let l of lignesIdx) positions.push(c * m.nlig + l);
  let elements = estVecteur(valeur) ? valeur : (estMatrice(valeur) ? valeur.donnees : [valeur]);
  if (elements.length !== positions.length && elements.length !== 1) {
    throw new Error(nom + "[...] ~ ... attend " + positions.length + " valeur(s) (ou une seule repetee), recu " + elements.length);
  }
  for (let i = 0; i < positions.length; i++) m.donnees[positions[i]] = elements[i % elements.length];
  let coherent = unifierTypeVecteur(m.donnees);
  for (let i = 0; i < m.donnees.length; i++) m.donnees[i] = coherent[i];
}

// Construit une sequence numerique de "debut" a "fin" avec le pas donne (ou +1/-1 par defaut).
function construireSequence(debut, fin, pas) {
  if (typeof debut !== 'number' || typeof fin !== 'number') throw new ErreurTypeInvalide("seq/':' attend des nombres");
  if (pas === undefined || pas === null) pas = (fin >= debut ? 1 : -1);
  if (typeof pas !== 'number' || pas === 0) throw new Error("Le pas d'une sequence ne peut pas etre 0");
  let resultat = [];
  if (pas > 0) { for (let v = debut; v <= fin + 1e-9; v += pas) resultat.push(Math.round(v * 1e9) / 1e9); }
  else { for (let v = debut; v >= fin - 1e-9; v += pas) resultat.push(Math.round(v * 1e9) / 1e9); }
  return resultat;
}

function pad(texte, largeur) {
  texte = String(texte);
  while (texte.length < largeur) texte = " " + texte;
  return texte;
}

function formatValeur(v) {
  if (v === undefined) return "pasdefini";
  if (estMatrice(v)) return formatMatrice(v);
  if (estListe(v)) return formatListe(v);
  if (estVecteur(v)) return formatVecteur(v);
  if (v === true) return "VRAI";
  if (v === false) return "FAUX";
  if (typeof v === 'string') return v;
  if (estValeurFonction(v)) {
    let listeParams = v.params.map(p => p.defautExpr !== null ? (p.nom + "~" + p.defautExpr) : p.nom).join(", ");
    return v.nom ? ("fonction " + v.nom + "(" + listeParams + ")") : ("fonction anonyme(" + listeParams + ")");
  }
  if (v !== null && typeof v === 'object' && v.__classe !== undefined) return formatInstance(v);
  return String(v);
}

// Affiche une instance de classe : NomClasse{attribut: valeur, ...}
function formatInstance(v) {
  let champs = Object.keys(v).filter(k => k !== '__classe').map(k => k + ": " + formatValeur(v[k]));
  return v.__classe + "{" + champs.join(", ") + "}";
}

// Formate une valeur pour l'affichage, en utilisant la methode texte(moi) de sa classe si
// elle en definit une (comme __str__ en Python) ; sinon retombe sur le format par defaut
// (NomClasse{attribut: valeur, ...}, via formatValeur/formatInstance). Async car une methode
// texte(moi) peut executer un corps de fonction entier (comme n'importe quelle methode).
// A utiliser aux points d'affichage de premier niveau (affi(...), retour affiche seul sur sa
// ligne) ; les instances imbriquees (dans un vecteur, ou comme attribut d'une autre instance)
// gardent le format par defaut.
async function formatPourAffichage(v) {
  if (v !== null && typeof v === 'object' && v.__classe !== undefined) {
    let trouve = trouverMethodeAvecClasse(v.__classe, "texte");
    if (trouve) {
      let resultat = await appellerMethodeInstance(v, "texte", []);
      return formatValeur(resultat);
    }
  }
  return formatValeur(v);
}

// Affiche un vecteur comme R : indice entre crochets en debut de ligne, elements
// alignes, et retour a la ligne automatique quand ca depasse la largeur de la console.
function formatVecteur(v) {
  let n = v.length;
  if (n === 0) return "vecteur(0)";
  let textes = v.map(formatValeur);
  let largeurElem = Math.max(...textes.map(t => t.length));
  let largeurIndice = String(n).length;
  let largeurLabel = largeurIndice + 2;
  let largeurConsole = 80;
  let parLigne = Math.max(1, Math.floor((largeurConsole - largeurLabel) / (largeurElem + 1)));
  let lignes = [];
  for (let i = 0; i < n; i += parLigne) {
    let label = "[" + pad(String(i + 1), largeurIndice) + "]";
    let morceaux = textes.slice(i, i + parLigne).map(t => pad(t, largeurElem));
    lignes.push(label + " " + morceaux.join(" "));
  }
  return lignes.join("\n");
}

// Affiche une liste comme R : chaque element sur sa propre section, precede de son
// indice entre double-crochets ([[i]]), avec le type reel de chaque element preserve
// (contrairement a un vecteur, pas de conversion vers un type commun).
function formatListe(li) {
  let n = li.elements.length;
  if (n === 0) return "liste(0)";
  let lignes = [];
  for (let i = 0; i < n; i++) {
    lignes.push("[[" + (i + 1) + "]]");
    lignes.push(formatValeur(li.elements[i]));
  }
  return lignes.join("\n");
}

function formatMatrice(m) {
  let entetes = [], largeurs = [];
  for (let c = 0; c < m.ncol; c++) {
    let entete = "[," + (c + 1) + "]";
    let largeur = entete.length;
    for (let l = 0; l < m.nlig; l++) largeur = Math.max(largeur, formatValeur(m.donnees[c * m.nlig + l]).length);
    entetes.push(entete);
    largeurs.push(largeur);
  }
  let lignesTexte = ["     " + entetes.map((e, c) => pad(e, largeurs[c])).join(" ")];
  for (let l = 0; l < m.nlig; l++) {
    let cellules = [];
    for (let c = 0; c < m.ncol; c++) cellules.push(pad(formatValeur(m.donnees[c * m.nlig + l]), largeurs[c]));
    lignesTexte.push(pad("[" + (l + 1) + ",]", 5) + " " + cellules.join(" "));
  }
  return lignesTexte.join("\n");
}

/* ===================== FONCTIONS UTILISATEUR ===================== */
// Execute un corps de fonction (params + tokens) avec les valeurs d'arguments deja evaluees.
// Partage entre les fonctions perso (fonc), les constructeurs de classe (init) et les
// methodes de classe (moi + autres parametres). classeCourante (facultatif) memorise, pour
// une methode de classe, la classe qui DEFINIT reellement le corps execute (utile pour
// parent.methode(...) : voir getClasseCourante ci-dessous).
async function executerCorpsFonction(params, corps, argsVals, nomPourErreur, classeCourante, environnementCapture) {
  // Separe les arguments fournis en POSITIONNELS (valeurs simples, dans l'ordre) et NOMMES
  // (objets {__argNomme, valeur} produits par lireArgument() quand l'appel utilise nom~valeur,
  // ex: text(b~5)). Un meme nom fourni deux fois est une erreur.
  let positionnels = [];
  let nommes = {};
  for (let a of argsVals) {
    if (a !== null && typeof a === 'object' && Object.prototype.hasOwnProperty.call(a, '__argNomme')) {
      if (Object.prototype.hasOwnProperty.call(nommes, a.__argNomme)) {
        throw new Error((nomPourErreur || "Cette fonction") + " : argument nomme \"" + a.__argNomme + "\" fourni deux fois");
      }
      nommes[a.__argNomme] = a.valeur;
    } else {
      positionnels.push(a);
    }
  }

  // Seuls les parametres NON *nomSeul sont remplissables par position.
  let paramsPositionnels = params.filter(p => !p.nomSeul);
  let nbRequisPositionnels = paramsPositionnels.filter(p => p.defautExpr === null).length;
  if (positionnels.length < nbRequisPositionnels || positionnels.length > paramsPositionnels.length) {
    let attendu = (nbRequisPositionnels === paramsPositionnels.length) ? String(paramsPositionnels.length) : (nbRequisPositionnels + " a " + paramsPositionnels.length);
    throw new Error((nomPourErreur || "Cette fonction") + " attend " + attendu + " argument(s) positionnel(s), " + positionnels.length + " fourni(s)");
  }
  let scope = {};
  paramsPositionnels.forEach((p, idx) => { if (idx < positionnels.length) scope[p.nom] = positionnels[idx]; });

  // Applique les arguments nommes : erreur si le nom ne correspond a aucun parametre, ou s'il
  // a deja ete rempli par position (conflit).
  for (let nomArg of Object.keys(nommes)) {
    let param = params.find(p => p.nom === nomArg);
    if (!param) throw new Error((nomPourErreur || "Cette fonction") + " : parametre inconnu \"" + nomArg + "\"");
    if (Object.prototype.hasOwnProperty.call(scope, nomArg)) {
      throw new Error((nomPourErreur || "Cette fonction") + " : \"" + nomArg + "\" fourni a la fois par position et par nom");
    }
    scope[nomArg] = nommes[nomArg];
  }

  if (classeCourante) scope['__classeCourante'] = classeCourante;
  profondeurAppel++;
  if (profondeurAppel > PROFONDEUR_APPEL_MAX) {
    profondeurAppel--;
    throw new ErreurRecursionMax((nomPourErreur || "Cette fonction") + " : plus de " + PROFONDEUR_APPEL_MAX + " appels imbriques -- recursion probablement infinie (cas d'arret manquant ou jamais atteint)");
  }
  // PORTEE LEXICALE : on isole completement la pile pour cet appel. On ne garde QUE le
  // scope global (scopes[0]) + ce nouveau scope local — jamais les scopes intermediaires
  // des fonctions actuellement en cours d'execution plus haut dans la chaine d'appel.
  // Avant ce correctif, "scopes.push(scope)" empilait par-dessus TOUTE la pile active,
  // ce qui rendait visible aux fonctions appelees les variables locales de leurs
  // appelantes (portee dynamique) — un appel de fonction pouvait donc "voir" par
  // accident une variable qu'on avait oublie de lui passer en parametre.
  let pilePrecedente = scopes;
  // CLOSURE : si cette fonction porte un environnement capture (voir construireFonctionAnonyme),
  // on l'utilise comme base au lieu du global seul -- il contient deja le scope global en
  // position 0 (capture avec scopes.slice(), qui part toujours de scopes[0]), donc pas besoin
  // de rajouter pilePrecedente[0] separement. Une fonction normale (fonc nom(...) au niveau
  // global, sans closure) n'a pas cet environnement : comportement inchange, global + local.
  scopes = environnementCapture ? [...environnementCapture, scope] : [pilePrecedente[0], scope];
  let resultat;
  try {
    // Valeurs par defaut pour tout parametre (positionnel OU *nomSeul) encore non rempli.
    // Evaluees maintenant, DANS le scope de la fonction (deja empile ci-dessus), ce qui
    // permet a une valeur par defaut de referencer un parametre precedent deja affecte
    // (ex: fonc f(a, b~a){...}). Un *parametre sans defaut encore non rempli est une
    // erreur claire : il devait etre fourni par son nom.
    for (let p of params) {
      if (Object.prototype.hasOwnProperty.call(scope, p.nom)) continue;
      if (p.defautExpr === null) {
        throw new Error((nomPourErreur || "Cette fonction") + " : le parametre \"" + p.nom + "\" est obligatoire" + (p.nomSeul ? " (fournir par son nom : " + p.nom + "~valeur)" : ""));
      }
      scope[p.nom] = await evalExpr(p.defautExpr, ctxExpr);
    }
    let res = await executerTokens(corps, 0, corps.length);
    resultat = (res.signal && res.signal.type === 'retour') ? res.signal.valeur : undefined;
  } finally {
    scopes = pilePrecedente;
    profondeurAppel--;
  }
  return resultat;
}

// Donne la classe qui definit la methode en cours d'execution (null hors d'une methode de
// classe). Utilise pour resoudre parent.methode(...) : on part de la classe PARENTE de
// celle-ci, pas de la classe reelle de l'instance (important avec plusieurs niveaux
// d'heritage, comme super() en Python).
function getClasseCourante() {
  for (let i = scopes.length - 1; i >= 0; i--) {
    if (Object.prototype.hasOwnProperty.call(scopes[i], '__classeCourante')) return scopes[i]['__classeCourante'];
  }
  return null;
}

async function appelerFonction(nom, argsVals) {
  // Priorite a une VARIABLE nommee "nom" si elle contient une valeur-fonction : c'est ce qui
  // permet d'appeler "f(...)" quand f a ete recue en parametre (callback) ou stockee via
  // "f ~ doubler". Une variable non-fonction (nombre, texte...) portant ce nom est une erreur
  // claire plutot que de retomber silencieusement sur une fonction/classe globale du meme nom.
  let rVar = chercherVariable(nom);
  if (rVar.trouve) {
    if (estValeurFonction(rVar.valeur)) {
      return await executerCorpsFonction(rVar.valeur.params, rVar.valeur.corps, argsVals, "La fonction " + nom, undefined, rVar.valeur.environnement);
    }
    throw new Error("'" + nom + "' n'est pas une fonction (c'est un(e) " + nomNature(rVar.valeur) + "), impossible de l'appeler avec (...)");
  }
  if (Object.prototype.hasOwnProperty.call(classes, nom)) {
    return await instancierClasse(nom, argsVals, classes[nom].__moduleEnv);
  }
  let f = fonctions[nom];
  if (!f) throw new ErreurFonctionInconnue("Fonction inconnue: " + nom);
  // Fonction importee selectivement (de X import(nom, ...)) : garde le contexte (fonctions/
  // classes/scope) de SON module pendant son execution, meme appelee sans prefixe ici.
  if (f.__moduleEnv) {
    let fonctionsPrec = fonctions, classesPrec = classes;
    fonctions = f.__moduleEnv.fonctions; classes = f.__moduleEnv.classes;
    try {
      return await executerCorpsFonction(f.params, f.corps, argsVals, "La fonction " + nom, undefined, f.__moduleEnv.env);
    } finally {
      fonctions = fonctionsPrec; classes = classesPrec;
    }
  }
  return await executerCorpsFonction(f.params, f.corps, argsVals, "La fonction " + nom);
}

// Cree une instance d'une classe declaree avec "classe NomClasse [herite NomParent] { ... }",
// et appelle son constructeur init(moi, ...) s'il existe (recherche en remontant la chaine
// d'heritage si la classe elle-meme n'en definit pas). moi recoit automatiquement le nouvel objet.
async function instancierClasse(nomClasse, argsVals, moduleEnv) {
  let classeInfo = classes[nomClasse];
  if (!classeInfo) throw new Error("Classe inconnue: " + nomClasse);
  // Une classe importee sélectivement (de X import(NomClasse sunom~Autre)) peut avoir ete
  // renommee localement : __nomInterne garde son VRAI nom dans le module, seul valable une
  // fois classes/fonctions bascules vers le dictionnaire prive du module ci-dessous (la chaine
  // d'heritage "herite Parent" a ete enregistree avec les noms internes du module).
  let nomRecherche = classeInfo.__nomInterne || nomClasse;
  let instance = { __classe: nomRecherche };
  if (moduleEnv) instance.__moduleEnv = moduleEnv; // se souvient de son module pour les appels de methode futurs
  let fonctionsPrec = fonctions, classesPrec = classes;
  if (moduleEnv) { fonctions = moduleEnv.fonctions; classes = moduleEnv.classes; }
  try {
    let trouve = trouverMethodeAvecClasse(nomRecherche, "init");
    if (trouve) {
      await executerCorpsFonction(trouve.methode.params, trouve.methode.corps, [instance, ...argsVals], "Le constructeur de " + nomClasse, trouve.classeDef, moduleEnv ? moduleEnv.env : undefined);
    } else if (argsVals.length > 0) {
      throw new Error("La classe " + nomClasse + " n'a pas de init(moi, ...) mais a recu " + argsVals.length + " argument(s)");
    }
  } finally {
    fonctions = fonctionsPrec; classes = classesPrec;
  }
  return instance;
}

// Appelle une methode d'instance (instance.methode(...)) : moi recoit automatiquement
// l'instance elle-meme, comme self en Python. Si la classe de l'instance ne definit pas
// cette methode elle-meme, on la cherche dans ses classes parentes (heritage).
// classeDepart (facultatif) permet de commencer la recherche plus haut dans la chaine que la
// classe reelle de l'instance : c'est ce qu'utilise parent.methode(...) pour ignorer la
// version redefinie et retomber sur celle du parent.
async function appellerMethodeInstance(instance, nomMethode, argsVals, classeDepart) {
  let nomClasseRecherche = classeDepart || instance.__classe;
  // Instance d'une classe importee d'un module : le temps de cet appel, on bascule les
  // dictionnaires globaux fonctions/classes vers ceux du module (comme chargerModule() le fait
  // au chargement), pour que la methode retrouve ses propres classes soeurs/fonctions internes.
  let moduleEnv = instance.__moduleEnv;
  let fonctionsPrec = fonctions, classesPrec = classes;
  if (moduleEnv) { fonctions = moduleEnv.fonctions; classes = moduleEnv.classes; }
  try {
    if (!classes[nomClasseRecherche]) throw new Error("Classe inconnue: " + nomClasseRecherche);
    let trouve = trouverMethodeAvecClasse(nomClasseRecherche, nomMethode);
    if (!trouve) throw new Error("La classe " + nomClasseRecherche + " n'a pas de methode " + nomMethode + "(...)");
    return await executerCorpsFonction(trouve.methode.params, trouve.methode.corps, [instance, ...argsVals], nomClasseRecherche + "." + nomMethode + "(...)", trouve.classeDef, moduleEnv ? moduleEnv.env : undefined);
  } finally {
    fonctions = fonctionsPrec; classes = classesPrec;
  }
}

// Appelle parent.methode(moi, ...) depuis l'interieur d'une methode de classe : execute la
// version de "methode" definie par la classe PARENTE de celle qui execute actuellement,
// pour l'instance moi (premier argument recu). Equivalent de super().methode(...) en Python.
async function appellerMethodeParent(nomMethode, argsVals) {
  let classeCourante = getClasseCourante();
  if (!classeCourante) throw new Error("parent." + nomMethode + "(...) ne peut etre utilise qu'a l'interieur d'une methode de classe");
  let classeInfo = classes[classeCourante];
  if (!classeInfo || !classeInfo.parent) throw new Error("La classe " + classeCourante + " n'a pas de classe parente (pas de \"herite\")");
  if (argsVals.length === 0) throw new Error("parent." + nomMethode + "(moi, ...) doit recevoir moi comme premier argument");
  let instance = argsVals[0];
  return await appellerMethodeInstance(instance, nomMethode, argsVals.slice(1), classeInfo.parent);
}


// Applique la "fonction" recue par suchaq() (son 3e argument) a une tranche (ligne/colonne).
// Historiquement ce 3e argument etait lu comme du texte brut (un nom "nu", jamais evalue) :
// suchaq(m, 1, moy) marchait, mais suchaq(m, 1, f) ou f est une variable contenant une
// fonction (ou suchaq(m, 1, fonc(x) moy(x)*2)) echouait toujours avec "doit etre le nom
// (sans parentheses) d'une fonction", meme si f contenait bien une fonction valide.
//
// Corrige en evaluant desormais ce 3e argument comme une VRAIE expression (via evalExpr),
// ce qui couvre variable-fonction, fonction anonyme, etc. Seule exception conservee : un nom
// nu qui designe une fonction statistique de base (som/moy/var/sd/max/min) N'EST PAS une
// expression evaluable (ce ne sont pas des variables), donc ce cas precis reste traite a part,
// exactement comme avant -- pour ne pas casser suchaq(m, 1, moy) deja existant.
const FONCTIONS_VECTEUR_SUCHAQ = { som: sommeVecteur, moy: moyenneVecteur, var: varianceVecteur, sd: ecartTypeVecteur, max: maxVecteur, min: minVecteur };
async function appelerFonctionPourSuchaq(argExpr, valeur, ctxExpr) {
  let texte = argExpr.trim();
  if (/^[a-zA-Z_]\w*$/.test(texte) && Object.prototype.hasOwnProperty.call(FONCTIONS_VECTEUR_SUCHAQ, texte) && !chercherVariable(texte).trouve) {
    return FONCTIONS_VECTEUR_SUCHAQ[texte](valeur);
  }
  let f = await evalExpr(argExpr, ctxExpr);
  if (!estValeurFonction(f)) {
    throw new Error("suchaq(...) : le 3e argument doit etre une fonction -- son nom (moy, doubler...), une variable qui en contient une, ou une fonction anonyme fonc(x){...} -- recu : " + nomNature(f));
  }
  return await executerCorpsFonction(f.params, f.corps, [valeur], "La fonction passee a suchaq", undefined, f.environnement);
}


// Vrai si ce texte de token est un "retour" sans valeur (bare), ex: "retour" seul, ou
// "retour()"/"retour( )" (parentheses vides). Sert a detecter, dans le corps d'une
// fonction/methode, si un "retour vide" y figure EXPLICITEMENT (voir estRetourVideDansCorps).
function estTokenRetourVide(texte) {
  if (texte === 'retour') return true;
  if (!/^retour[\s(]/.test(texte)) return false;
  let reste = texte.slice(6).trim();
  if (/^\(.*\)$/.test(reste)) reste = reste.slice(1, -1).trim();
  return reste === "";
}

// Vrai si au moins un "retour" sans valeur figure explicitement quelque part dans le corps
// (n'importe quel niveau d'imbrication, sans analyse d'atteignabilite : une simple presence
// suffit). Sert a decider, quand une fonction/methode est appelee seule sur sa ligne et ne
// renvoie rien (pasdefini), si on doit l'afficher (la fonction l'annonce explicitement) ou
// rester silencieux (la fonction ne renvoie simplement jamais rien, comme une procedure).
function estRetourVideDansCorps(corps) {
  return corps.some(t => estTokenRetourVide(t.texte));
}

// Analyse la liste de parametres d'une declaration de fonction/methode (ex: "x, ordre~|croissant|")
// en une liste d'objets {nom, defautExpr}. Un parametre AVEC valeur par defaut (nom~expr,
// meme syntaxe ~ que pour une affectation) devient facultatif a l'appel -- s'il est omis,
// defautExpr est evalue au moment de l'appel (voir executerCorpsFonction). splitTopLevelComma
// est reutilise pour ne pas couper une virgule presente a l'interieur d'un texte litteral
// |...| utilise comme valeur par defaut (ex: ordre~|valeur, avec virgule|). Les parametres
// avec defaut doivent tous venir apres ceux sans, comme en Python.
function analyserListeParametres(str, contexteErreur, ligneErreur) {
  if (str.trim() === "") return [];
  let parties = splitTopLevelComma(str);
  let params = parties.map(part => {
    // *param (ou *param~defaut) : parametre NOMME UNIQUEMENT (style Monlangage, le * colle
    // directement au nom au lieu d'etre un separateur isole comme en Python). Peut venir
    // n'importe ou apres un parametre par defaut puisqu'il ne sera jamais rempli par
    // position -- seulement via param~valeur a l'appel (voir executerCorpsFonction).
    let nomSeul = false;
    if (part.startsWith('*')) { nomSeul = true; part = part.slice(1).trim(); }
    let mDefaut = part.match(/^(\w+)\s*~\s*(.+)$/);
    if (mDefaut) return { nom: mDefaut[1], defautExpr: mDefaut[2].trim(), nomSeul };
    if (!/^\w+$/.test(part)) throw new ErreurLangage("Parametre invalide dans " + contexteErreur + " : \"" + part + "\"", ligneErreur);
    return { nom: part, defautExpr: null, nomSeul };
  });
  let vuDefaut = false;
  for (let p of params) {
    if (p.nomSeul) continue; // regle d'ordre : ne concerne que les parametres positionnels
    if (p.defautExpr !== null) vuDefaut = true;
    else if (vuDefaut) throw new ErreurLangage("Dans " + contexteErreur + " : le parametre \"" + p.nom + "\" (sans valeur par defaut) ne peut pas venir apres un parametre qui en a une", ligneErreur);
  }
  return params;
}

// Bug reel trouve et corrige (signale par Yannick, capture d'ecran console) : cette fonction
// remettait "fonctions = {}" AVANT de re-scanner les tokens fournis. Sans consequence pour
// runScript() (RUN), qui fait deja ce reset lui-meme juste avant d'appeler cette fonction sur
// TOUT le script d'un coup -- mais catastrophique pour la console interactive, qui appelle
// cette fonction a CHAQUE touche Entree avec les tokens de la SEULE commande tapee : definir
// "fonc t(...){...}" sur une ligne l'enregistrait bien, mais taper n'importe quelle AUTRE
// commande juste apres (meme "t(b~1)", l'appel lui-meme !) effacait aussitot fonctions -- donc
// "t" redevenait introuvable des la commande suivante, avec l'erreur trompeuse "Appel de
// fonction mal forme" (le vrai souci n'etait pas la syntaxe de l'appel, juste que la fonction
// avait deja disparu). Le reset reste a sa place a l'unique endroit ou il doit avoir lieu :
// runScript(), qui fait deja fonctions = {} explicitement avant son propre appel a
// preRegistrerFonctions() (voir plus bas) -- il etait simplement redondant ici, en plus d'etre
// faux pour l'usage console.
function preRegistrerFonctions(tokens) {
  let i = 0;
  while (i < tokens.length) {
    let t = tokens[i];
    let mClasse = t.texte.match(/^classe\s+(\w+)(?:\s+herite\s+(\w+))?$/);
    if (mClasse) {
      // Les fonc(...) a l'interieur d'un bloc classe sont des methodes, pas des fonctions
      // globales : on saute tout le bloc (elles sont enregistrees a part, voir preRegistrerClasses).
      if (!tokens[i+1] || tokens[i+1].texte !== "{") throw new ErreurLangage("Manque { apres la definition de classe " + mClasse[1], t.ligne);
      let finBlocClasse = trouverFinBloc(tokens, i + 2, t.ligne);
      i = finBlocClasse;
      continue;
    }
    let m = t.texte.match(/^fonc\s+(\w+)\((.*)\)$/);
    if (m) {
      let nom = m[1];
      let params = analyserListeParametres(m[2], "fonc " + nom + "(...)", t.ligne);
      if (!tokens[i+1] || tokens[i+1].texte !== "{") throw new ErreurLangage("Manque { apres la definition de fonction " + nom, t.ligne);
      let finBloc = trouverFinBloc(tokens, i + 2, t.ligne);
      let corps = tokens.slice(i + 2, finBloc - 1);
      fonctions[nom] = { params: params, corps: corps, aRetourVide: estRetourVideDansCorps(corps) };
      i = finBloc;
    } else {
      i++;
    }
  }
}

// Extrait les methodes fonc nomMethode(moi, ...) { ... } declarees a l'interieur d'un bloc
// "classe NomClasse { ... }". Chaque methode doit prendre "moi" comme premier parametre
// (recoit automatiquement l'instance sur laquelle elle est appelee, comme self en Python).
function extraireMethodes(tokens, debut, fin, nomClasse) {
  let methodes = {};
  let i = debut;
  while (i < fin) {
    let t = tokens[i];
    let m = t.texte.match(/^fonc\s+(\w+)\((.*)\)$/);
    if (m) {
      let nomMethode = m[1];
      let params = analyserListeParametres(m[2], "la methode " + nomClasse + "." + nomMethode + "(...)", t.ligne);
      if (params.length === 0 || params[0].nom !== "moi") {
        throw new ErreurLangage("La methode " + nomClasse + "." + nomMethode + "(...) doit prendre \"moi\" comme premier parametre (comme self en Python)", t.ligne);
      }
      if (!tokens[i+1] || tokens[i+1].texte !== "{") throw new ErreurLangage("Manque { apres la methode " + nomMethode, t.ligne);
      let finBlocMethode = trouverFinBloc(tokens, i + 2, t.ligne);
      let corps = tokens.slice(i + 2, finBlocMethode - 1);
      methodes[nomMethode] = { params: params, corps: corps, aRetourVide: estRetourVideDansCorps(corps) };
      i = finBlocMethode;
    } else {
      i++;
    }
  }
  return methodes;
}

// Extrait les attributs de classe PARTAGES (statiques) : les lignes "nom ~ valeur"
// declarees DIRECTEMENT dans le corps de la classe, hors de toute methode (les fonc(...)
// sont sautes entierement, ce ne sont pas des attributs partages). Evalue chaque valeur une
// seule fois, au moment de l'enregistrement de la classe (pas a chaque instanciation).
async function extraireAttributsPartages(tokens, debut, fin, ctxExpr) {
  let attrs = {};
  let i = debut;
  while (i < fin) {
    let t = tokens[i];
    let mFonc = t.texte.match(/^fonc\s+(\w+)\((.*)\)$/);
    if (mFonc) {
      // Le corps d'une methode n'est pas un attribut partage : on saute tout le bloc.
      let finBlocMethode = trouverFinBloc(tokens, i + 2, t.ligne);
      i = finBlocMethode;
      continue;
    }
    let mAttr = t.texte.match(/^([a-zA-Z_]\w*)\s*~\s*(.*)$/s);
    if (mAttr) {
      let nomAttr = mAttr[1], valeurExpr = mAttr[2].trim();
      let valeur;
      if (/^\|[\s\S]*\|$/.test(valeurExpr)) valeur = valeurExpr.slice(1, -1);
      else valeur = await evalExpr(valeurExpr, ctxExpr);
      attrs[nomAttr] = valeur;
    }
    i++;
  }
  return attrs;
}

// Pre-enregistre toutes les classes "classe NomClasse [herite NomParent] { fonc methode(moi, ...){...} ... }"
// du script, avant execution (comme preRegistrerFonctions pour fonc).
async function preRegistrerClasses(tokens) {
  classes = {};
  let i = 0;
  while (i < tokens.length) {
    let t = tokens[i];
    let m = t.texte.match(/^classe\s+(\w+)(?:\s+herite\s+(\w+))?$/);
    if (m) {
      let nomClasse = m[1];
      let nomParent = m[2] || null;
      if (!tokens[i+1] || tokens[i+1].texte !== "{") throw new ErreurLangage("Manque { apres la definition de classe " + nomClasse, t.ligne);
      let finBloc = trouverFinBloc(tokens, i + 2, t.ligne);
      let methodes = extraireMethodes(tokens, i + 2, finBloc - 1, nomClasse);
      let statique = await extraireAttributsPartages(tokens, i + 2, finBloc - 1, ctxExpr);
      classes[nomClasse] = { methodes: methodes, parent: nomParent, ligne: t.ligne, statique: statique };
      i = finBloc;
    } else {
      i++;
    }
  }
  // Verifie que chaque "herite NomParent" pointe vers une classe existante, et qu'il n'y a
  // pas de cycle d'heritage (A herite B herite A).
  for (let nomClasse in classes) {
    let vus = new Set([nomClasse]);
    let c = classes[nomClasse];
    while (c.parent) {
      if (!classes[c.parent]) throw new ErreurLangage("La classe " + nomClasse + " herite de " + c.parent + ", qui n'existe pas", c.ligne);
      if (vus.has(c.parent)) throw new ErreurLangage("Heritage circulaire detecte pour la classe " + nomClasse, c.ligne);
      vus.add(c.parent);
      c = classes[c.parent];
    }
  }
}

/* ===================== MODULES (import) ===================== */
// Reconnait les differentes formes de "import(...)" et "de X import(...)" a la ligne. Renvoie
// null si la ligne n'est pas un import, sinon un descripteur structure. Ne resout ni ne charge
// rien elle-meme -- ca c'est le travail de resoudreCheminImport()/chargerModule() plus bas.
function analyserLigneImport(ligne) {
  let mDe = ligne.match(/^de\s+(.+?)\s+import\((.*)\)$/);
  if (mDe) {
    let cibleBrute = mDe[1].trim();
    let listeBrute = mDe[2].trim();
    if (listeBrute === "") throw new Error("de ... import(...) : liste de noms vide");
    let noms = splitTopLevelComma(listeBrute).map(item => {
      let m = item.trim().match(/^([a-zA-Z_]\w*)(?:\s+sunom~([a-zA-Z_]\w*))?$/);
      if (!m) throw new Error("de ... import(...) : element invalide \"" + item.trim() + "\" (attendu: nom ou nom sunom~alias)");
      return { nom: m[1], alias: m[2] || m[1] };
    });
    return { forme: "selectif", cible: cibleBrute, noms: noms };
  }
  let mImport = ligne.match(/^import\((.*)\)$/);
  if (mImport) {
    let interieur = mImport[1].trim();
    if (interieur === "") throw new Error("import(...) : chemin ou nom de module manquant");
    let parties = splitTopLevelComma(interieur);
    if (parties.length > 2) throw new Error("import(...) : trop d'arguments (attendu: import(module) ou import(module, sunom~alias))");
    let cibleBrute = parties[0].trim();
    let alias = null;
    if (parties.length === 2) {
      let m = parties[1].trim().match(/^sunom~([a-zA-Z_]\w*)$/);
      if (!m) throw new Error("import(...) : deuxieme argument invalide (attendu: sunom~alias)");
      alias = m[1];
    }
    return { forme: "complet", cible: cibleBrute, alias: alias };
  }
  return null;
}

// Resout la "cible" brute d'un import (identifiant nu SANS extension, ou texte |chemin.mlg|
// explicite) en un chemin de fichier complet, et determine le nom de module par defaut (utilise
// comme prefixe si aucun sunom~ n'est fourni). Identifiant nu -> outils.mlg dans le dossier du
// script courant. Texte |...| -> chemin explicite (absolu si commence par "/", sinon relatif au
// dossier du script courant), extension requise dans ce cas.
function resoudreCheminImport(cibleBrute, ligneErreur) {
  let mTexte = cibleBrute.match(/^\|([^|]*)\|$/);
  let cheminBrut, nomModuleParDefaut;
  if (mTexte) {
    cheminBrut = mTexte[1].trim();
    if (cheminBrut === "") throw new ErreurLangage("import(...) : chemin vide", ligneErreur);
    let base = cheminBrut.substring(cheminBrut.lastIndexOf("/") + 1);
    nomModuleParDefaut = base.replace(/\.mlg$/i, "");
  } else {
    if (!/^[a-zA-Z_]\w*$/.test(cibleBrute)) {
      throw new ErreurLangage("import(...) : \"" + cibleBrute + "\" n'est ni un identifiant de module ni un chemin |...|", ligneErreur);
    }
    cheminBrut = cibleBrute + ".mlg";
    nomModuleParDefaut = cibleBrute;
  }
  let chemin;
  if (cheminBrut.startsWith("/")) {
    chemin = cheminBrut;
  } else {
    let onglet = trouverOnglet(ongletActifId);
    let dossier = onglet && onglet.dossier;
    if (!dossier) {
      throw new ErreurLangage("import(...) : impossible de resoudre un chemin relatif -- ce script n'a pas encore ete enregistre sur le stockage (enregistre-le d'abord avec un nom, ou utilise un chemin absolu |...|)", ligneErreur);
    }
    chemin = dossier.replace(/\/+$/, "") + "/" + cheminBrut;
  }
  return { chemin: chemin, nomModuleParDefaut: nomModuleParDefaut };
}

// Charge le fichier a "chemin", l'execute ISOLE (son propre fonctions{}/classes{}/scope, jamais
// melange a ceux du script qui importe -- comme un module Python), et l'enregistre sous
// modules[alias]. Rend ensuite chacune de ses fonctions/classes appelable via "alias.nom(...)".
async function chargerModule(chemin, alias, ligneErreur) {
  if (Object.prototype.hasOwnProperty.call(modules, alias)) {
    if (modules[alias].chemin === chemin) return; // deja charge sous cet alias : rien a faire
    throw new ErreurLangage("import(...) : l'alias \"" + alias + "\" est deja utilise pour un autre module (utilise sunom~ pour en choisir un autre)", ligneErreur);
  }
  if (pileImportEnCours.includes(chemin)) {
    throw new ErreurLangage("import(...) : import circulaire detecte (" + [...pileImportEnCours, chemin].join(" -> ") + ")", ligneErreur);
  }
  if (!(window.MonLangage && typeof window.MonLangage.lireFichier === "function")) {
    throw new ErreurIndisponibleHorsApp("import(...) : disponible uniquement dans l'app installee (rebuild requis)");
  }
  if (window.MonLangage && typeof window.MonLangage.permissionStockageAccordee === "function" && !window.MonLangage.permissionStockageAccordee()) {
    throw new ErreurPermissionRefusee("import(...) : l'acces au stockage n'est pas autorise (active la permission dans les reglages de l'app)");
  }
  let texte = window.MonLangage.lireFichier(chemin);
  if (texte === null || texte === undefined) {
    throw new ErreurFichierIntrouvable("import(...) : impossible de lire le module '" + chemin + "'");
  }
  let tokensModule;
  try {
    tokensModule = parser(texte);
    let erreursModule = verifierSyntaxeSansRisque(texte, tokensModule);
    if (erreursModule.length > 0) throw new Error("erreur de syntaxe ligne " + erreursModule[0].ligne + " : " + erreursModule[0].message);
  } catch (e) {
    throw new ErreurLangage("import(...) : erreur dans le module '" + chemin + "' : " + e.message, ligneErreur);
  }
  // v1 : un module ne peut pas lui-meme importer un autre module (pas de namespacing recursif
  // pour l'instant). On le detecte explicitement plutot que de laisser un import(...) imbrique
  // se faire ignorer silencieusement (il ne serait jamais charge, mais la ligne serait quand
  // meme reconnue comme "un import deja traite" et sautee sans rien faire).
  for (let tm of tokensModule) {
    let estImport = false;
    try { estImport = !!analyserLigneImport(tm.texte); } catch (_) { estImport = true; }
    if (estImport) {
      throw new ErreurLangage("import(...) : le module '" + chemin + "' contient lui-meme un import -- un module ne peut pas encore importer un autre module (limitation v1)", ligneErreur);
    }
  }

  let fonctionsPrec = fonctions, classesPrec = classes, scopesPrec = scopes;
  pileImportEnCours.push(chemin);
  fonctions = {};
  classes = {};
  scopes = [{}];
  try {
    preRegistrerFonctions(tokensModule);
    await preRegistrerClasses(tokensModule);
    await executerTokens(tokensModule, 0, tokensModule.length);
    modules[alias] = { fonctions: fonctions, classes: classes, scope: scopes[0], chemin: chemin };
  } catch (e) {
    if (e instanceof ErreurLangage) throw new ErreurLangage("import(...) : erreur dans le module '" + chemin + "' (ligne " + e.ligne + ") : " + e.message, ligneErreur);
    throw new Error("import(...) : erreur dans le module '" + chemin + "' : " + e.message);
  } finally {
    fonctions = fonctionsPrec;
    classes = classesPrec;
    scopes = scopesPrec;
    pileImportEnCours.pop();
  }

  let modInfo = modules[alias];
  let moduleEnv = { fonctions: modInfo.fonctions, classes: modInfo.classes, env: [modInfo.scope] };
  for (let nomFonc in modInfo.fonctions) enregistrerAppelableModule(alias, nomFonc, "fonction", moduleEnv);
  for (let nomClasse in modInfo.classes) enregistrerAppelableModule(alias, nomClasse, "classe", moduleEnv);
}

// Enregistre "alias.nom(...)" comme un appel valide, en reutilisant EXACTEMENT le mecanisme
// deja utilise par les fonctions integrees a prefixe (ecrire.fichier, conver.texte.nombr, entr.secret...) :
// une simple clef avec un point dans fonctionsBase/fonctionsExpression. Rien d'autre a changer
// dans le moteur -- ni le tokenizer, ni l'evaluateur d'expressions ne voient jamais la difference.
function enregistrerAppelableModule(alias, nom, type, moduleEnv) {
  let cle = alias + "." + nom;
  let wrapper = async function(argExprs, ctxExpr) {
    let argsVals = [];
    for (let a of argExprs) argsVals.push(await evaluerArgumentAppelStmt(a.trim(), ctxExpr));
    let fonctionsPrec = fonctions, classesPrec = classes;
    fonctions = moduleEnv.fonctions; classes = moduleEnv.classes;
    try {
      if (type === "fonction") {
        let f = moduleEnv.fonctions[nom];
        return await executerCorpsFonction(f.params, f.corps, argsVals, cle + "(...)", undefined, moduleEnv.env);
      }
      return await instancierClasse(nom, argsVals, moduleEnv);
    } finally {
      fonctions = fonctionsPrec; classes = classesPrec;
    }
  };
  fonctionsBase[cle] = fonctionsExpression[cle] = wrapper;
  _versionFonctionsExpression++; // nouveau nom disponible -> le cache d'analyse d'expression perime
}

let __compteurImportTmp = 0;
// "de X import(a, b sunom~c)" : charge le module sous un alias interne (jamais expose via
// prefixe), puis recopie SEULEMENT les noms demandes directement dans fonctions{}/classes{}
// globaux -- chacun garde neanmoins le contexte (fonctions/classes/scope) de son module
// d'origine via __moduleEnv, pour que ses appels internes non-prefixes continuent de fonctionner.
async function appliquerImportSelectif(chemin, noms, ligneErreur) {
  let aliasInterne = "__import_selectif_" + (__compteurImportTmp++);
  await chargerModule(chemin, aliasInterne, ligneErreur);
  let modInfo = modules[aliasInterne];
  let moduleEnv = { fonctions: modInfo.fonctions, classes: modInfo.classes, env: [modInfo.scope] };
  for (let { nom, alias } of noms) {
    let estFonction = Object.prototype.hasOwnProperty.call(modInfo.fonctions, nom);
    let estClasse = Object.prototype.hasOwnProperty.call(modInfo.classes, nom);
    if (!estFonction && !estClasse) {
      throw new ErreurLangage("de ... import(...) : \"" + nom + "\" est introuvable dans le module '" + chemin + "'", ligneErreur);
    }
    if (Object.prototype.hasOwnProperty.call(fonctions, alias) || Object.prototype.hasOwnProperty.call(classes, alias)) {
      throw new ErreurLangage("de ... import(...) : \"" + alias + "\" existe deja dans ce script -- renomme a l'import avec : " + nom + " sunom~nouveauNom", ligneErreur);
    }
    if (estFonction) {
      let f = modInfo.fonctions[nom];
      fonctions[alias] = { params: f.params, corps: f.corps, aRetourVide: f.aRetourVide, __moduleEnv: moduleEnv };
    } else {
      let c = modInfo.classes[nom];
      c.__moduleEnv = moduleEnv;
      c.__nomInterne = nom;
      classes[alias] = c;
    }
  }
}

// Scanne les tokens de PREMIER NIVEAU a la recherche de import(...)/de X import(...), avant
// meme preRegistrerFonctions() -- comme les fonc/classe, les imports sont "hisses" en haut du
// script, peu importe ou la ligne apparait textuellement. Saute entierement les blocs classe
// (memes regles que preRegistrerFonctions : un import(...) a l'interieur d'une classe n'a pas
// de sens et n'est pas reconnu).
async function preRegistrerImports(tokens) {
  let i = 0;
  while (i < tokens.length) {
    let t = tokens[i];
    let mClasse = t.texte.match(/^classe\s+(\w+)(?:\s+herite\s+(\w+))?$/);
    if (mClasse) {
      if (!tokens[i+1] || tokens[i+1].texte !== "{") { i++; continue; }
      let finBlocClasse = trouverFinBloc(tokens, i + 2, t.ligne);
      i = finBlocClasse;
      continue;
    }
    let desc;
    try {
      desc = analyserLigneImport(t.texte);
    } catch (e) {
      throw new ErreurLangage(e.message, t.ligne);
    }
    if (desc) {
      let resolu = resoudreCheminImport(desc.cible, t.ligne);
      if (desc.forme === "complet") {
        await chargerModule(resolu.chemin, desc.alias || resolu.nomModuleParDefaut, t.ligne);
      } else {
        await appliquerImportSelectif(resolu.chemin, desc.noms, t.ligne);
      }
    }
    i++;
  }
}

// Cherche une methode en remontant la chaine d'heritage (classe, puis son parent, etc.),
// comme la resolution de methode en Python quand une sous-classe n'a pas redefini une
// methode de sa classe parente. Renvoie aussi la classe qui DEFINIT reellement la methode
// (utile pour parent.methode(...), qui a besoin de savoir ou reprendre la recherche).
function trouverMethodeAvecClasse(nomClasse, nomMethode) {
  let nomActuel = nomClasse;
  let c = classes[nomClasse];
  while (c) {
    if (Object.prototype.hasOwnProperty.call(c.methodes, nomMethode)) return { methode: c.methodes[nomMethode], classeDef: nomActuel };
    nomActuel = c.parent;
    c = c.parent ? classes[c.parent] : null;
  }
  return null;
}

// Cherche un attribut de classe PARTAGE (NomClasse.attribut, declare directement dans le
// corps de la classe, hors de toute methode) en remontant la chaine d'heritage si la classe
// elle-meme ne le definit pas (comme pour les methodes, voir trouverMethodeAvecClasse). Une
// seule valeur existe par classe (pas par instance) : la modifier via NomClasse.attribut ~
// valeur la change pour tout le monde.
function trouverAttributPartage(nomClasse, nomAttr) {
  let c = classes[nomClasse];
  while (c) {
    if (Object.prototype.hasOwnProperty.call(c.statique, nomAttr)) return { valeur: c.statique[nomAttr] };
    c = c.parent ? classes[c.parent] : null;
  }
  return null;
}

// Decide si l'appel seul sur sa ligne d'une fonction/methode qui n'a rien renvoye
// (val === undefined) doit afficher "pasdefini" ou rester silencieux : uniquement si son
// corps contient explicitement un "retour" vide (voir estRetourVideDansCorps). Une
// fonction/methode qui n'a simplement aucun retour (comme une procedure) reste silencieuse.
function doitAfficherResultatAppel(val, aRetourVide) {
  return val !== undefined || !!aRetourVide;
}

  { noms: ["~"], categorie: "Base", syntaxe: "nom ~ valeur", description: [

  { noms: ["base"], categorie: "Base", syntaxe: "base.nom(...)", description: [

  { noms: ["aide"], categorie: "Base", syntaxe: "aide()  ou  aide(nomOuSymbole)  ou  aide(spec)", description: [

  { noms: ["natu"], categorie: "Base", syntaxe: "natu(var)", description: [

  { noms: ["entier", "reel"], categorie: "Base", syntaxe: "entier(x)  /  reel(x)", description: [
      "Convertit x vers un GRAND ENTIER exact ou vers un nombre normal (reel), comme int(...)/float(...) en Python.",
      "entier(x) : grand entier exact (precision illimitee, contrairement aux nombres normaux limites a 2^53), tronque une valeur a virgule vers zero. Depuis un texte, doit etre une suite de chiffres valide.",

    ], exemple: "entier(2) ^ entier(100)   ->   1267650600228229401496703205376  (exact)\nreel(entier(5))            ->   5" },
  { noms: ["conver.texte.texte", "conver.booleen.booleen", "conver.nombr.nombr", "conver.vecteu.vecteu", "conver.matric.matric", "conver.liste.liste", "conver.texte.nombr", "conver.booleen.nombr", "conver.nombr.texte", "conver.booleen.texte", "conver.nombr.booleen", "conver.texte.booleen", "conver.texte.vecteu", "conver.booleen.vecteu", "conver.nombr.vecteu", "conver.texte.matric", "conver.booleen.matric", "conver.nombr.matric", "conver.texte.liste", "conver.booleen.liste", "conver.nombr.liste", "conver.vecteu.nombr", "conver.matric.nombr", "conver.liste.nombr", "conver.vecteu.matric", "conver.matric.vecteu", "conver.vecteu.liste", "conver.liste.vecteu", "conver.liste.matric", "conver.matric.liste"], categorie: "Base", syntaxe: "conver.source.cible(valeur)", description: [
      "Convertit valeur d'un type vers un autre, avec la forme generale conver.source.cible(valeur) -- une fonction par couple, verifiant STRICTEMENT que valeur est bien du type source annonce (erreur sinon, jamais de conversion \"multi-source\" implicite).",
      "Types geres : texte, booleen, nombr, vecteu, matric, liste. entier(...)/reel(...) restent des fonctions a part (voir plus haut), non couvertes par ce principe.",
      "Identites (conver.texte.texte, conver.nombr.nombr, ...) : renvoient la valeur telle quelle si le type correspond.",
      "Entre scalaires : conver.texte.nombr / conver.booleen.nombr (texte comme |3.5| -> 3.5 ; VRAI/FAUX -> 1/0) ; conver.nombr.texte / conver.booleen.texte (-> texte, ex: VRAI -> |VRAI|) ; conver.nombr.booleen (0 -> FAUX, tout le reste -> VRAI) ; conver.texte.booleen (uniquement |VRAI| ou |FAUX| exact, erreur sinon).",
      "Scalaire -> collection (vecteu/matric/liste) : nombre/texte/booleen devient un vecteur ou une liste a 1 element, ou une matrice 1x1.",
      "Collection -> conver.*.nombr : seulement si la collection contient EXACTEMENT 1 element numerique, erreur sinon.",
      "Entre collections : conver.vecteu.matric (colonne) / conver.matric.vecteu (aplatit tous les elements) ; conver.vecteu.liste / conver.liste.vecteu (element par element) ; conver.liste.matric (chaque vecteur de la liste devient une ligne -- tous doivent avoir la meme longueur) / conver.matric.liste (l'inverse : chaque ligne devient un vecteur de la liste)."
    ], exemple: "conver.texte.nombr(|3.5|)   ->   3.5\nconver.nombr.texte(42)       ->   |42|\nconver.nombr.booleen(0)      ->   FAUX\nconver.matric.vecteu(matrice(1:4, nlig~2, ncol~2))   ->   c(1,2,3,4)\nconver.vecteu.matric(c(1,2,3))   ->   matrice 3x1\nconver.liste.matric(liste(c(1,2), c(3,4)))   ->   matrice 2x2" },
  { noms: ["est.nombr", "est.text", "est.vecteu", "est.matric", "est.enti", "est.reel", "est.liste"], categorie: "Base", syntaxe: "est.nombr(var) / est.text(var) / est.vecteu(var) / est.matric(var) / est.enti(var) / est.reel(var) / est.liste(var)", description: [
      "Verifie le type de var, et renvoie VRAI ou FAUX.",
      "est.nombr(var) : VRAI si var est un nombre normal OU un grand entier (large ; voir est.enti/est.reel pour distinguer precisement).",
      "est.text(var) : VRAI si var est un texte.",
      "est.vecteu(var) : VRAI si var est un vecteur.",
      "est.matric(var) : VRAI si var est une matrice.",
      "est.enti(var) : VRAI uniquement si var est un GRAND ENTIER (cree via entier(...)) ; FAUX pour un nombre normal meme de valeur entiere.",

      "est.liste(var) : VRAI si var est une liste (creee via liste(...))."

  { noms: ["est.fonction"], categorie: "Base", syntaxe: "est.fonction(var)", description: [
      "VRAI si var contient une fonction (recue en parametre, ou stockee avec f ~ nomFonction).",

      "Une fois stockee, elle s'appelle comme n'importe quelle fonction : f(5).",

    ], exemple: "fonc doubler(x){ retour x * 2 }\nf ~ doubler\naffi(f(5))          ->   10\naffi(est.fonction(f))   ->   VRAI\n\nfonc mapper(vecteur, f){\n    resultat ~ c()\n    pou(x dan vecteur){ resultat.ajout(f(x)) }\n    retour resultat\n}\naffi(mapper(c(1,2,3), doubler))   ->   2 4 6" },
  { noms: ["est.instance"], categorie: "Base", syntaxe: "est.instance(objet, NomClasse)", description: [

  { noms: ["**"], categorie: "Base", syntaxe: "** commentaire", description: [
      "Tout ce qui suit ** jusqu'a la fin de la ligne est un commentaire : ignore par le programme.",

      "Un ** a l'interieur d'un texte litteral |...| n'est pas traite comme un commentaire."
    ], exemple: "x ~ 5 ** on initialise x a 5\n** ceci est une ligne entierement en commentaire" },

  { noms: ["pou"], categorie: "Controle", syntaxe: "pou(var, debut, fin, pas){ ... }  /  pou(var dan objet){ ... }", description: [
      "Repete le bloc entre accolades. Deux syntaxes possibles.",
      "1) pou(var, debut, fin, pas) : var prend d'abord la valeur debut, puis debut+pas, et ainsi de suite jusqu'a fin (fin incluse). pas est facultatif : vaut 1 par defaut, et peut etre negatif (pour compter a l'envers).",
      "debut, fin et pas peuvent etre des expressions complexes (avec des parentheses, ^, des appels de fonction, etc.), separees par des virgules.",
      "2) pou(var dan objet) : var prend tour a tour chaque valeur de objet, qui doit etre un vecteur ou une liste() (chaque element de la liste, pas ses indices).",
      "stop permet d'arreter la boucle avant la fin (voir aide(stop))."
    ], exemple: "pou(i, 1, 5){ affi(i) }   ->   affiche 1 2 3 4 5\npou(i, 10, 1, -1){ affi(i) }   ->   compte a l'envers de 10 a 1\npou(x dan c(3,7,9)){ affi(x) }   ->   affiche 3 7 9" },
  { noms: ["stop"], categorie: "Controle", syntaxe: "stop", description: [
      "Arrete immediatement la boucle (pou ou tanqer) en cours, et continue l'execution juste apres cette boucle.",
      "Utilisable a l'interieur d'un pou(...){...} ou d'un tanqer(...){...}, y compris a l'interieur d'un si(...) place dans la boucle."
    ], exemple: "pou(i, 1, 10){\n  si(i==4){ stop }\n  affi(i)\n}   ->   affiche 1 2 3" },
  { noms: ["continu"], categorie: "Controle", syntaxe: "continu", description: [
      "Interrompt uniquement le tour en cours de la boucle (pou ou tanqer), et passe directement au tour suivant : le reste du bloc est saute pour ce tour, mais la boucle continue.",
      "Contrairement a stop, ca ne quitte pas la boucle.",
      "Utilisable a l'interieur d'un pou(...){...} ou d'un tanqer(...){...}, y compris a l'interieur d'un si(...) place dans la boucle."
    ], exemple: "pou(i, 1, 5){\n  si(i==3){ continu }\n  affi(i)\n}   ->   affiche 1 2 4 5" },
  { noms: ["tanqer"], categorie: "Controle", syntaxe: "tanqer(condition){ ... }  /  tanqer VRAI{ ... }", description: [
      "Repete le bloc tant que la condition reste vraie.",
      "S'arrete des que la condition devient fausse (ou plus tot si stop est rencontre).",
      "tanqer VRAI{...} (ou tanqer V{...}) : raccourci sans parentheses pour une boucle infinie, comme while True en Python. Pas besoin d'ecrire une condition bidon toujours vraie."
    ], exemple: "x ~ 0\ntanqer(x<5){ x ~ x+1 }\n\ni ~ 0\ntanqer VRAI{\n  i ~ i+1\n  si(i>=3){ stop }\n}" },
  { noms: ["si"], categorie: "Controle", syntaxe: "si(condition){ ... }", description: [
      "Execute le bloc uniquement si la condition est vraie. Fonctionne comme if() en R.",
      "Peut etre suivi de sinon si(...){...} et/ou d'un sinon final (tous optionnels)."
    ], exemple: "si(note>=10){ affi(|Reussi|) }" },
  { noms: ["sinon"], categorie: "Controle", syntaxe: "sinon{ ... }", description: [
      "Execute son bloc uniquement quand aucune condition precedente (si ou sinon si) n'etait vraie. Fonctionne comme else en R.",
      "Un seul bloc au total est execute parmi si/sinon si/sinon : le premier dont la condition est vraie.",
      "Toujours place juste apres un si(...){...} ou un sinon si(...){...}, jamais seul."
    ], exemple: "si(note>=10){ affi(|Reussi|) } sinon{ affi(|Echoue|) }" },
  { noms: ["sinon si"], categorie: "Controle", syntaxe: "sinon si(condition){ ... }", description: [
      "Ajoute une condition supplementaire apres un si(...) (ou un autre sinon si), comme else if en R.",
      "On peut en enchainer plusieurs a la suite d'un si(...).",
      "Un seul bloc au total est execute parmi si/sinon si/sinon : le premier dont la condition est vraie.",
      "Peut etre suivi d'autres sinon si(...){...} et/ou d'un sinon final (tous optionnels)."
    ], exemple: "si(note>=16){ affi(|Excellent|) } sinon si(note>=10){ affi(|Reussi|) } sinon{ affi(|Echoue|) }" },
  { noms: ["sision"], categorie: "Controle", syntaxe: "sision(condition, valeurSiVrai, valeurSiFaux)", description: [
      "Version vectorisee (element par element) de si/sinon, comme ifelse() en R.",
      "condition peut etre un vecteur de tests (ex: x>0) : le resultat est un vecteur ou chaque element vient de valeurSiVrai ou valeurSiFaux selon le test correspondant.",
      "valeurSiVrai et valeurSiFaux peuvent etre des scalaires ou des vecteurs (recycles si plus courts que condition, comme les autres operations vectorielles).",
      "Si condition est un simple scalaire, renvoie directement valeurSiVrai ou valeurSiFaux."
    ], exemple: "x ~ seq(-2,2,1)\naffi(sision(x>=0, x, x*-1))   ->   [1] 2 1 0 1 2" },
  { noms: ["essai", "attrape"], categorie: "Controle", syntaxe: "essai{ ... } attrape(msg){ ... }  /  essai{ ... } attrape{ ... }", description: [
      "Intercepte une erreur levee dans le bloc essai au lieu de planter tout le script.",

      "Si aucune erreur ne survient, le bloc attrape est entierement ignore.",
      "attrape(msg){...} recupere le message d'erreur (texte) dans la variable msg. attrape{...} (sans parametre) l'ignore.",
      "Toujours place juste apres un essai{...}, jamais seul.",
      "Ne peut pas empecher un arret manuel du script (bouton Retour pendant l'execution) : cela remonte toujours en dehors de essai/attrape."
    ], exemple: "essai {\n    ecrire.fichier(|/storage/emulated/0/Download/save.mld|, moi)\n} attrape(msg) {\n    affi(|Echec de sauvegarde :|, msg)\n}" },
  { noms: ["limiteRecursion"], categorie: "Controle", syntaxe: "limiteRecursion()  /  limiteRecursion(n)", description: [
      "Lit ou change la limite d'appels de fonction imbriques autorises (protection contre une recursion infinie), comme sys.setrecursionlimit(...) en Python.",

  { noms: ["fonc"], categorie: "Controle", syntaxe: "fonc nom(param1, param2){ ... }", description: [

  { noms: ["retour"], categorie: "Controle", syntaxe: "retour valeur", description: [

  { noms: ["classe"], categorie: "Controle", syntaxe: "classe NomClasse [herite NomParent] { fonc init(moi, ...){...} fonc methode(moi, ...){...} }", description: [
