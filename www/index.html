function enregistrerFonctionsBase() {
    fonctionsBase = {};
    fonctionsExpression = {};

    fonctionsBase["affi"] = async function(args, ctxExpr) {
        let parties = [];
        for (let elem of args) {
            let elemTrim = elem.trim();
            if (elemTrim === "saulig") {
                // saulig : saut de ligne. Reconnu de facon generale par evaluerElementBrut(),
                // mais traite ici directement (sans repasser par elle) pour rester coherent
                // avec le formatage d'affichage (formatPourAffichage) plutot que formatValeur.
                parties.push("\n");
            } else if (/^\|[\s\S]*\|$/.test(elemTrim)) {
                parties.push(elemTrim.slice(1, -1));
            } else {
                verifierTexteLitteralFerme(elemTrim);
                parties.push(await formatPourAffichage(await evalExpr(elemTrim, ctxExpr)));
            }
        }
        // Les parties sont normalement separees par un espace, sauf autour d'un saut de
        // ligne insere par saulig : on retire l'espace parasite qui se retrouverait juste
        // avant/apres le "\n".
        printValeur(parties.join(" ").replace(/ {2,}/g, " ").replace(/ *\n */g, "\n"));
        // Force l'affichage immediat de ce resultat avant de poursuivre l'execution,
        // au lieu de tout accumuler et de ne peindre l'ecran qu'a la toute fin.
        await respirer(true);
    };

    // texte(a, b, ...) : concatene plusieurs parties (comme les arguments de affi()/entr()/~)
    // en UN SEUL texte, saulig compris pour un saut de ligne -- mais renvoie ce texte comme
    // une VALEUR au lieu de l'afficher. Utile pour obtenir un texte concatene a passer
    // directement en un seul argument a ecrire(...)/ecrire.fichier(...)/ajout(...), qui sinon
    // rangeraient chaque partie separee par une virgule comme un element distinct d'une
    // liste() plutot que de les coller ensemble.
    fonctionsBase["texte"] = fonctionsExpression["texte"] = async function(args, ctxExpr) {
        let parties = [];
        for (let elem of args) {
            let elemTrim = elem.trim();
            if (elemTrim === "saulig") {
                parties.push("\n");
            } else if (/^\|[\s\S]*\|$/.test(elemTrim)) {
                parties.push(elemTrim.slice(1, -1));
            } else {
                verifierTexteLitteralFerme(elemTrim);
                parties.push(formatValeur(await evalExpr(elemTrim, ctxExpr)));
            }
        }
        return parties.join(" ").replace(/ {2,}/g, " ").replace(/ *\n */g, "\n");
    };

    // c(...) : combine des valeurs (et aplatit les vecteurs/matrices donnes en argument) en un vecteur.
    fonctionsBase["c"] = fonctionsExpression["c"] = async function(args, ctxExpr) {
        let resultat = [];
        for (let a of args) {
            let v = await evaluerElementBrut(a, ctxExpr);
            if (estListe(v)) throw new Error("c() ne prend pas de liste (types melanges) : utilise liste() pour combiner des types differents, ou [i] pour extraire un element avant de le passer a c()");
            if (estVecteur(v)) resultat.push(...v);
            else if (estMatrice(v)) resultat.push(...v.donnees);
            else resultat.push(v);
        }
        return unifierTypeVecteur(resultat);
    };

    // liste(...) : comme c(), mais SANS unifier vers un type commun et SANS aplatir les
    // vecteurs/matrices/listes donnes en argument -- chaque argument devient un element,
    // tel quel, avec son type d'origine preserve. C'est le conteneur a utiliser quand on
    // veut melanger nombre/texte/booleen/vecteur/instance dans une seule collection
    // accessible par indice (contrairement a une instance de classe, accessible par nom).
    fonctionsBase["liste"] = fonctionsExpression["liste"] = async function(args, ctxExpr) {
        let elements = [];
        for (let a of args) elements.push(await evaluerElementBrut(a, ctxExpr));
        return { __type: "liste", elements: elements };
    };


    // seq(debut, fin, pas) : sequence numerique. pas est optionnel (defaut +1 ou -1).
    fonctionsBase["seq"] = fonctionsExpression["seq"] = async function(args, ctxExpr) {
        if (args.length < 2) throw new Error("seq(debut, fin, pas) attend au moins 2 arguments");
        let debut = await evalExpr(args[0], ctxExpr);
        let fin = await evalExpr(args[1], ctxExpr);
        let pas = args.length >= 3 && args[2].trim() !== "" ? await evalExpr(args[2], ctxExpr) : undefined;
        return construireSequence(debut, fin, pas);
    };

    // rep(elements, nombre) : repete un element ou un vecteur entier "nombre" fois, a la suite.
    fonctionsBase["rep"] = fonctionsExpression["rep"] = async function(args, ctxExpr) {
        if (args.length < 2) throw new Error("rep(elements, nombre) attend 2 arguments");
        let elementsVal = await evaluerElementBrut(args[0], ctxExpr);
        let base = estVecteur(elementsVal) ? elementsVal : (estMatrice(elementsVal) ? elementsVal.donnees : [elementsVal]);
        let nombre = Math.trunc(await evalExpr(args[1], ctxExpr));
        if (nombre < 0) throw new Error("rep(...) : le nombre de repetitions doit etre positif");
        let resultat = [];
        for (let k = 0; k < nombre; k++) resultat.push(...base);
        return resultat;
    };

    // alea(var, x) : choisit x elements au hasard, SANS remise (jamais deux fois le meme
    // element), parmi les elements d'un vecteur ou d'une matrice (traitee "a plat", comme
    // accederUnique/c()).
    // alea(debut, fin, x) : choisit x nombres entiers au hasard, SANS remise, dans
    // l'intervalle [debut, fin] (bornes incluses).
    // Dans les deux cas, renvoie toujours un vecteur, meme pour x~1.
    fonctionsBase["alea"] = fonctionsExpression["alea"] = async function(args, ctxExpr) {
        if (args.length === 2) {
            let v = await evaluerElementBrut(args[0], ctxExpr);
            let x = Math.trunc(await evalExpr(args[1], ctxExpr));
            let plat = estMatrice(v) ? v.donnees : (estVecteur(v) ? v : null);
            if (plat === null) throw new Error("alea(var, x) : var doit etre un vecteur ou une matrice");
            if (x < 0) throw new Error("alea(...) : x doit etre positif");
            if (x > plat.length) throw new Error("alea(...) : impossible de choisir " + x + " element(s) au hasard sans remise parmi seulement " + plat.length);
            return tirerAuHasardSansRemise(plat, x);
        }
        if (args.length === 3) {
            let debut = Math.trunc(await evalExpr(args[0], ctxExpr));
            let fin = Math.trunc(await evalExpr(args[1], ctxExpr));
            let x = Math.trunc(await evalExpr(args[2], ctxExpr));
            if (fin < debut) throw new Error("alea(debut, fin, x) : fin doit etre superieur ou egal a debut");
            let taille = fin - debut + 1;
            if (x < 0) throw new Error("alea(...) : x doit etre positif");
            if (x > taille) throw new Error("alea(...) : impossible de choisir " + x + " nombre(s) au hasard sans remise dans un intervalle de seulement " + taille + " valeur(s)");
            let plage = [];
            for (let n = debut; n <= fin; n++) plage.push(n);
            return tirerAuHasardSansRemise(plage, x);
        }
        throw new Error("alea(...) attend soit alea(var, x), soit alea(debut, fin, x)");
    };

    // ralea(var, x) : comme alea(var, x), mais AVEC remise (un meme element peut sortir
    // plusieurs fois) -- x peut donc depasser le nombre d'elements disponibles.
    // ralea(debut, fin, x) : comme alea(debut, fin, x), mais AVEC remise.
    fonctionsBase["ralea"] = fonctionsExpression["ralea"] = async function(args, ctxExpr) {
        if (args.length === 2) {
            let v = await evaluerElementBrut(args[0], ctxExpr);
            let x = Math.trunc(await evalExpr(args[1], ctxExpr));
            let plat = estMatrice(v) ? v.donnees : (estVecteur(v) ? v : null);
            if (plat === null) throw new Error("ralea(var, x) : var doit etre un vecteur ou une matrice");
            if (x < 0) throw new Error("ralea(...) : x doit etre positif");
            if (plat.length === 0) throw new Error("ralea(...) : impossible de tirer dans un vecteur/une matrice vide");
            return tirerAuHasardAvecRemise(plat, x);
        }
        if (args.length === 3) {
            let debut = Math.trunc(await evalExpr(args[0], ctxExpr));
            let fin = Math.trunc(await evalExpr(args[1], ctxExpr));
            let x = Math.trunc(await evalExpr(args[2], ctxExpr));
            if (fin < debut) throw new Error("ralea(debut, fin, x) : fin doit etre superieur ou egal a debut");
            if (x < 0) throw new Error("ralea(...) : x doit etre positif");
            let plage = [];
            for (let n = debut; n <= fin; n++) plage.push(n);
            return tirerAuHasardAvecRemise(plage, x);
        }
        throw new Error("ralea(...) attend soit ralea(var, x), soit ralea(debut, fin, x)");
    };

    // lettr et Lettr sont geres comme des identifiants constants directement dans l'evaluateur
    // d'expressions (comme VRAI/FAUX), sans parentheses : voir parsePrimaryBrute.

    // sision(condition, valeurSiVrai, valeurSiFaux) : version vectorisee (element par element)
    // de si/sinon, comme ifelse(...) en R. Si condition est un vecteur (typiquement issu d'une
    // comparaison comme x>0), le resultat est un vecteur choisissant, pour chaque position,
    // dans valeurSiVrai ou valeurSiFaux (recycles si plus courts, comme les autres operations
    // vectorielles du langage). Si condition est un simple scalaire, renvoie une seule valeur.
    fonctionsBase["sision"] = fonctionsExpression["sision"] = async function(args, ctxExpr) {
        if (args.length !== 3) throw new Error("sision(condition, valeurSiVrai, valeurSiFaux) attend exactement 3 arguments");
        let cond = await evaluerElementBrut(args[0], ctxExpr);
        let siVrai = await evaluerElementBrut(args[1], ctxExpr);
        let siFaux = await evaluerElementBrut(args[2], ctxExpr);

        if (!estVecteur(cond)) {
            if (estVecteur(siVrai) || estVecteur(siFaux)) throw new Error("sision(...) : pour choisir dans des vecteurs, condition doit aussi etre un vecteur (ex: x>0)");
            return estVrai(cond) ? siVrai : siFaux;
        }
        if (cond.length === 0) throw new Error("sision(...) : condition est un vecteur vide");
        let vVrai = estVecteur(siVrai) ? siVrai : [siVrai];
        let vFaux = estVecteur(siFaux) ? siFaux : [siFaux];
        if (vVrai.length === 0 || vFaux.length === 0) throw new Error("sision(...) : valeurSiVrai/valeurSiFaux ne peuvent pas etre un vecteur vide");
        let resultat = [];
        for (let i = 0; i < cond.length; i++) {
            resultat.push(estVrai(cond[i]) ? vVrai[i % vVrai.length] : vFaux[i % vFaux.length]);
        }
        return unifierTypeVecteur(resultat);
    };

    // matrice(elements, nlig~..., ncol~..., parlig~VRAI|FAUX) : cree une matrice.
    // Remplissage par defaut en colonne (parlig~FAUX). nlig/ncol : au moins un des deux
    // suffit, l'autre est deduit ; si aucun n'est donne, on obtient un vecteur colonne.
    fonctionsBase["matrice"] = fonctionsExpression["matrice"] = async function(args, ctxExpr) {
        if (args.length < 1) throw new Error("matrice(elements, nlig~..., ncol~..., parlig~...) attend au moins les elements");
        let elementsVal = await evaluerElementBrut(args[0], ctxExpr);
        let elements = estVecteur(elementsVal) ? elementsVal : (estMatrice(elementsVal) ? elementsVal.donnees : [elementsVal]);
        if (elements.length === 0) throw new Error("matrice(...) : la liste d'elements est vide");
        elements = unifierTypeVecteur(elements);

        let nlig = null, ncol = null, parLigne = false;
        for (let i = 1; i < args.length; i++) {
            let m = args[i].trim().match(/^(\w+)\s*~\s*(.*)$/);
            if (!m) throw new Error("Argument invalide dans matrice(...) : " + args[i]);
            let paramNom = m[1], paramValeur = await evalExpr(m[2], ctxExpr);
            if (paramNom === "nlig") nlig = paramValeur;
            else if (paramNom === "ncol") ncol = paramValeur;
            else if (paramNom === "parlig") parLigne = estVrai(paramValeur);
            else throw new Error("Parametre inconnu pour matrice(...) : " + paramNom);
        }

        if (nlig === null && ncol === null) { ncol = 1; nlig = elements.length; }
        else if (nlig === null) nlig = Math.ceil(elements.length / ncol);
        else if (ncol === null) ncol = Math.ceil(elements.length / nlig);
        nlig = Math.trunc(nlig); ncol = Math.trunc(ncol);
        if (nlig <= 0 || ncol <= 0) throw new Error("matrice(...) : nlig et ncol doivent etre positifs");

        let taille = nlig * ncol;
        let donnees = new Array(taille);
        if (parLigne) {
            for (let idx = 0; idx < taille; idx++) {
                let l = Math.floor(idx / ncol), c = idx % ncol;
                donnees[c * nlig + l] = elements[idx % elements.length];
            }
        } else {
            for (let idx = 0; idx < taille; idx++) donnees[idx] = elements[idx % elements.length];
        }
        return { __type: "matrice", nlig: nlig, ncol: ncol, donnees: donnees };
    };

    // entr() : fonction native utilisable dans une expression (ex: nom ~ entr(|...|)).
    // Enregistree aussi dans fonctionsExpression car elle doit etre extraite avant
    // le decoupage normal de l'expression (syntaxe |texte| + attente asynchrone).
    // Construit le message affiche par entr()/entr.secret()/entr.nombr()/... a partir des
    // arguments bruts (non evalues) : meme logique de concatenation que affi() (avec |texte|
    // et saulig), factorisee ici pour etre reutilisee par toutes les variantes de entr.
    async function construireMessageEntr(args, ctxExpr) {
        let parties = [];
        for (let elem of args) {
            let elemTrim = (elem || "").trim();
            if (elemTrim === "") continue;
            if (elemTrim === "saulig") {
                parties.push("\n");
            } else if (/^\|[\s\S]*\|$/.test(elemTrim)) {
                parties.push(elemTrim.slice(1, -1));
            } else {
                try { verifierTexteLitteralFerme(elemTrim); parties.push(formatValeur(await evalExpr(elemTrim, ctxExpr))); }
                catch (e) { parties.push(elemTrim); }
            }
        }
        return parties.join(" ").replace(/ {2,}/g, " ").replace(/ *\n */g, "\n");
    }
    // Separe, parmi les arguments bruts d'un entr.secret()/entr.Nsecret()/entr.Tsecret(),
    // le parametre nomme sty~... (le caractere de masquage) du reste (le message a afficher).
    // Pas de sty~... fourni : styleChar reste null, ce qui veut dire "rien affiche du tout
    // pendant la frappe" (pas meme un caractere de masquage).
    async function extraireStyleEtMessageEntr(args, ctxExpr) {
        let styleChar = null, messageParts = [];
        for (let a of args) {
            let m = a.trim().match(/^sty\s*~\s*(.*)$/);
            if (m) {
                let v = await evalExpr(m[1], ctxExpr);
                if (typeof v !== 'string' || v.length !== 1) throw new Error("sty~... doit etre un seul caractere texte, ex: sty~|*|");
                styleChar = v;
            } else {
                messageParts.push(a);
            }
        }
        return { message: await construireMessageEntr(messageParts, ctxExpr), styleChar };
    }

    fonctionsBase["entr"] = fonctionsExpression["entr"] = async function(args, ctxExpr) {
        let message = await construireMessageEntr(args, ctxExpr);
        let saisie = await demanderSaisieConsole(message);
        if (saisie === null || saisie === undefined) saisie = "";
        let asTrim = saisie.trim();
        let nombre = parseFloat(asTrim);
        let estNombre = asTrim !== "" && !isNaN(nombre) && String(nombre) === asTrim;
        return estNombre ? nombre : saisie;
    };

    // entr.secret(|texte|, sty~|*|) : comme entr(), mais la frappe n'est jamais affichee en
    // clair. Sans sty~... : rien n'est affiche du tout (pas meme un caractere de masquage).
    // Avec sty~... : affiche ce caractere autant de fois que de caracteres tapes.
    // Detecte nombre/texte automatiquement, comme entr().
    fonctionsBase["entr.secret"] = fonctionsExpression["entr.secret"] = async function(args, ctxExpr) {
        let { message, styleChar } = await extraireStyleEtMessageEntr(args, ctxExpr);
        let saisie = await demanderSaisieConsoleSecrete(message, styleChar);
        if (saisie === null || saisie === undefined) saisie = "";
        let asTrim = saisie.trim();
        let nombre = parseFloat(asTrim);
        let estNombre = asTrim !== "" && !isNaN(nombre) && String(nombre) === asTrim;
        return estNombre ? nombre : saisie;
    };

    // entr.nombr(...) : comme entr(), mais SANS masquer la frappe -- redemande en boucle
    // tant que la saisie n'est pas un nombre valide, et renvoie toujours un nombre.
    fonctionsBase["entr.nombr"] = fonctionsExpression["entr.nombr"] = async function(args, ctxExpr) {
        let message = await construireMessageEntr(args, ctxExpr);
        while (true) {
            let saisie = await demanderSaisieConsole(message);
            if (saisie === null || saisie === undefined) saisie = "";
            let asTrim = saisie.trim();
            let nombre = Number(asTrim);
            if (asTrim !== "" && !isNaN(nombre)) return nombre;
            print("Cette saisie attend un nombre, pas du texte. Merci de reessayer.", "erreur");
        }
    };

    // entr.text(...) : comme entr(), mais SANS masquer la frappe et SANS jamais convertir
    // en nombre -- renvoie toujours du texte tel quel (utile pour un code/numero avec des
    // zeros en tete, ex: |0123|, qui deviendrait sinon le nombre 123 avec entr()).
    fonctionsBase["entr.text"] = fonctionsExpression["entr.text"] = async function(args, ctxExpr) {
        let message = await construireMessageEntr(args, ctxExpr);
        let saisie = await demanderSaisieConsole(message);
        if (saisie === null || saisie === undefined) saisie = "";
        return saisie;
    };

    // entr.oui(...) : question fermee oui/non. Redemande en boucle tant que la reponse
    // n'est pas reconnue (oui/o/non/n, insensible a la casse et aux espaces), et renvoie
    // directement VRAI ou FAUX -- pas besoin de comparer le texte tape a la main.
    fonctionsBase["entr.oui"] = fonctionsExpression["entr.oui"] = async function(args, ctxExpr) {
        let message = await construireMessageEntr(args, ctxExpr);
        while (true) {
            let saisie = await demanderSaisieConsole(message);
            if (saisie === null || saisie === undefined) saisie = "";
            let asTrim = saisie.trim().toLowerCase();
            if (asTrim === "oui" || asTrim === "o" || asTrim === "ok") return true;
            if (asTrim === "non" || asTrim === "n") return false;
            print("Reponds par oui ou non (ou juste o/n).", "erreur");
        }
    };

    // entr.Nsecret(|texte|, sty~|*|) : entr.secret() + validation, redemande en boucle tant
    // que la saisie masquee n'est pas un nombre valide, et renvoie toujours un nombre.
    fonctionsBase["entr.Nsecret"] = fonctionsExpression["entr.Nsecret"] = async function(args, ctxExpr) {
        let { message, styleChar } = await extraireStyleEtMessageEntr(args, ctxExpr);
        while (true) {
            let saisie = await demanderSaisieConsoleSecrete(message, styleChar);
            if (saisie === null || saisie === undefined) saisie = "";
            let asTrim = saisie.trim();
            let nombre = Number(asTrim);
            if (asTrim !== "" && !isNaN(nombre)) return nombre;
            print("Cette saisie attend un nombre, pas du texte. Merci de reessayer.", "erreur");
        }
    };

    // entr.Tsecret(|texte|, sty~|*|) : entr.secret(), mais renvoie TOUJOURS du texte, jamais
    // converti en nombre (utile pour un code/numero avec des zeros en tete, ex: |0123|).
    fonctionsBase["entr.Tsecret"] = fonctionsExpression["entr.Tsecret"] = async function(args, ctxExpr) {
        let { message, styleChar } = await extraireStyleEtMessageEntr(args, ctxExpr);
        let saisie = await demanderSaisieConsoleSecrete(message, styleChar);
        if (saisie === null || saisie === undefined) saisie = "";
        return saisie;
    };

    // ecrire(cle, valeur) ou ecrire(cle, val1, val2, ...) : sauvegarde silencieuse et
    // immediate dans localStorage (reste dans l'app, aucune interaction utilisateur).
    // N'importe quelle valeur de monlangage peut etre sauvegardee (nombre, texte, booleen,
    // vecteur, matrice, liste, instance de classe) car toutes se representent en JS comme
    // des donnees simples (les instances sont de simples {__classe:..., attributs...}, sans
    // methodes attachees).
    // Avec UNE seule valeur : comportement inchange, lire(cle) renvoie cette valeur telle
    // quelle (type conserve).
    // Avec PLUSIEURS valeurs : stockees ensemble comme une liste() (pas un vecteur), pour
    // ne pas forcer un type unique sur des valeurs de natures differentes -- lire(cle)
    // renvoie alors une liste(), accessible par indice (l[1], l[2]...).
    fonctionsBase["ecrire"] = fonctionsExpression["ecrire"] = async function(args, ctxExpr) {
        if (args.length < 2) throw new Error("ecrire(cle, valeur, ...) attend au moins 2 arguments");
        let cle = await evalExpr(args[0], ctxExpr);
        if (typeof cle !== 'string') throw new Error("ecrire(cle, valeur, ...) : cle doit etre du texte");
        let valeurs = [];
        for (let i = 1; i < args.length; i++) valeurs.push(await evaluerElementBrut(args[i], ctxExpr));
        let valeur = valeurs.length === 1 ? valeurs[0] : { __type: "liste", elements: valeurs };
        let texte;
        try { texte = JSON.stringify(valeur); }
        catch (e) { throw new Error("ecrire(...) : cette valeur ne peut pas etre sauvegardee"); }
        try { localStorage.setItem("monlangage:" + cle, texte); }
        catch (e) { throw new Error("ecrire(...) : sauvegarde impossible (" + e.message + ")"); }
        return true;
    };

    // lire(cle) : recupere une valeur sauvegardee avec ecrire(...). Renvoie pasdefini si
    // la cle n'existe pas.
    fonctionsBase["lire"] = fonctionsExpression["lire"] = async function(args, ctxExpr) {
        if (args.length !== 1) throw new Error("lire(cle) attend 1 argument");
        let cle = await evalExpr(args[0], ctxExpr);
        if (typeof cle !== 'string') throw new Error("lire(cle) : cle doit etre du texte");
        let brut = localStorage.getItem("monlangage:" + cle);
        if (brut === null) return undefined;
        try { return JSON.parse(brut); }
        catch (e) { throw new Error("lire(...) : la sauvegarde pour '" + cle + "' est corrompue"); }
    };

    // existe.fichier(chemin) : VRAI/FAUX selon qu'un fichier existe deja a cet emplacement.
    // Demande un CHEMIN COMPLET (comme ecrire.fichier(chemin, valeur) avec un "/") : sans
    // emplacement fixe, il n'y a rien a verifier avant l'ouverture du navigateur de fichiers
    // interactif. A utiliser typiquement avant ecrire.fichier(chemin, valeur) pour decider
    // d'ecraser ou non, sans passer par essai/attrape.
    fonctionsBase["existe.fichier"] = fonctionsExpression["existe.fichier"] = async function(args, ctxExpr) {
        if (args.length !== 1) throw new Error("existe.fichier(chemin) attend 1 argument");
        let chemin = await evalExpr(args[0], ctxExpr);
        if (typeof chemin !== 'string') throw new Error("existe.fichier(chemin) : chemin doit etre du texte");
        if (chemin.indexOf("/") === -1) {
            throw new Error("existe.fichier(chemin) : il faut un chemin complet (avec '/'), comme pour ecrire.fichier(chemin, valeur) -- un simple nom n'a pas d'emplacement fixe a verifier avant l'ouverture du navigateur de fichiers");
        }
        if (!(window.MonLangage && typeof window.MonLangage.existeFichier === "function")) {
            throw new Error("existe.fichier(...) : disponible uniquement dans l'app installee (rebuild requis)");
        }
        let cheminFinal = /\.[a-zA-Z0-9]+$/.test(chemin) ? chemin : chemin + ".mld";
        return window.MonLangage.existeFichier(cheminFinal);
    };

    // ecrire.fichier(nom, valeur) ou ecrire.fichier(nom, val1, val2, ..., ecra~FAUX) :
    // export REEL -- sur l'app native (Android), ecrit directement un vrai fichier .mld a
    // l'emplacement choisi par l'utilisateur dans le navigateur de fichiers integre de l'app
    // (pas de selecteur systeme). En previsualisation navigateur (pas d'app native), repli
    // sur un telechargement classique.
    // ecrire.fichier(chemin, valeur) : si "nom" contient un "/", il est traite comme un
    // CHEMIN COMPLET -- ecriture DIRECTE a cet emplacement, sans rien afficher a l'ecran
    // (symetrique de lire.fichier(chemin)). Necessite l'app native.
    // PLUSIEURS valeurs (val1, val2, ...) : stockees ensemble comme une liste(), meme
    // logique que pour ecrire(cle, val1, val2, ...) -- voir plus haut.
    // ecra~FAUX (par defaut) : si le fichier cible existe deja, l'ecriture est REFUSEE et
    // une erreur est levee (a intercepter avec essai/attrape, ou a eviter en verifiant
    // d'abord avec existe.fichier(...)). ecra~VRAI ecrase sans verifier, comme avant.
    // Ce refus par defaut ne s'applique qu'aux deux chemins qui passent par le stockage
    // reel de l'app (chemin direct et navigateur de fichiers integre) : en repli navigateur
    // web (pas d'app native), il n'existe aucun moyen de verifier un fichier existant depuis
    // la page, donc ecra n'a pas d'effet dans ce cas precis (le navigateur gere lui-meme les
    // doublons de nom au telechargement).
    fonctionsBase["ecrire.fichier"] = fonctionsExpression["ecrire.fichier"] = async function(args, ctxExpr) {
        if (args.length < 2) throw new Error("ecrire.fichier(nom, valeur, ...) attend au moins 2 arguments");
        let nom = await evalExpr(args[0], ctxExpr);
        if (typeof nom !== 'string') throw new Error("ecrire.fichier(nom, valeur, ...) : nom doit etre du texte");

        let ecra = false, valeursBrutes = [];
        for (let i = 1; i < args.length; i++) {
            let argStr = args[i].trim();
            let mParam = argStr.match(/^(\w+)\s*~\s*(.*)$/);
            if (mParam) {
                let paramNom = mParam[1];
                if (paramNom !== "ecra") throw new Error("Parametre inconnu pour ecrire.fichier(...) : " + paramNom);
                ecra = estVrai(await evalExpr(mParam[2], ctxExpr));
            } else {
                valeursBrutes.push(await evaluerElementBrut(argStr, ctxExpr));
            }
        }
        if (valeursBrutes.length === 0) throw new Error("ecrire.fichier(nom, valeur, ...) : au moins une valeur est attendue");
        let valeur = valeursBrutes.length === 1 ? valeursBrutes[0] : { __type: "liste", elements: valeursBrutes };

        let texte;
        try { texte = JSON.stringify(valeur); }
        catch (e) { throw new Error("ecrire.fichier(...) : cette valeur ne peut pas etre sauvegardee"); }

        if (nom.indexOf("/") !== -1) {
            if (!(window.MonLangage && typeof window.MonLangage.ecrireFichier === "function")) {
                throw new Error("ecrire.fichier(chemin, valeur, ...) : l'ecriture directe par chemin n'est possible que dans l'app installee (utilise ecrire.fichier(nom, valeur, ...) sans '/' en previsualisation navigateur)");
            }
            let cheminDirect = /\.[a-zA-Z0-9]+$/.test(nom) ? nom : nom + ".mld";
            if (!ecra && typeof window.MonLangage.existeFichier === "function" && window.MonLangage.existeFichier(cheminDirect)) {
                throw new Error("ecrire.fichier(...) : le fichier '" + cheminDirect + "' existe deja (utilise ecra~VRAI pour l'ecraser, ou existe.fichier(...) pour verifier avant)");
            }
            let ok = window.MonLangage.ecrireFichier(cheminDirect, texte);
            if (!ok) throw new Error("ecrire.fichier(...) : echec de l'ecriture sur '" + cheminDirect + "'");
            return true;
        }

        if (window.MonLangage && typeof window.MonLangage.ecrireFichier === "function") {
            let nomSansExt = nom.replace(/\.[a-zA-Z0-9]+$/, "");
            let cheminComplet = await demanderEmplacementEcritureFichier(nomSansExt, ".mld");
            if (!ecra && typeof window.MonLangage.existeFichier === "function" && window.MonLangage.existeFichier(cheminComplet)) {
                throw new Error("ecrire.fichier(...) : le fichier '" + cheminComplet + "' existe deja (utilise ecra~VRAI pour l'ecraser, ou existe.fichier(...) pour verifier avant)");
            }
            let ok = window.MonLangage.ecrireFichier(cheminComplet, texte);
            if (!ok) throw new Error("ecrire.fichier(...) : echec de l'ecriture sur le telephone");
            return true;
        }

        // Repli navigateur web (previsualisation hors app) : telechargement classique.
        // Pas de verification d'existence possible ici (voir commentaire plus haut) : ecra
        // est ignore dans ce cas precis.
        let nomFichier = /\.[a-zA-Z0-9]+$/.test(nom) ? nom : nom + ".mld";
        let blob = new Blob([texte], { type: "application/json" });
        let url = URL.createObjectURL(blob);
        let a = document.createElement("a");
        a.href = url;
        a.download = nomFichier;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        return true;
    };

    // Fusionne une nouvelle serie de valeurs avec ce qui est deja stocke sous une cle/un
    // fichier (ecrire()/ecrire.fichier()), sans jamais rien ecraser -- utilise par ajout()
    // et ajout.fichier(). Trois cas, du plus specifique au plus general :
    // - L'existant est un VECTEUR : etendu directement, exactement comme .ajout() sur ce
    //   vecteur (unification de type incluse) -- reste un vecteur, pas transforme en liste().
    // - L'existant est deja une liste() : les nouvelles valeurs y sont simplement ajoutees
    //   (types conserves, sans unification, comme .ajout() sur une liste()).
    // - Sinon (nombre, texte, booleen, matrice, instance...) : l'existant devient le PREMIER
    //   element d'une nouvelle liste() -- rien n'est perdu, mais une matrice deja stockee
    //   n'est pas etendue colonne par colonne (pas d'equivalent clair a "ajouter une colonne"
    //   sans info supplementaire) ; utilise .ajout() sur la matrice elle-meme avant de la
    //   re-sauvegarder si c'est le comportement voulu.
    function fusionnerPourAjout(existant, nouvelles) {
        if (estVecteur(existant)) {
            let v = existant.slice();
            ajouterVecteur(v, nouvelles);
            return v;
        }
        if (existant !== null && typeof existant === 'object' && existant.__type === "liste") {
            return { __type: "liste", elements: existant.elements.concat(nouvelles) };
        }
        return { __type: "liste", elements: [existant].concat(nouvelles) };
    }

    // ajout(cle, valeur, ...) : ajoute une ou plusieurs valeurs a une cle DEJA EXISTANTE
    // (sauvegardee avec ecrire(...)), sans rien ecraser -- contrairement a ecrire(cle, ...)
    // qui remplace toujours le contenu. Erreur si la cle n'existe pas encore : utiliser
    // ecrire(...) pour la creer d'abord. Voir fusionnerPourAjout(...) ci-dessus pour la
    // logique de fusion exacte.
    fonctionsBase["ajout"] = fonctionsExpression["ajout"] = async function(args, ctxExpr) {
        if (args.length < 2) throw new Error("ajout(cle, valeur, ...) attend au moins 2 arguments");
        let cle = await evalExpr(args[0], ctxExpr);
        if (typeof cle !== 'string') throw new Error("ajout(cle, valeur, ...) : cle doit etre du texte");
        let brut = localStorage.getItem("monlangage:" + cle);
        if (brut === null) throw new Error("ajout(...) : la cle '" + cle + "' n'existe pas encore (utilise ecrire(...) pour la creer)");
        let existant;
        try { existant = JSON.parse(brut); }
        catch (e) { throw new Error("ajout(...) : la sauvegarde pour '" + cle + "' est corrompue"); }

        let nouvelles = [];
        for (let i = 1; i < args.length; i++) nouvelles.push(await evaluerElementBrut(args[i], ctxExpr));
        let fusion = fusionnerPourAjout(existant, nouvelles);

        let texte;
        try { texte = JSON.stringify(fusion); }
        catch (e) { throw new Error("ajout(...) : cette valeur ne peut pas etre sauvegardee"); }
        try { localStorage.setItem("monlangage:" + cle, texte); }
        catch (e) { throw new Error("ajout(...) : sauvegarde impossible (" + e.message + ")"); }
        return true;
    };

    // ajout.fichier(nom, valeur, ...) ou ajout.fichier(chemin, valeur, ...) : ajoute une ou

    fonctionsBase["ajout.fichier"] = fonctionsExpression["ajout.fichier"] = async function(args, ctxExpr) {

    fonctionsBase["ajout.Tfichier"] = fonctionsExpression["ajout.Tfichier"] = async function(args, ctxExpr) {

    // voir.cle() : liste les NOMS de toutes les cles actuellement sauvegardees avec

    fonctionsBase["voir.cle"] = fonctionsExpression["voir.cle"] = async function(args, ctxExpr) {
        if (args.length !== 0) throw new Error("voir.cle() n'attend aucun argument");
        let noms = [];
        for (let i = 0; i < localStorage.length; i++) {
            let clePrefixee = localStorage.key(i);
            if (clePrefixee && clePrefixee.indexOf("monlangage:") === 0) {
                noms.push(clePrefixee.slice("monlangage:".length));
            }
        }

    // supri.cle(cle) : supprime UNE cle precise sauvegardee avec ecrire(...), sans toucher
    // aux autres (contrairement a "Effacer donnees utilisateur" de l'app). Erreur si la cle
    // n'existe pas.
    fonctionsBase["supri.cle"] = fonctionsExpression["supri.cle"] = async function(args, ctxExpr) {
        if (args.length !== 1) throw new Error("supri.cle(cle) attend 1 argument");
        let cle = await evalExpr(args[0], ctxExpr);
        if (typeof cle !== 'string') throw new Error("supri.cle(cle) : cle doit etre du texte");
        if (localStorage.getItem("monlangage:" + cle) === null) {
            throw new Error("supri.cle(...) : la cle '" + cle + "' n'existe pas");

    // stockage de l'appareil. Contrairement aux cles ecrire()/lire(), l'app ne tient pas de

    // comme le navigateur de fichiers integre, plutot que "tous les fichiers jamais crees".
    // Necessite l'app native.
    fonctionsBase["voir.fichier"] = fonctionsExpression["voir.fichier"] = async function(args, ctxExpr) {
        if (args.length > 1) throw new Error("voir.fichier(dossier) attend 0 ou 1 argument");
        if (!(window.MonLangage && typeof window.MonLangage.listerDossier === "function")) {
            throw new Error("voir.fichier(...) : disponible uniquement dans l'app installee (rebuild requis)");
        }
        let dossier;
        if (args.length === 1) {
            dossier = await evalExpr(args[0], ctxExpr);

        } else {
            dossier = (typeof window.MonLangage.dossierRacine === "function") ? window.MonLangage.dossierRacine() : null;

    // supri.fichier(nom) ou supri.fichier(chemin) : supprime UN fichier precis, sans toucher

    fonctionsBase["supri.fichier"] = fonctionsExpression["supri.fichier"] = async function(args, ctxExpr) {

        if (typeof nom !== 'string') throw new Error("supri.fichier(nom) : nom doit etre du texte");

    fonctionsBase["lire.fichier"] = fonctionsExpression["lire.fichier"] = async function(args, ctxExpr) {

            if (!(window.MonLangage && typeof window.MonLangage.lireFichier === "function")) {

        catch (e) { throw new Error("lire.fichier(...) : le fichier choisi n'est pas une sauvegarde valide"); }
    };


    // lon(...) : longueur d'un vecteur/matrice (nombre total d'elements). Un scalaire vaut 1.
    fonctionsBase["lon"] = fonctionsExpression["lon"] = async function(args, ctxExpr) {

        let v = await evalExpr(args[0], ctxExpr);
        if (estListe(v)) return v.elements.length;
        if (estVecteur(v)) return v.length;
        if (estMatrice(v)) return v.donnees.length;
        return 1;
    };

    // dim(...) : dimensions d'une matrice, sous forme de vecteur c(nlig, ncol).

    // som(...) : somme des elements d'un vecteur.
    fonctionsBase["som"] = fonctionsExpression["som"] = async function(args, ctxExpr) {

    fonctionsBase["moy"] = fonctionsExpression["moy"] = async function(args, ctxExpr) {

    // max(...) : le plus grand element, parmi un ou plusieurs arguments (nombres, vecteurs

    fonctionsBase["max"] = fonctionsExpression["max"] = async function(args, ctxExpr) {

        for (let a of args) valeurs.push(await evalExpr(a, ctxExpr));

    // trace(...) : trace d'une matrice carree (somme des elements de la diagonale).
    fonctionsBase["trace"] = fonctionsExpression["trace"] = async function(args, ctxExpr) {

    fonctionsBase["trans"] = fonctionsExpression["trans"] = async function(args, ctxExpr) {

    // suchaq(matrice, marge, fonction) : comme apply() en R.
    // marge vaut 1 (applique 'fonction' a chaque LIGNE) ou 2 (a chaque COLONNE).
    // 'fonction' est le nom "nu" (sans parentheses) d'une fonction : som, moy, var, sd,
    // ou une fonction definie avec fonc. Renvoie un vecteur si 'fonction' renvoie un nombre
    // pour chaque ligne/colonne, ou une matrice si elle renvoie un vecteur (comme en R).
    fonctionsBase["suchaq"] = fonctionsExpression["suchaq"] = async function(args, ctxExpr) {
        if (args.length !== 3) {
            throw new Error("suchaq(...) attend 3 arguments : suchaq(matrice, marge, fonction) -- marge vaut 1 (par ligne) ou 2 (par colonne)");
        }
        let m = await evalExpr(args[0], ctxExpr);
        if (!estMatrice(m)) throw new Error("suchaq(...) : le 1er argument doit etre une matrice");
        let marge = await evalExpr(args[1], ctxExpr);
        if (marge !== 1 && marge !== 2) throw new Error("suchaq(...) : la marge (2e argument) doit valoir 1 (par ligne) ou 2 (par colonne), recu : " + marge);
        let nomFonction = args[2].trim();
        if (!/^[a-zA-Z_]\w*$/.test(nomFonction)) {
            throw new Error("suchaq(...) : le 3e argument doit etre le nom (sans parentheses) d'une fonction, ex: suchaq(m, 1, moy) -- recu : " + nomFonction);

        let resultats = [];
        for (let i = 0; i < nb; i++) {

        return surUnNombre(v);
    }

    fonctionsBase["cos"] = fonctionsExpression["cos"] = async function(args, ctxExpr) {

    fonctionsBase["pusan"] = fonctionsExpression["pusan"] = async function(args, ctxExpr) {

        let a = await evalExpr(args[0], ctxExpr);
        let b = await evalExpr(args[1], ctxExpr);

    };

    // natu(var) : renvoie la nature (le type) de l'objet contenu dans var, sous forme de texte :

    fonctionsBase["natu"] = fonctionsExpression["natu"] = async function(args, ctxExpr) {
