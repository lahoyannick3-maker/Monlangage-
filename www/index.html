// meme precedence que le vrai evaluateur (parseOr > parseAnd > parseDan > parseCmp > parseAdd >
// parseMul > parseColon > parseUnary > parsePow > parsePrimary, plus la chaine de suffixes
// .attr / .methode(args) / [idx]) -- mais SANS RIEN EVALUER. Sert uniquement, au moment ou une
// fonction anonyme fonc(params) expr est rencontree au milieu d'une expression plus large, a
// savoir ou s'arrete son corps -- a un instant ou ses parametres n'ont encore aucune valeur
// (on ne peut donc pas se contenter d'appeler le vrai evaluateur, qui a besoin d'evaluer au fur
// et a mesure pour avancer).
// Remarque importante : a l'execution reelle, un "." rencontre apres un resultat peut etre
// interprete soit comme un produit scalaire (parseMul), soit comme un acces a un attribut ou
// une methode d'instance (suffixes de parsePrimary) -- selon le TYPE de la valeur a gauche, que
// l'on ne connait pas ici. Mais dans les deux cas, le nombre de jetons consommes est identique
// (un identifiant, un ".", un identifiant, et eventuellement des parentheses/crochets) : ce
// reperage n'a donc jamais besoin de trancher entre les deux pour trouver la bonne fin.
// Consomme (sans RIEN evaluer) un operande booleen a partir d'un NIVEAU donne du flux de
// jetons, en suivant EXACTEMENT la meme grammaire que le vrai evaluateur (or_/and_/not_/dan_/
// cmp_/.../primaire_ -- copie de la grammaire deja eprouvee de trouverFinCorpsAnonyme
// ci-dessous). Sert au court-circuit de et/ou : quand le resultat est deja connu (VRAI ou FAUX
// suffit a determiner et/ou), il faut quand meme AVANCER le curseur jusqu'a la fin du
// sous-arbre de droite pour que le parseur appelant continue correctement ensuite -- mais sans
// jamais evaluer ce sous-arbre (aucun appel de fonction, aucune division, aucun effet de bord
// ni erreur declenchee). C'est ce qui rend "x!=0 et 10/x>2" sur avec x==0 : 10/x n'est jamais
// calcule puisque x!=0 est deja FAUX.
// niveau : 'and' pour sauter l'operande droit de "et" (niveau not_), 'or' pour sauter
// l'operande droit de "ou" (niveau and_ -- peut lui-meme contenir des "et"/"non" imbriques).
function sauterOperandeBooleen(tokens, debut, niveau) {
  let pos = debut;
  const peek = () => tokens[pos];
  const next = () => tokens[pos++];
  function attendre(type, quoi) {
    if (!peek() || peek().type !== type) throw new Error("Expression incomplete ou mal formee (" + quoi + " attendu)");
    next();
  }
  function listeArgs() {
    if (!(peek() && peek().type === ')')) {
      or_();
      while (peek() && peek().type === ',') { next(); or_(); }
    }
    attendre(')', "parenthese fermante");
  }
  function or_() { and_(); while (peek() && peek().type === 'or') { next(); and_(); } }
  function and_() { not_(); while (peek() && peek().type === 'and') { next(); not_(); } }
  function not_() { if (peek() && peek().type === 'not') { next(); not_(); return; } dan_(); }
  function dan_() { cmp_(); while (peek() && peek().type === 'dan') { next(); cmp_(); } }
  function cmp_() { add_(); if (peek() && peek().type === 'cmp') { next(); add_(); } }
  function add_() { mul_(); while (peek() && peek().type === 'op' && (peek().v === '+' || peek().v === '-')) { next(); mul_(); } }
  function mul_() {
    colon_();
    while (peek() && peek().type === 'op' && ['*', '/', '%', 'enti', '.', '..', '×'].includes(peek().v)) { next(); colon_(); }
  }
  function colon_() { unary_(); if (peek() && peek().type === 'deuxpoints') { next(); unary_(); } }
  function unary_() {
    if (peek() && peek().type === 'op' && peek().v === '-') { next(); unary_(); return; }
    pow_();
  }
  function pow_() { primaire_(); if (peek() && peek().type === 'op' && peek().v === '^') { next(); unary_(); } }
  function primaire_() {
    let t = peek();
    if (!t) throw new Error("Expression incomplete");
    if (t.type === 'num' || t.type === 'str') { next(); suffixes_(); return; }
    if (t.type === '(') { next(); or_(); attendre(')', "parenthese fermante"); suffixes_(); return; }
    if (t.type === 'ident') {
      next();
      if (peek() && peek().type === '(') { next(); listeArgs(); suffixes_(); return; }
      if (peek() && peek().type === '[') {
        next();
        if (!(peek() && (peek().type === ',' || peek().type === ']'))) or_();
        if (peek() && peek().type === ',') { next(); if (!(peek() && peek().type === ']')) or_(); }
        attendre(']', "crochet fermant");
        suffixes_(); return;
      }
      suffixes_(); return;
    }
    throw new Error("Expression invalide (jeton inattendu)");
  }
  function suffixes_() {
    while (true) {
      if (peek() && peek().type === 'op' && peek().v === '.' && tokens[pos + 1] && tokens[pos + 1].type === 'ident') {
        next(); next();
        if (peek() && peek().type === '(') { next(); listeArgs(); }
        continue;
      }
      if (peek() && peek().type === '[') {
        next();
        if (!(peek() && (peek().type === ',' || peek().type === ']'))) or_();
        if (peek() && peek().type === ',') { next(); if (!(peek() && peek().type === ']')) or_(); }
        attendre(']', "crochet fermant");
        continue;
      }
      break;
    }
  }
  if (niveau === 'and') not_(); else and_();
  return pos;
}

function trouverFinCorpsAnonyme(tokens, debut) {
  let pos = debut;
  const peek = () => tokens[pos];
  const next = () => tokens[pos++];
  function attendre(type, quoi) {
    if (!peek() || peek().type !== type) throw new Error("Corps de fonction anonyme incomplet ou mal forme (" + quoi + " attendu)");
    next();
  }
  function listeArgs() {
    if (!(peek() && peek().type === ')')) {
      or_();
      while (peek() && peek().type === ',') { next(); or_(); }
    }
    attendre(')', "parenthese fermante");
  }
  function or_() { and_(); while (peek() && peek().type === 'or') { next(); and_(); } }
  function and_() { not_(); while (peek() && peek().type === 'and') { next(); not_(); } }
  function not_() { if (peek() && peek().type === 'not') { next(); not_(); return; } dan_(); }
  function dan_() { cmp_(); while (peek() && peek().type === 'dan') { next(); cmp_(); } }
  function cmp_() { add_(); if (peek() && peek().type === 'cmp') { next(); add_(); } }
  function add_() { mul_(); while (peek() && peek().type === 'op' && (peek().v === '+' || peek().v === '-')) { next(); mul_(); } }
  function mul_() {
    colon_();
    while (peek() && peek().type === 'op' && ['*', '/', '%', 'enti', '.', '..', '×'].includes(peek().v)) { next(); colon_(); }
  }
  function colon_() { unary_(); if (peek() && peek().type === 'deuxpoints') { next(); unary_(); } }
  function unary_() {
    if (peek() && peek().type === 'op' && peek().v === '-') { next(); unary_(); return; }
    pow_();
  }
  function pow_() { primaire_(); if (peek() && peek().type === 'op' && peek().v === '^') { next(); unary_(); } }
  function primaire_() {
    let t = peek();
    if (!t) throw new Error("Corps de fonction anonyme incomplet");
    if (t.type === 'num' || t.type === 'str') { next(); suffixes_(); return; }
    if (t.type === '(') { next(); or_(); attendre(')', "parenthese fermante"); suffixes_(); return; }
    if (t.type === 'ident') {
      next();
      if (peek() && peek().type === '(') { next(); listeArgs(); suffixes_(); return; }
      if (peek() && peek().type === '[') {
        next();
        if (!(peek() && (peek().type === ',' || peek().type === ']'))) or_();
        if (peek() && peek().type === ',') { next(); if (!(peek() && peek().type === ']')) or_(); }
        attendre(']', "crochet fermant");
        suffixes_(); return;
      }
      suffixes_(); return;
    }
    throw new Error("Corps de fonction anonyme invalide (jeton inattendu)");
  }
  function suffixes_() {
    while (true) {
      if (peek() && peek().type === 'op' && peek().v === '.' && tokens[pos + 1] && tokens[pos + 1].type === 'ident') {
        next(); next();
        if (peek() && peek().type === '(') { next(); listeArgs(); }
        continue;
      }
      if (peek() && peek().type === '[') {
        next();
        if (!(peek() && (peek().type === ',' || peek().type === ']'))) or_();
        if (peek() && peek().type === ',') { next(); if (!(peek() && peek().type === ']')) or_(); }
        attendre(']', "crochet fermant");
        continue;
      }
      break;
    }
  }
  or_();
  return pos;
}

// Construit une fonction anonyme (fonc(params) expr) rencontree au milieu d'une expression :
// tokens[pos] doit designer le '(' des parametres (le mot-cle "fonc" a deja ete consomme par
// l'appelant, voir parsePrimaryBrute). Ne mute jamais "pos" directement : le renvoie dans le
// resultat, a l'appelant (sync ou async, chacun gere sa propre variable pos) de l'appliquer.
function construireFonctionAnonyme(tokens, pos) {
  if (!tokens[pos] || tokens[pos].type !== '(') throw new Error("fonc(...) attend une liste de parametres entre parentheses");
  pos++; // '('
  let params = [];
  if (tokens[pos] && tokens[pos].type !== ')') {
    if (!tokens[pos] || tokens[pos].type !== 'ident') throw new Error("Parametre invalide dans fonc(...) : un nom de parametre est attendu");
    params.push({ nom: tokens[pos].v, defautExpr: null, nomSeul: false }); pos++;
    while (tokens[pos] && tokens[pos].type === ',') {
      pos++;
      if (!tokens[pos] || tokens[pos].type !== 'ident') throw new Error("Parametre invalide dans fonc(...) : un nom de parametre est attendu");
      params.push({ nom: tokens[pos].v, defautExpr: null, nomSeul: false }); pos++;
    }
  }
  if (!tokens[pos] || tokens[pos].type !== ')') throw new Error("Parenthese fermante manquante pour les parametres de fonc(...)");
  pos++; // ')'
  let debutCorps = pos;
  let finCorps = trouverFinCorpsAnonyme(tokens, debutCorps);
  if (finCorps === debutCorps) throw new Error("fonc(...) attend une expression apres les parametres (son corps ne peut pas etre vide) : ecris par exemple fonc(x) x*2");
  let corpsTexte = detokeniserExpr(tokens.slice(debutCorps, finCorps));
  // Corps synthetique : une seule instruction "retour <expression>", au format attendu par
  // executerCorpsFonction (une liste de "lignes", chacune avec son texte et son numero de
  // ligne). Le numero de ligne reutilise la derniere ligne source reellement executee
  // (ligneExpressionCourante) : le corps n'a pas de numero de ligne propre puisqu'il est
  // fabrique a partir de jetons d'expression, qui n'en portent jamais.
  let valeur = {
    __fonction: true,
    nom: null,
    params: params,
    corps: [{ texte: "retour " + corpsTexte, ligne: ligneExpressionCourante }],
    // CLOSURE : capture une reference vers la pile de portees ACTIVE au moment ou cette
    // fonction anonyme est CREEE (pas ou elle sera appelee plus tard -- c'est toute la
    // difference entre portee lexicale et portee dynamique). scopes.slice() copie le
    // TABLEAU (donc l'ordre des portees a cet instant est fige), mais chaque element reste
    // une reference vers le MEME objet-portee : si la fonction englobante modifie ensuite
    // une de ses variables locales, la fonction anonyme la voit -- exactement comme n ~ n+1
    // reste visible d'un appel a l'autre dans "fonc creerCompteur(){ n~0 retour fonc(){...} }".
    environnement: scopes.slice()
  };
  return { valeur: valeur, pos: finCorps };
}

// Affiche, sur une NOUVELLE ligne de la console, le message eventuel de entr(...) suivi d'une
// zone de saisie editable (le curseur). Retourne une Promise qui se resout avec le texte tape
// quand l'utilisateur valide (Entree).
// entr() sans argument -> juste le curseur. entr(|message|) -> "message" puis le curseur.
// Dans le service (WebView sans interface), il n'y a aucune console ou taper : entr() attendrait
// pour toujours. On leve une erreur claire a la place.
function verifierSaisiePossible() {
  if (window.MonLangageServiceNative) {
    throw new Error("entr() est indisponible en arriere-plan (aucune console pour saisir) : lance ce script avec RUN au lieu de FOND");
  }
}

function demanderSaisieConsole(message) {
  verifierSaisiePossible();
  // On attend une saisie de l'utilisateur, pas un calcul : l'indicateur
  // "execution en cours" n'a pas lieu d'etre ici.
  arreterIndicateurAttente();
  return new Promise((resolve, reject) => {
    let ligne = document.createElement("div");
    ligne.className = "ligneCommande";
    let msg = document.createElement("span");
    msg.className = "invite";
    msg.textContent = message ? message + " " : "";
    msg.contentEditable = "false";
    let input = document.createElement("span");
    input.className = "entrInput";
    input.contentEditable = "true";
    // Sans aucun texte (ni message, ni saisie), certains navigateurs mobiles
    // n'affichent pas le curseur clignotant au focus() : rien ne sert d'ancre
    // visuelle. On glisse une espace de largeur nulle (invisible) pour que le
    // curseur ait toujours quelque chose ou s'accrocher.
    input.textContent = "\u200B";
    ligne.appendChild(msg);
    ligne.appendChild(input);
    outputDiv.appendChild(ligne);
    outputDiv.scrollTop = outputDiv.scrollHeight;

    input.focus();
    let range = document.createRange();
    range.selectNodeContents(input);
    range.collapse(false);
    let sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);

    function onKeyDown(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        e.stopPropagation();
        let valeur = input.innerText.replace(/\u200B/g, "");
        input.contentEditable = "false";
        input.removeEventListener("keydown", onKeyDown);
        annulerSaisieEnCours = null;
        outputDiv.scrollTop = outputDiv.scrollHeight;
        demarrerIndicateurAttente();
        resolve(valeur);
      }
    }
    input.addEventListener("keydown", onKeyDown);

    // Permet d'interrompre proprement l'attente de saisie (ex: bouton "Retour"
    // pendant qu'un entr() attend une reponse que l'utilisateur ne peut plus donner).
    annulerSaisieEnCours = () => {
      input.removeEventListener("keydown", onKeyDown);
      annulerSaisieEnCours = null;
      reject(new ExecutionInterrompue());
    };
  });
}

// Comme demanderSaisieConsole, mais pour une saisie secrete (mot de passe / code PIN).
// styleChar === null : rien n'est JAMAIS affiche a l'ecran pendant la frappe (pas meme un
// caractere de masquage) -- seul le nombre de caracteres tapes reste invisible aussi.
// styleChar donne (un seul caractere texte) : affiche autant de styleChar que de
// caracteres reellement tapes, comme un champ mot de passe classique mais avec le
// caractere de masquage choisi par le codeur (pas forcement '*').
// Comme la zone de saisie est un <span contentEditable>, on intercepte nous-memes
// la saisie (au lieu de laisser le navigateur l'inserer visiblement) pour garder le
// texte reellement tape dans une variable JS cachee, jamais dans le DOM affiche.
// IMPORTANT : sur mobile (clavier virtuel/IME, ex. Gboard), l'insertion de caractere
// ne passe PAS par un keydown classique annulable -- e.preventDefault() sur keydown
// est ignore et le vrai texte s'affiche quand meme. Le seul evenement fiable et
// annulable pour intercepter la saisie AVANT affichage, sur mobile comme sur desktop,
// est "beforeinput" : on s'appuie donc dessus pour le texte tape/compose et les
// suppressions, et on ne garde keydown que comme filet de securite pour la touche
// Entree physique (deja annulee par beforeinput sur la plupart des navigateurs, mais
// pas garanti partout).
function demanderSaisieConsoleSecrete(message, styleChar) {
  verifierSaisiePossible();
  arreterIndicateurAttente();
  return new Promise((resolve, reject) => {
    let ligne = document.createElement("div");
    ligne.className = "ligneCommande";
    let msg = document.createElement("span");
    msg.className = "invite";
    msg.textContent = message ? message + " " : "";
    msg.contentEditable = "false";
    let input = document.createElement("span");
    input.className = "entrInput";
    input.contentEditable = "true";
    input.textContent = "\u200B";
    ligne.appendChild(msg);
    ligne.appendChild(input);
    outputDiv.appendChild(ligne);
    outputDiv.scrollTop = outputDiv.scrollHeight;

    input.focus();
    let range = document.createRange();
    range.selectNodeContents(input);
    range.collapse(false);
    let sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);

    let buffer = "";
    let termine = false;
    function placerCurseurFin() {
      let r = document.createRange();
      r.selectNodeContents(input);
      r.collapse(false);
      let s = window.getSelection();
      s.removeAllRanges();
      s.addRange(r);
    }
    function rafraichirAffichage() {
      input.textContent = (styleChar ? styleChar.repeat(buffer.length) : "") || "\u200B";
      placerCurseurFin();
    }
    function detacherEcouteurs() {
      input.removeEventListener("beforeinput", onBeforeInput);
      input.removeEventListener("keydown", onKeyDown);
      input.removeEventListener("paste", onPaste);
    }
    function soumettre() {
      if (termine) return;
      termine = true;
      input.contentEditable = "false";
      detacherEcouteurs();
      annulerSaisieEnCours = null;
      outputDiv.scrollTop = outputDiv.scrollHeight;
      demarrerIndicateurAttente();
      resolve(buffer);
    }
    function onBeforeInput(e) {
      e.preventDefault();
      let type = e.inputType || "";
      if (type === "insertLineBreak" || type === "insertParagraph") {
        soumettre();
        return;
      }
      if (type.indexOf("delete") === 0) {
        buffer = buffer.slice(0, -1);
        rafraichirAffichage();
        return;
      }
      let texte = e.data;
      if (texte === null || texte === undefined) {
        texte = e.dataTransfer ? e.dataTransfer.getData("text") : "";
      }
      if (texte) {
        buffer += texte;
        rafraichirAffichage();
      }
    }
    function onKeyDown(e) {
      // Filet de securite pour clavier physique : la plupart des navigateurs annulent
      // deja l'Entree via beforeinput ci-dessus, mais on la traite aussi ici au cas ou.
      if (e.key === "Enter") {
        e.preventDefault();
        e.stopPropagation();
        soumettre();
      }
    }
    function onPaste(e) {
      e.preventDefault();
      let texte = (e.clipboardData || window.clipboardData).getData("text");
      buffer += texte;
      rafraichirAffichage();
    }
    input.addEventListener("beforeinput", onBeforeInput);
    input.addEventListener("keydown", onKeyDown);
    input.addEventListener("paste", onPaste);

    annulerSaisieEnCours = () => {
      detacherEcouteurs();
      annulerSaisieEnCours = null;
      reject(new ExecutionInterrompue());
    };
  });
}

// Ouvre le selecteur de fichiers natif du telephone/navigateur et attend que l'utilisateur
// choisisse un fichier (ou l'annule via le bouton "Retour"). Renvoie le CONTENU TEXTE du
// fichier choisi. Utilise par lire.fichier(...) -- meme logique d'indicateur d'attente et
// d'annulation que demanderSaisieConsole/demanderSaisieConsoleSecrete.
function demanderFichierConsole() {
  arreterIndicateurAttente();
  print("Choisir un fichier a charger...", "invite");
  return new Promise((resolve, reject) => {
    let input = document.createElement("input");
    input.type = "file";
    input.accept = ".mld,application/json,text/plain";
    input.style.display = "none";
    document.body.appendChild(input);
    let termine = false;
    function nettoyer() {
      if (input.parentNode) document.body.removeChild(input);
      annulerSaisieEnCours = null;
    }
    input.addEventListener("change", () => {
      if (termine) return;
      let fichier = input.files && input.files[0];
      if (!fichier) {
        termine = true;
        nettoyer();
        demarrerIndicateurAttente();
        reject(new Error("lire.fichier(...) : aucun fichier selectionne"));
        return;
      }
      let lecteur = new FileReader();
      lecteur.onload = () => {
        termine = true;
        nettoyer();
        demarrerIndicateurAttente();
        resolve(lecteur.result);
      };
      lecteur.onerror = () => {
        termine = true;
        nettoyer();
        demarrerIndicateurAttente();
        reject(new Error("lire.fichier(...) : impossible de lire le fichier selectionne"));
      };
      lecteur.readAsText(fichier);
    });
    annulerSaisieEnCours = () => {
      termine = true;
      nettoyer();
      reject(new ExecutionInterrompue());
    };
    input.click();
  });
}

// Choisit l'emplacement (chemin complet) ou ecrire un vrai fichier, via le navigateur de
// fichiers integre de l'app native (window.MonLangage) : demande un nom + un dossier dans
// le style de l'app, plutot qu'un telechargement de navigateur classique. Utilise par
// ecrire.fichier(...). N'est appelee que quand window.MonLangage est disponible.
function demanderEmplacementEcritureFichier(nomDefaut, extension) {
  arreterIndicateurAttente();
  return new Promise((resolve, reject) => {
    ouvrirNavigateurFichiers("enregistrer", {
      nomDefaut: nomDefaut,
      extension: extension,
      onValide: (cheminComplet) => { demarrerIndicateurAttente(); resolve(cheminComplet); },
      onAnnule: () => { demarrerIndicateurAttente(); reject(new ExecutionInterrompue()); }
    });
  });
}

// Choisit un fichier existant a lire, via le meme navigateur de fichiers integre. Renvoie
// le CHEMIN COMPLET choisi (la lecture elle-meme se fait ensuite via
// window.MonLangage.lireFichier). Utilise par lire.fichier(...).
function demanderEmplacementLectureFichier() {
  arreterIndicateurAttente();
  return new Promise((resolve, reject) => {
    ouvrirNavigateurFichiers("ouvrir", {
      onValide: (cheminComplet) => { demarrerIndicateurAttente(); resolve(cheminComplet); },
      onAnnule: () => { demarrerIndicateurAttente(); reject(new ExecutionInterrompue()); }
    });
  });
}


// Cherche les appels aux fonctions de fonctionsExpression (ex: entr(...)) dans une expression,
// les execute tout de suite (elles peuvent etre asynchrones / interactives), et remplace
// chaque appel par une variable temporaire portant la valeur retournee.
// Analyse PUREMENT SYNTAXIQUE de l'expression : decoupe str en segments (texte litteral /
// appel fonc(...) a sauter tel quel / appel racineN(...) / appel d'une fonction native de
// fonctionsExpression), SANS RIEN EVALUER. Ne depend que du texte str et du jeu de noms
// actuellement dans fonctionsExpression -- resultat mis en cache par _obtenirSegmentsExpression.
function _analyserSegmentsExpression(str) {
  let segments = [], i = 0, n = str.length;
  let noms = Object.keys(fonctionsExpression);
  let texteAccum = "";
  function flushTexte() {
    if (texteAccum !== "") { segments.push({ type: 'texte', valeur: texteAccum }); texteAccum = ""; }
  }
  while (i < n) {
    let precedent = i > 0 ? str[i-1] : "";
    let nomTrouve = null, mRacine = null, mFonc = null;
    if (!/[a-zA-Z0-9_]/.test(precedent)) {
      mFonc = /^fonc\s*\(/.exec(str.slice(i));
      if (!mFonc) {
        mRacine = /^racine(\d*)\(/.exec(str.slice(i));
        if (!mRacine) {
          for (let nom of noms) {
            if (str.startsWith(nom + '(', i)) { nomTrouve = nom; break; }
          }
        }
      }
    }
    if (mFonc) {
      // Fonction anonyme fonc(params) corps : voir commentaire original -- on saute tout le
      // bloc (parametres + corps) SANS y toucher, en suivant la profondeur de parentheses/
      // crochets pour reperer la meme frontiere de corps que trouverFinCorpsAnonyme.
      let j = i + mFonc[0].length;
      let depth = 1, dansTexteLocal = false;
      while (j < n && depth > 0) {
        let c2 = str[j];
        if (c2 === '|') dansTexteLocal = !dansTexteLocal;
        if (!dansTexteLocal) {
          if (c2 === '(') depth++;
          if (c2 === ')') depth--;
        }
        j++;
      }
      let depthParens = 0, depthCrochets = 0;
      dansTexteLocal = false;
      while (j < n) {
        let c2 = str[j];
        if (c2 === '|') { dansTexteLocal = !dansTexteLocal; j++; continue; }
        if (!dansTexteLocal) {
          if (c2 === '(') { depthParens++; }
          else if (c2 === ')') { if (depthParens === 0) break; depthParens--; }
          else if (c2 === '[') { depthCrochets++; }
          else if (c2 === ']') { if (depthCrochets === 0) break; depthCrochets--; }
          else if (c2 === ',' && depthParens === 0 && depthCrochets === 0) break;
        }
        j++;
      }
      flushTexte();
      segments.push({ type: 'skip', debut: i, fin: j });
      i = j;
      continue;
    }
    if (mRacine) {
      let n2 = mRacine[1] === "" ? 2 : parseInt(mRacine[1], 10);
      let longueurNom = mRacine[0].length - 1;
      let debutArgs = i + longueurNom + 1;
      let depth = 1, j = debutArgs;
      while (j < n && depth > 0) {
        if (str[j] === '(') depth++;
        if (str[j] === ')') depth--;
        j++;
      }
      flushTexte();
      if (depth !== 0) {
        segments.push({ type: 'erreur', message: "Parenthese fermante manquante pour " + nomRacine(n2) + "(...)" });
        break;
      }
      let argStr = str.slice(debutArgs, j - 1).trim();
      let argExprs = argStr === "" ? [] : splitTopLevelComma(argStr);
      segments.push({ type: 'racine', n2: n2,
        erreurArgs: argExprs.length !== 1 ? (nomRacine(n2) + "(...) attend exactement 1 argument") : null,
        argExprs: argExprs });
      i = j;
      continue;
    }
    if (nomTrouve) {
      let debutArgs = i + nomTrouve.length + 1;
      let depth = 1, j = debutArgs;
      while (j < n && depth > 0) {
        if (str[j] === '(') depth++;
        if (str[j] === ')') depth--;
        j++;
      }
      flushTexte();
      if (depth !== 0) {
        segments.push({ type: 'erreur', message: "Parenthese fermante manquante pour " + nomTrouve + "(...)" });
        break;
      }
      let argStr = str.slice(debutArgs, j - 1).trim();
      let argExprs = argStr === "" ? [] : splitTopLevelComma(argStr);
      segments.push({ type: 'appel', nom: nomTrouve, argExprs: argExprs });
      i = j;
    } else {
      texteAccum += str[i];
      i++;
    }
  }
  flushTexte();
  return segments;
}

// Cache borne (FIFO, voir _cacheSegmentsExpression) autour de _analyserSegmentsExpression :
// invalide automatiquement des qu'un nouveau nom apparait dans fonctionsExpression (import
// dynamique), via _versionFonctionsExpression. Aucun reordonnancement au hit (meme raisonnement
// que _obtenirEntreeLigne ci-dessus) : juste un .get(), rien de plus sur le chemin chaud.
function _obtenirSegmentsExpression(str) {
  let entree = _cacheSegmentsExpression.get(str);
  if (entree !== undefined && entree.version === _versionFonctionsExpression) {
    return entree.segments;
  }
  let segments = _analyserSegmentsExpression(str);
  let etaitPresente = _cacheSegmentsExpression.has(str);
  _cacheSegmentsExpression.set(str, { version: _versionFonctionsExpression, segments: segments });
  if (!etaitPresente && _cacheSegmentsExpression.size > _CACHE_EXPR_TAILLE_MAX) {
    _cacheSegmentsExpression.delete(_cacheSegmentsExpression.keys().next().value);
  }
  return segments;
}

async function extraireFonctionsExpression(str) {
  let segments = _obtenirSegmentsExpression(str);
  let resultat = "", temp = {}, compteur = 0;
  for (let seg of segments) {
    if (seg.type === 'texte') { resultat += seg.valeur; continue; }
    if (seg.type === 'skip') { resultat += str.slice(seg.debut, seg.fin); continue; }
    if (seg.type === 'erreur') { throw new Error(seg.message); }
    if (seg.type === 'racine') {
      if (seg.erreurArgs) throw new Error(seg.erreurArgs);
      let valeur = appliquerRacineN(seg.n2, await evalExpr(seg.argExprs[0], ctxExpr));
      let nomTemp = "__ext" + compteur + "__";
      temp[nomTemp] = valeur;
      compteur++;
      resultat += nomTemp;
      continue;
    }
    // seg.type === 'appel'
    let valeur = await fonctionsExpression[seg.nom](seg.argExprs, ctxExpr);
    let nomTemp = "__ext" + compteur + "__";
    temp[nomTemp] = valeur;
    compteur++;
    resultat += nomTemp;
  }
  return { str: resultat, temp: temp };
}

async function evalExpr(str, ctx) {
  let extrait = await extraireFonctionsExpression(str);
  let temp = extrait.temp;
  let aTemp = Object.keys(temp).length > 0;
  if (aTemp) scopes.push(temp);
  try {
    return await evalExprSansEntree(extrait.str, ctx);
  } finally {
    if (aTemp) scopes.pop();
  }
}

// Signal interne (pas une vraie erreur du langage) : leve par le parseur RAPIDE
// synchrone quand il rencontre un appel a une fonction UTILISATEUR (fonc ...) au
// milieu d'une expression. Un tel appel doit pouvoir executer des boucles/retour/
// entr() etc., donc il a reellement besoin d'async -> on retombe alors sur
// l'ancien parseur async complet, qui sait le gerer.
class __BesoinAsync extends Error {}

// ===================== AST — cache d'arbre pour le sous-ensemble "pur" des expressions ====================
// Constat du benchmark_cascade.mlg : "i+i" dans une boucle de 50000 tours est aujourd'hui
// re-tokenise ET re-parse depuis la chaine brute a CHAQUE tour, alors que sa STRUCTURE ne
// change jamais -- seules les valeurs des variables qu'elle lit changent d'un tour a l'autre.
// On construit donc un arbre une seule fois par expression SOURCE (mis en cache par chaine),
// puis on se contente de le PARCOURIR a chaque evaluation suivante. Les memes fonctions
// combinerAddition/combinerComparaison/accederUnique/etc. sont reutilisees telles quelles :
// seul le CHEMIN pour y arriver change, pas leur logique.
//
// Porte volontairement REDUITE a un sous-ensemble "pur" : arithmetique, comparaisons,
// et/ou/non, dan, sequence ':', indexation v[i]/m[i,j], nombres/textes/VRAI/FAUX/pasdefini/
// codes d'erreur/variables/parentheses. Des qu'on rencontre autre chose (appel de fonction,
// '.' quel qu'il soit -- attribut de classe, variable de module, methode de texte, PRODUIT
// SCALAIRE inclus, fonc(...) anonyme, lettr/Lettr, parent) la construction DECLINE (renvoie
// null) : l'appelant retombe alors sur l'ancien parseur rapide (evalExprSansEntreeSync ci-
// dessous, inchange) exactement comme avant. Le "." est traite en bloc plutot que de tenter
// de distinguer produit scalaire vs attribut ici : c'est strictement plus prudent (le produit
// scalaire perd juste le benefice du cache) et ca evite de dupliquer la logique de
// disambiguation deja presente dans evalExprSansEntreeSync. Zero risque de regression sur ce
// qui n'est pas couvert : c'est litteralement le meme code qu'avant pour ces cas-la.
let _cacheArbreRapide = new Map(); // str -> noeud | null (null = "grammaire non couverte, ne pas reessayer")

function _obtenirArbreRapide(str) {
  if (_cacheArbreRapide.has(str)) return _cacheArbreRapide.get(str);
  let noeud;
  try {
    noeud = _construireArbreRapide(tokenizerExpr(str));
  } catch (e) {
    // Erreur de syntaxe (parenthese manquante, etc.) : pas notre travail de la diagnostiquer
    // ici -- on decline, l'ancien parseur la retrouvera et la rapportera avec son message habituel.
    noeud = null;
  }
  _cacheArbreRapide.set(str, noeud);
  if (_cacheArbreRapide.size > _CACHE_EXPR_TAILLE_MAX) {
    _cacheArbreRapide.delete(_cacheArbreRapide.keys().next().value);
  }
  return noeud;
}

function _construireArbreRapide(tokens) {
  let pos = 0;
  const peek = () => tokens[pos];
  const next = () => tokens[pos++];
  const DECLINE = null;

  function or_() {
    let g = and_();
    if (g === DECLINE) return DECLINE;
    while (peek() && peek().type === 'or') {
      next();
      let d = and_();
      if (d === DECLINE) return DECLINE;
      g = { t: 'or', g, d };
    }
    return g;
  }
  function and_() {
    let g = not_();
    if (g === DECLINE) return DECLINE;
    while (peek() && peek().type === 'and') {
      next();
      let d = not_();
      if (d === DECLINE) return DECLINE;
      g = { t: 'and', g, d };
    }
    return g;
  }
  function not_() {
    if (peek() && peek().type === 'not') {
      next();
      let v = not_();
      if (v === DECLINE) return DECLINE;
      return { t: 'not', v };
    }
    return dan_();
  }
  function dan_() {
    let g = cmp_();
    if (g === DECLINE) return DECLINE;
    while (peek() && peek().type === 'dan') {
      next();
      let d = cmp_();
      if (d === DECLINE) return DECLINE;
      g = { t: 'dan', g, d };
    }
    return g;
  }
  function cmp_() {
    let g = add_();
    if (g === DECLINE) return DECLINE;
    if (peek() && peek().type === 'cmp') {
      let op = next().v;
      let d = add_();
      if (d === DECLINE) return DECLINE;
      return { t: 'cmp', g, d, op };
    }
    return g;
  }
  function add_() {
    let g = mul_();
    if (g === DECLINE) return DECLINE;
    while (peek() && peek().type === 'op' && (peek().v === '+' || peek().v === '-')) {
      let op = next().v;
      let d = mul_();
      if (d === DECLINE) return DECLINE;
      g = { t: 'add', g, d, op };
    }
    return g;
  }
  function mul_() {
    let g = colon_();
    if (g === DECLINE) return DECLINE;
    // NB : '.' (produit scalaire) ne peut jamais arriver ici -- primary_() decline des qu'il
    // voit un '.' de suite, avant meme de remonter jusqu'ici (voir commentaire plus haut).
    while (peek() && peek().type === 'op' && (peek().v === '*' || peek().v === '/' || peek().v === '%' || peek().v === 'enti' || peek().v === '..' || peek().v === '×')) {
      let op = next().v;
      let d = colon_();
      if (d === DECLINE) return DECLINE;
      g = { t: 'mul', g, d, op };
    }
    return g;
  }
  function colon_() {
    let g = unary_();
    if (g === DECLINE) return DECLINE;
    if (peek() && peek().type === 'deuxpoints') {
      next();
      let d = unary_();
      if (d === DECLINE) return DECLINE;
      return { t: 'seq', g, d };
    }
    return g;
  }
  function unary_() {
    if (peek() && peek().type === 'op' && peek().v === '-') {
      next();
      let v = unary_();
      if (v === DECLINE) return DECLINE;
      return { t: 'neg', v };
    }
    return pow_();
  }
  function pow_() {
    let g = primary_();
    if (g === DECLINE) return DECLINE;
    if (peek() && peek().type === 'op' && peek().v === '^') {
      next();
      let d = unary_(); // recursif (associatif a droite) : autorise 2^3^2 et 2^-1
      if (d === DECLINE) return DECLINE;
      return { t: 'pow', g, d };
    }
    return g;
  }
  function primary_() {
    let valeur = primaryBrute_();
    if (valeur === DECLINE) return DECLINE;
    while (true) {
      if (peek() && peek().type === '[') {
        next();
        let idx1 = null;
        if (peek() && peek().type !== ',' && peek().type !== ']') {
          idx1 = or_();
          if (idx1 === DECLINE) return DECLINE;
        }
        if (peek() && peek().type === ',') {
          next();
          let idx2 = null;
          if (peek() && peek().type !== ']') {
            idx2 = or_();
            if (idx2 === DECLINE) return DECLINE;
          }
          if (!peek() || peek().type !== ']') return DECLINE;
          next();
          valeur = { t: 'idx2', base: valeur, i1: idx1, i2: idx2 };
          continue;
        }
        if (!peek() || peek().type !== ']') return DECLINE;
        next();
        valeur = { t: 'idx1', base: valeur, i: idx1 };
        continue;
      }
      // Tout '.' ici (attribut de classe, variable de module, methode de texte, produit
      // scalaire...) sort de ce sous-ensemble reduit -- on decline plutot que de deviner
      // sans le contexte runtime dont dispose l'ancien parseur.
      if (peek() && peek().type === 'op' && peek().v === '.') return DECLINE;
      break;
    }
    return valeur;
  }
  function primaryBrute_() {
    let t = peek();
    if (!t) return DECLINE;
    if (t.type === 'num') { next(); return { t: 'num', v: t.v }; }
    if (t.type === 'str') { next(); return { t: 'str', v: t.v }; }
    if (t.type === '(') {
      next();
      let v = or_();
      if (v === DECLINE) return DECLINE;
      if (!peek() || peek().type !== ')') return DECLINE;
      next();
      return v;
    }
    if (t.type === 'ident') {
      if (t.v === 'VRAI') { next(); return { t: 'lit', v: true }; }
      if (t.v === 'FAUX') { next(); return { t: 'lit', v: false }; }
      // lettr/Lettr (alphabetMinuscule()/alphabetMajuscule()) et parent (acces a l'instance
      // englobante) : constructions particulieres, laissees a l'ancien parseur.
      if (t.v === 'lettr' || t.v === 'Lettr' || t.v === 'parent') return DECLINE;
      // Suivi de '(' : appel de fonction utilisateur, ou pasdefini(...)/lettr(...)/fonc(...)
      // mal ecrits -- dans tous les cas, decline pour laisser l'ancien parseur produire le
      // bon comportement (ou le bon message d'erreur).
      if (tokens[pos + 1] && tokens[pos + 1].type === '(') return DECLINE;
      if (t.v === 'pasdefini') { next(); return { t: 'lit', v: undefined }; }
      if (CODES_ERREUR_RECONNUS.has(t.v)) { next(); return { t: 'lit', v: t.v }; }
      // Suivi de '.' : attribut de classe, variable de module, methode de texte -- decline
      // (voir commentaire dans primary_()).
      if (tokens[pos + 1] && tokens[pos + 1].type === 'op' && tokens[pos + 1].v === '.') return DECLINE;
      next();
      return { t: 'var', nom: t.v };
    }
    return DECLINE;
  }

  let resultat = or_();
  if (resultat === DECLINE) return null;
  if (pos < tokens.length) return null; // tokens non consommes : hors de ce sous-ensemble (ou erreur ; laisse l'ancien parseur trancher)
  return resultat;
}

function evaluerArbreRapide(noeud, ctx) {
  switch (noeud.t) {
    case 'num': case 'str': case 'lit': return noeud.v;
    case 'var': return ctx.getVar(noeud.nom);
    case 'neg': { let v = evaluerArbreRapide(noeud.v, ctx); verifierNombre(v, '-'); return -v; }
    case 'not': return !estVrai(evaluerArbreRapide(noeud.v, ctx));
    case 'or': { let g = evaluerArbreRapide(noeud.g, ctx); if (estVrai(g)) return true; return estVrai(evaluerArbreRapide(noeud.d, ctx)); }
    case 'and': { let g = evaluerArbreRapide(noeud.g, ctx); if (!estVrai(g)) return false; return estVrai(evaluerArbreRapide(noeud.d, ctx)); }
    case 'dan': return testerAppartenance(evaluerArbreRapide(noeud.g, ctx), evaluerArbreRapide(noeud.d, ctx));
    case 'cmp': return combinerComparaison(evaluerArbreRapide(noeud.g, ctx), evaluerArbreRapide(noeud.d, ctx), noeud.op);
    case 'add': return combinerAddition(evaluerArbreRapide(noeud.g, ctx), evaluerArbreRapide(noeud.d, ctx), noeud.op);
    case 'mul': return combinerMultiplication(evaluerArbreRapide(noeud.g, ctx), evaluerArbreRapide(noeud.d, ctx), noeud.op);
    case 'seq': {
      let g = evaluerArbreRapide(noeud.g, ctx), d = evaluerArbreRapide(noeud.d, ctx);
      verifierNombre(g, ':'); verifierNombre(d, ':');
      return construireSequence(g, d);
    }
    case 'pow': return combinerPuissance(evaluerArbreRapide(noeud.g, ctx), evaluerArbreRapide(noeud.d, ctx));
    case 'idx1': return accederUnique(evaluerArbreRapide(noeud.base, ctx), noeud.i === null ? null : evaluerArbreRapide(noeud.i, ctx), "resultat");
    case 'idx2': return accederMatrice(evaluerArbreRapide(noeud.base, ctx), noeud.i1 === null ? null : evaluerArbreRapide(noeud.i1, ctx), noeud.i2 === null ? null : evaluerArbreRapide(noeud.i2, ctx), "resultat");
  }
  throw new Error("Noeud d'arbre rapide inconnu: " + noeud.t);
}

// ---- Parseur RAPIDE (synchrone). Utilise pour l'ecrasante majorite des
// expressions (conditions de boucles, calculs, indexation...) qui ne contiennent
// aucun appel a une fonction definie par l'utilisateur. Pas de Promise creee a
// chaque niveau de descente recursive -> beaucoup plus rapide dans les boucles.
function evalExprSansEntreeSync(str, ctx) {
  let arbre = _obtenirArbreRapide(str);
  if (arbre !== null) return evaluerArbreRapide(arbre, ctx);

  let tokens = tokenizerExpr(str);
  let pos = 0;
  const peek = () => tokens[pos];
  const next = () => tokens[pos++];

  function parseOr() {
    let g = parseAnd();
    while (peek() && peek().type === 'or') {
      next();
      if (estVrai(g)) { pos = sauterOperandeBooleen(tokens, pos, 'or'); g = true; }
      else { g = estVrai(parseAnd()); }
    }
    return g;
  }
  function parseAnd() {
    let g = parseNot();
    while (peek() && peek().type === 'and') {
      next();
      if (!estVrai(g)) { pos = sauterOperandeBooleen(tokens, pos, 'and'); g = false; }
      else { g = estVrai(parseNot()); }
    }
    return g;
  }
  function parseNot() {
    if (peek() && peek().type === 'not') { next(); return !estVrai(parseNot()); }
    return parseDan();
  }
  function parseDan() {
    let g = parseCmp();
    while (peek() && peek().type === 'dan') { next(); let d = parseCmp(); g = testerAppartenance(g, d); }
    return g;
  }
  function parseCmp() {
    let g = parseAdd();
    if (peek() && peek().type === 'cmp') {
      let op = next().v; let d = parseAdd();
      return combinerComparaison(g, d, op);
    }
    return g;
  }
  function parseAdd() {
    let g = parseMul();
    while (peek() && peek().type === 'op' && (peek().v === '+' || peek().v === '-')) {
      let op = next().v; let d = parseMul();
      g = combinerAddition(g, d, op);
    }
    return g;
  }
  function parseMul() {
    let g = parseColon();
    while (peek() && peek().type === 'op' && (peek().v === '*' || peek().v === '/' || peek().v === '%' || peek().v === 'enti' || peek().v === '.' || peek().v === '..' || peek().v === '×')) {
      let op = next().v; let d = parseColon();
      if (op === '*' || op === '/' || op === '%' || op === 'enti') {
        g = combinerMultiplication(g, d, op);
      } else if (op === '.') {
        g = produitScalaire(g, d);
      } else if (op === '×') {
        g = produitVectoriel(g, d);
      } else if (op === '..') {
        g = produitMatriciel(g, d);
      }
    }
    return g;
  }
  function parseColon() {
    let g = parseUnary();
    if (peek() && peek().type === 'deuxpoints') {
      next();
      let d = parseUnary();
      verifierNombre(g, ':'); verifierNombre(d, ':');
      return construireSequence(g, d);
    }
    return g;
  }
  function parseUnary() {
    if (peek() && peek().type === 'op' && peek().v === '-') { next(); let v = parseUnary(); verifierNombre(v, '-'); return -v; }
    return parsePow();
  }
  function parsePow() {
    let g = parsePrimary();
    if (peek() && peek().type === 'op' && peek().v === '^') {
      next();
      let d = parseUnary(); // recursif (associatif a droite) : autorise 2^3^2 et 2^-1
      g = combinerPuissance(g, d);
    }
    return g;
  }
  function parsePrimary() {
    let valeur = parsePrimaryBrute();
    // Suite d'attributs / indexations / methodes de texte enchaines sur le resultat, dans
    // n'importe quel ordre : moi.comptes[i].nom, v[i].texte(), etc. Une methode d'instance
    // rencontree ici (a.methode(...)) a besoin d'executer un corps entier : on delegue au
    // parseur lent.
    while (true) {
      // Attribut/methode d'une instance de classe : a.nom (lecture), a.methode(...) (appel).
      if (peek() && peek().type === 'op' && peek().v === '.' &&
          tokens[pos + 1] && tokens[pos + 1].type === 'ident' &&
          valeur && typeof valeur === 'object' && valeur.__classe !== undefined) {
        if (tokens[pos + 2] && tokens[pos + 2].type === '(') {
          // Appel de methode : execute un corps entier, ca a besoin d'etre async.
          // On laisse la main au parseur lent.
          throw new __BesoinAsync();
        }
        next(); // '.'
        let nomAttr = next().v;
        valeur = Object.prototype.hasOwnProperty.call(valeur, nomAttr) ? valeur[nomAttr] : undefined;
        continue;
      }
      // Variable d'un module importe : outils.PI (lecture seule). outils.fonction(...) n'arrive
      // jamais ici -- extraireFonctionsExpression() l'a deja remplace par un appel avant que le
      // tokenizer ne voie cette expression (meme mecanisme que ecrire.fichier(...) etc.).
      if (peek() && peek().type === 'op' && peek().v === '.' &&
          tokens[pos + 1] && tokens[pos + 1].type === 'ident' &&
          valeur && typeof valeur === 'object' && valeur.__module !== undefined) {
        next(); // '.'
        let nomAttr = next().v;
        let modInfo = modules[valeur.__module];
        if (!modInfo || !Object.prototype.hasOwnProperty.call(modInfo.scope, nomAttr)) {
          throw new ErreurAttributInconnu("Le module \"" + valeur.__module + "\" n'a pas de variable \"" + nomAttr + "\"");
        }
        valeur = modInfo.scope[nomAttr];
        continue;
      }
      // Methodes de texte chainees directement dans une expression (si(...), affi(...), etc.) :
      // var.miniscul(), |texte|.majuscul(), (a+b).suprespac()... Ne consomme le '.' que si le
      // motif complet correspond, pour ne jamais gener l'operateur '.' de produit scalaire.
      if (peek() && peek().type === 'op' && peek().v === '.' &&
          tokens[pos + 1] && tokens[pos + 1].type === 'ident' &&
          (tokens[pos + 1].v === 'miniscul' || tokens[pos + 1].v === 'majuscul' || tokens[pos + 1].v === 'suprespac') &&
          tokens[pos + 2] && tokens[pos + 2].type === '(' &&
          tokens[pos + 3] && tokens[pos + 3].type === ')') {
        next(); // '.'

async function evalExprSansEntree(str, ctx) {
  try {
    // Chemin rapide, synchrone : couvre la grande majorite des expressions.
    return evalExprSansEntreeSync(str, ctx);
  } catch (e) {
    if (e instanceof __BesoinAsync) {
      // Appel de fonction utilisateur detecte au milieu de l'expression :
      // on refait l'evaluation avec le parseur complet (async).
      return await evalExprSansEntreeAsync(str, ctx);
    }

/* ===================== VECTEURS ET MATRICES ===================== */
// Un vecteur est un simple tableau JS. Une matrice est { __type:"matrice", nlig, ncol, donnees }
// avec "donnees" toujours stockees en colonne (comme R en interne), quel que soit parlig.
function estMatrice(v) { return v !== null && typeof v === 'object' && v.__type === 'matrice'; }
function estVecteur(v) { return Array.isArray(v); }
function estListe(v) { return v !== null && typeof v === 'object' && v.__type === 'liste'; }
// Nom (texte) de la nature d'une valeur : "texte", "nombre", "booleen", "vecteur", "matrice" ou "inconnu".
// Utilise par natu() et par les messages d'erreur de conver.*/est.*.
function nomNature(v) {
  if (estMatrice(v)) return "matrice";
  if (estListe(v)) return "liste";
  if (estVecteur(v)) return "vecteur";
  if (typeof v === "boolean") return "booleen";
  if (typeof v === "bigint") return "entier";
  if (typeof v === "number") return "reel";
  if (typeof v === "string") return "texte";
  if (estValeurFonction(v)) return "fonction";
  // Instance de classe : natu(a) renvoie le nom de sa classe (comme type(a).__name__ en Python),
  // pas juste "inconnu" — pour une instance de "Chien", natu(a) -> "Chien".
  if (v !== null && typeof v === 'object' && v.__classe !== undefined) return v.__classe;
  return "inconnu";
}
// Vecteurs pour les identifiants constants lettr / Lettr (toujours regeneres, pour que des
// modifications faites par l'utilisateur sur le vecteur recupere ne touchent jamais l'original).
function alphabetMinuscule() { let r = []; for (let i = 0; i < 26; i++) r.push(String.fromCharCode(97 + i)); return r; }
function alphabetMajuscule() { let r = []; for (let i = 0; i < 26; i++) r.push(String.fromCharCode(65 + i)); return r; }

// Nom d'affichage pour les messages d'erreur : racine() reste "racine", racine3() reste "racine3", etc.
function nomRacine(n) { return "racine" + (n === 2 ? "" : n); }

// Utilitaires partages par date()/datejour()/heure() : formatage a 2 chiffres et assemblage
// "JJ/MM/AAAA HH:MM:SS" complet (date()), reutilises separement par datejour()/heure() pour
// n'en garder qu'une moitie sans dupliquer la logique de formatage.
function deuxChiffres(n) { return String(n).padStart(2, "0"); }
function formaterDateHeure(d) {
  return deuxChiffres(d.getDate()) + "/" + deuxChiffres(d.getMonth() + 1) + "/" + d.getFullYear()
       + " " + deuxChiffres(d.getHours()) + ":" + deuxChiffres(d.getMinutes()) + ":" + deuxChiffres(d.getSeconds());
}

// Calcule la racine n-ieme d'un nombre. Les racines d'indice impair sont definies pour les
// nombres negatifs (ex: racine3(-8) = -2) ; les racines d'indice pair ne le sont pas.
function racineNieme(n, x) {
  if (typeof x === 'bigint') x = Number(x); // resultat generalement irrationnel de toute facon : pas d'exactitude a preserver, comme math.sqrt(10**30) en Python
  if (typeof x !== 'number') throw new ErreurTypeInvalide(nomRacine(n) + "(...) attend un nombre, un vecteur ou une matrice de nombres");
  if (!Number.isFinite(n) || n === 0) throw new Error(nomRacine(n) + "(...) : indice de racine invalide");
  if (x < 0) {
    if (Number.isInteger(n) && Math.abs(n % 2) === 1) return -Math.pow(-x, 1 / n);
    throw new Error(nomRacine(n) + "(...) : racine d'indice pair d'un nombre negatif impossible (recu " + x + ")");
  }
  return Math.pow(x, 1 / n);
}

// Applique racineNieme a un scalaire, ou element par element a un vecteur/une matrice.
function appliquerRacineN(n, v) {
  if (estMatrice(v)) return { __type: "matrice", nlig: v.nlig, ncol: v.ncol, donnees: v.donnees.map(x => racineNieme(n, x)) };
  if (estVecteur(v)) return v.map(x => racineNieme(n, x));
  return racineNieme(n, v);

// Evalue un argument brut (texte non parse) : gere le texte litteral |...| comme affi/entr,
// sinon evalue normalement l'expression. Utilise partout ou un element de vecteur/matrice
// ou une valeur assignee peut etre soit un nombre/expr, soit du texte litteral.
// Si s commence par '|' mais n'est pas un texte litteral bien forme (|...|), on leve
// tout de suite une erreur precise. Sans ce garde-fou, un tel texte mal ferme finissait
// par etre envoye tel quel a evalExpr, qui ne connait pas le caractere '|' et renvoyait
