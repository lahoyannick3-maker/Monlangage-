<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MonLangage IDE v4.0</title>
  <style>
    * { box-sizing: border-box; }
    html {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
    }
    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: monospace;
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      inset: 0;
      overscroll-behavior: none;
    }
    #editeur {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      overscroll-behavior: none;
    }
    #console { width: 100%; height: 100%; display: none; flex-direction: column; }
    #console.actif { display: flex; }
    #editeur.masque { display: none; }
    #barre {
      background: #161b22;
      padding: 8px;
      border-bottom: 1px solid #30363d;
      display: flex;
      gap: 10px;
      flex-shrink: 0;
      align-items: center;
      position: relative;
      z-index: 1000;
    }
    button { background: #238636; color: white; border: none; padding: 6px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; font-family: monospace; }
    button:hover { background: #2ea043; }
    button:disabled { background: #444; cursor: not-allowed; }
    #btnRunFond { background: #6e40c9; }
    #btnRunFond:hover { background: #8957e5; }
    #btnRunFond:disabled { background: #444; }
    #btnConsole { background: #1f6feb; }
    #btnConsole:hover { background: #388bfd; }
    #btnRetour { background: #30363d; }
    #btnRetour:hover { background: #484f58; }
    #btnArretUrgence { background: #da3633; margin-left: auto; }
    #btnArretUrgence:hover { background: #f85149; }
    #btnSauver {
      background: #8957e5;
      width: 46px;
      min-width: 46px;
      height: 42px;
      padding: 0;
      font-size: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    #btnSauver:hover { background: #a371f7; }

    .menuOuvrir { position: relative; flex-shrink: 0; }
    #btnOuvrir {
      background: #9e6a03;
      width: 46px;
      min-width: 46px;
      height: 42px;
      padding: 0;
      font-size: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    #btnOuvrir:hover { background: #bb8009; }
    #menuOuvrir {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 190px;
      padding: 6px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,.45);
      display: none;
      z-index: 2000;
    }
    #menuOuvrir.ouvert { display: block; }
    #menuOuvrir button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: transparent;
      color: #c9d1d9;
      border-radius: 6px;
      text-align: left;
      font-size: 14px;
    }
    #menuOuvrir button:hover { background: #21262d; }
    #barreFichier {
      background: #161b22;
      padding: 6px 12px;
      border-bottom: 1px solid #30363d;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    #nomFichier { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #c9d1d9; font-size: 15px; font-weight: bold; max-width: 100%; }
    #cheminFichier { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #8b949e; font-size: 11px; max-width: 100%; margin-top: 1px; }
    #cheminFichier:empty { display: none; }

    /* Navigateur de fichiers integre (remplace les selecteurs systeme Android) */
    .modalFichiersOverlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(1,4,9,.72);
      z-index: 5000;
      align-items: flex-end;
      justify-content: center;
    }
    .modalFichiersOverlay.ouvert { display: flex; }
    .modalFichiersBoite {
      width: 100%; max-width: 640px; max-height: 82vh;
      background: #161b22; border: 1px solid #30363d; border-radius: 12px 12px 0 0;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .modalFichiersEntete {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 14px; border-bottom: 1px solid #30363d; flex-shrink: 0;
    }
    .modalFichiersEntete button { background: #21262d; padding: 6px 10px; font-size: 14px; }
    .modalFichiersChemin { color: #58a6ff; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
    .modalFichiersListe { flex: 1; overflow-y: auto; padding: 4px 0; }
    .modalFichiersLigne {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 14px; color: #c9d1d9; font-size: 14px; cursor: pointer;
    }
    .modalFichiersLigne:active { background: #21262d; }
    .modalFichiersLigne .icone { font-size: 16px; flex-shrink: 0; }
    .modalFichiersLigne .nom { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .modalFichiersVide { padding: 20px 14px; color: #8b949e; font-size: 13px; text-align: center; }
    .modalFichiersNomLigne {
      display: none; align-items: center; gap: 8px;
      padding: 12px 14px; border-top: 1px solid #30363d; flex-shrink: 0; color: #8b949e; font-size: 13px;
    }
    .modalFichiersNomLigne.visible { display: flex; }
    .modalFichiersNomLigne input {
      flex: 1; background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
      color: #c9d1d9; padding: 8px 10px; font-family: monospace; font-size: 14px;
    }
    .modalFichiersExtension { color: #58a6ff; font-family: monospace; }
    .modalFichiersActions {
      display: flex; justify-content: flex-end; gap: 10px;
      padding: 12px 14px; border-top: 1px solid #30363d; flex-shrink: 0;
    }
    .modalFichiersActions button.annuler { background: #21262d; color: #c9d1d9; }

    #ongletsBarre {
      background: #0d1117;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: stretch;
      overflow-x: auto;
      overflow-y: hidden;
      min-height: 38px;
      flex-shrink: 0;
      position: relative;
      z-index: 999;
      touch-action: pan-x;
    }
    #ongletsBarre::-webkit-scrollbar { height: 4px; }
    .onglet { display: flex; align-items: center; gap: 7px; min-width: 115px; max-width: 220px; height: 38px; padding: 0 8px 0 12px; border-right: 1px solid #30363d; background: #161b22; color: #8b949e; cursor: pointer; user-select: none; }
    .onglet.actif { background: #010409; color: #c9d1d9; border-top: 2px solid #58a6ff; }
    .ongletNom { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .ongletFermer { width: 24px; height: 24px; padding: 0; border-radius: 4px; background: transparent; color: #8b949e; font-size: 17px; line-height: 24px; flex-shrink: 0; }
    .ongletFermer:hover { background: #30363d; color: #fff; }
    #zoneCode {
      flex: 1;
      display: flex;
      overflow: hidden;
      min-height: 0;
      position: relative;
    }
    #numeros { width: 42px; flex-shrink: 0; background: #0d1117; color: #6e7681; text-align: right; padding: 10px 6px 10px 0; font-size: 15px; line-height: 23px; overflow: hidden; user-select: none; white-space: pre; }
    #codeConteneur { position: relative; flex: 1; overflow: hidden; background: #010409; }
    #codeHighlight, #code { position: absolute; inset: 0; margin: 0; padding: 10px; font-size: 15px; line-height: 23px; font-family: monospace; white-space: pre; overflow-wrap: normal; }
    #codeHighlight { color: #c9d1d9; overflow: auto; pointer-events: none; scrollbar-width: none; }
    #codeHighlight::-webkit-scrollbar { display: none; }
    #code { background: transparent; color: transparent; caret-color: #c9d1d9; border: none; outline: none; resize: none; overflow-x: auto; overflow-y: auto; z-index: 1; }
    #code::selection { background: #264f78; color: #c9d1d9; }
    #ligneActive { position: absolute; left: 0; right: 0; top: 0; height: 23px; background: rgba(31, 111, 235, 0.12); pointer-events: none; z-index: 0; }

    #barreRecherche {
      display: none;
      align-items: center;
      gap: 8px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 8px;
      flex-shrink: 0;
    }
    #barreRecherche.visible { display: flex; }
    #rechercheTexte {
      flex: 1;
      min-width: 0;
      background: #0d1117;
      color: #c9d1d9;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 7px 10px;
      font-family: monospace;
      font-size: 14px;
    }
    #rechercheCompte { color: #8b949e; font-size: 12px; min-width: 42px; text-align: center; flex-shrink: 0; }
    #barreRecherche button { background: #21262d; padding: 6px 10px; flex-shrink: 0; }
    #barreRecherche button:hover { background: #30363d; }

    #barreOutilsBas {
      display: flex;
      background: #161b22;
      border-top: 1px solid #30363d;
      flex-shrink: 0;
      padding: 2px;
    }
    #barreOutilsBas button {
      flex: 1;
      background: transparent;
      color: #c9d1d9;
      border-radius: 6px;
      padding: 10px 0;
      font-size: 17px;
      font-weight: normal;
    }
    #barreOutilsBas button:hover, #barreOutilsBas button:active { background: #21262d; }
    #barreOutilsBas button:disabled { color: #444; background: transparent; }

    #headerConsole { background: #010409; padding: 10px 10px 0 10px; flex-shrink: 0 -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    /* Bug reel signale par Yannick : le long appui pour copier ne faisait apparaitre AUCUNE
       bulle "Copier" (ni sur l'app buildee, ni dans l'apercu fichier, ni dans Chrome) -- a la
       difference de #code (un vrai <textarea>, toujours selectionnable nativement quel que
       soit le navigateur). #output n'est que des <div>/<span> ordinaires : sans ces regles
       explicites, certains WebView (dont celui de Capacitor) restent plus restrictifs par
       defaut sur la selection de texte hors champ de formulaire -- on l'active donc ici sans
       ambiguite plutot que de compter sur le comportement par defaut. */
    #output { flex: 1; background: #010409; padding: 0 10px 10px 10px; overflow-y: auto; min-height: 0; white-space: pre-wrap; -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
    #output:focus { outline: none; }

    /* ===================== ECRAN SPECIFICATION OFFICIELLE ===================== */
    #ecranSpecification {
      position: fixed; inset: 0; z-index: 7000;
      display: none; flex-direction: column;
      background: #0d1117; color: #c9d1d9;
    }
    #ecranSpecification.actif { display: flex; }
    #barreSpecification {
      min-height: 52px; flex-shrink: 0;
      display: flex; align-items: center; gap: 10px;
      padding: 7px 10px;
      background: #161b22; border-bottom: 1px solid #30363d;
      z-index: 2;
    }
    #btnFermerSpecification {
      background: #30363d; min-width: 44px; height: 38px; padding: 0 12px;
      font-size: 18px;
    }
    #btnFermerSpecification:hover { background: #484f58; }
    #titreSpecification {
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: 15px; font-weight: bold;
    }
    #cadreSpecification { flex: 1; min-height: 0; border: 0; width: 100%; background: #0d1117; }
  .invite { color: #58a6ff; font-weight: bold; user-select: none; }
  .ligneCommande { }
  .cmdInput { outline: none; }
  .entrInput { outline: none; }

.erreur { color: #f85149; }
.resultatConsole { padding-left: 12px; border-left: 2px solid #30363d; margin: 2px 0 2px 4px; }
.keyword { color: #ff7b72; font-weight: bold; }
.fonction { color: #a5d6ff; }
.operateur { color: #ffa657; }
.nombre { color: #79c0ff; }

/* Indicateur "execution en cours" : n'apparait que si le script met un peu de
   temps a s'executer (voir demarrerIndicateurAttente), pour ne jamais clignoter
   inutilement sur les executions quasi instantanees. */
#indicateurAttente {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: #161b22;
  border: 1px solid #30363d;
  color: #c9d1d9;
  padding: 8px 16px;
  border-radius: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  font-family: monospace;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  z-index: 999;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s ease, transform 0.15s ease;
}
#indicateurAttente.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
.spinnerAttente {
  width: 14px; height: 14px; flex-shrink: 0;
  border: 2px solid #30363d;
  border-top-color: #58a6ff;
  border-radius: 50%;
  animation: tournerSpinnerAttente 0.7s linear infinite;
}
@keyframes tournerSpinnerAttente { to { transform: rotate(360deg); } }

/* Toast de confirmation d'enregistrement (succes / echec), meme habillage
   que l'indicateur d'attente pour rester dans le theme de l'app. */
#toastEnregistrement {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: #161b22;
  border: 1px solid #30363d;
  color: #c9d1d9;
  padding: 8px 16px;
  border-radius: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  font-family: monospace;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  z-index: 1001;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s ease, transform 0.15s ease;
}
#toastEnregistrement.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
#toastEnregistrement.succes { border-color: #238636; }
#toastEnregistrement.echec { border-color: #da3633; }
.toastIcone {
  width: 16px; height: 16px; flex-shrink: 0;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: bold; line-height: 1;
}
#toastEnregistrement.succes .toastIcone { background: #238636; color: #c9d1d9; }
#toastEnregistrement.echec .toastIcone { background: #da3633; color: #c9d1d9; }
    .dialogueOverlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.65); z-index: 3000; padding: 24px; }
    .dialogueOverlay.ouvert { display: flex; }
    .dialogueBoite { width: min(92vw, 420px); background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 22px; box-shadow: 0 12px 40px rgba(0,0,0,.55); }
    .dialogueTitre { font-size: 17px; line-height: 1.45; color: #f0f6fc; margin-bottom: 22px; }
    .dialogueActions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; }
    #btnDialogueNon { background: #30363d; }
    #btnDialogueOui { background: #238636; }
    #btnFermetureOngletAnnuler { background: #21262d; }
    #btnFermetureOngletSansEnregistrer { background: #da3633; }
    #btnFermetureOngletSansEnregistrer:hover { background: #f85149; }
    #btnFermetureOngletEnregistrer { background: #238636; }
  </style>
</head>
<body>
  <div id="editeur">
    <div id="barre">
      <button id="btnRun">▶ RUN</button>
      <button id="btnRunFond" type="button" hidden title="Executer en arriere-plan (service Android, sans console : entr() indisponible)">🌙 FOND</button>
      <button id="btnConsole">Console</button>
      <button id="btnSauver" title="Enregistrer" aria-label="Enregistrer">💾</button>
      <div class="menuOuvrir">
        <button id="btnOuvrir" title="Ouvrir / Nouveau" aria-label="Ouvrir / Nouveau">📂</button>
        <div id="menuOuvrir" role="menu">
          <button id="btnMenuNouvelOnglet" type="button" role="menuitem">＋&nbsp;&nbsp;Nouvel onglet</button>
          <button id="btnMenuOuvrirFichier" type="button" role="menuitem">📄&nbsp;&nbsp;Ouvrir un fichier</button>
        </div>
      </div>
      <input type="file" id="inputOuvrir" accept="*/*" style="display:none">
    </div>
    <div id="barreFichier" title="Fichier actuel">
      <span id="nomFichier">Sans fichier</span>
      <span id="cheminFichier"></span>
    </div>
    <div id="ongletsBarre"></div>
    <div id="zoneCode">
      <div id="numeros">1</div>
      <div id="codeConteneur">
        <div id="ligneActive" aria-hidden="true"></div>
        <div id="codeHighlight" aria-hidden="true"></div>
        <textarea id="code" spellcheck="false">fonc double(x){
retour(x*2)
}

pou(i, 1, 3){
si(i==2 ou i==3){
affi(|i vaut |, i, | (special)|)
}sinon{
affi(|i vaut |, i)
}
}

y ~ double(5)
affi(|Resultat: |, y)

nom ~ entr(|Quel est ton prenom ?|)
affi(|Bonjour |, nom)</textarea>
      </div>
    </div>
    <div id="barreRecherche">
      <input type="text" id="rechercheTexte" placeholder="Rechercher..." autocomplete="off" spellcheck="false">
      <span id="rechercheCompte"></span>
      <button id="btnRecherchePrecedent" type="button" title="Occurrence precedente">↑</button>
      <button id="btnRechercheSuivant" type="button" title="Occurrence suivante">↓</button>
      <button id="btnRechercheFermer" type="button" title="Fermer la recherche">✕</button>
    </div>
    <div id="barreOutilsBas">
      <button id="btnCurseurGauche" type="button" title="Curseur a gauche">◀</button>
      <button id="btnCurseurDroite" type="button" title="Curseur a droite">▶</button>
      <button id="btnAnnuler" type="button" title="Annuler">↶</button>
      <button id="btnRefaire" type="button" title="Retablir">↷</button>
      <button id="btnRechercheOutil" type="button" title="Rechercher">🔍</button>
      <button id="btnCollerOutil" type="button" title="Coller">📋</button>
    </div>
  </div>

  <div id="ecranSpecification" aria-hidden="true">
    <div id="barreSpecification">
      <button id="btnFermerSpecification" type="button" title="Retour">←</button>
      <span id="titreSpecification">Spécification officielle de MonLangage</span>
    </div>
    <iframe id="cadreSpecification" src="about:blank" title="Spécification officielle de MonLangage"></iframe>
  </div>

  <div id="console">
    <div id="headerConsole" style="display:flex; align-items:center; gap:10px;">
      <button id="btnRetour">← Retour</button>
      <span>Console MonLangage v4.0</span>
      <button id="btnArretUrgence" type="button" hidden>🛑 Arrêt d’urgence</button>
    </div>
    <div id="output"></div>
  </div>

  <div id="dialogueArrierePlan" class="dialogueOverlay" aria-hidden="true">
    <div class="dialogueBoite" role="dialog" aria-modal="true" aria-labelledby="titreDialogueArrierePlan">
      <div id="titreDialogueArrierePlan" class="dialogueTitre">Ce script tourne encore dans la console. Le laisser continuer ? (pour un vrai arrière-plan sans console : bouton FOND)</div>
      <div class="dialogueActions">
        <button id="btnDialogueNon" type="button">Arrêter</button>
        <button id="btnDialogueOui" type="button">Laisser</button>
      </div>
    </div>
  </div>

  <div id="dialogueFermetureOnglet" class="dialogueOverlay" aria-hidden="true">
    <div class="dialogueBoite" role="dialog" aria-modal="true" aria-labelledby="titreDialogueFermetureOnglet">
      <div id="titreDialogueFermetureOnglet" class="dialogueTitre"></div>
      <div class="dialogueActions">
        <button id="btnFermetureOngletAnnuler" type="button">Annuler</button>
        <button id="btnFermetureOngletSansEnregistrer" type="button">Fermer sans enregistrer</button>
        <button id="btnFermetureOngletEnregistrer" type="button">Enregistrer</button>
      </div>
    </div>
  </div>

  <div id="indicateurAttente"><div class="spinnerAttente"></div><span id="texteIndicateurAttente">Execution en cours, patientez…</span></div>

  <div id="toastEnregistrement"><span class="toastIcone"></span><span class="toastTexte"></span></div>

  <div id="modalFichiers" class="modalFichiersOverlay">
    <div class="modalFichiersBoite">
      <div class="modalFichiersEntete">
        <button id="modalFichiersRetour" type="button" title="Dossier parent">⬅</button>
        <span id="modalFichiersChemin" class="modalFichiersChemin"></span>
      </div>
      <div id="modalFichiersListe" class="modalFichiersListe"></div>
      <div id="modalFichiersNomLigne" class="modalFichiersNomLigne">
        <span>Nom du fichier :</span>
        <input id="modalFichiersNom" type="text" spellcheck="false">
        <span id="modalFichiersExtension" class="modalFichiersExtension">.mlg</span>
      </div>
      <div class="modalFichiersActions">
        <button id="modalFichiersAnnuler" type="button" class="annuler">ANNULER</button>
        <button id="modalFichiersValider" type="button"></button>
      </div>
    </div>
  </div>

<script>
/* ===================== ETAT GLOBAL ===================== */
              let scopes = [{}];   // pile de portees pour les variables (globale + fonctions)
let profondeurAppel = 0;   // nombre d'appels de fonction Monlangage actuellement imbriques
// Limite volontaire pour eviter qu'une recursion infinie (ex: fonc f(n){retour f(n)} oublie
// son cas d'arret) ne fasse planter tout l'interpreteur avec un "Maximum call stack size
// exceeded" JS brut, illisible. Cette limite doit rester nettement en dessous de la
// profondeur JS reelle que le navigateur supporte (chaque appel Monlangage consomme plusieurs
// niveaux d'appels JS internes : evalExpr, executerTokens, executerCorpsFonction...), pour que
// l'erreur claire ci-dessous se declenche AVANT le crash JS. Augmentable si besoin.
const PROFONDEUR_APPEL_MAX_DEFAUT = 500;

// ===================== Cache de classification de ligne (executerCommandeSimple) =====================
// Cache BORNE (eviction FIFO) des resultats des tests regex FIXES qui reconnaissent la forme
// d'une ligne (affectation, appel de methode, indexation, ...). Ces regex sont des constantes du
// moteur -- elles ne dependent jamais de l'etat runtime -- donc pour un TEXTE de ligne donne, le
// resultat d'un match() est toujours identique d'une iteration a l'autre. Seul ce qui est fait
// APRES un match (evalExpr, setVar, resolution de variables, effets de bord...) depend des
// valeurs runtime et n'est jamais mis en cache ici : seule la RECONNAISSANCE de la forme l'est.
// Borne a _CACHE_LIGNE_TAILLE_MAX entrees pour ne pas grossir indefiniment sur une longue
// session ou beaucoup de lignes distinctes sont executees (ex: code genere dynamiquement).
const _CACHE_LIGNE_TAILLE_MAX = 500;
let _cacheLigneRegex = new Map(); // ligne (texte exact) -> Map(cle de regex -> match|null)
// Recupere (ou cree) l'entree de cache pour cette ligne. Eviction FIFO bornee (la plus
// ANCIENNE entree inseree saute si on depasse _CACHE_LIGNE_TAILLE_MAX) plutot qu'une vraie LRU :
// une LRU exige de "retoucher" la Map externe (delete+set) a chaque HIT pour la remonter en
// position recente, ce qui s'est avere plus cher que le gain du cache lui-meme sur mesure reelle
// (113ms avec LRU-par-regex vs 53ms sans cache du tout ; 24ms avec LRU-par-ligne corrigee ;
// 19ms en FIFO sans aucun reordonnancement au hit -- cf mesures dans la conversation). Pour une
// boucle chaude (le cas qui compte), les memes lignes reviennent sans cesse et ne sont jamais
// evincees tant que le nombre de lignes DISTINCTES du script reste sous la limite -- la FIFO
// suffit largement, sans le cout de la vraie LRU.
function _obtenirEntreeLigne(ligne) {
  let entree = _cacheLigneRegex.get(ligne);
  if (entree !== undefined) return entree;
  entree = new Map();
  _cacheLigneRegex.set(ligne, entree);
  if (_cacheLigneRegex.size > _CACHE_LIGNE_TAILLE_MAX) {
    _cacheLigneRegex.delete(_cacheLigneRegex.keys().next().value);
  }
  return entree;
}
// Lookup/pose LEGER dans une entree deja recuperee via _obtenirEntreeLigne -- aucune operation
// sur la Map externe ici.
function _regexCache(entree, cle, ligne, regex) {
  if (entree.has(cle)) return entree.get(cle);
  let resultat = ligne.match(regex);
  entree.set(cle, resultat);
  return resultat;
}

// ===================== Cache d'analyse d'expression (extraireFonctionsExpression) =====================
// Le decoupage d'une expression en "segments" (texte litteral / appel de fonction native a
// evaluer / bloc fonc(...) a ne pas toucher) ne depend QUE du texte de l'expression et du JEU DE
// NOMS actuellement enregistres dans fonctionsExpression (ce jeu peut grossir a l'execution via
// import(...), qui enregistre des noms "alias.fonction" a la volee -- cf enregistrerAppelableModule
// et enregistrerFonctionsBase). _versionFonctionsExpression est incremente a chaque fois que ce
// jeu de noms change ; une entree de cache dont la version ne correspond plus est traitee comme
// perimee et regeneree. Les VALEURS evaluees (appels a des fonctions avec effets de bord comme
// entr(), resultats qui dependent des variables courantes) ne sont jamais mises en cache : seul
// le decoupage syntaxique (quels sous-textes sont des appels, a quels noms, avec quels
// arguments-texte) l'est. Borne (eviction FIFO, meme raisonnement que le cache de lignes
// ci-dessus : pas de reordonnancement au hit, trop couteux pour le gain apporte) comme le cache
// de lignes ci-dessus.
let _versionFonctionsExpression = 0;
const _CACHE_EXPR_TAILLE_MAX = 500;
let _cacheSegmentsExpression = new Map(); // str -> { version, segments }

/* ===================== ONGlets DE L'EDITEUR ===================== */
let onglets = [];
let ongletActifId = null;
let prochainIdOnglet = 1;

function sauvegarderEtatOnglets() {
  // .historique est volontairement exclu de la serialisation : il peut contenir jusqu'a
  // 100 versions completes du texte par onglet (voir HISTORIQUE_MAX plus bas), inutile de
  // gonfler localStorage avec ca. La position du curseur et le scroll, eux, sont conserves
  // afin de retrouver exactement la ligne active apres fermeture/reouverture de l'app.
  let ongletsSerialisables = onglets.map(({ historique, ...reste }) => reste);
  localStorage.setItem("monlangage_onglets", JSON.stringify(ongletsSerialisables));
  localStorage.setItem("monlangage_onglet_actif", String(ongletActifId ?? ""));
}

// Memorise la position d'edition de l'onglet actif. La ligne active est une consequence
// de selectionStart : pour la restaurer correctement, il faut donc memoriser la position du
// curseur (et la selection eventuelle), ainsi que le scroll vertical.
function memoriserPositionEditeur() {
  let onglet = trouverOnglet(ongletActifId);
  if (!onglet || !codeArea) return;
  onglet.curseurDebut = Number.isFinite(codeArea.selectionStart) ? codeArea.selectionStart : 0;
  onglet.curseurFin = Number.isFinite(codeArea.selectionEnd) ? codeArea.selectionEnd : onglet.curseurDebut;
  onglet.scrollTop = codeArea.scrollTop || 0;
  onglet.scrollLeft = codeArea.scrollLeft || 0;
}

function restaurerPositionEditeur(onglet) {
  if (!onglet || !codeArea) return;
  let longueur = codeArea.value.length;
  let debut = Number.isFinite(Number(onglet.curseurDebut))
    ? Math.max(0, Math.min(longueur, Number(onglet.curseurDebut))) : 0;
  let fin = Number.isFinite(Number(onglet.curseurFin))
    ? Math.max(debut, Math.min(longueur, Number(onglet.curseurFin))) : debut;

  codeArea.setSelectionRange(debut, fin);
  codeArea.scrollTop = Math.max(0, Number(onglet.scrollTop) || 0);
  codeArea.scrollLeft = Math.max(0, Number(onglet.scrollLeft) || 0);
  synchroniserScrollEditeur();
}

function sauvegarderPositionEtEtat() {
  memoriserPositionEditeur();
  sauvegarderEtatOnglets();
}

function trouverOnglet(id) {
  return onglets.find(o => o.id === id) || null;
}

function mettreAJourBarreOnglets() {
  ongletsBarre.querySelectorAll(".onglet").forEach(el => el.remove());

  onglets.forEach(onglet => {
    let bouton = document.createElement("div");
    bouton.className = "onglet" + (onglet.id === ongletActifId ? " actif" : "");
    bouton.dataset.id = onglet.id;

    let nom = document.createElement("span");
    nom.className = "ongletNom";
    nom.textContent = (onglet.dirty ? "*" : "") + (onglet.nom || "sans titre");
    nom.title = onglet.nom || "sans titre";

    let fermer = document.createElement("button");
    fermer.className = "ongletFermer";
    fermer.textContent = "×";
    fermer.title = "Fermer";
    fermer.addEventListener("click", function(e) {
      e.stopPropagation();
      fermerOnglet(onglet.id);
    });

    bouton.appendChild(nom);
    bouton.appendChild(fermer);
    bouton.addEventListener("click", () => activerOnglet(onglet.id));
    ongletsBarre.appendChild(bouton);
  });

  // Fait defiler la barre d'onglets pour que l'onglet ACTIF soit toujours visible
  // (sinon, avec beaucoup d'onglets ouverts, l'onglet actif peut se retrouver hors
  // de l'ecran sans que rien ne le signale).
  let ongletActifEl = ongletsBarre.querySelector(".onglet.actif");
  if (ongletActifEl) {
    ongletActifEl.scrollIntoView({ behavior: "smooth", inline: "nearest", block: "nearest" });
  }
}

function afficherNomOngletActif() {
  let onglet = trouverOnglet(ongletActifId);
  let nom = onglet ? (onglet.nom || "sans titre") : "";
  nomFichier.textContent = nom || "Sans fichier";
  nomFichier.title = nom || "Fichier actuel";
  let dossier = onglet ? (onglet.dossier || "") : "";
  cheminFichierEl.textContent = dossier;
  cheminFichierEl.title = dossier;
}

function definirNomFichier(nom) {
  let onglet = trouverOnglet(ongletActifId);
  if (onglet) {
    onglet.nom = nom || "sans titre";
    afficherNomOngletActif();
    mettreAJourBarreOnglets();
    sauvegarderEtatOnglets();
  } else {
    nomFichier.textContent = nom || "Sans fichier";
    nomFichier.title = nom || "Fichier actuel";
    cheminFichierEl.textContent = "";
  }
}

function creerOnglet(nom, contenu, contenuSauvegarde, activer = true) {
  let onglet = {
    id: prochainIdOnglet++,
    nom: nom || "sans titre",
    contenu: contenu || "",
    contenuSauvegarde: contenuSauvegarde !== undefined ? contenuSauvegarde : (contenu || ""),
    dirty: contenuSauvegarde !== undefined ? (contenu || "") !== contenuSauvegarde : false,
    curseurDebut: 0,
    curseurFin: 0,
    scrollTop: 0,
    scrollLeft: 0,
    // Historique annuler/retablir maison, propre a cet onglet -- jamais serialise dans
    // localStorage (voir sauvegarderEtatOnglets) : il repart a zero a chaque ouverture de
    // l'app, comme dans la plupart des editeurs.
    historique: { piles: [contenu || ""], index: 0 }
  };
  onglets.push(onglet);
  if (activer) {
    ongletActifId = onglet.id;
    codeArea.value = onglet.contenu;
    restaurerPositionEditeur(onglet);
    afficherNomOngletActif();
    majNumeros();
    majSurbrillance();
    synchroniserScrollEditeur();
    majEtatBoutonsHistorique();
  }
  mettreAJourBarreOnglets();
  sauvegarderEtatOnglets();
  return onglet;
}

function mettreAJourOngletDepuisEditeur() {
  let onglet = trouverOnglet(ongletActifId);
  if (!onglet) return;
  onglet.contenu = codeArea.value;
  onglet.dirty = onglet.contenu !== onglet.contenuSauvegarde;
  mettreAJourBarreOnglets();
  sauvegarderEtatOnglets();
}

function activerOnglet(id) {
  if (id === ongletActifId) return;
  mettreAJourOngletDepuisEditeur();

  let onglet = trouverOnglet(id);
  if (!onglet) return;
  ongletActifId = id;
  codeArea.value = onglet.contenu;
  restaurerPositionEditeur(onglet);
  afficherNomOngletActif();
  majNumeros();
  majSurbrillance();
  synchroniserScrollEditeur();
  majEtatBoutonsHistorique();
  sauvegarderEtatOnglets();
  mettreAJourBarreOnglets();
  requestAnimationFrame(synchroniserScrollEditeur);
}

function nouvelOnglet() {
  creerOnglet("sans titre", "", "", true);
}

function enregistrerOnglet(onglet, apresSauvegarde) {
  if (!onglet) return;

  let nomDefaut = (onglet.nom || "").trim().replace(/\.mlg$/i, "");
  if (!nomDefaut || nomDefaut.toLowerCase() === "sans titre") nomDefaut = "monscript";

  // Navigateur de fichiers integre (choix du nom ET de l'emplacement dans un seul
  // dialogue, dans le style de l'app) : c'est la voie normale sur l'app native.
  if (window.MonLangage && typeof window.MonLangage.listerDossier === "function") {
    ouvrirNavigateurFichiers("enregistrer", {
      nomDefaut: nomDefaut,
      onValide: (cheminComplet) => {
        let ok = window.MonLangage.ecrireFichier(cheminComplet, onglet.contenu);
        if (ok) {
          onglet.nom = cheminComplet.substring(cheminComplet.lastIndexOf("/") + 1);
          onglet.dossier = cheminComplet.substring(0, cheminComplet.lastIndexOf("/"));
          onglet.contenuSauvegarde = onglet.contenu;
          onglet.dirty = false;
          sauvegarderEtatOnglets();
          mettreAJourBarreOnglets();
          if (onglet.id === ongletActifId) afficherNomOngletActif();
          afficherToastEnregistrement(true, "Enregistre avec succes");
        } else {
          afficherToastEnregistrement(false, "Echec de l'enregistrement");
        }
        if (apresSauvegarde) apresSauvegarde(!!ok);
      }
    });
    return;
  }

  // Fallback navigateur web classique (previsualisation hors app, ou app native
  // pas encore reconstruite avec le navigateur de fichiers integre).
  try {
    onglet.nom = nomDefaut + ".mlg";
    let blob = new Blob([onglet.contenu], { type: "text/plain;charset=utf-8" });
    let url = URL.createObjectURL(blob);
    let a = document.createElement("a");
    a.href = url;
    a.download = onglet.nom;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);

    onglet.contenuSauvegarde = onglet.contenu;
    onglet.dirty = false;
    sauvegarderEtatOnglets();
    mettreAJourBarreOnglets();
    if (onglet.id === ongletActifId) afficherNomOngletActif();
    afficherToastEnregistrement(true, "Enregistre avec succes");
    if (apresSauvegarde) apresSauvegarde(true);
  } catch (e) {
    afficherToastEnregistrement(false, "Echec de l'enregistrement");
    if (apresSauvegarde) apresSauvegarde(false);
  }
}

function enregistrerFichierMlg() {
  mettreAJourOngletDepuisEditeur();
  let onglet = trouverOnglet(ongletActifId);
  enregistrerOnglet(onglet);
}

// Dialogue "modifications non enregistrees" avant fermeture d'un onglet -- remplace l'ancien
// confirm() natif du navigateur (popup blanche hors-charte) par une boite stylee identique aux
// autres dialogues de l'app (voir dialogueArrierePlan). Trois issues possibles, resolues sous
// forme de texte : "enregistrer" (enregistrer puis fermer), "fermer" (fermer sans enregistrer),
// "annuler" (ne pas fermer l'onglet du tout).
function demanderConfirmationFermeture(nomFichier) {
  return new Promise((resolve) => {
    const overlay = document.getElementById("dialogueFermetureOnglet");
    const titre = document.getElementById("titreDialogueFermetureOnglet");
    const btnEnregistrer = document.getElementById("btnFermetureOngletEnregistrer");
    const btnSansEnregistrer = document.getElementById("btnFermetureOngletSansEnregistrer");
    const btnAnnuler = document.getElementById("btnFermetureOngletAnnuler");
    titre.textContent = "Le fichier « " + (nomFichier || "sans titre") + " » contient des modifications non enregistrées.";
    overlay.classList.add("ouvert");
    overlay.setAttribute("aria-hidden", "false");
    function terminer(reponse) {
      overlay.classList.remove("ouvert");
      overlay.setAttribute("aria-hidden", "true");
      btnEnregistrer.removeEventListener("click", surEnregistrer);
      btnSansEnregistrer.removeEventListener("click", surSansEnregistrer);
      btnAnnuler.removeEventListener("click", surAnnuler);
      resolve(reponse);
    }
    function surEnregistrer() { terminer("enregistrer"); }
    function surSansEnregistrer() { terminer("fermer"); }
    function surAnnuler() { terminer("annuler"); }
    btnEnregistrer.addEventListener("click", surEnregistrer);
    btnSansEnregistrer.addEventListener("click", surSansEnregistrer);
    btnAnnuler.addEventListener("click", surAnnuler);
  });
}

async function fermerOnglet(id) {
  let onglet = trouverOnglet(id);
  if (!onglet) return;

  if (onglet.dirty) {
    let reponse = await demanderConfirmationFermeture(onglet.nom);

    if (reponse === "annuler") return;

    if (reponse === "enregistrer") {
      enregistrerOnglet(onglet, function(succes) {
        if (succes) fermerOnglet(id);
      });
      return;
    }
  }

  let index = onglets.findIndex(o => o.id === id);
  onglets.splice(index, 1);

  if (onglets.length === 0) {
    creerOnglet("sans titre", "", "", true);
    return;
  }

  if (id === ongletActifId) {
    let nouvelIndex = Math.min(index, onglets.length - 1);
    ongletActifId = onglets[nouvelIndex].id;
    codeArea.value = onglets[nouvelIndex].contenu;
    afficherNomOngletActif();
    majNumeros();
    majSurbrillance();
    synchroniserScrollEditeur();
    majEtatBoutonsHistorique();
  }

  sauvegarderEtatOnglets();
  mettreAJourBarreOnglets();
}

function chargerFichierDansNouvelOnglet(texte, nom, dossier) {
  let onglet = creerOnglet(nom || "sans titre", texte, texte, true);
  if (dossier) onglet.dossier = dossier;
  sauvegarderCode();
  afficherEditeur();
  requestAnimationFrame(synchroniserScrollEditeur);
}

function initialiserOnglets() {
  let stock = null;
  try {
    stock = JSON.parse(localStorage.getItem("monlangage_onglets") || "null");
  } catch (_) {}

  if (Array.isArray(stock) && stock.length) {
    onglets = stock.map(o => ({
      id: Number(o.id) || prochainIdOnglet++,
      nom: o.nom || "sans titre",
      contenu: o.contenu || "",
      contenuSauvegarde: o.contenuSauvegarde !== undefined ? o.contenuSauvegarde : (o.contenu || ""),
      dirty: !!o.dirty,
      dossier: o.dossier || undefined,
      curseurDebut: Number.isFinite(Number(o.curseurDebut)) ? Number(o.curseurDebut) : 0,
      curseurFin: Number.isFinite(Number(o.curseurFin)) ? Number(o.curseurFin) : (Number.isFinite(Number(o.curseurDebut)) ? Number(o.curseurDebut) : 0),
      scrollTop: Number.isFinite(Number(o.scrollTop)) ? Number(o.scrollTop) : 0,
      scrollLeft: Number.isFinite(Number(o.scrollLeft)) ? Number(o.scrollLeft) : 0,
      historique: { piles: [o.contenu || ""], index: 0 }
    }));
    prochainIdOnglet = Math.max(...onglets.map(o => Number(o.id) || 0), 0) + 1;
    let idSauvegarde = Number(localStorage.getItem("monlangage_onglet_actif"));
    ongletActifId = onglets.some(o => o.id === idSauvegarde) ? idSauvegarde : onglets[0].id;
    let actif = trouverOnglet(ongletActifId);
    codeArea.value = actif.contenu;
    restaurerPositionEditeur(actif);
  } else {
    let ancienCode = localStorage.getItem("monlangage_code");
    let ancienNom = localStorage.getItem("monlangage_nom_fichier") || "sans titre";
    let contenu = ancienCode !== null ? ancienCode : codeArea.value;
    creerOnglet(ancienNom, contenu, contenu, true);
  }

  afficherNomOngletActif();
  mettreAJourBarreOnglets();
  majNumeros();
  majSurbrillance();
  synchroniserScrollEditeur();
  majEtatBoutonsHistorique();
}

let __cacheTokenizerExpr = new Map();

    if (c === '!' && str[i+1] === '=') { tokens.push({ type: 'cmp', v: '!=' }); i += 2; continue; }
    if (c === '<' && str[i+1] === '=') { tokens.push({ type: 'cmp', v: '<=' }); i += 2; continue; }
    if (c === '>' && str[i+1] === '=') { tokens.push({ type: 'cmp', v: '>=' }); i += 2; continue; }
    if (c === '<') { tokens.push({ type: 'cmp', v: '<' }); i++; continue; }
    if (c === '>') { tokens.push({ type: 'cmp', v: '>' }); i++; continue; }
    if ('+-*/%'.includes(c)) { tokens.push({ type: 'op', v: c }); i++; continue; }
    if (c === '^') { tokens.push({ type: 'op', v: '^' }); i++; continue; }
    if (c === '.' && str[i+1] === '.') { tokens.push({ type: 'op', v: '..' }); i += 2; continue; }
    if (c === '.') { tokens.push({ type: 'op', v: '.' }); i++; continue; }

// Reconstruit un texte d'expression equivalent a partir d'une TRANCHE de jetons deja produite

// Un espace separe systematiquement chaque jeton : ca ne change jamais le sens (tokenizerExpr

function detokeniserExpr(tokens) {

      case ']': return ']';

      case 'op': return t.v;
      case 'num': return String(t.v);
      case 'ident': return t.v;
      case 'and': return 'et';
      case 'or': return 'ou';
      case 'not': return 'non';
      case 'dan': return 'dan';

    }

  // "som ( x ) + 100". Inoffensif pour le retokenizing (qui ignore les espaces), mais fatal
  // pour extraireFonctionsExpression : les fonctions integrees (som/moy/entr/ecrire/matrice/...)
  // ne sont PAS appelables via ctx.appelerFonction (reserve aux fonctions perso/variables-
  // fonction) -- elles ne marchent QUE via ce pre-passage, qui les detecte par correspondance
  // TEXTUELLE EXACTE "nomFonction(" dans la chaine brute. Avec l'espace insere, la
  // correspondance echouait silencieusement et on retombait sur "Fonction inconnue: som".
  // Consequence concrete : toute fonction anonyme fonc(x){...} appelant un built-in (ex:
  // fonc(x) som(x)+100, utilise justement comme exemple pour suchaq()) echouait a l'appel.
  // Corrige en ne remettant un espace qu'entre deux jetons qui se termineraient/commenceraient
  // tous les deux par un caractere alphanumerique (deux "mots" colles fusionneraient en un

  const finitParMot = (s) => /[a-zA-Z0-9_]$/.test(s);
