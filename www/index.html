    // aide() : liste toutes les commandes, groupees par categorie. aide(nom_ou_symbole) : detail sur une seule.
    fonctionsBase["aide"] = async function(args, ctxExpr) {
        if (args.length === 0 || args[0].trim() === "") {
            // Index compact : la syntaxe (signature) de chaque commande, groupee par categorie,
            // mais SANS les paragraphes de description ni les exemples multi-lignes (avant,
            // aide() affichait TOUT ca d'un coup pour plus de 100 entrees -- illisible et
            // decourageant a faire defiler sur mobile). La syntaxe seule reste lisible en un
            // coup d'oeil ; le detail complet (description + exemple) reste a un aide(nom) de
            // distance, rien n'est supprime nulle part.
            let categories = [];
            for (let e of aideCommandes) if (!categories.includes(e.categorie)) categories.push(e.categorie);
            let lignes = ["=== Commandes de MonLangage ==="];
            lignes.push("aide(nom) pour le detail d'une commande, ex: aide(matrice) ou aide(+)");
            lignes.push("aide(spec) pour ouvrir la specification officielle complete");
            for (let cat of categories) {
                lignes.push("");
                lignes.push("-- " + cat + " --");
                for (let e of aideCommandes) {
                    if (e.categorie !== cat) continue;
                    lignes.push("  " + e.syntaxe);
                }
            }
            print(lignes.join("\n"));
            // aide() doit commencer par le haut de la liste, pas rester forcee en bas.
            requestAnimationFrame(() => { outputDiv.scrollTop = 0; });
            return;
        }
        let cle = args[0].trim();
        if (/^\|.*\|$/.test(cle)) cle = cle.slice(1, -1).trim();
        if (cle.toLowerCase() === "spec") {
            ouvrirSpecification();
            return;
        }
        let entree = aideCommandes.find(e => e.noms.includes(cle));
        if (!entree) { print("Aucune aide trouver pour : " + cle); return; }
        let lignes = ["[" + entree.categorie + "]", entree.syntaxe];
        for (let d of entree.description) lignes.push(d);
        if (entree.exemple) lignes.push("Exemple : " + entree.exemple);
        print(lignes.join("\n"));
    };

    // effa() : efface toute la console (comme l'ancien bouton "Effacer Console").
    // effa(a, e, ...) : supprime ces variables de la memoire (sans toucher a l'affichage).
    fonctionsBase["effa"] = async function(args, ctxExpr) {
        if (args.length === 0 || (args.length === 1 && args[0].trim() === "")) {
            clearConsole();
            return;
        }
        let supprimes = [], inconnus = [];
        for (let a of args) {
            let nom = a.trim();
            if (!/^[a-zA-Z_]\w*$/.test(nom)) throw new Error("effa(...) : argument invalide : " + nom);
            let trouve = false;
            for (let i = scopes.length - 1; i >= 0; i--) {
                if (Object.prototype.hasOwnProperty.call(scopes[i], nom)) { delete scopes[i][nom]; trouve = true; break; }
            }
            if (trouve) supprimes.push(nom); else inconnus.push(nom);
        }
        if (supprimes.length) print((supprimes.length > 1 ? "Elements supprimer : " : "Element supprimer : ") + supprimes.join(", "));
        if (inconnus.length) print((inconnus.length > 1 ? inconnus.join(", ") + " ne sont pas stocker en memoire : ils ne peuvent pas etre effacer." : inconnus.join(", ") + " n'est pas stocker en memoire : il ne peut pas etre effacer.") , "erreur");
    };

    // voi() : liste les noms de tous les elements actuellement stockes en memoire.
    // voi(a, e, ...) : confirme pour chacun s'il est stocke ou non.
    fonctionsBase["voi"] = async function(args, ctxExpr) {
        if (args.length === 0 || (args.length === 1 && args[0].trim() === "")) {
            let noms = [];
            for (let s of scopes) {
                for (let nom of Object.keys(s)) {
                    if (nom.startsWith("__ext")) continue;
                    if (!noms.includes(nom)) noms.push(nom);
                }
            }
            if (noms.length === 0) print("Aucun element stocker pour le moment.");
            else print("Elements stocker : " + noms.join(", "));
            return;
        }
        let trouves = [], nonTrouves = [];
        for (let a of args) {
            let nom = a.trim();
            if (!/^[a-zA-Z_]\w*$/.test(nom)) throw new Error("voi(...) : argument invalide : " + nom);
            let existe = false;
            for (let i = scopes.length - 1; i >= 0; i--) {
                if (Object.prototype.hasOwnProperty.call(scopes[i], nom)) { existe = true; break; }
            }
            if (existe) trouves.push(nom); else nonTrouves.push(nom);
        }
        if (trouves.length) print("Oui, " + trouves.join(", ") + (trouves.length > 1 ? " sont stocker." : " est stocker."));
        if (nonTrouves.length) print("Non, " + nonTrouves.join(", ") + (nonTrouves.length > 1 ? " ne sont pas stocker." : " n'est pas stocker."));
    };

    // Codes couleur simplifies façon Scilab, mais en francais (une ou deux lettres),
    // pour eviter d'avoir a taper un code hexadecimal.
    let COULEURS_TRAC = {
        r: "#f85149",   // rouge
        v: "#3fb950",   // vert
        b: "#58a6ff",   // bleu
        n: "#000000",   // noir (peu visible sur fond sombre, prevoir un fond clair si besoin)
        j: "#e3b341",   // jaune
        m: "#ff5fd1",   // magenta
        c: "#39d0d8",   // cyan
        bl: "#f0f6fc"   // blanc
    };

    fonctionsBase["trac"] = async function(args, ctxExpr) {
        if (args.length < 1) throw new Error("trac(...) attend au moins un vecteur : trac(y)  ou  trac(x, y)");

        // Separe les arguments positionnels des options nommees (cle~valeur)
        let clesOptions = ["couleur", "type", "titre", "xlab", "ylab"];
        let positionnels = [], nommes = {};
        for (let a of args) {
            let m = a.trim().match(/^(\w+)\s*~\s*(.*)$/);
            if (m && clesOptions.includes(m[1])) nommes[m[1]] = m[2];
            else positionnels.push(a);
        }
        if (positionnels.length < 1) throw new Error("trac(...) attend au moins un vecteur : trac(y)  ou  trac(x, y)");

        // Lit une option comme texte : |...| litteral, sinon expression convertie en texte
        async function texteOption(cle, defaut) {
            if (!(cle in nommes)) return defaut;
            let s = nommes[cle].trim();
            if (/^\|[\s\S]*\|$/.test(s)) return s.slice(1, -1);
            verifierTexteLitteralFerme(s);
            return String(await evalExpr(s, ctxExpr));
        }

        let couleur = await texteOption("couleur", "b");
        let type = await texteOption("type", "-");
        let titre = await texteOption("titre", "");
        let xlab = await texteOption("xlab", "");
        let ylab = await texteOption("ylab", "");

        // couleur : lettre(s) façon Scilab (r, v, b, n, j, m, c, bl) ou code hexadecimal direct
        let coCode = couleur.trim().toLowerCase();
        if (Object.prototype.hasOwnProperty.call(COULEURS_TRAC, coCode)) couleur = COULEURS_TRAC[coCode];

        // style/type : "-" (trait, par defaut) ou "o" (points), comme les styles plot() de Scilab
        let tyCode = type.trim().toLowerCase();
        type = (tyCode === "o" || tyCode === "points" || tyCode === "point") ? "points" : "lignes";

        // Comme en Scilab : les points (x, y) doivent deja etre calcules avant l'appel.
        // trac(x, y)  -> trace y en fonction de x
        // trac(y)     -> trace y en fonction de sa position (1, 2, 3...)
        let premierVal = await evalExpr(positionnels[0], ctxExpr);
        if (!estVecteur(premierVal)) throw new ErreurTypeInvalide("trac(...) : l'argument doit etre un vecteur (calcule au prealable, comme en Scilab)");

        let xs, ys;
        if (positionnels.length >= 2) {
            let deuxiemeVal = await evalExpr(positionnels[1], ctxExpr);
            if (!estVecteur(deuxiemeVal)) throw new ErreurTypeInvalide("trac(...) : le deuxieme argument doit etre un vecteur");
            if (premierVal.length !== deuxiemeVal.length) throw new Error("trac(...) : x et y doivent avoir la meme longueur");
            xs = premierVal; ys = deuxiemeVal;
            if (!xlab) xlab = "x";
            if (!ylab) ylab = "y";
        } else {
            ys = premierVal;
            xs = [];
            for (let i = 0; i < ys.length; i++) xs.push(i + 1);
            if (!xlab) xlab = "indice";
            if (!ylab) ylab = "y";
        }
        for (let v of xs) verifierNombre(v, "trac");
        for (let v of ys) verifierNombre(v, "trac");

        dessinerCourbe(xs, ys, { couleur, type, titre, xlab, ylab, grille: false });
    };

    // grille(...) : active ou desactive la grille sur le DERNIER graphique trace avec
    // trac(...) — comme xgrid() en Scilab, ou la grille n'est pas affichee par defaut.
    // grille()      -> active la grille
    // grille(FAUX)  -> desactive la grille
    fonctionsBase["grille"] = async function(args, ctxExpr) {
        if (!dernierGraphique) throw new Error("grille(...) : aucun graphique n'a encore ete trace, utilise trac(...) avant");
        let actif = true;
        if (args.length >= 1 && args[0].trim() !== "") actif = estVrai(await evalExpr(args[0], ctxExpr));
        dernierGraphique.options.grille = actif;
        dessinerCourbe(dernierGraphique.xs, dernierGraphique.ys, dernierGraphique.options, dernierGraphique.canvas);
    };

    // Pour ajouter une future fonction native :
    // - fonctionsBase["nom"] = async (args, ctxExpr) => { ... };  -> utilisable en instruction + base.nom(...)
    // - ajouter aussi fonctionsExpression["nom"] = fonctionsBase["nom"]; si elle doit
    //   pouvoir etre utilisee a l'interieur d'une expression (ex: x ~ nom(...)).
}

/* ===================== COLORATION SYNTAXIQUE ===================== */
// Une couleur par categorie (voir aideCommandes), pour ne pas avoir une seule couleur
// unique pour toutes les commandes. Utilise a la fois pour l'affichage dans la console
// (resultats) ET pour la coloration en direct pendant la frappe (editeur + console).
let categorieCouleurs = {
  "Base": "#ff7b72",
  "Controle": "#d2a8ff",
  "Creer un vecteur/une matrice": "#7ee787",
  "Infos sur un vecteur/une matrice": "#f2cc60",
  "Acceder / modifier un element": "#ff9bce",
  "Console": "#e3b341",
  "Graphique": "#56d4dd",
  "Fonctions mathematiques": "#f2a65a",
  "Texte": "#79c0ff",
  "Sauvegarde": "#a5d6ff",
  "Constantes": "#56d4dd",
  "Modules": "#3fb950"
};
// Construit nom -> couleur a partir de aideCommandes (uniquement les noms "mots", pas
// les symboles comme +, -, [, ], qui restent geres a part).
// Les fonctions sont colorees comme fonctions uniquement lorsqu'une parenthese
// est requise juste apres leur nom (avec espaces eventuels). Les commandes MLG
// qui se reconnaissent sans parenthese restent des commandes, meme si leur aide
// contient aussi une autre forme avec parentheses. Exemples :
//   temps() -> fonction coloree
//   temps~0 -> variable normale
//   de module import(...) -> "de" reste colore comme commande
//   si(condition){...}, pou(...), tanqer(...) -> commandes de controle reconnues
//   stop, continu, retour valeur, classe Nom... -> commandes sans parentheses
//   nom.ajout(elements), var.majuscul() -> fonctions colorees (le "." dans leur syntaxe
//     documentee ne les exempte plus de l'exigence de parenthese, sinon "ajout" se
//     recolorait par-dessus lui-meme en 2 couleurs a l'interieur de ajout.fichier(...))
let commandeCouleur = {};
let fonctionsCouleur = {};
for (let e of aideCommandes) {
  if (!categorieCouleurs[e.categorie]) continue;
  for (let nom of e.noms) {
    if (!/^[a-zA-Z_]\w*(?:\.[a-zA-Z_]\w*)*(?:\s+[a-zA-Z_]\w*)*$/.test(nom)) continue;

    // Une commande est une fonction lorsqu'elle est suivie de la premiere
    // parenthese ouvrante : nom(...) -- y compris quand ce nom est lui-meme
    // precede d'un '.' dans sa syntaxe documentee (ex: "nom.ajout(elements)",
    // "var.majuscul()") : ce sont des methodes qui exigent TOUJOURS la
    // parenthese pour etre appelees, donc des fonctions comme les autres.
    // Principe : la coloration d'une commande a parenthese ne doit jamais
    // s'appliquer avant que sa premiere parenthese ouvrante soit ecrite.
    // On ne depend donc plus de la position du nom dans la chaine "syntaxe"
    // de l'aide. Cela corrige notamment les entrees regroupant plusieurs
    // fonctions (planifier.*, date.*, sms.*, ...) et evite qu'un nom comme
    // "ajout" (methode vecteur/matrice/liste) se retrouve colore deux fois
    // avec deux couleurs differentes a l'interieur d'un appel distinct comme
    // "ajout.fichier(...)" ou "ajout.cle(...)".
    let nomEchappe = nom.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    let syntaxe = String(e.syntaxe || '');
    let estFonction = new RegExp('(?:^|[^a-zA-Z0-9_])' + nomEchappe + '\\s*\\(').test(syntaxe);

    // Certaines familles sont documentees avec une syntaxe generique
    // (ex. conver.source.cible(valeur)). Tous les noms de cette entree sont
    // alors des fonctions, meme si leur nom concret n'apparait pas dans la
    // syntaxe generique.
    if (!estFonction && /\bconver\.source\.cible\s*\(/.test(syntaxe)) {
      estFonction = true;
    }

    if (estFonction) {
      fonctionsCouleur[nom] = categorieCouleurs[e.categorie];
    } else {
      commandeCouleur[nom] = categorieCouleurs[e.categorie];
    }
  }
}

// Un seul passage sur les noms reconnus évite qu'une premiere coloration
// (commande) empiete sur une seconde (fonction). Les noms les plus longs sont
// places en premier pour que "annuler.planifier" passe avant "planifier" et
// "sinon si" avant "sinon".
let nomsCouleur = Array.from(new Set([
  ...Object.keys(commandeCouleur),
  ...Object.keys(fonctionsCouleur)
])).sort((a, b) => b.length - a.length);

// Les fonctions et les commandes sont reconnues separement.
// Une fonction est coloree UNIQUEMENT lorsque sa premiere parenthese ouvrante
// suit son nom (espaces eventuels autorises). Une commande sans parentheses est
// coloree directement. Ainsi "conver.vecteu.liste" reste un identifiant normal,
// tandis que "conver.vecteu.liste(...)" est colore comme fonction.
let regexCommandeCouleur = Object.keys(commandeCouleur).length
  ? new RegExp('(?<![a-zA-Z0-9_])(' + Object.keys(commandeCouleur)
      .sort((a, b) => b.length - a.length)
      .map(n => n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join('|') + ')(?![a-zA-Z0-9_])', 'g')
  : null;
let regexFonctionCouleur = Object.keys(fonctionsCouleur).length
  ? new RegExp('(?<![a-zA-Z0-9_])(' + Object.keys(fonctionsCouleur)
      .sort((a, b) => b.length - a.length)
      .map(n => n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join('|') + ')(?=\\s*\\()', 'g')
  : null;

function echapperHTML(texte) {
  return String(texte).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// Colore un morceau de CODE (pas de texte litteral |...|) : commandes reconnues par
// categorie, VRAI/FAUX, ENTI/MOD/et/ou, ~ (affectation), et les nombres (colores par
// defaut, y compris les decimaux).
function colorerCode(texte) {
  let html = echapperHTML(texte);
  html = html.replace(/~/g, '<span class="operateur">~</span>');
  // Fonctions : la parenthese ouvrante est obligatoire pour la coloration.
  if (regexFonctionCouleur) {
    html = html.replace(regexFonctionCouleur, function(match, nom) {
      return '<span style="color:' + fonctionsCouleur[nom] + '; font-weight:bold;">' + match + '</span>';
    });
  }
  // Commandes sans parentheses : coloration independante de la presence de "(".
  if (regexCommandeCouleur) {
    html = html.replace(regexCommandeCouleur, function(match, nom) {
      return '<span style="color:' + commandeCouleur[nom] + '; font-weight:bold;">' + match + '</span>';
    });
  }
  html = html.replace(/\b(VRAI|FAUX|pasdefini)\b/g, '<span style="color:#56d4dd; font-weight:bold;">$1</span>');
  // racineN() : racine2, racine3, racine10... Le regex generique ci-dessus ne reconnait que le
  // mot exact "racine" (limite de mot \b), pas colle a des chiffres (meme souci que mod/enti).
  html = html.replace(/(?<![a-zA-Z0-9_])(racine\d+)(?=\()/g, '<span style="color:' + categorieCouleurs["Fonctions mathematiques"] + '; font-weight:bold;">$1</span>');
  // mod/enti : comme dans le tokeniseur d'expression, reconnus sans espace autour, colles a des
  // chiffres (3mod4, 3ENTI4, 3Enti4...) et sans distinction de casse. On utilise un "regard
  // arriere/avant" plutot que \b, car \b ne separe pas un chiffre d'une lettre (3 et e sont tous
  // deux consideres comme des caracteres de mot).
  html = html.replace(/(?<![a-zA-Z_])(mod|enti)(?![a-zA-Z_])/gi, '<span class="operateur">$1</span>');
  // et/ou restent des mots complets en minuscules (comme dans le tokeniseur), non colles a un chiffre.
  html = html.replace(/\b(et|ou|non|dan)\b/g, '<span class="operateur">$1</span>');
  // Nombres : evalues apres mod/enti pour que 3enti4 colore bien le 3 et le 4 (le mod/enti deja
  // isole dans une balise <span> cree la coupure necessaire pour que \b fonctionne).
  html = html.replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="nombre">$1</span>');
  return html;
}

// Comme colorerCode, mais isole d'abord le texte litteral |...| pour ne jamais colorer
// une commande qui apparait a l'interieur d'un texte (ex: affi(|pou est cool|) ne doit
// pas colorer "pou"). Utilisee pour la console (resultats) ET pour la coloration en
// direct de l'editeur et de la ligne de commande console.
function genererHTMLColore(texte) {
  texte = String(texte);
  let resultat = "", i = 0, n = texte.length;
  while (i < n) {
    if (texte[i] === '*' && texte[i + 1] === '*') {
      let j = i;
      while (j < n && texte[j] !== '\n') j++;
      resultat += '<span style="color:#8b949e; font-style:italic;">' + echapperHTML(texte.slice(i, j)) + '</span>';
      i = j;
    } else if (texte[i] === '|') {
      let j = i + 1;
      while (j < n && texte[j] !== '|') j++;
      let finInclus = j < n ? j + 1 : n;
      resultat += echapperHTML(texte.slice(i, finInclus));
      i = finInclus;
    } else {
      let debut = i;
      while (i < n && texte[i] !== '|' && !(texte[i] === '*' && texte[i + 1] === '*')) i++;
      resultat += colorerCode(texte.slice(debut, i));
    }
  }
  return resultat;
}

function colorerLigne(texte) { return genererHTMLColore(texte); }

// Les messages d'erreur sont entièrement rouges par défaut. On ne leur applique
// PAS la coloration syntaxique générale : un nom de commande cité dans une erreur
// (par exemple dans sa correction syntaxique) reste donc rouge et ne devient pas
// une fausse commande colorée. La seule exception concerne les codes d'erreur
// officiellement indexés par le langage (DIVISION_ZERO, SYNTAXE, etc.), qui peuvent
// conserver la coloration réservée aux constantes d'erreur.
function colorerMessageErreur(texte) {
  texte = String(texte);

  // Le message d'erreur reste rouge, mais lorsque le moteur indique explicitement
  // la ligne/source fautive après ": ", cette partie est du CODE MLG et doit
  // recevoir la coloration syntaxique normale. Exemple :
  // "Appel de fonction mal forme ... : temps(" -> seul "temps(" est colore.
  // On limite volontairement cette regle a ce message precis pour ne pas colorer
  // par erreur du texte normal contenu dans d'autres messages d'erreur.
  const prefixAppelMalForme = "Appel de fonction mal forme (parenthese fermante manquante ou en trop) : ";

  // Affichage des erreurs avec numero de ligne : "Erreur ligne 1: ..." aussi bien que
  // "Erreur de syntaxe ligne 1: ..." (verifierSyntaxeSansRisque) :
  // - le numero de ligne est colore comme un nombre MLG ;
  // - le texte explicatif reste entierement rouge ;
  // - le morceau de code fautif apres ": " est recolore comme du code MLG.
  const matchErreurLigne = texte.match(/^(Erreur (?:de syntaxe )?ligne )(\d+)(: )(.*)$/);
  if (matchErreurLigne) {
    const prefix = echapperHTML(matchErreurLigne[1]);
    const numeroLigne = '<span class="nombre">' + matchErreurLigne[2] + '</span>';
    const separateur = echapperHTML(matchErreurLigne[3]);
    const message = matchErreurLigne[4];

    if (message.startsWith(prefixAppelMalForme)) {
      const messagePrefix = echapperHTML(message.slice(0, prefixAppelMalForme.length));
      const codeFautif = message.slice(prefixAppelMalForme.length);
      return prefix + numeroLigne + separateur + messagePrefix + colorerLigne(codeFautif);
    }

    return prefix + numeroLigne + separateur + echapperHTML(message);
  }

  // Cas ou le message est utilise sans le prefixe "Erreur ligne X: ".
  if (texte.startsWith(prefixAppelMalForme)) {
    const prefix = texte.slice(0, prefixAppelMalForme.length);
    const codeFautif = texte.slice(prefixAppelMalForme.length);
    return echapperHTML(prefix) + colorerLigne(codeFautif);
  }

  let html = echapperHTML(texte);
  if (typeof CODES_ERREUR_RECONNUS !== "undefined" && CODES_ERREUR_RECONNUS.size) {
    let codes = Array.from(CODES_ERREUR_RECONNUS)
      .sort((a, b) => b.length - a.length)
      .map(c => c.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
    if (codes.length) {
      let regexCodes = new RegExp('(?<![a-zA-Z0-9_])(' + codes.join('|') + ')(?![a-zA-Z0-9_])', 'g');
      html = html.replace(regexCodes, '<span style="color:' + categorieCouleurs["Constantes"] + '; font-weight:bold;">$1</span>');
    }
  }
  return html;
}

function print(texte, classe = "") {
  let div = document.createElement("div");
  let classes = classe;
  if (modeConsoleCommande) classes = (classes ? classes + " " : "") + "resultatConsole";
  if (classes) div.className = classes;
  div.innerHTML = classe && classe.split(/\s+/).includes("erreur")
    ? colorerMessageErreur(texte)
    : colorerLigne(texte);
  outputDiv.appendChild(div);
  outputDiv.scrollTop = outputDiv.scrollHeight;
}

// Comme print(), mais pour une VALEUR deja calculee (resultat de affi(...), resultat d'une
// expression tapee dans la console...) et non du code source : on echappe juste le HTML sans
// repasser par le colorisateur de commandes. Sinon un texte affiche comme affi(|ou|) se
// retrouvait recolore comme si "ou" etait l'operateur du langage, alors que ce n'est plus
// qu'un simple texte a ce stade (les | ont deja ete retires).
function printValeur(texte, classe = "") {
  let div = document.createElement("div");
  let classes = classe;
  if (modeConsoleCommande) classes = (classes ? classes + " " : "") + "resultatConsole";
  if (classes) div.className = classes;
  let texteStr = String(texte);
  // Un <div> totalement vide (innerHTML = "") n'a aucune hauteur de ligne et reste
  // invisible a l'ecran, contrairement a un <div> contenant un espace. On force donc une
  // espace insecable quand le texte est vide (ou quand une ligne interne, separee par un
  // saut de ligne, est vide), pour que affi(||) affiche bien une ligne visible, comme
  // affi(| |).
  texteStr = texteStr.split("\n").map(l => l === "" ? "\u00A0" : l).join("\n");
  div.innerHTML = echapperHTML(texteStr);
  outputDiv.appendChild(div);
  outputDiv.scrollTop = outputDiv.scrollHeight;
}

function printInvite() {
  let ligne = document.createElement("div");
  ligne.className = "ligneCommande";
  let invite = document.createElement("span");
  invite.className = "invite";
  invite.textContent = "# ";
  invite.contentEditable = "false";
  let input = document.createElement("span");
  input.className = "cmdInput";
  input.contentEditable = "true";
  ligne.appendChild(invite);
  ligne.appendChild(input);
  outputDiv.appendChild(ligne);
  outputDiv.scrollTop = outputDiv.scrollHeight;
  input.focus();
  let range = document.createRange();
  range.selectNodeContents(input);
  range.collapse(false);
  let sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

function clearConsole() {
  outputDiv.innerHTML = "";
}

/* ===================== GRAPHIQUE (trac) ===================== */
// Formate un nombre pour les graduations des axes (compact, lisible sur mobile).
function formaterNombreAxe(v) {
  if (v === 0) return "0";
  if (Math.abs(v) >= 1000 || Math.abs(v) < 0.01) return v.toExponential(1);
  return (Math.round(v * 100) / 100).toString();
}

// Memorise le dernier graphique trace (xs, ys, options, canvas) pour que la commande
// grille(...) puisse le redessiner avec la grille activee, comme xgrid() en Scilab.
let dernierGraphique = null;

// Dessine une courbe (xs, ys) dans un <canvas> ajoute a la console.
// options : { couleur, type: "lignes"|"points", titre, xlab, ylab, grille }
// canvasExistant (optionnel) : si fourni, redessine sur ce canvas au lieu d'en creer un
// nouveau (utilise par grille(...) pour mettre a jour le graphique déjà affiche).
function dessinerCourbe(xs, ys, options, canvasExistant) {
  options = options || {};
  let couleur = options.couleur || "#58a6ff";
  let type = (options.type || "lignes").toLowerCase();
  let titre = options.titre || "";
  let xlab = options.xlab || "";
  let ylab = options.ylab || "";
  let grille = !!options.grille;

  let canvas, largeurCSS, hauteurCSS, ratio;

  if (canvasExistant) {
    canvas = canvasExistant;
    largeurCSS = canvas._largeurCSS;
    hauteurCSS = canvas._hauteurCSS;
    ratio = canvas._ratio;
  } else {
    let conteneur = document.createElement("div");
    conteneur.style.margin = "8px 0";
    if (modeConsoleCommande) conteneur.className = "resultatConsole";

    if (titre) {
      let t = document.createElement("div");
      t.textContent = titre;
      t.style.color = "#c9d1d9";
      t.style.fontWeight = "bold";
      t.style.marginBottom = "4px";
      conteneur.appendChild(t);
    }

    largeurCSS = Math.max(200, Math.min((outputDiv.clientWidth || 360) - 24, 420));
    hauteurCSS = Math.round(largeurCSS * 0.65);
    ratio = window.devicePixelRatio || 1;

    canvas = document.createElement("canvas");
    canvas.width = Math.round(largeurCSS * ratio);
    canvas.height = Math.round(hauteurCSS * ratio);
    canvas.style.width = largeurCSS + "px";
    canvas.style.height = hauteurCSS + "px";
    canvas.style.background = "#010409";
    canvas.style.border = "1px solid #30363d";
    canvas.style.borderRadius = "4px";
    canvas.style.display = "block";
    canvas._largeurCSS = largeurCSS;
    canvas._hauteurCSS = hauteurCSS;
    canvas._ratio = ratio;
    conteneur.appendChild(canvas);

    outputDiv.appendChild(conteneur);
    outputDiv.scrollTop = outputDiv.scrollHeight;
  }

  let ctx = canvas.getContext("2d");
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.scale(ratio, ratio);

  let marge = { gauche: 44, droite: 12, haut: 10, bas: 28 };
  let largeurTrace = largeurCSS - marge.gauche - marge.droite;
  let hauteurTrace = hauteurCSS - marge.haut - marge.bas;

  // Points non-finis (division par zero -> Infini, 0/0 -> NaN, etc., comme une asymptote
  // sur x=0 pour y=1/x) : on les ignore pour calculer les bornes du repere (sinon un seul
  // Infini ferait exploser toute l'echelle et rendrait le graphique vide), et on coupera
  // la ligne a cet endroit au moment du trace, comme le font les autres langages de trace
  // (matplotlib, R, Scilab) qui laissent un "trou" au niveau de l'asymptote.
  let xsFinis = [], ysFinis = [];
  for (let i = 0; i < xs.length; i++) {
    if (Number.isFinite(xs[i]) && Number.isFinite(ys[i])) { xsFinis.push(xs[i]); ysFinis.push(ys[i]); }

    }
    ctx.fillText(formaterNombreAxe(x), pxv, hauteurCSS - marge.bas + 12);
  }
  ctx.textAlign = "right";
  for (let i = 0; i <= nGrilleY; i++) {
    let y = ymin + (ymax - ymin) * i / nGrilleY;
    let pyv = py(y);
    if (grille) {
      ctx.strokeStyle = "#21262d"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(marge.gauche, pyv); ctx.lineTo(largeurCSS - marge.droite, pyv); ctx.stroke();
    }
    ctx.fillText(formaterNombreAxe(y), marge.gauche - 4, pyv + 3);
  }
  ctx.textAlign = "left";

  // Axes x=0 / y=0 s'ils sont visibles
  ctx.strokeStyle = "#484f58";
  if (xmin <= 0 && xmax >= 0) { ctx.beginPath(); ctx.moveTo(px(0), marge.haut); ctx.lineTo(px(0), marge.haut + hauteurTrace); ctx.stroke(); }
  if (ymin <= 0 && ymax >= 0) { ctx.beginPath(); ctx.moveTo(marge.gauche, py(0)); ctx.lineTo(largeurCSS - marge.droite, py(0)); ctx.stroke(); }

  // Cadre
  ctx.strokeStyle = "#30363d";
  ctx.strokeRect(marge.gauche, marge.haut, largeurTrace, hauteurTrace);

  // Courbe
  ctx.strokeStyle = couleur;
  ctx.fillStyle = couleur;
  ctx.lineWidth = 2;
  if (type === "points") {
    for (let i = 0; i < xs.length; i++) {

      ctx.fill();
    }

    ctx.beginPath();
    let enCours = false;
    for (let i = 0; i < xs.length; i++) {
      if (!Number.isFinite(xs[i]) || !Number.isFinite(ys[i])) { enCours = false; continue; }
      let X = px(xs[i]), Y = py(ys[i]);
      if (!enCours) { ctx.moveTo(X, Y); enCours = true; } else { ctx.lineTo(X, Y); }
    }
    ctx.stroke();
  }

  // Labels des axes
  ctx.fillStyle = "#8b949e";
  ctx.font = "11px monospace";
  if (xlab) { ctx.textAlign = "right"; ctx.fillText(xlab, largeurCSS - marge.droite, hauteurCSS - 4); ctx.textAlign = "left"; }
  if (ylab) {
    ctx.save();
    ctx.translate(11, marge.haut + 4);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText(ylab, 0, 0);
    ctx.restore();
  }

  dernierGraphique = { canvas: canvas, xs: xs, ys: ys, options: options };
}

/* ===================== DECOUPAGE DES ELEMENTS DE affi(...) ===================== */
// Chaque element est separe par une virgule (hors parentheses / hors texte litteral |...|)
function splitAffiElements(str) {
  let elems = [], i = 0, n = str.length, buffer = "", depth = 0;
  while (i < n) {
    let c = str[i];
    if (c === '|' && depth === 0 && buffer.trim() === "") {
      let k = i + 1, fin = -1;
      while (k < n) {
        if (str[k] === '|') { fin = k; break; }
        k++;
      }
      if (fin === -1) { elems.push(str.slice(i)); i = n; }
      else { elems.push(str.slice(i, fin + 1)); i = fin + 1; }
      buffer = "";
      continue;
    }
    if (c === '(') depth++;
    if (c === ')') depth--;
    if (c === ',' && depth === 0) {
      if (buffer.trim() !== "") elems.push(buffer);
      buffer = "";
      i++;
      continue;
    }
    buffer += c;
    i++;
  }
  if (buffer.trim() !== "") elems.push(buffer);
  return elems.map(s => s.trim());
}

// Decoupe une liste d'arguments separes par des virgules, en ignorant les virgules
// (et les parentheses) qui se trouvent A L'INTERIEUR d'un texte litteral |...|.
// Sans ca, un argument comme |i vaut |  ou  | (special)|  pouvait etre coupe au
// mauvais endroit (a cause d'une virgule ou d'une parenthese presente dans le texte),
// ou simplement mal repere a cause d'espaces autour du '|'.
// Evalue UN argument d'appel deja isole par splitTopLevelComma, en reconnaissant la syntaxe
// d'argument nomme "nomParam~expr" (meme ~ que les affectations) EXACTEMENT comme lireArgument()
// le fait dans le parseur d'expression asynchrone -- necessaire ici car les appels de fonction
// ECRITS SEULS SUR LEUR LIGNE (ex: "t(b~3)", "moi.methode(x~1)", "parent.methode(moi, x~1)")
// ne passent PAS par ce parseur : ils sont detectes par une regex a part (matchAppel/mMethode)
// puis leurs arguments etaient jusqu'ici evalues un par un avec evalExpr() brut, qui ne
// reconnait pas "nomParam~expr" et tentait donc de lire "b" comme une simple variable
// (d'ou "Variable non definie: b" avec fonc t(a~1,*b){...} puis t(b~3) sur sa ligne).
async function evaluerArgumentAppelStmt(argStr, ctxExpr) {
  let m = argStr.match(/^([a-zA-Z_]\w*)\s*~\s*([\s\S]*)$/);
  if (m) {
    return { __argNomme: m[1], valeur: await evalExpr(m[2], ctxExpr) };
  }
  return await evalExpr(argStr, ctxExpr);
}
function splitTopLevelComma(str) {
  let parts = [], depth = 0, buf = "", dansTexte = false;
  for (let ch of str) {
    if (ch === '|') { dansTexte = !dansTexte; buf += ch; continue; }
    if (!dansTexte) {
      if (ch === '(') depth++;
      if (ch === ')') depth--;
      if (ch === ',' && depth === 0) { parts.push(buf); buf = ""; continue; }
    }
    buf += ch;
  }
  parts.push(buf);
  return parts.map(p => p.trim());
}

// Analyse l'en-tete d'une boucle pou, sous l'une des deux syntaxes possibles :
//  - pou(var, debut, fin, pas)  : pas est facultatif (vaut 1 par defaut). var, debut, fin et pas
//    sont separes par des virgules de haut niveau (hors parentheses/texte), via splitTopLevelComma,
//    ce qui permet a debut/fin/pas d'etre des expressions complexes (ex: racine(x), c(1,2)).
//  - pou(var dan objet)  : var prend tour a tour chaque valeur du vecteur objet.
function analyserEnTetePou(token) {
  let interieur = token.slice(4, -1).trim(); // enleve "pou(" et le ")" final
  let parties = splitTopLevelComma(interieur);

  if (parties.length === 1) {
    let mDan = parties[0].match(/^(\w+)\s+dan\s+(.+)$/);
    if (!mDan) throw new Error("Syntaxe: pou(var, debut, fin, pas) ou pou(var dan objet)");
    return { type: 'dan', varNom: mDan[1], objetExpr: mDan[2].trim() };
  }

  if (parties.length === 3 || parties.length === 4) {
    let varNom = parties[0].trim();
    if (!/^\w+$/.test(varNom)) throw new Error("Syntaxe: pou(var, debut, fin, pas) ou pou(var dan objet)");
    let debutExpr = parties[1].trim();
    let finExpr = parties[2].trim();
    if (debutExpr === "" || finExpr === "") throw new Error("Syntaxe: pou(var, debut, fin, pas) ou pou(var dan objet)");
    let parExpr = parties.length === 4 ? parties[3].trim() : null;
    if (parExpr === "") throw new Error("Syntaxe: pou(var, debut, fin, pas) ou pou(var dan objet)");
    return { type: 'plage', varNom, debutExpr, finExpr, parExpr };
  }

  throw new Error("Syntaxe: pou(var, debut, fin, pas) ou pou(var dan objet)");
}

          verifierTexteLitteralFerme(elemTrim);
          parties.push(formatValeur(await evalExpr(elemTrim, ctxExpr)));
        }
      }
      setVar(nom, parties.join(" ").replace(/ {2,}/g, " ").replace(/ *\n */g, "\n"));
      return;
    }
    if (/^\|[\s\S]*\|$/.test(valeur)) {
      setVar(nom, valeur.slice(1, -1));
    } else {
      verifierTexteLitteralFerme(valeur);
      setVar(nom, await evalExpr(valeur, ctxExpr));
    }
    return;
  }

  // Appel de fonction (prioritaire, comme en Python)
  // IMPORTANT : la ligne n'est un appel "seul" QUE si la parenthese fermante qui correspond
  // exactement a la 1ere '(' (en comptant la profondeur, sans compter ce qui est a
  // l'interieur d'un texte litteral |...|) tombe tout en fin de ligne. Un ancien regex
  // "/^nom\((.*)\)$/" etait greedy et capturait jusqu'a la DERNIERE ')' de la ligne, ce qui
  // faisait passer a tort une EXPRESSION comme "entier(2) ^ entier(100)" pour un appel unique
  // "entier(...)" avec pour argument le texte casse "2) ^ entier(100" -- d'ou l'erreur trompeuse
  // "Parenthese fermante manquante" plus loin. Avec un vrai comptage de profondeur, cette ligne
  // ne matche plus ici et retombe correctement sur l'evaluation d'expression generale ci-dessous.
  let matchAppel = null;
  {
    let mIdent = _regexCache(_entreeLigne, 'identAppel', ligne, /^([a-zA-Z_][a-zA-Z0-9_.]*)\(/);
    if (mIdent) {
      let depth = 1, k = mIdent[0].length, dansTexte = false;
      while (k < ligne.length && depth > 0) {
        let c = ligne[k];
        if (c === '|') dansTexte = !dansTexte;
        if (!dansTexte) {
          if (c === '(') depth++;
          if (c === ')') depth--;
        }
        k++;
      }
      if (depth === 0 && k === ligne.length) {
        matchAppel = [ligne, mIdent[1], ligne.slice(mIdent[0].length, k - 1)];
      }
    }
  }
if (matchAppel) {
  let nom = matchAppel[1];
  if (nom === 'lettr' || nom === 'Lettr' || nom === 'pasdefini') {
    throw new Error(nom + " est une constante (comme VRAI/FAUX), pas une fonction : ecris-la sans parentheses, \"" + nom + "\" au lieu de \"" + nom + "()\"");
  }
let nomBase = null;

if (nom.startsWith("base.")) {
    nomBase = nom.substring(5); // enlève "base."
}
if (nomBase !== null) {
    let mRacineBase = nomBase.match(/^racine(\d*)$/);
    if (mRacineBase) {
      let n2 = mRacineBase[1] === "" ? 2 : parseInt(mRacineBase[1], 10);
      let argsStr = matchAppel[2].trim();
      let argExprs = argsStr === "" ? [] : splitTopLevelComma(argsStr);
      if (argExprs.length !== 1) throw new Error(nomRacine(n2) + "(...) attend exactement 1 argument");
      let val = appliquerRacineN(n2, await evalExpr(argExprs[0], ctxExpr));
      if (modeConsoleCommande && val !== undefined) printValeur(formatValeur(val));
      return;
    }
    if (!Object.prototype.hasOwnProperty.call(fonctionsBase, nomBase)) {
        throw new Error("Fonction de base inconnue : " + nomBase);
    }
    let argsStr = matchAppel[2].trim();
    let argExprs = argsStr === "" ? [] : splitTopLevelComma(argsStr);
    let val = await fonctionsBase[nomBase](argExprs, ctxExpr);
    if (modeConsoleCommande && val !== undefined) printValeur(formatValeur(val));
    return;
}
  // Si une fonction utilisateur (ou une classe, pour l'instancier) porte ce nom, ou qu'une
  // VARIABLE de ce nom contient une valeur-fonction (recue en parametre, ou stockee avec
  // f ~ nomFonction), elle masque complètement la commande intégrée.
  let varAppelDirect = chercherVariable(nom);
  let estAppelVariableFonction = varAppelDirect.trouve && estValeurFonction(varAppelDirect.valeur);
  if (Object.prototype.hasOwnProperty.call(fonctions, nom) || Object.prototype.hasOwnProperty.call(classes, nom) || varAppelDirect.trouve) {
    let argsStr = matchAppel[2].trim();
    let argExprs = argsStr === "" ? [] : splitTopLevelComma(argsStr);
    let argsVals = [];
    for (let a of argExprs) argsVals.push(await evaluerArgumentAppelStmt(a.trim(), ctxExpr));
    let val = await appelerFonction(nom, argsVals);
    // Affiche automatiquement le retour d'une fonction perso appelee seule sur sa
    // ligne (ex: "nomfonction(x)"), que ce soit dans la console OU en executant
    // un script (RUN) : plus besoin d'ecrire obligatoirement affi(nomfonction(x)).
    // Si la fonction ne renvoie rien (pasdefini), on ne l'affiche que si un "retour"
    // vide figure EXPLICITEMENT dans son corps (fonctions[nom].aRetourVide, ou le corps
    // de la valeur-fonction si l'appel se fait via une variable) : sinon c'est juste une
    // procedure sans valeur de retour, et on reste silencieux.
    // (L'instanciation d'une classe renvoie toujours une instance, jamais pasdefini.)
    let aRetourVide = Object.prototype.hasOwnProperty.call(fonctions, nom)
      ? fonctions[nom].aRetourVide
      : (estAppelVariableFonction ? estRetourVideDansCorps(varAppelDirect.valeur.corps) : true);
    if (doitAfficherResultatAppel(val, aRetourVide)) printValeur(await formatPourAffichage(val));
    return;
  }

  // Racine n-ieme : racine(), racine2(), racine3(), ... racineN() (masquable par fonc racineN(...) ci-dessus)
  let mRacineAppel = nom.match(/^racine(\d*)$/);
  if (mRacineAppel) {
    let n2 = mRacineAppel[1] === "" ? 2 : parseInt(mRacineAppel[1], 10);
    let argsStr = matchAppel[2].trim();
    let argExprs = argsStr === "" ? [] : splitTopLevelComma(argsStr);
    if (argExprs.length !== 1) throw new Error(nomRacine(n2) + "(...) attend exactement 1 argument");
    let val = appliquerRacineN(n2, await evalExpr(argExprs[0], ctxExpr));
    if (modeConsoleCommande && val !== undefined) printValeur(formatValeur(val));
    return;
  }

  // Sinon seulement, on utilise la commande intégrée affi(...)
  
if (Object.prototype.hasOwnProperty.call(fonctionsBase, nom)) {
    let argsStr = matchAppel[2].trim();
    let argExprs = argsStr === "" ? [] : splitTopLevelComma(argsStr);
    let val = await fonctionsBase[nom](argExprs, ctxExpr);
    if (modeConsoleCommande && val !== undefined) printValeur(formatValeur(val));
    return;
}
}
  // Dans la console : une simple expression (ex: 3+4) est evaluee et son resultat affiche,
  // sans avoir besoin de passer par affi(...)
  // Ces 4 formes ont une erreur SPECIFIQUE plus utile que le message generique qu'evalExpr
  // produirait en les prenant a tort pour une expression (ex: "sinon" seul serait interprete
  // comme un nom de variable et donnerait "Variable non definie: sinon" au lieu du message
  // ci-dessous, qui explique le vrai probleme) -- elles doivent donc etre reconnues AVANT
  // la tentative d'evaluation generale en mode console.
  if (/^sinon\s+si\(/.test(ligne)) {
    throw new Error("sinon si doit suivre directement un bloc si(...){...} ou sinon si(...){...}, sans instruction entre les deux : " + ligne);
  }
  if (/^sinon\b/.test(ligne)) {
    throw new Error("sinon doit suivre directement un bloc si(...){...} ou sinon si(...){...}, sans instruction entre les deux : " + ligne);
  }
  if (/^attrape\b/.test(ligne)) {
    throw new Error("attrape doit suivre directement un bloc essai{...}, sans instruction entre les deux : " + ligne);
  }
  if (/^[a-zA-Z_][a-zA-Z0-9_.]*\(/.test(ligne)) {
    throw new Error("Appel de fonction mal forme (parenthese fermante manquante ou en trop) : " + ligne);
  }

  if (modeConsoleCommande) {
    // Toute autre ligne : on tente de l'evaluer comme une expression (ex: "5/0", "x+1",
    // "maVariable"). Si evalExpr echoue, c'est une VRAIE erreur (division par zero, variable
    // inconnue, type invalide...) qui doit remonter telle quelle -- elle n'est plus avalee au
    // profit d'un "Commande inconnue" trompeur (bug corrige : avant ce correctif, "5/0" tape
    // dans la console affichait a tort "Commande inconnue: 5/0" au lieu de l'erreur de
    // division par zero).
    let val = await evalExpr(ligne, ctxExpr);
    if (val !== undefined) printValeur(formatValeur(val));
    return;
  }

  throw new Error("Commande inconnue: " + ligne);
}

/* ===================== TOKENISEUR (avec numeros de ligne) ===================== */
// Retire les commentaires du code source avant tokenisation : tout ce qui suit ** jusqu'a
// la fin de la ligne est ignore, sauf a l'interieur d'un texte litteral |...| (pour pouvoir
// ecrire des ** a l'interieur d'un texte affiche sans que ce soit traite comme un commentaire).
function retirerCommentaires(code) {
  let resultat = "", i = 0, n = code.length, dansTexte = false;
  while (i < n) {
    let c = code[i];
    if (c === '|') { dansTexte = !dansTexte; resultat += c; i++; continue; }
    if (!dansTexte && c === '*' && code[i + 1] === '*') {
      while (i < n && code[i] !== '\n') i++;
      continue; // le '\n' (s'il existe) sera traite au prochain tour de boucle
    }
    resultat += c;
    i++;
  }
  return resultat;
}

function parser(code) {
  code = retirerCommentaires(code);
  let tokens = [], buffer = "", ligne = 1, ligneDebutBuffer = 1;
  // dansTexte : un ';' A L'INTERIEUR d'un texte litteral |...| ne separe pas des
  // instructions, il fait partie du texte (ex: affi(|un ; deux|) reste UN seul argument).
  let dansTexte = false;
  // profondeur : nombre de ( et [ ouverts (hors texte) dans l'instruction en cours. Tant qu'il
  // en reste un d'ouvert, un saut de ligne ne termine PAS l'instruction : un appel peut donc
  // s'ecrire sur plusieurs lignes, comme en Python --
  //   chaines ~ liste(
  //     liste(|a|, |b|),
  //     liste(|c|, |d|)
  //   )
  // Le saut de ligne (et l'indentation qui le suit) est alors remplace par UN espace : le texte
  // de l'instruction reste sur une seule ligne, comme si elle avait ete ecrite ainsi. Les sauts
  // de ligne A L'INTERIEUR d'un texte |...| sont conserves tels quels. Les numeros de ligne
  // restent exacts (chaque saut de ligne replie compte toujours pour une ligne).
  let profondeur = 0;
  let sauterEspaces = false;
  let ligneFinBuffer = 1;   // ligne du dernier caractere non blanc de l'instruction en cours
  for (let i = 0; i < code.length; i++) {
    let c = code[i];
    if (c === '|') dansTexte = !dansTexte;
    if (!dansTexte && profondeur > 0) {
      if (c === '\r') continue;
      if (c === '\n') {
        ligne++;
        if (buffer !== "" && buffer[buffer.length - 1] !== ' ') buffer += " ";
        sauterEspaces = true;
        continue;
      }
      if (sauterEspaces && (c === ' ' || c === '\t')) continue;
    }
    sauterEspaces = false;
    if (!dansTexte && (c === '{' || c === '}' || c === '\n' || c === ';')) {
      if (buffer.trim() !== "") tokens.push({ texte: buffer.trim(), ligne: ligneDebutBuffer, ligneFin: ligneFinBuffer });
      if (c === '{' || c === '}') tokens.push({ texte: c, ligne: ligne });
      buffer = "";
      profondeur = 0;
      if (c === '\n') ligne++;
      ligneDebutBuffer = ligne;
    } else {
      if (buffer === "") ligneDebutBuffer = ligne;
      buffer += c;
      if (c === '\n') ligne++;   // saut de ligne a l'interieur d'un texte |...| : il compte aussi
      else if (c !== ' ' && c !== '\t' && c !== '\r') ligneFinBuffer = ligne;
      if (!dansTexte) {
        if (c === '(' || c === '[') profondeur++;
        else if ((c === ')' || c === ']') && profondeur > 0) profondeur--;
      }
    }
  }
  if (buffer.trim() !== "") tokens.push({ texte: buffer.trim(), ligne: ligneDebutBuffer, ligneFin: ligneFinBuffer });
  return tokens;
}

function trouverFinBloc(tokens, debut, ligneErreur) {
  let niveau = 1, i = debut;
  while (niveau > 0 && i < tokens.length) {
    if (tokens[i].texte === "{") niveau++;
    if (tokens[i].texte === "}") niveau--;
    i++;
  }
  if (niveau !== 0) throw new ErreurLangage("Accolade fermante manquante", ligneErreur);
  return i;
}

/* ===================== VERIFICATION DE SYNTAXE AVANT EXECUTION ===================== */
// Comme Python, qui compile tout le fichier AVANT d'executer la moindre ligne : cette etape relit
// TOUT le script (structure des blocs, forme de chaque en-tete, syntaxe de chaque expression) avant
// que la premiere instruction ne s'execute -- et meme avant le pre-enregistrement des fonctions,
// classes et imports (qui charge et execute des modules). Sans elle, une faute de syntaxe a la
// ligne 50 n'etait decouverte qu'apres avoir deja execute les lignes 1 a 49 (envoi de SMS,
// ecriture ou suppression de fichier, notification...), avec des effets deja irreversibles.
// Regle d'or : ne JAMAIS rejeter un programme valide. Chaque controle ci-dessous reprend donc
// exactement les formes que l'execution reconnait deja (memes regex d'en-tete, meme grammaire
// d'expression que l'evaluateur) ; ce qui est verifie ici ne sert qu'a detecter ce qui ferait
// de toute facon echouer le script, mais AVANT qu'il ait pu faire quoi que ce soit.
// Ce qui n'est PAS verifie ici (donc toujours detecte a l'execution, comme en Python) : les noms
// (variable/fonction inconnue), les types, le nombre d'arguments, les fichiers, etc.

// Regroupe toutes les erreurs de syntaxe trouvees (chacune avec son numero de ligne).
class ErreurSyntaxeProgramme extends ErreurLangage {
  constructor(erreurs) {
    super(erreurs[0].message, erreurs[0].ligne);
    this.erreurs = erreurs;   // [{ ligne, message }, ...]
  }
}

// Raccourcit un morceau de code affiche dans un message d'erreur (une parenthese oubliee fait
// avaler tout le reste du fichier dans une seule instruction : inutile de tout recopier).
function _court(t, max) {
  max = max || 70;
  t = String(t);
  return t.length > max ? t.slice(0, max - 3) + "..." : t;
}

function _decrireJetonExpr(t) {
  if (!t) return "fin de l'expression";
  switch (t.type) {
    case 'num': return String(t.v);
    case 'str': return "|" + t.v + "|";
    case 'ident': return t.v;
    case 'op': case 'cmp': return t.v;
    case 'and': return "et";
    case 'or': return "ou";
    case 'not': return "non";
    case 'dan': return "dan";
    case 'tilde': return "~";
    case 'deuxpoints': return ":";
    default: return t.type;   // ( ) , [ ]
  }
}

// Verifie la syntaxe d'UNE expression (sans rien evaluer) : leve une Error decrivant le probleme,
// ne renvoie rien si elle est bien formee. Meme grammaire (memes niveaux de precedence, memes
// suffixes .attr / .methode(...) / [indice], meme fonction anonyme fonc(params) corps, memes
// arguments nommes nom~valeur) que l'evaluateur d'expressions -- voir evalExprSansEntreeAsync.
function verifierSyntaxeExpression(str) {
  const s = (str === undefined || str === null) ? "" : String(str).trim();
  if (s === "") throw new Error("expression vide");
  const sa = _court(s);
  let tokens;
  try {
    tokens = tokenizerExpr(s);
  } catch (e) {
    let msg = _court(e.message, 220);
    if (msg.indexOf("Caractere inattendu '='") === 0) msg += " -- pour comparer utilise ==, pour affecter utilise ~";
    throw new Error(msg);
  }
  let pos = 0;
  const peek = () => tokens[pos];
  const est = (type, v) => { const t = tokens[pos]; return !!t && t.type === type && (v === undefined || t.v === v); };
  const inattendu = () => {
    const t = tokens[pos];
    if (!t) return new Error("expression incomplete (il manque quelque chose a la fin de \"" + sa + "\")");
    if (t.type === ')') return new Error("parenthese fermante ) en trop ou mal placee dans \"" + sa + "\"");
    if (t.type === ']') return new Error("crochet fermant ] en trop ou mal place dans \"" + sa + "\"");
    return new Error("\"" + _decrireJetonExpr(t) + "\" inattendu dans \"" + sa + "\"");
  };
  const attendre = (type, msgFin) => {
    if (est(type)) { pos++; return; }
    if (!peek()) throw new Error(msgFin + " dans \"" + sa + "\"");
    throw inattendu();
  };
  const OPS_MUL = ['*', '/', '%', 'enti', '.', '..', '×'];
  function or_() { and_(); while (est('or')) { pos++; and_(); } }
  function and_() { not_(); while (est('and')) { pos++; not_(); } }
  function not_() { if (est('not')) { pos++; not_(); return; } dan_(); }
  function dan_() { cmp_(); while (est('dan')) { pos++; cmp_(); } }
  function cmp_() { add_(); if (est('cmp')) { pos++; add_(); } }
  function add_() { mul_(); while (est('op', '+') || est('op', '-')) { pos++; mul_(); } }
  function mul_() { colon_(); while (peek() && peek().type === 'op' && OPS_MUL.indexOf(peek().v) !== -1) { pos++; colon_(); } }
  function colon_() { unary_(); if (est('deuxpoints')) { pos++; unary_(); } }
  function unary_() { if (est('op', '-')) { pos++; unary_(); return; } pow_(); }
  function pow_() { primaire_(); if (est('op', '^')) { pos++; unary_(); } }
  function indice_() {   // '[' deja reconnu, non consomme
    pos++;
    if (!(est(',') || est(']'))) or_();
    if (est(',')) { pos++; if (!est(']')) or_(); }
    attendre(']', "crochet fermant ] manquant");
  }
  function arg_() {      // un argument d'appel : nom~valeur (argument nomme) ou expression
    if (est(')') || est(',')) throw new Error("argument vide (virgule en trop ?) dans \"" + sa + "\"");
    if (est('ident') && tokens[pos + 1] && tokens[pos + 1].type === 'tilde') { pos += 2; }
    or_();
  }
  function args_() {     // '(' deja consomme
    if (!est(')')) { arg_(); while (est(',')) { pos++; arg_(); } }
    attendre(')', "parenthese fermante ) manquante");
  }
  // Apres un ".", un mot reserve (et, ou, non, dan, mod, enti) est un simple nom : le tokeniseur
  // le decoupe en operateur, mais a l'execution un appel comme est.enti(...) est reconnu comme
  // nom de fonction native AVANT toute tokenisation (voir _analyserSegmentsExpression).
  const nomApresPoint = (t) => !!t && (t.type === 'ident' || t.type === 'and' || t.type === 'or' || t.type === 'not' || t.type === 'dan' || (t.type === 'op' && (t.v === 'enti' || t.v === '%')));
  function suffixes_() {
    while (true) {
      if (est('op', '.') && nomApresPoint(tokens[pos + 1])) {
        pos += 2;
        if (est('(')) { pos++; args_(); }
        continue;
      }
      if (est('[')) { indice_(); continue; }
      break;
    }
  }
  function primaire_() {
    const t = peek();
    if (!t) throw inattendu();
    if (t.type === 'num' || t.type === 'str') { pos++; suffixes_(); return; }
    if (t.type === '(') { pos++; or_(); attendre(')', "parenthese fermante ) manquante"); suffixes_(); return; }
    if (t.type === 'ident') {
      pos++;
      if (t.v === 'fonc' && est('(')) {
        // fonction anonyme : fonc(param, param2~defaut...) corps
        pos++;
        if (!est(')')) {
          while (true) {
            if (!est('ident')) throw new Error("parametre invalide dans fonc(...) : un nom de parametre est attendu (dans \"" + sa + "\")");
            pos++;
            if (est('tilde')) { pos++; or_(); }
            if (est(',')) { pos++; continue; }
            break;
          }
        }
        attendre(')', "parenthese fermante ) manquante pour les parametres de fonc(...)");
        if (!peek() || est(')') || est(',') || est(']')) throw new Error("fonc(...) attend une expression apres les parametres, ecris par exemple fonc(x) x*2 (dans \"" + sa + "\")");
        or_();
        return;
      }
      if (est('(')) { pos++; args_(); }
      suffixes_();
      return;
    }
    throw inattendu();
  }
  or_();
  if (pos < tokens.length) throw inattendu();
}

// Renvoie le numero de ligne (dans le source) du | qui ouvre un texte litteral jamais ferme, ou 0
// si tous les textes sont fermes. Un seul | oublie avale sinon tout le reste du fichier dans un
// unique "texte" : accolades, lignes et instructions comprises.
function _trouverTexteNonFerme(code) {
  const c = retirerCommentaires(code);
  let dansTexte = false, ligne = 1, ligneOuverture = 0;
  for (let k = 0; k < c.length; k++) {
    const ch = c[k];
    if (ch === '\n') { ligne++; continue; }
    if (ch === '|') { dansTexte = !dansTexte; if (dansTexte) ligneOuverture = ligne; }
  }
  return dansTexte ? ligneOuverture : 0;
}

// Coupe sur les virgules de haut niveau (hors texte |...|, hors (...) et hors [...]).
function _splitVirgulesHautNiveau(str) {
  const parts = [];
  let buf = "", prof = 0, dansTexte = false;
  for (let k = 0; k < str.length; k++) {
    const c = str[k];
    if (c === '|') { dansTexte = !dansTexte; buf += c; continue; }
    if (!dansTexte) {
      if (c === '(' || c === '[') prof++;
      else if (c === ')' || c === ']') prof--;
      else if (c === ',' && prof === 0) { parts.push(buf); buf = ""; continue; }
    }
    buf += c;
  }
  parts.push(buf);
  return parts.map(p => p.trim());
}

// Position du premier ~ de haut niveau (hors texte, hors parentheses/crochets), ou -1.
function _indexTildeHautNiveau(t) {
  let dansTexte = false, prof = 0;
  for (let k = 0; k < t.length; k++) {
    const c = t[k];
    if (c === '|') { dansTexte = !dansTexte; continue; }
    if (dansTexte) continue;
    if (c === '(' || c === '[') prof++;
    else if (c === ')' || c === ']') prof--;
    else if (c === '~' && prof === 0) return k;
  }
  return -1;
}

// Verifie une suite de valeurs separees par des virgules (droite d'un ~, retour a, b...) comme
// le fait l'execution : chaque element est soit saulig, soit un texte |...|, soit une expression.
// Renvoie le message d'erreur, ou null si tout est bien forme.
function _verifierListeValeurs(str) {
  for (const p of _splitVirgulesHautNiveau(str)) {
    const s = p.trim();
    if (s === "saulig") continue;
    if (/^\|[\s\S]*\|$/.test(s)) continue;
    try { verifierSyntaxeExpression(s); } catch (e) { return e.message; }
  }
  return null;
}

const _RE_ATTRAPE = /^attrape(?:\(\s*([a-zA-Z_][a-zA-Z0-9_]*)\s*(?:,\s*([a-zA-Z_][a-zA-Z0-9_]*)\s*)?\))?$/;

// Verifie tout le programme sans rien executer. "code" est le source brut, "tokens" le resultat
// de parser(code). Renvoie la liste des erreurs [{ ligne, message }] (vide si la syntaxe est bonne).
function verifierSyntaxeProgramme(code, tokens) {
  const erreurs = [];
  let tokCourant = null;   // instruction en cours d'analyse (pour l'indice "parenthese restee ouverte")
  const err = (ligne, message) => { erreurs.push({ ligne: ligne, message: message, tok: tokCourant }); };

  // 1) Texte litteral |...| non ferme : tout ce qui suit serait avale, inutile d'aller plus loin.
  const ligneTexteOuvert = _trouverTexteNonFerme(code);
  if (ligneTexteOuvert) {
    err(ligneTexteOuvert, "Texte litteral non ferme : il manque le | de fermeture");
    delete erreurs[0].tok;
    return erreurs;
  }

  const pile = [{ kind: 'racine', nom: 'programme', ligne: 0 }];
  const fermes = [];      // fermes[i] = genre du bloc que le '}' d'index i vient de fermer
  let arret = false;      // erreur de structure (accolades) : la suite n'est plus fiable
  const fatal = (ligne, message) => { err(ligne, message); arret = true; };
  const testExpr = (str, ligne, contexte) => {
    try { verifierSyntaxeExpression(str); }
    catch (e) { err(ligne, (contexte ? contexte + " : " : "") + e.message); }
  };
  const dansFonction = () => pile.some(b => b.kind === 'fonc');
  const dansBoucle = () => {
    for (let k = pile.length - 1; k >= 0; k--) {
      const kd = pile[k].kind;
      if (kd === 'pou' || kd === 'tanqer') return true;
      if (kd === 'fonc' || kd === 'classe' || kd === 'racine') return false;
    }
    return false;
  };
  // Le jeton suivant un en-tete doit etre "{". dejaErreur : une erreur a deja ete signalee sur
  // cet en-tete (inutile d'en ajouter une seconde pour la meme ligne).
  const ouvrirBloc = (kind, nom, i, ligne, dejaErreur) => {
    if (!tokens[i + 1] || tokens[i + 1].texte !== '{') {
      if (!dejaErreur) fatal(ligne, "Manque { apres " + nom);
      return i + 1;
    }
    pile.push({ kind: kind, nom: nom, ligne: ligne });
    return i + 2;
  };
  const apresSiOuSinonSi = (i) => { const p = i > 0 ? fermes[i - 1] : undefined; return p === 'si' || p === 'sinonsi'; };

  let i = 0;
  while (i < tokens.length && !arret) {
    const tok = tokens[i], t = tok.texte, l = tok.ligne;
    tokCourant = tok;
    const parent = pile[pile.length - 1];
    const nbAvant = erreurs.length;
    let m;

    if (t === '{') {
      fatal(l, "Accolade { inattendue : elle doit suivre une instruction de bloc (si, sinon, pou, tanqer, fonc, classe, essai, attrape)");
      break;
    }
    if (t === '}') {
      if (pile.length === 1) { fatal(l, "Accolade } en trop : aucun bloc n'est ouvert a cet endroit"); break; }
      const bloc = pile.pop();
      fermes[i] = bloc.kind;
      if (bloc.kind === 'essai') {
        const suivant = tokens[i + 1];
        if (!suivant || !_RE_ATTRAPE.test(suivant.texte)) {
          err(bloc.ligne, "essai{...} doit etre suivi directement de attrape{...}, attrape(msg){...} ou attrape(msg, code){...}, sans instruction entre les deux");
        }
      }
      i++;
      continue;
    }

    // ---- en-tetes de bloc (memes formes que executerTokens) ----
    if (t.startsWith('fonc ')) {
      m = t.match(/^fonc\s+(\w+)\((.*)\)$/);
      if (!m) {
        err(l, "Declaration de fonction mal formee : " + _court(t) + " (forme attendue : fonc nom(parametres){ ... })");
        i = (tokens[i + 1] && tokens[i + 1].texte === '{') ? ouvrirBloc('fonc', t, i, l, true) : i + 1;
        continue;
      }
      try {
        const params = analyserListeParametres(m[2], "fonc " + m[1] + "(...)", l);
        for (const p of params) if (p.defautExpr !== null) testExpr(p.defautExpr, l, "valeur par defaut du parametre " + p.nom);
      } catch (e) { err(l, e.message); }
      i = ouvrirBloc('fonc', "fonc " + m[1] + "(...)", i, l, erreurs.length > nbAvant);
      continue;
    }
    if (t.startsWith('classe ')) {
      m = t.match(/^classe\s+(\w+)(?:\s+herite\s+(\w+))?$/);
      if (!m) {
        err(l, "Declaration de classe mal formee : " + _court(t) + " (forme attendue : classe Nom { ... } ou classe Nom herite Parent { ... })");
        i = (tokens[i + 1] && tokens[i + 1].texte === '{') ? ouvrirBloc('classe', t, i, l, true) : i + 1;
        continue;
      }
      i = ouvrirBloc('classe', "classe " + m[1], i, l, false);
      continue;
    }
    if (t.startsWith('si(') && t.endsWith(')')) {
      testExpr(t.slice(3, -1), l, "condition de si(...)");
      i = ouvrirBloc('si', "si(...)", i, l, erreurs.length > nbAvant);
      continue;
    }
    m = t.match(/^sinon\s+si\((.*)\)$/);
    if (m) {
      if (!apresSiOuSinonSi(i)) err(l, "sinon si doit suivre directement un bloc si(...){...} ou sinon si(...){...}, sans instruction entre les deux");
      testExpr(m[1], l, "condition de sinon si(...)");
      i = ouvrirBloc('sinonsi', "sinon si(...)", i, l, erreurs.length > nbAvant);
      continue;
    }
    if (t === 'sinon') {
      if (!apresSiOuSinonSi(i)) err(l, "sinon doit suivre directement un bloc si(...){...} ou sinon si(...){...}, sans instruction entre les deux");
      i = ouvrirBloc('sinon', "sinon", i, l, erreurs.length > nbAvant);
      continue;
    }
    if (t === 'essai') {
      i = ouvrirBloc('essai', "essai", i, l, false);
      continue;
    }
    if (_RE_ATTRAPE.test(t)) {
      if (!(i > 0 && fermes[i - 1] === 'essai')) err(l, "attrape doit suivre directement un bloc essai{...}, sans instruction entre les deux");
      i = ouvrirBloc('attrape', "attrape", i, l, erreurs.length > nbAvant);
      continue;
    }
    if (t.startsWith('pou(') && t.endsWith(')')) {
      try {
        const e = analyserEnTetePou(t);
        if (e.type === 'dan') {
          testExpr(e.objetExpr, l, "objet de pou(... dan ...)");
        } else {
          testExpr(e.debutExpr, l, "debut de pou(...)");
          testExpr(e.finExpr, l, "fin de pou(...)");
          if (e.parExpr !== null) testExpr(e.parExpr, l, "pas de pou(...)");
        }
      } catch (e) { err(l, e.message); }
      i = ouvrirBloc('pou', "pou(...)", i, l, erreurs.length > nbAvant);
      continue;
    }
    const tanqerInfini = /^tanqer\s+(VRAI|V)$/.test(t);
    if (tanqerInfini || (t.startsWith('tanqer(') && t.endsWith(')'))) {
      if (!tanqerInfini) testExpr(t.slice(7, -1), l, "condition de tanqer(...)");
      i = ouvrirBloc('tanqer', "tanqer", i, l, erreurs.length > nbAvant);
      continue;
    }

    // ---- instructions de controle ----
    if (t === 'stop' || t === 'continu') {
      if (!dansBoucle()) err(l, t + " n'est utilisable qu'a l'interieur d'une boucle (pou ou tanqer)");
      i++;
      continue;
    }
    if (t === 'retour' || /^retour[\s(]/.test(t)) {
      if (!dansFonction()) err(l, "retour n'est utilisable qu'a l'interieur d'une fonction (fonc)");
      const reste = t.slice(6).trim();
      if (reste !== "") {
        let msg = _verifierListeValeurs(reste);
        // retour(x*x) : l'execution retire les parentheses englobantes avant d'evaluer
        if (msg !== null && /^\(.*\)$/.test(reste) && _verifierListeValeurs(reste.slice(1, -1).trim()) === null) msg = null;
        if (msg !== null) err(l, "valeur de retour : " + msg);
      }
      i++;
      continue;
    }

    // ---- une ligne suivie de { qui n'est aucun des en-tetes ci-dessus : en-tete mal forme ----
    if (tokens[i + 1] && tokens[i + 1].texte === '{') {
      err(l, "Instruction de bloc inconnue ou mal formee avant { : \"" + _court(t) + "\" (attendu : si(condition), sinon si(condition), sinon, pou(...), tanqer(condition), tanqer VRAI, fonc nom(...), classe Nom, essai ou attrape)");
      pile.push({ kind: 'inconnu', nom: t, ligne: l });
      i += 2;
      continue;
    }

    // ---- instruction simple ----
    verifierInstructionSimple(t, l, err, testExpr, parent.kind === 'classe');
    i++;
  }

  tokCourant = null;
  if (!arret) {
    for (let k = pile.length - 1; k >= 1; k--) {
      err(pile[k].ligne, "Accolade fermante } manquante : le bloc " + pile[k].nom + " ouvert ici n'est jamais ferme");
    }
  }
  // Une instruction qui s'etend sur plusieurs lignes (appel ouvert avec "(" ou "[" et pas encore
  // refermé) : si elle est en erreur, la cause la plus probable est une parenthese oubliee.
  for (const e of erreurs) {
    if (e.tok && e.tok.ligneFin > e.tok.ligne) {
      e.message += " -- cette instruction s'etend de la ligne " + e.tok.ligne + " a la ligne " + e.tok.ligneFin + " : verifie qu'une parenthese ( ou un crochet [ n'est pas reste ouvert";
    }
    delete e.tok;
  }
  return erreurs;
}

// Enveloppe de securite utilisee aux points d'appel : si le verificateur lui-meme plantait (bug
// interne, cas imprevu), on laisse le script s'executer normalement plutot que de le bloquer.
function verifierSyntaxeSansRisque(code, tokens) {
  try { return verifierSyntaxeProgramme(code, tokens); }
  catch (e) { return []; }
}

// Verifie une instruction simple (une ligne qui n'est ni un en-tete ni stop/continu/retour).
// Reconnait, comme executerCommandeSimple, les seules formes qui peuvent s'executer :
// import, affectation (nom ~ ..., a.b ~ ..., v[i] ~ ...), appel de fonction/methode.
// Toute autre ligne ferait echouer l'execution avec "Commande inconnue".
function verifierInstructionSimple(t, l, err, testExpr, dansClasse) {
  if (t === "") return;

  // aide(...) lit ses arguments TELS QUELS (aide(+), aide(dan), aide(..), aide(spec)...) sans les
  // evaluer comme une expression : ils ne suivent donc pas la grammaire des expressions.
  if (/^aide\(.*\)$/.test(t)) return;

  // import(...) / de X import(...) : verifies ici par le meme analyseur que le pre-enregistrement
  if (/^import\(/.test(t) || /^de\s+\S/.test(t)) {
    let desc = null;
    try { desc = analyserLigneImport(t); }
    catch (e) { err(l, e.message); return; }
    if (desc) return;
    if (/^import\(/.test(t)) { err(l, "import(...) mal forme : " + _court(t)); return; }
    // sinon : "de" est ici un simple nom de variable (ex: de ~ 5), on continue normalement
  }

  const idx = _indexTildeHautNiveau(t);
  if (idx !== -1) {
    const gauche = t.slice(0, idx).trim();
    const droite = t.slice(idx + 1).trim();
    if (!/^[a-zA-Z_]\w*(?:\.[a-zA-Z_]\w*)*(?:\s*\[.*\])?$/.test(gauche)) {
      err(l, "A gauche de ~ il faut un nom de variable (x ~ 5), un attribut (a.nom ~ 5) ou un indice (v[1] ~ 5) : \"" + gauche + "\"");
    } else if (gauche.indexOf('[') !== -1) {
      testExpr(gauche, l, "partie gauche de ~");
    }
    if (droite === "") err(l, "Valeur manquante apres ~ : " + _court(t));
    else {
      const msg = _verifierListeValeurs(droite);
      if (msg !== null) err(l, "valeur affectee : " + msg);
    }
    return;
  }

  // Dans le corps d'une classe, seuls les attributs (nom ~ valeur, ci-dessus) et les methodes
  // sont lus : toute autre ligne y est ignoree par l'execution, on n'a donc rien a en dire.
  if (dansClasse) return;

  // Appel de fonction ou de methode : nom(...), a.methode(...), base.nom(...) ...
  if (/^[a-zA-Z_][a-zA-Z0-9_.]*\(/.test(t)) {
    testExpr(t, l, null);
    return;
  }

  let hint = "";
  const sansTextes = t.replace(/\|[^|]*\|/g, "||");
  if (/(^|[^=!<>])=([^=]|$)/.test(sansTextes)) hint = " -- pour affecter une valeur utilise ~ (ex: x ~ 5), pas =";
  err(l, "Commande inconnue : " + _court(t) + hint);
}

/* ===================== EXECUTION ===================== */
// Retourne { index, signal } ; signal = {type:'retour', valeur} si un "retour(...)" a ete rencontre
async function executerTokens(tokens, debut = 0, fin = tokens.length) {
  let index = debut;
  while (index < fin) {
    await respirer();
    let tokObj = tokens[index];
    let token = tokObj.texte;
    let ligneActuelle = tokObj.ligne;
    ligneExpressionCourante = ligneActuelle;

    if (token === "}") return { index: index + 1, signal: null };
    if (token === "{") { index++; continue; }

    try {
      if (token.startsWith('fonc ')) {
        // Fonction IMBRIQUEE (declaree a l'interieur d'un si/pou/tanqer/essai/autre fonc) :
        // preRegistrerFonctions() ne la voit jamais au demarrage, car des qu'elle rencontre
        // "fonc r(x){...}" au niveau superieur elle saute d'un bloc tout le CORPS de r pour
        // continuer son scan -- elle ne descend donc jamais dans un fonc imbrique a
        // l'interieur. Avant ce correctif, on arrivait ici en supposant a tort que la
        // fonction etait deja enregistree, et on se contentait de sauter le bloc : la
        // fonction n'existait donc nulle part, et l'appel qui suivait echouait avec
        // "Fonction inconnue". On l'enregistre donc ici, au moment reel ou l'execution
        // atteint cette ligne (elle devient alors utilisable, comme une fonction globale
        // normale, y compris apres ce point dans le script).
        let mFoncImbrique = token.match(/^fonc\s+(\w+)\((.*)\)$/);
        if (!mFoncImbrique) throw new ErreurLangage("Declaration de fonction mal formee : " + token, ligneActuelle);
        let nomFoncImbrique = mFoncImbrique[1];
        let paramsFoncImbrique = analyserListeParametres(mFoncImbrique[2], "fonc " + nomFoncImbrique + "(...)", ligneActuelle);
        if (!tokens[index+1] || tokens[index+1].texte !== "{") throw new ErreurLangage("Manque { apres la definition de fonction " + nomFoncImbrique, ligneActuelle);
        let finBloc = trouverFinBloc(tokens, index + 2, ligneActuelle);
        let corpsFoncImbrique = tokens.slice(index + 2, finBloc - 1);
        fonctions[nomFoncImbrique] = { params: paramsFoncImbrique, corps: corpsFoncImbrique, aRetourVide: estRetourVideDansCorps(corpsFoncImbrique) };
        index = finBloc;
        continue;
      }

      if (token.startsWith('classe ')) {
        // deja pre-enregistree (voir preRegistrerClasses) : on saute simplement le bloc
        let finBloc = trouverFinBloc(tokens, index + 2, ligneActuelle);
        index = finBloc;
        continue;
      }

      if (token.startsWith('si(') && token.endsWith(')')) {
        let condition = token.slice(3, -1);
        if (!tokens[index+1] || tokens[index+1].texte !== "{") throw new Error("Manque { apres si");
        let finBloc = trouverFinBloc(tokens, index + 2, ligneActuelle);
        let dejaExecute = false;

        if (estVrai(await evalExpr(condition, ctxExpr))) {
          let res = await executerTokens(tokens, index + 2, finBloc - 1);
          if (res.signal) return res;
          dejaExecute = true;
        }

        // Enchaine sur d'eventuels "sinon si(...)" (comme "else if" en R), puis un
        // eventuel "sinon{...}" final. Un seul bloc au total est execute.
        // (sision(...) est une fonction a part, pas une structure de bloc : voir plus bas.)
        let curseur = finBloc;
        while (tokens[curseur]) {
          let texteSuivant = tokens[curseur].texte;
          let mSinonSi = texteSuivant.match(/^sinon\s+si\((.*)\)$/);
          if (mSinonSi) {
            if (!tokens[curseur+1] || tokens[curseur+1].texte !== "{") throw new Error("Manque { apres sinon si");
            let finBlocSi = trouverFinBloc(tokens, curseur + 2, ligneActuelle);
            if (!dejaExecute && estVrai(await evalExpr(mSinonSi[1], ctxExpr))) {
              let res = await executerTokens(tokens, curseur + 2, finBlocSi - 1);
              if (res.signal) return res;
              dejaExecute = true;
            }
            curseur = finBlocSi;
            continue;
          }
          if (texteSuivant === "sinon") {
            if (!tokens[curseur+1] || tokens[curseur+1].texte !== "{") throw new Error("Manque { apres sinon");
            let finBlocSinon = trouverFinBloc(tokens, curseur + 2, ligneActuelle);
            if (!dejaExecute) {
              let res = await executerTokens(tokens, curseur + 2, finBlocSinon - 1);
              if (res.signal) return res;
            }
            curseur = finBlocSinon;
          }
          break;
        }
        index = curseur;
        continue;
      }

      // essai{...} attrape(msg, code){...} : intercepte une erreur levee dans le bloc essai (ex:
      // ecrire.fichier(...) avec ecra~FAUX sur un fichier existant) sans planter tout le
      // script. Comme sinon apres si, attrape doit suivre IMMEDIATEMENT le "}" de essai (pas
      // d'instruction entre les deux). "attrape(msg){...}" recupere le message d'erreur (texte)
      // dans la variable msg ; "attrape(msg, code){...}" recupere en plus un code d'erreur court
      // (ex: "DIVISION_ZERO") dans la variable code, quand l'erreur levee est une instance
      // d'ErreurLangage (voir la hierarchie de classes plus haut) -- sinon (erreur JS/syntaxe non
      // migree) code vaut "SYNTAXE" par defaut. "attrape{...}" (sans parametre) ignore le message
      // et le code. Le bloc attrape n'est execute QUE si une erreur a ete levee ; sinon il est
      // simplement saute. ExecutionInterrompue (retour force a l'editeur pendant l'execution)
      // n'est JAMAIS interceptee ici : elle doit toujours remonter jusqu'en haut, essai/attrape
      // ne doit pas pouvoir empecher l'utilisateur d'arreter un script.
      if (token === 'essai') {
        if (!tokens[index+1] || tokens[index+1].texte !== "{") throw new Error("Manque { apres essai");
        let finBlocEssai = trouverFinBloc(tokens, index + 2, ligneActuelle);

        let curseurAttrape = finBlocEssai;
        let tokAttrape = tokens[curseurAttrape];
        let mAttrape = tokAttrape ? tokAttrape.texte.match(/^attrape(?:\(\s*([a-zA-Z_][a-zA-Z0-9_]*)\s*(?:,\s*([a-zA-Z_][a-zA-Z0-9_]*)\s*)?\))?$/) : null;
        if (!mAttrape) throw new Error("essai{...} doit etre suivi directement de attrape{...}, attrape(msg){...} ou attrape(msg, code){...}, sans instruction entre les deux");
        if (!tokens[curseurAttrape+1] || tokens[curseurAttrape+1].texte !== "{") throw new Error("Manque { apres attrape");
        let finBlocAttrape = trouverFinBloc(tokens, curseurAttrape + 2, ligneActuelle);
        let nomVarErreur = null;
        let nomVarCode = null;
        if (mAttrape[2]) {
          nomVarErreur = mAttrape[1];
          nomVarCode = mAttrape[2];
        } else if (mAttrape[1] === "code") {
          nomVarCode = "code";
        } else {
          nomVarErreur = mAttrape[1] || null;
        }

        let messageErreur = null, codeErreur = null, resEssai = null;
        try {
          resEssai = await executerTokens(tokens, index + 2, finBlocEssai - 1);
        } catch (e) {
          if (e instanceof ExecutionInterrompue) throw e;
          messageErreur = e.message;
          // e.code peut venir soit d'une ErreurCode levee directement, soit d'une ErreurLangage
          // qui l'a recopie en remontant la pile (voir le catch de executerTokens plus haut) --
          // dans les deux cas, e.code est la source de verite ici, pas la classe exacte de e.
          codeErreur = e.code || "SYNTAXE";
        }

        if (messageErreur === null) {
          // Pas d'erreur : le bloc attrape est saute integralement.
          if (resEssai && resEssai.signal) return resEssai;
          index = finBlocAttrape;
          continue;
        }

        if (nomVarErreur) setVar(nomVarErreur, messageErreur);
        if (nomVarCode) setVar(nomVarCode, codeErreur);
        let resAttrape = await executerTokens(tokens, curseurAttrape + 2, finBlocAttrape - 1);
        if (resAttrape.signal) return resAttrape;
        index = finBlocAttrape;
        continue;
      }

      if (token === 'stop') {
        return { index: index + 1, signal: { type: 'stop' } };
      }

      if (token === 'continu') {
        return { index: index + 1, signal: { type: 'continu' } };
      }

      if (token.startsWith('pou(') && token.endsWith(')')) {
        let entete = analyserEnTetePou(token);
        if (!tokens[index+1] || tokens[index+1].texte !== "{") throw new Error("Manque { apres pou");
        let finBloc = trouverFinBloc(tokens, index + 2, ligneActuelle);

        if (entete.type === 'dan') {
          let objetVal = await evalExpr(entete.objetExpr, ctxExpr);
          let iterable;
          if (estVecteur(objetVal)) iterable = objetVal;
          else if (estListe(objetVal)) iterable = objetVal.elements;
          else throw new ErreurTypeInvalide("pou(var dan objet) : objet doit etre un vecteur ou une liste");
          for (let val of iterable) {
            await respirer();
            setVar(entete.varNom, val);
            let res = await executerTokens(tokens, index + 2, finBloc - 1);
            if (res.signal) {
              if (res.signal.type === 'stop') break;
              if (res.signal.type === 'continu') continue;
              return res;
            }
          }
        } else {
          let debutVal = await evalExpr(entete.debutExpr, ctxExpr);
          let finVal = await evalExpr(entete.finExpr, ctxExpr);
          let pasVal = entete.parExpr === null ? 1 : await evalExpr(entete.parExpr, ctxExpr);
          if (typeof pasVal !== 'number' || isNaN(pasVal)) throw new ErreurTypeInvalide("pou(...) : le pas doit etre un nombre");
          if (pasVal === 0) throw new Error("pou(...) : le pas ne peut pas valoir 0 (boucle infinie)");
          for (let val = debutVal; (pasVal > 0 ? val <= finVal : val >= finVal); val += pasVal) {
            await respirer();
            setVar(entete.varNom, val);
            let res = await executerTokens(tokens, index + 2, finBloc - 1);
            if (res.signal) {
              if (res.signal.type === 'stop') break;
              if (res.signal.type === 'continu') continue;
              return res;
            }
          }
        }
        index = finBloc;
        continue;
      }

      // tanqer(condition){...} classique, ou tanqer VRAI{...} / tanqer V{...} sans parentheses
      // (raccourci pour une boucle infinie, comme "while True" en Python), sans avoir besoin
      // d'ecrire une condition bidon toujours vraie (ex: tanqer(i==1){...}).
      let mTanqerBoucleInfinie = /^tanqer\s+(VRAI|V)$/.test(token);
      if ((token.startsWith('tanqer(') && token.endsWith(')')) || mTanqerBoucleInfinie) {
        let condition = mTanqerBoucleInfinie ? null : token.slice(7, -1);
        if (!tokens[index+1] || tokens[index+1].texte !== "{") throw new Error("Manque { apres tanqer");
        let finBloc = trouverFinBloc(tokens, index + 2, ligneActuelle);
        while (mTanqerBoucleInfinie || estVrai(await evalExpr(condition, ctxExpr))) {
          await respirer();
          let res = await executerTokens(tokens, index + 2, finBloc - 1);
          if (res.signal) {
            if (res.signal.type === 'stop') break;
            if (res.signal.type === 'continu') continue;
            return res;
          }
        }
        index = finBloc;
        continue;
      }

      if (token === 'retour' || /^retour[\s(]/.test(token)) {
        let reste = token.slice(6).trim(); // tout ce qui suit "retour"
        // Si l'expression est entierement entre parentheses (retour(...)), on les retire ;
        // "retour x*x" et "retour(x*x)" sont tous les deux acceptes.
        if (/^\(.*\)$/.test(reste)) reste = reste.slice(1, -1).trim();
        let valeur;
        if (reste === "") {
          valeur = undefined;
        } else {
          let elementsRetour = splitTopLevelComma(reste);
          if (elementsRetour.length === 1) {
            // Un seul element : comportement inchange, on garde le type reel (nombre,
            // vecteur, matrice, instance...), pas de conversion en texte.
            valeur = await evalExpr(reste, ctxExpr);
          } else {
            // Plusieurs elements separes par virgule : concatenes en un seul texte,
            // exactement comme les arguments de affi()/entr() (avec |texte| et saulig).
            let parties = [];
            for (let elem of elementsRetour) {
              let elemTrim = elem.trim();
              if (elemTrim === "saulig") {
                parties.push("\n");
              } else if (/^\|[\s\S]*\|$/.test(elemTrim)) {
                parties.push(elemTrim.slice(1, -1));
              } else {
                verifierTexteLitteralFerme(elemTrim);
                parties.push(formatValeur(await evalExpr(elemTrim, ctxExpr)));
              }
            }
            valeur = parties.join(" ").replace(/ {2,}/g, " ").replace(/ *\n */g, "\n");
          }
        }
        return { index: index + 1, signal: { type: 'retour', valeur: valeur } };
      }

      await executerCommandeSimple(token);
      index++;
    } catch (e) {
      if (e instanceof ErreurLangage) throw e;
