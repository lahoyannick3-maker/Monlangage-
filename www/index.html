<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MonLangage IDE v4.0</title>
  <style>
    * { box-sizing: border-box; }
    html {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
    }
    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: monospace;
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      inset: 0;
      overscroll-behavior: none;
    }
    #editeur {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      overscroll-behavior: none;
    }
    #console { width: 100%; height: 100%; display: none; flex-direction: column; }
    #console.actif { display: flex; }
    #editeur.masque { display: none; }
    #barre {
      background: #161b22;
      padding: 8px;
      border-bottom: 1px solid #30363d;
      display: flex;
      gap: 10px;
      flex-shrink: 0;
      align-items: center;
      position: relative;
      z-index: 1000;
    }
    button { background: #238636; color: white; border: none; padding: 6px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; font-family: monospace; }
    button:hover { background: #2ea043; }
    button:disabled { background: #444; cursor: not-allowed; }
    #btnConsole { background: #1f6feb; }
    #btnConsole:hover { background: #388bfd; }
    #btnRetour { background: #30363d; }
    #btnRetour:hover { background: #484f58; }
    #btnSauver {
      background: #8957e5;
      width: 46px;
      min-width: 46px;
      height: 42px;
      padding: 0;
      font-size: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    #btnSauver:hover { background: #a371f7; }

    .menuOuvrir { position: relative; flex-shrink: 0; }
    #btnOuvrir {
      background: #9e6a03;
      width: 46px;
      min-width: 46px;
      height: 42px;
      padding: 0;
      font-size: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    #btnOuvrir:hover { background: #bb8009; }
    #menuOuvrir {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 190px;
      padding: 6px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,.45);
      display: none;
      z-index: 2000;
    }
    #menuOuvrir.ouvert { display: block; }
    #menuOuvrir button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: transparent;
      color: #c9d1d9;
      border-radius: 6px;
      text-align: left;
      font-size: 14px;
    }
    #menuOuvrir button:hover { background: #21262d; }
    #nomFichier { margin-left: auto; max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #8b949e; font-size: 13px; }

    /* Navigateur de fichiers integre (remplace les selecteurs systeme Android) */
    .modalFichiersOverlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(1,4,9,.72);
      z-index: 5000;
      align-items: flex-end;
      justify-content: center;
    }
    .modalFichiersOverlay.ouvert { display: flex; }
    .modalFichiersBoite {
      width: 100%; max-width: 640px; max-height: 82vh;
      background: #161b22; border: 1px solid #30363d; border-radius: 12px 12px 0 0;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .modalFichiersEntete {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 14px; border-bottom: 1px solid #30363d; flex-shrink: 0;
    }
    .modalFichiersEntete button { background: #21262d; padding: 6px 10px; font-size: 14px; }
    .modalFichiersChemin { color: #58a6ff; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
    .modalFichiersListe { flex: 1; overflow-y: auto; padding: 4px 0; }
    .modalFichiersLigne {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 14px; color: #c9d1d9; font-size: 14px; cursor: pointer;
    }
    .modalFichiersLigne:active { background: #21262d; }
    .modalFichiersLigne .icone { font-size: 16px; flex-shrink: 0; }
    .modalFichiersLigne .nom { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .modalFichiersVide { padding: 20px 14px; color: #8b949e; font-size: 13px; text-align: center; }
    .modalFichiersNomLigne {
      display: none; align-items: center; gap: 8px;
      padding: 12px 14px; border-top: 1px solid #30363d; flex-shrink: 0; color: #8b949e; font-size: 13px;
    }
    .modalFichiersNomLigne.visible { display: flex; }
    .modalFichiersNomLigne input {
      flex: 1; background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
      color: #c9d1d9; padding: 8px 10px; font-family: monospace; font-size: 14px;
    }
    .modalFichiersExtension { color: #58a6ff; font-family: monospace; }
    .modalFichiersActions {
      display: flex; justify-content: flex-end; gap: 10px;
      padding: 12px 14px; border-top: 1px solid #30363d; flex-shrink: 0;
    }
    .modalFichiersActions button.annuler { background: #21262d; color: #c9d1d9; }

    #ongletsBarre {
      background: #0d1117;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: stretch;
      overflow-x: auto;
      overflow-y: hidden;
      min-height: 38px;
      flex-shrink: 0;
      position: relative;
      z-index: 999;
      touch-action: pan-x;
    }
    #ongletsBarre::-webkit-scrollbar { height: 4px; }
    .onglet { display: flex; align-items: center; gap: 7px; min-width: 115px; max-width: 220px; height: 38px; padding: 0 8px 0 12px; border-right: 1px solid #30363d; background: #161b22; color: #8b949e; cursor: pointer; user-select: none; }
    .onglet.actif { background: #010409; color: #c9d1d9; border-top: 2px solid #58a6ff; }
    .ongletNom { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .ongletFermer { width: 24px; height: 24px; padding: 0; border-radius: 4px; background: transparent; color: #8b949e; font-size: 17px; line-height: 24px; flex-shrink: 0; }
    .ongletFermer:hover { background: #30363d; color: #fff; }
    #zoneCode {
      flex: 1;
      display: flex;
      overflow: hidden;
      min-height: 0;
      position: relative;
    }
    #numeros { width: 42px; flex-shrink: 0; background: #0d1117; color: #6e7681; text-align: right; padding: 10px 6px 10px 0; font-size: 15px; line-height: 23px; overflow: hidden; user-select: none; white-space: pre; }
    #codeConteneur { position: relative; flex: 1; overflow: hidden; background: #010409; }
    #codeHighlight, #code { position: absolute; inset: 0; margin: 0; padding: 10px; font-size: 15px; line-height: 23px; font-family: monospace; white-space: pre; overflow-wrap: normal; }
    #codeHighlight { color: #c9d1d9; overflow: auto; pointer-events: none; scrollbar-width: none; }
    #codeHighlight::-webkit-scrollbar { display: none; }
    #code { background: transparent; color: transparent; caret-color: #c9d1d9; border: none; outline: none; resize: none; overflow-x: auto; overflow-y: auto; z-index: 1; }
    #code::selection { background: #264f78; color: #c9d1d9; }

    #headerConsole { background: #010409; padding: 10px 10px 0 10px; flex-shrink: 0; }
    #output { flex: 1; background: #010409; padding: 0 10px 10px 10px; overflow-y: auto; min-height: 0; white-space: pre-wrap; }
    #output:focus { outline: none; }
  .invite { color: #58a6ff; font-weight: bold; user-select: none; }
  .ligneCommande { }
  .cmdInput { outline: none; }
  .entrInput { outline: none; }

.erreur { color: #f85149; }
.resultatConsole { padding-left: 12px; border-left: 2px solid #30363d; margin: 2px 0 2px 4px; }
.keyword { color: #ff7b72; font-weight: bold; }
.fonction { color: #a5d6ff; }
.operateur { color: #ffa657; }
.nombre { color: #79c0ff; }

/* Indicateur "execution en cours" : n'apparait que si le script met un peu de
   temps a s'executer (voir demarrerIndicateurAttente), pour ne jamais clignoter
   inutilement sur les executions quasi instantanees. */
#indicateurAttente {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: #161b22;
  border: 1px solid #30363d;
  color: #c9d1d9;
  padding: 8px 16px;
  border-radius: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  font-family: monospace;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  z-index: 999;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s ease, transform 0.15s ease;
}
#indicateurAttente.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
.spinnerAttente {
  width: 14px; height: 14px; flex-shrink: 0;
  border: 2px solid #30363d;
  border-top-color: #58a6ff;
  border-radius: 50%;
  animation: tournerSpinnerAttente 0.7s linear infinite;
}
@keyframes tournerSpinnerAttente { to { transform: rotate(360deg); } }

/* Toast de confirmation d'enregistrement (succes / echec), meme habillage
   que l'indicateur d'attente pour rester dans le theme de l'app. */
#toastEnregistrement {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: #161b22;
  border: 1px solid #30363d;
  color: #c9d1d9;
  padding: 8px 16px;
  border-radius: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  font-family: monospace;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  z-index: 1001;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s ease, transform 0.15s ease;
}
#toastEnregistrement.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
#toastEnregistrement.succes { border-color: #238636; }
#toastEnregistrement.echec { border-color: #da3633; }
.toastIcone {
  width: 16px; height: 16px; flex-shrink: 0;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: bold; line-height: 1;
}
#toastEnregistrement.succes .toastIcone { background: #238636; color: #c9d1d9; }
#toastEnregistrement.echec .toastIcone { background: #da3633; color: #c9d1d9; }
  </style>
</head>
<body>
  <div id="editeur">
    <div id="barre">
      <button id="btnRun">▶ RUN</button>
      <button id="btnConsole">Console</button>
      <button id="btnSauver" title="Enregistrer" aria-label="Enregistrer">💾</button>
      <div class="menuOuvrir">
        <button id="btnOuvrir" title="Ouvrir / Nouveau" aria-label="Ouvrir / Nouveau">📂</button>
        <div id="menuOuvrir" role="menu">
          <button id="btnMenuNouvelOnglet" type="button" role="menuitem">＋&nbsp;&nbsp;Nouvel onglet</button>
          <button id="btnMenuOuvrirFichier" type="button" role="menuitem">📄&nbsp;&nbsp;Ouvrir un fichier</button>
        </div>
      </div>
      <input type="file" id="inputOuvrir" accept="*/*" style="display:none">
      <span id="nomFichier" title="Fichier actuel">Sans fichier</span>
    </div>
    <div id="ongletsBarre"></div>
    <div id="zoneCode">
      <div id="numeros">1</div>
      <div id="codeConteneur">
        <div id="codeHighlight" aria-hidden="true"></div>
        <textarea id="code" spellcheck="false">fonc double(x){
retour(x*2)
}

pou(i, 1, 3){
si(i==2 ou i==3){
affi(|i vaut |, i, | (special)|)
}sinon{
affi(|i vaut |, i)
}
}

y ~ double(5)
affi(|Resultat: |, y)

nom ~ entr(|Quel est ton prenom ?|)
affi(|Bonjour |, nom)</textarea>
      </div>
    </div>
  </div>

  <div id="console">
    <div id="headerConsole" style="display:flex; align-items:center; gap:10px;">
      <button id="btnRetour">← Retour</button>
      <span>Console MonLangage v4.0</span>
    </div>
    <div id="output"></div>
  </div>

  <div id="indicateurAttente"><div class="spinnerAttente"></div><span>Execution en cours, patientez…</span></div>

  <div id="toastEnregistrement"><span class="toastIcone"></span><span class="toastTexte"></span></div>

  <div id="modalFichiers" class="modalFichiersOverlay">
    <div class="modalFichiersBoite">
      <div class="modalFichiersEntete">
        <button id="modalFichiersRetour" type="button" title="Dossier parent">⬅</button>
        <span id="modalFichiersChemin" class="modalFichiersChemin"></span>
      </div>
      <div id="modalFichiersListe" class="modalFichiersListe"></div>
      <div id="modalFichiersNomLigne" class="modalFichiersNomLigne">
        <span>Nom du fichier :</span>
        <input id="modalFichiersNom" type="text" spellcheck="false">
        <span id="modalFichiersExtension" class="modalFichiersExtension">.mlg</span>
      </div>
      <div class="modalFichiersActions">
        <button id="modalFichiersAnnuler" type="button" class="annuler">ANNULER</button>
        <button id="modalFichiersValider" type="button"></button>
      </div>
    </div>
  </div>

<script>
/* ===================== ETAT GLOBAL ===================== */
              let scopes = [{}];   // pile de portees pour les variables (globale + fonctions)
let fonctions = {};      // fonctions ~ { nom: {params:[...], corps:[tokens...] } }
let classes = {};        // classes ~ { nom: {methodes: {nomMethode: {params:[...], corps:[tokens...]}}} }
let fonctionsBase = {};
let fonctionsExpression = {};   // sous-ensemble de fonctionsBase utilisable directement dans une expression (ex: entr)
// Numero de la ligne source EN COURS D'EXECUTION, mis a jour par executerTokens a chaque
// instruction. Sert a donner un numero de ligne correct aux erreurs qui surviennent a
// l'interieur d'une fonction anonyme (fonc(params) expr) : son corps synthetique n'a pas de
// numero de ligne propre (il est fabrique a partir de tokens d'expression, qui n'en portent
// pas), donc on reutilise la derniere ligne source reellement executee.
let ligneExpressionCourante = 0;
let commandes = ["affi", "pou", "tanqer", "stop", "continu", "si", "sinon", "sision", "essai", "attrape", "fonc", "retour", "entr", "c", "liste", "texte", "seq", "rep", "alea", "ralea", "matrice", "lon", "dim", "som", "moy", "var", "sd", "max", "min", "suchaq", "det", "trace", "trans", "aide", "base", "effa", "voi", "lettr", "Lettr", "VRAI", "FAUX", "pasdefini", "ecrire", "lire", "ajout"];

let outputDiv = document.getElementById("output");
let codeArea = document.getElementById("code");
let codeHighlight = document.getElementById("codeHighlight");
let numeros = document.getElementById("numeros");
let btnRun = document.getElementById("btnRun");
let ecranEditeur = document.getElementById("editeur");
let ecranConsole = document.getElementById("console");
let btnConsole = document.getElementById("btnConsole");
let btnRetour = document.getElementById("btnRetour");
let btnSauver = document.getElementById("btnSauver");
let btnOuvrir = document.getElementById("btnOuvrir");
let inputOuvrir = document.getElementById("inputOuvrir");
let nomFichier = document.getElementById("nomFichier");
let ongletsBarre = document.getElementById("ongletsBarre");
let menuOuvrir = document.getElementById("menuOuvrir");
let btnMenuNouvelOnglet = document.getElementById("btnMenuNouvelOnglet");
let btnMenuOuvrirFichier = document.getElementById("btnMenuOuvrirFichier");

let modalFichiers = document.getElementById("modalFichiers");
let modalFichiersRetour = document.getElementById("modalFichiersRetour");
let modalFichiersChemin = document.getElementById("modalFichiersChemin");
let modalFichiersListe = document.getElementById("modalFichiersListe");
let modalFichiersNomLigne = document.getElementById("modalFichiersNomLigne");
let modalFichiersNom = document.getElementById("modalFichiersNom");
let modalFichiersExtension = document.getElementById("modalFichiersExtension");
let modalFichiersAnnuler = document.getElementById("modalFichiersAnnuler");
let modalFichiersValider = document.getElementById("modalFichiersValider");
let toastEnregistrement = document.getElementById("toastEnregistrement");

let toastEnregistrementTimeoutId = null;
function afficherToastEnregistrement(succes, message) {
  clearTimeout(toastEnregistrementTimeoutId);
  toastEnregistrement.classList.remove("succes", "echec");
  toastEnregistrement.classList.add(succes ? "succes" : "echec");
  toastEnregistrement.querySelector(".toastIcone").textContent = succes ? "✓" : "✕";
  toastEnregistrement.querySelector(".toastTexte").textContent = message;
  toastEnregistrement.classList.add("visible");
  toastEnregistrementTimeoutId = setTimeout(() => {
    toastEnregistrement.classList.remove("visible");
  }, 2200);
}

/* ===================== ONGlets DE L'EDITEUR ===================== */
let onglets = [];
let ongletActifId = null;
let prochainIdOnglet = 1;

function sauvegarderEtatOnglets() {
  localStorage.setItem("monlangage_onglets", JSON.stringify(onglets));
  localStorage.setItem("monlangage_onglet_actif", String(ongletActifId ?? ""));
}

function trouverOnglet(id) {
  return onglets.find(o => o.id === id) || null;
}

function mettreAJourBarreOnglets() {
  ongletsBarre.querySelectorAll(".onglet").forEach(el => el.remove());

  onglets.forEach(onglet => {
    let bouton = document.createElement("div");
    bouton.className = "onglet" + (onglet.id === ongletActifId ? " actif" : "");
    bouton.dataset.id = onglet.id;

    let nom = document.createElement("span");
    nom.className = "ongletNom";
    nom.textContent = (onglet.dirty ? "*" : "") + (onglet.nom || "sans titre");
    nom.title = onglet.nom || "sans titre";

    let fermer = document.createElement("button");
    fermer.className = "ongletFermer";
    fermer.textContent = "×";
    fermer.title = "Fermer";
    fermer.addEventListener("click", function(e) {
      e.stopPropagation();
      fermerOnglet(onglet.id);
    });

    bouton.appendChild(nom);
    bouton.appendChild(fermer);
    bouton.addEventListener("click", () => activerOnglet(onglet.id));
    ongletsBarre.appendChild(bouton);
  });

  // Fait defiler la barre d'onglets pour que l'onglet ACTIF soit toujours visible
  // (sinon, avec beaucoup d'onglets ouverts, l'onglet actif peut se retrouver hors
  // de l'ecran sans que rien ne le signale).
  let ongletActifEl = ongletsBarre.querySelector(".onglet.actif");
  if (ongletActifEl) {
    ongletActifEl.scrollIntoView({ behavior: "smooth", inline: "nearest", block: "nearest" });
  }
}

function afficherNomOngletActif() {
  let onglet = trouverOnglet(ongletActifId);
  let nom = onglet ? (onglet.nom || "sans titre") : "";
  nomFichier.textContent = nom || "Sans fichier";
  nomFichier.title = nom || "Fichier actuel";
}

function definirNomFichier(nom) {
  let onglet = trouverOnglet(ongletActifId);
  if (onglet) {
    onglet.nom = nom || "sans titre";
    afficherNomOngletActif();
    mettreAJourBarreOnglets();
    sauvegarderEtatOnglets();
  } else {
    nomFichier.textContent = nom || "Sans fichier";
    nomFichier.title = nom || "Fichier actuel";
  }
}

function creerOnglet(nom, contenu, contenuSauvegarde, activer = true) {
  let onglet = {
    id: prochainIdOnglet++,
    nom: nom || "sans titre",
    contenu: contenu || "",
    contenuSauvegarde: contenuSauvegarde !== undefined ? contenuSauvegarde : (contenu || ""),
    dirty: contenuSauvegarde !== undefined ? (contenu || "") !== contenuSauvegarde : false
  };
  onglets.push(onglet);
  if (activer) {
    ongletActifId = onglet.id;
    codeArea.value = onglet.contenu;
    afficherNomOngletActif();
    majNumeros();
    majSurbrillance();
    synchroniserScrollEditeur();
  }
  mettreAJourBarreOnglets();
  sauvegarderEtatOnglets();
  return onglet;
}

function mettreAJourOngletDepuisEditeur() {
  let onglet = trouverOnglet(ongletActifId);
  if (!onglet) return;
  onglet.contenu = codeArea.value;
  onglet.dirty = onglet.contenu !== onglet.contenuSauvegarde;
  mettreAJourBarreOnglets();
  sauvegarderEtatOnglets();
}

function activerOnglet(id) {
  if (id === ongletActifId) return;
  mettreAJourOngletDepuisEditeur();

  let onglet = trouverOnglet(id);
  if (!onglet) return;
  ongletActifId = id;
  codeArea.value = onglet.contenu;
  afficherNomOngletActif();
  majNumeros();
  majSurbrillance();
  synchroniserScrollEditeur();
  sauvegarderEtatOnglets();
  mettreAJourBarreOnglets();
  requestAnimationFrame(synchroniserScrollEditeur);
}

function nouvelOnglet() {
  creerOnglet("sans titre", "", "", true);
}

function enregistrerOnglet(onglet, apresSauvegarde) {
  if (!onglet) return;

  let nomDefaut = (onglet.nom || "").trim().replace(/\.mlg$/i, "");
  if (!nomDefaut || nomDefaut.toLowerCase() === "sans titre") nomDefaut = "monscript";

  // Navigateur de fichiers integre (choix du nom ET de l'emplacement dans un seul
  // dialogue, dans le style de l'app) : c'est la voie normale sur l'app native.
  if (window.MonLangage && typeof window.MonLangage.listerDossier === "function") {
    ouvrirNavigateurFichiers("enregistrer", {
      nomDefaut: nomDefaut,
      onValide: (cheminComplet) => {
        let ok = window.MonLangage.ecrireFichier(cheminComplet, onglet.contenu);
        if (ok) {
          onglet.nom = cheminComplet.substring(cheminComplet.lastIndexOf("/") + 1);
          onglet.contenuSauvegarde = onglet.contenu;
          onglet.dirty = false;
          sauvegarderEtatOnglets();
          mettreAJourBarreOnglets();
          if (onglet.id === ongletActifId) afficherNomOngletActif();
          afficherToastEnregistrement(true, "Enregistre avec succes");
        } else {
          afficherToastEnregistrement(false, "Echec de l'enregistrement");
        }
        if (apresSauvegarde) apresSauvegarde(!!ok);
      }
    });
    return;
  }

  // Fallback navigateur web classique (previsualisation hors app, ou app native
  // pas encore reconstruite avec le navigateur de fichiers integre).
  try {
    onglet.nom = nomDefaut + ".mlg";
    let blob = new Blob([onglet.contenu], { type: "text/plain;charset=utf-8" });
    let url = URL.createObjectURL(blob);
    let a = document.createElement("a");
    a.href = url;
    a.download = onglet.nom;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);

    onglet.contenuSauvegarde = onglet.contenu;
    onglet.dirty = false;
    sauvegarderEtatOnglets();
    mettreAJourBarreOnglets();
    if (onglet.id === ongletActifId) afficherNomOngletActif();
    afficherToastEnregistrement(true, "Enregistre avec succes");
    if (apresSauvegarde) apresSauvegarde(true);
  } catch (e) {
    afficherToastEnregistrement(false, "Echec de l'enregistrement");
    if (apresSauvegarde) apresSauvegarde(false);
  }
}

function enregistrerFichierMlg() {
  mettreAJourOngletDepuisEditeur();
  let onglet = trouverOnglet(ongletActifId);
  enregistrerOnglet(onglet);
}

function fermerOnglet(id) {
  let onglet = trouverOnglet(id);
  if (!onglet) return;

  if (onglet.dirty) {
    let enregistrer = confirm("Le fichier « " + (onglet.nom || "sans titre") + " » contient des modifications non enregistrées.\n\nOK = enregistrer avant de fermer\nAnnuler = fermer sans enregistrer");

    if (enregistrer) {
      enregistrerOnglet(onglet, function(succes) {
        if (succes) fermerOnglet(id);
      });
      return;
    }
  }

  let index = onglets.findIndex(o => o.id === id);
  onglets.splice(index, 1);

  if (onglets.length === 0) {
    creerOnglet("sans titre", "", "", true);
    return;
  }

  if (id === ongletActifId) {
    let nouvelIndex = Math.min(index, onglets.length - 1);
    ongletActifId = onglets[nouvelIndex].id;
    codeArea.value = onglets[nouvelIndex].contenu;
    afficherNomOngletActif();
    majNumeros();
    majSurbrillance();
    synchroniserScrollEditeur();
  }

  sauvegarderEtatOnglets();
  mettreAJourBarreOnglets();
}

function chargerFichierDansNouvelOnglet(texte, nom) {
  creerOnglet(nom || "sans titre", texte, texte, true);
  sauvegarderCode();
  afficherEditeur();
  requestAnimationFrame(synchroniserScrollEditeur);
}

function initialiserOnglets() {
  let stock = null;
  try {
    stock = JSON.parse(localStorage.getItem("monlangage_onglets") || "null");
  } catch (_) {}

  if (Array.isArray(stock) && stock.length) {
    onglets = stock.map(o => ({
      id: Number(o.id) || prochainIdOnglet++,
      nom: o.nom || "sans titre",
      contenu: o.contenu || "",
      contenuSauvegarde: o.contenuSauvegarde !== undefined ? o.contenuSauvegarde : (o.contenu || ""),
      dirty: !!o.dirty
    }));
    prochainIdOnglet = Math.max(...onglets.map(o => Number(o.id) || 0), 0) + 1;
    let idSauvegarde = Number(localStorage.getItem("monlangage_onglet_actif"));
    ongletActifId = onglets.some(o => o.id === idSauvegarde) ? idSauvegarde : onglets[0].id;
    let actif = trouverOnglet(ongletActifId);
    codeArea.value = actif.contenu;
  } else {
    let ancienCode = localStorage.getItem("monlangage_code");
    let ancienNom = localStorage.getItem("monlangage_nom_fichier") || "sans titre";
    let contenu = ancienCode !== null ? ancienCode : codeArea.value;
    creerOnglet(ancienNom, contenu, contenu, true);
  }

  afficherNomOngletActif();
  mettreAJourBarreOnglets();
  majNumeros();
  majSurbrillance();
}

function focaliserSaisieConsole() {
  let saisies = outputDiv.querySelectorAll(".cmdInput, .entrInput");
  let derniereSaisie = saisies.length ? saisies[saisies.length - 1] : null;
  if (derniereSaisie) {

    let range = document.createRange();
    range.selectNodeContents(derniereSaisie);

}

// Levee pour interrompre une execution en cours (retour a l'editeur pendant que ca tourne).

// de fois dans une boucle. MessageChannel n'a pas cette limite.

      __canalRespiration.port2.postMessage(0);

  // coute plus 4ms, on peut se permettre d'etre moins frequent, ce qui reduit
  // encore le nombre total de passages par la boucle d'evenements.
  if (forcer || compteurPas % 300 === 0) {

  return pos;
}

// Construit une fonction anonyme (fonc(params) expr) rencontree au milieu d'une expression :
// tokens[pos] doit designer le '(' des parametres (le mot-cle "fonc" a deja ete consomme par
// l'appelant, voir parsePrimaryBrute). Ne mute jamais "pos" directement : le renvoie dans le
// resultat, a l'appelant (sync ou async, chacun gere sa propre variable pos) de l'appliquer.
function construireFonctionAnonyme(tokens, pos) {
  if (!tokens[pos] || tokens[pos].type !== '(') throw new Error("fonc(...) attend une liste de parametres entre parentheses");
  pos++; // '('
  let params = [];
  if (tokens[pos] && tokens[pos].type !== ')') {
    if (!tokens[pos] || tokens[pos].type !== 'ident') throw new Error("Parametre invalide dans fonc(...) : un nom de parametre est attendu");
    params.push(tokens[pos].v); pos++;
    while (tokens[pos] && tokens[pos].type === ',') {
      pos++;
      if (!tokens[pos] || tokens[pos].type !== 'ident') throw new Error("Parametre invalide dans fonc(...) : un nom de parametre est attendu");
      params.push(tokens[pos].v); pos++;
    }
  }
  if (!tokens[pos] || tokens[pos].type !== ')') throw new Error("Parenthese fermante manquante pour les parametres de fonc(...)");
  pos++; // ')'
  let debutCorps = pos;
  let finCorps = trouverFinCorpsAnonyme(tokens, debutCorps);
  if (finCorps === debutCorps) throw new Error("fonc(...) attend une expression apres les parametres (son corps ne peut pas etre vide) : ecris par exemple fonc(x) x*2");
  let corpsTexte = detokeniserExpr(tokens.slice(debutCorps, finCorps));
  // Corps synthetique : une seule instruction "retour <expression>", au format attendu par
  // executerCorpsFonction (une liste de "lignes", chacune avec son texte et son numero de
  // ligne). Le numero de ligne reutilise la derniere ligne source reellement executee
  // (ligneExpressionCourante) : le corps n'a pas de numero de ligne propre puisqu'il est
  // fabrique a partir de jetons d'expression, qui n'en portent jamais.
  let valeur = {
    __fonction: true,
    nom: null,
    params: params,
    corps: [{ texte: "retour " + corpsTexte, ligne: ligneExpressionCourante }]
  };
  return { valeur: valeur, pos: finCorps };
}

// Affiche, sur une NOUVELLE ligne de la console, le message eventuel de entr(...) suivi d'une
// zone de saisie editable (le curseur). Retourne une Promise qui se resout avec le texte tape
// quand l'utilisateur valide (Entree).
// entr() sans argument -> juste le curseur. entr(|message|) -> "message" puis le curseur.
function demanderSaisieConsole(message) {
  // On attend une saisie de l'utilisateur, pas un calcul : l'indicateur
  // "execution en cours" n'a pas lieu d'etre ici.
  arreterIndicateurAttente();
  return new Promise((resolve, reject) => {
    let ligne = document.createElement("div");
    ligne.className = "ligneCommande";
    let msg = document.createElement("span");
    msg.className = "invite";
    msg.textContent = message ? message + " " : "";
    msg.contentEditable = "false";
    let input = document.createElement("span");
    input.className = "entrInput";
    input.contentEditable = "true";
    // Sans aucun texte (ni message, ni saisie), certains navigateurs mobiles
    // n'affichent pas le curseur clignotant au focus() : rien ne sert d'ancre
    // visuelle. On glisse une espace de largeur nulle (invisible) pour que le
    // curseur ait toujours quelque chose ou s'accrocher.
    input.textContent = "\u200B";
    ligne.appendChild(msg);
    ligne.appendChild(input);
    outputDiv.appendChild(ligne);
    outputDiv.scrollTop = outputDiv.scrollHeight;

    input.focus();
    let range = document.createRange();
    range.selectNodeContents(input);
    range.collapse(false);
    let sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);

    function onKeyDown(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        e.stopPropagation();
        let valeur = input.innerText.replace(/\u200B/g, "");
        input.contentEditable = "false";
        input.removeEventListener("keydown", onKeyDown);
        annulerSaisieEnCours = null;
        outputDiv.scrollTop = outputDiv.scrollHeight;
        demarrerIndicateurAttente();
        resolve(valeur);
      }
    }
    input.addEventListener("keydown", onKeyDown);

    // Permet d'interrompre proprement l'attente de saisie (ex: bouton "Retour"
    // pendant qu'un entr() attend une reponse que l'utilisateur ne peut plus donner).
    annulerSaisieEnCours = () => {
      input.removeEventListener("keydown", onKeyDown);
      annulerSaisieEnCours = null;
      reject(new ExecutionInterrompue());
    };
  });
}

// Comme demanderSaisieConsole, mais pour une saisie secrete (mot de passe / code PIN).
// styleChar === null : rien n'est JAMAIS affiche a l'ecran pendant la frappe (pas meme un
// caractere de masquage) -- seul le nombre de caracteres tapes reste invisible aussi.
// styleChar donne (un seul caractere texte) : affiche autant de styleChar que de
// caracteres reellement tapes, comme un champ mot de passe classique mais avec le
// caractere de masquage choisi par le codeur (pas forcement '*').
// Comme la zone de saisie est un <span contentEditable>, on intercepte nous-memes
// la saisie (au lieu de laisser le navigateur l'inserer visiblement) pour garder le
// texte reellement tape dans une variable JS cachee, jamais dans le DOM affiche.
// IMPORTANT : sur mobile (clavier virtuel/IME, ex. Gboard), l'insertion de caractere
// ne passe PAS par un keydown classique annulable -- e.preventDefault() sur keydown
// est ignore et le vrai texte s'affiche quand meme. Le seul evenement fiable et
// annulable pour intercepter la saisie AVANT affichage, sur mobile comme sur desktop,
// est "beforeinput" : on s'appuie donc dessus pour le texte tape/compose et les
// suppressions, et on ne garde keydown que comme filet de securite pour la touche
// Entree physique (deja annulee par beforeinput sur la plupart des navigateurs, mais
// pas garanti partout).
function demanderSaisieConsoleSecrete(message, styleChar) {
  arreterIndicateurAttente();
  return new Promise((resolve, reject) => {
    let ligne = document.createElement("div");
    ligne.className = "ligneCommande";
    let msg = document.createElement("span");
    msg.className = "invite";
    msg.textContent = message ? message + " " : "";
    msg.contentEditable = "false";
    let input = document.createElement("span");
    input.className = "entrInput";
    input.contentEditable = "true";
    input.textContent = "\u200B";
    ligne.appendChild(msg);
    ligne.appendChild(input);
    outputDiv.appendChild(ligne);
    outputDiv.scrollTop = outputDiv.scrollHeight;

    input.focus();
    let range = document.createRange();
    range.selectNodeContents(input);
    range.collapse(false);
    let sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);

    let buffer = "";
    let termine = false;
    function placerCurseurFin() {
      let r = document.createRange();
      r.selectNodeContents(input);
      r.collapse(false);
      let s = window.getSelection();
      s.removeAllRanges();
      s.addRange(r);
    }
    function rafraichirAffichage() {
      input.textContent = (styleChar ? styleChar.repeat(buffer.length) : "") || "\u200B";
      placerCurseurFin();
    }
    function detacherEcouteurs() {
      input.removeEventListener("beforeinput", onBeforeInput);
      input.removeEventListener("keydown", onKeyDown);
      input.removeEventListener("paste", onPaste);
    }
    function soumettre() {
      if (termine) return;
      termine = true;
      input.contentEditable = "false";
      detacherEcouteurs();
      annulerSaisieEnCours = null;
      outputDiv.scrollTop = outputDiv.scrollHeight;
      demarrerIndicateurAttente();
      resolve(buffer);
    }
    function onBeforeInput(e) {
      e.preventDefault();
      let type = e.inputType || "";
      if (type === "insertLineBreak" || type === "insertParagraph") {
        soumettre();
        return;
      }
      if (type.indexOf("delete") === 0) {
        buffer = buffer.slice(0, -1);
        rafraichirAffichage();
        return;
      }
      let texte = e.data;
      if (texte === null || texte === undefined) {
        texte = e.dataTransfer ? e.dataTransfer.getData("text") : "";
      }
      if (texte) {
        buffer += texte;
        rafraichirAffichage();
      }
    }
    function onKeyDown(e) {
      // Filet de securite pour clavier physique : la plupart des navigateurs annulent
      // deja l'Entree via beforeinput ci-dessus, mais on la traite aussi ici au cas ou.
      if (e.key === "Enter") {
        e.preventDefault();
        e.stopPropagation();
        soumettre();
      }
    }
    function onPaste(e) {
      e.preventDefault();
      let texte = (e.clipboardData || window.clipboardData).getData("text");
      buffer += texte;
      rafraichirAffichage();
    }
    input.addEventListener("beforeinput", onBeforeInput);
    input.addEventListener("keydown", onKeyDown);
    input.addEventListener("paste", onPaste);

    annulerSaisieEnCours = () => {
      detacherEcouteurs();
      annulerSaisieEnCours = null;
      reject(new ExecutionInterrompue());
    };
  });
}

// Ouvre le selecteur de fichiers natif du telephone/navigateur et attend que l'utilisateur
// choisisse un fichier (ou l'annule via le bouton "Retour"). Renvoie le CONTENU TEXTE du
// fichier choisi. Utilise par lire.fichier(...) -- meme logique d'indicateur d'attente et
// d'annulation que demanderSaisieConsole/demanderSaisieConsoleSecrete.
function demanderFichierConsole() {
  arreterIndicateurAttente();
  print("Choisir un fichier a charger...", "invite");
  return new Promise((resolve, reject) => {
    let input = document.createElement("input");
    input.type = "file";
    input.accept = ".mld,application/json,text/plain";
    input.style.display = "none";
    document.body.appendChild(input);
    let termine = false;
    function nettoyer() {
      if (input.parentNode) document.body.removeChild(input);
      annulerSaisieEnCours = null;
    }
    input.addEventListener("change", () => {
      if (termine) return;
      let fichier = input.files && input.files[0];
      if (!fichier) {
        termine = true;
        nettoyer();
        demarrerIndicateurAttente();
        reject(new Error("lire.fichier(...) : aucun fichier selectionne"));
        return;
      }
      let lecteur = new FileReader();
      lecteur.onload = () => {
        termine = true;
        nettoyer();
        demarrerIndicateurAttente();
        resolve(lecteur.result);
      };
      lecteur.onerror = () => {
        termine = true;
        nettoyer();
        demarrerIndicateurAttente();
        reject(new Error("lire.fichier(...) : impossible de lire le fichier selectionne"));
      };
      lecteur.readAsText(fichier);
    });
    annulerSaisieEnCours = () => {
      termine = true;
      nettoyer();
      reject(new ExecutionInterrompue());
    };
    input.click();
  });
}

// Choisit l'emplacement (chemin complet) ou ecrire un vrai fichier, via le navigateur de
// fichiers integre de l'app native (window.MonLangage) : demande un nom + un dossier dans
// le style de l'app, plutot qu'un telechargement de navigateur classique. Utilise par
// ecrire.fichier(...). N'est appelee que quand window.MonLangage est disponible.
function demanderEmplacementEcritureFichier(nomDefaut, extension) {
  arreterIndicateurAttente();
  return new Promise((resolve, reject) => {
    ouvrirNavigateurFichiers("enregistrer", {
      nomDefaut: nomDefaut,
      extension: extension,
      onValide: (cheminComplet) => { demarrerIndicateurAttente(); resolve(cheminComplet); },
      onAnnule: () => { demarrerIndicateurAttente(); reject(new ExecutionInterrompue()); }
    });
  });
}

// Choisit un fichier existant a lire, via le meme navigateur de fichiers integre. Renvoie
// le CHEMIN COMPLET choisi (la lecture elle-meme se fait ensuite via
// window.MonLangage.lireFichier). Utilise par lire.fichier(...).
function demanderEmplacementLectureFichier() {
  arreterIndicateurAttente();
  return new Promise((resolve, reject) => {
    ouvrirNavigateurFichiers("ouvrir", {
      onValide: (cheminComplet) => { demarrerIndicateurAttente(); resolve(cheminComplet); },
      onAnnule: () => { demarrerIndicateurAttente(); reject(new ExecutionInterrompue()); }
    });
  });
}


// Cherche les appels aux fonctions de fonctionsExpression (ex: entr(...)) dans une expression,
// les execute tout de suite (elles peuvent etre asynchrones / interactives), et remplace
// chaque appel par une variable temporaire portant la valeur retournee.
async function extraireFonctionsExpression(str) {
  let resultat = "", i = 0, n = str.length, compteur = 0, temp = {};
  let noms = Object.keys(fonctionsExpression);
  while (i < n) {
    let precedent = i > 0 ? str[i-1] : "";
    let nomTrouve = null;
    let mRacine = null;
    if (!/[a-zA-Z0-9_]/.test(precedent)) {
      mRacine = /^racine(\d*)\(/.exec(str.slice(i));
      if (!mRacine) {
        for (let nom of noms) {
          if (str.startsWith(nom + '(', i)) { nomTrouve = nom; break; }
        }
      }
    }
    if (mRacine) {
      let n2 = mRacine[1] === "" ? 2 : parseInt(mRacine[1], 10);
      let longueurNom = mRacine[0].length - 1; // sans le '('
      let debutArgs = i + longueurNom + 1;
      let depth = 1, j = debutArgs;
      while (j < n && depth > 0) {
        if (str[j] === '(') depth++;
        if (str[j] === ')') depth--;
        j++;
      }
      if (depth !== 0) throw new Error("Parenthese fermante manquante pour " + nomRacine(n2) + "(...)");
      let argStr = str.slice(debutArgs, j - 1).trim();
      let argExprs = argStr === "" ? [] : splitTopLevelComma(argStr);
      if (argExprs.length !== 1) throw new Error(nomRacine(n2) + "(...) attend exactement 1 argument");
      let valeur = appliquerRacineN(n2, await evalExpr(argExprs[0], ctxExpr));
      let nomTemp = "__ext" + compteur + "__";
      temp[nomTemp] = valeur;
      compteur++;
      resultat += nomTemp;
      i = j;
      continue;
    }
    if (nomTrouve) {
      let debutArgs = i + nomTrouve.length + 1;
      let depth = 1, j = debutArgs;
      while (j < n && depth > 0) {
        if (str[j] === '(') depth++;
        if (str[j] === ')') depth--;
        j++;
      }
      if (depth !== 0) throw new Error("Parenthese fermante manquante pour " + nomTrouve + "(...)");
      let argStr = str.slice(debutArgs, j - 1).trim();
      let argExprs = argStr === "" ? [] : splitTopLevelComma(argStr);
      let valeur = await fonctionsExpression[nomTrouve](argExprs, ctxExpr);
      let nomTemp = "__ext" + compteur + "__";
      temp[nomTemp] = valeur;
      compteur++;
      resultat += nomTemp;
      i = j;
    } else {
      resultat += str[i];
      i++;
    }
  }
  return { str: resultat, temp: temp };
}

async function evalExpr(str, ctx) {
  let extrait = await extraireFonctionsExpression(str);
  let temp = extrait.temp;
  let aTemp = Object.keys(temp).length > 0;
  if (aTemp) scopes.push(temp);
  try {
    return await evalExprSansEntree(extrait.str, ctx);
  } finally {
    if (aTemp) scopes.pop();
  }
}

// Signal interne (pas une vraie erreur du langage) : leve par le parseur RAPIDE
// synchrone quand il rencontre un appel a une fonction UTILISATEUR (fonc ...) au
// milieu d'une expression. Un tel appel doit pouvoir executer des boucles/retour/
// entr() etc., donc il a reellement besoin d'async -> on retombe alors sur
// l'ancien parseur async complet, qui sait le gerer.
class __BesoinAsync extends Error {}

// ---- Parseur RAPIDE (synchrone). Utilise pour l'ecrasante majorite des
// expressions (conditions de boucles, calculs, indexation...) qui ne contiennent
// aucun appel a une fonction definie par l'utilisateur. Pas de Promise creee a
// chaque niveau de descente recursive -> beaucoup plus rapide dans les boucles.
function evalExprSansEntreeSync(str, ctx) {
  let tokens = tokenizerExpr(str);
  let pos = 0;
  const peek = () => tokens[pos];
  const next = () => tokens[pos++];

  function parseOr() {
    let g = parseAnd();
    while (peek() && peek().type === 'or') { next(); let d = parseAnd(); g = estVrai(g) || estVrai(d); }
    return g;
  }
  function parseAnd() {
    let g = parseDan();
    while (peek() && peek().type === 'and') { next(); let d = parseDan(); g = estVrai(g) && estVrai(d); }
    return g;
  }
  function parseDan() {
    let g = parseCmp();
    while (peek() && peek().type === 'dan') { next(); let d = parseCmp(); g = testerAppartenance(g, d); }
    return g;
  }
  function parseCmp() {
    let g = parseAdd();
    if (peek() && peek().type === 'cmp') {
      let op = next().v; let d = parseAdd();
      return combinerComparaison(g, d, op);
    }
    return g;
  }
  function parseAdd() {
    let g = parseMul();
    while (peek() && peek().type === 'op' && (peek().v === '+' || peek().v === '-')) {
      let op = next().v; let d = parseMul();
      g = combinerAddition(g, d, op);
    }
    return g;
  }
  function parseMul() {
    let g = parseColon();
    while (peek() && peek().type === 'op' && (peek().v === '*' || peek().v === '/' || peek().v === '%' || peek().v === 'enti' || peek().v === '.' || peek().v === '..' || peek().v === '×')) {
      let op = next().v; let d = parseColon();
      if (op === '*' || op === '/' || op === '%' || op === 'enti') {
        g = combinerMultiplication(g, d, op);
      } else if (op === '.') {
        g = produitScalaire(g, d);
      } else if (op === '×') {
        g = produitVectoriel(g, d);
      } else if (op === '..') {
        g = produitMatriciel(g, d);
      }
    }
    return g;
  }
  function parseColon() {
    let g = parseUnary();
    if (peek() && peek().type === 'deuxpoints') {
      next();
      let d = parseUnary();
      verifierNombre(g, ':'); verifierNombre(d, ':');
      return construireSequence(g, d);
    }
    return g;
  }
  function parseUnary() {
    if (peek() && peek().type === 'op' && peek().v === '-') { next(); let v = parseUnary(); verifierNombre(v, '-'); return -v; }
    return parsePow();
  }
  function parsePow() {
    let g = parsePrimary();
    if (peek() && peek().type === 'op' && peek().v === '^') {
      next();
      let d = parseUnary(); // recursif (associatif a droite) : autorise 2^3^2 et 2^-1
      g = combinerPuissance(g, d);
    }
    return g;
  }
  function parsePrimary() {
    let valeur = parsePrimaryBrute();
    // Suite d'attributs / indexations / methodes de texte enchaines sur le resultat, dans
    // n'importe quel ordre : moi.comptes[i].nom, v[i].texte(), etc. Une methode d'instance
    // rencontree ici (a.methode(...)) a besoin d'executer un corps entier : on delegue au
    // parseur lent.
    while (true) {
      // Attribut/methode d'une instance de classe : a.nom (lecture), a.methode(...) (appel).
      if (peek() && peek().type === 'op' && peek().v === '.' &&
          tokens[pos + 1] && tokens[pos + 1].type === 'ident' &&
          valeur && typeof valeur === 'object' && valeur.__classe !== undefined) {
        if (tokens[pos + 2] && tokens[pos + 2].type === '(') {
          // Appel de methode : execute un corps entier, ca a besoin d'etre async.
          // On laisse la main au parseur lent.
          throw new __BesoinAsync();
        }
        next(); // '.'
        let nomAttr = next().v;
        valeur = Object.prototype.hasOwnProperty.call(valeur, nomAttr) ? valeur[nomAttr] : undefined;
        continue;
      }
      // Methodes de texte chainees directement dans une expression (si(...), affi(...), etc.) :
      // var.miniscul(), |texte|.majuscul(), (a+b).suprespac()... Ne consomme le '.' que si le
      // motif complet correspond, pour ne jamais gener l'operateur '.' de produit scalaire.
      if (peek() && peek().type === 'op' && peek().v === '.' &&
          tokens[pos + 1] && tokens[pos + 1].type === 'ident' &&
          (tokens[pos + 1].v === 'miniscul' || tokens[pos + 1].v === 'majuscul' || tokens[pos + 1].v === 'suprespac') &&
          tokens[pos + 2] && tokens[pos + 2].type === '(' &&
          tokens[pos + 3] && tokens[pos + 3].type === ')') {
        next(); // '.'
        let methode = next().v; // miniscul / majuscul / suprespac
        next(); next(); // '(' ')'
        if (typeof valeur === 'number') continue; // rien a convertir : ignore silencieusement
        if (typeof valeur !== 'string') throw new Error("." + methode + "() attend du texte");
        if (methode === 'miniscul') valeur = valeur.toLowerCase();
        else if (methode === 'majuscul') valeur = valeur.toUpperCase();
        else if (methode === 'suprespac') valeur = valeur.trim();
        continue;
      }
      // Indexation sur le resultat d'un attribut/appel precedent : moi.comptes[i], f()[1]...
      if (peek() && peek().type === '[' && (estVecteur(valeur) || estMatrice(valeur) || estListe(valeur))) {
        next(); // '['
        let idx1 = (peek() && peek().type !== ',' && peek().type !== ']') ? parseOr() : null;
        if (peek() && peek().type === ',') {
          next();
          let idx2 = (peek() && peek().type !== ']') ? parseOr() : null;
          if (!peek() || peek().type !== ']') throw new Error("Crochet fermant manquant pour l'indexation");
          next();
          valeur = accederMatrice(valeur, idx1, idx2, "resultat");
          continue;
        }
        if (!peek() || peek().type !== ']') throw new Error("Crochet fermant manquant pour l'indexation");
        next();
        valeur = accederUnique(valeur, idx1, "resultat");
        continue;
      }
      break;
    }
    return valeur;
  }
  function parsePrimaryBrute() {
    let t = peek();
    if (!t) throw new Error("Expression incomplete");
    if (t.type === 'num') { next(); return t.v; }
    if (t.type === 'str') { next(); return t.v; }
    if (t.type === '(') {
      next(); let v = parseOr();
      if (!peek() || peek().type !== ')') throw new Error("Parenthese fermante manquante");
      next(); return v;
    }
    if (t.type === 'ident') {
      next();
      if (t.v === 'fonc' && peek() && peek().type === '(') {
        let r = construireFonctionAnonyme(tokens, pos);
        pos = r.pos;
        return r.valeur;
      }
      if (t.v === 'VRAI') return true;
      if (t.v === 'FAUX') return false;
      if (t.v === 'pasdefini') {
        if (peek() && peek().type === '(') throw new Error(t.v + " est une constante (comme VRAI/FAUX), pas une fonction : ecris-la sans parentheses, \"" + t.v + "\" au lieu de \"" + t.v + "()\"");
        return undefined;
      }
      if (t.v === 'lettr' || t.v === 'Lettr') {
        if (peek() && peek().type === '(') throw new Error(t.v + " est une constante (comme VRAI/FAUX), pas une fonction : ecris-la sans parentheses, \"" + t.v + "\" au lieu de \"" + t.v + "()\"");
        return t.v === 'lettr' ? alphabetMinuscule() : alphabetMajuscule();
      }
      if (t.v === 'parent' && peek() && peek().type === 'op' && peek().v === '.') {
        // parent.methode(...) execute un corps entier : ca a besoin d'etre async.
        throw new __BesoinAsync();
      }
      if (Object.prototype.hasOwnProperty.call(classes, t.v) && peek() && peek().type === 'op' && peek().v === '.' &&

function produitScalaire(g, d) {
  if (!estVecteur(g) || !estVecteur(d)) throw new Error("'.' (produit scalaire) attend deux vecteurs");
  if (g.length !== d.length) throw new Error("'.' : les deux vecteurs doivent avoir la meme taille (" + g.length + " et " + d.length + ")");
  let somme = 0;
  for (let i = 0; i < g.length; i++) {
    if (typeof g[i] !== 'number' || typeof d[i] !== 'number') throw new Error("'.' : le produit scalaire ne fonctionne que sur des vecteurs numeriques");
    somme += g[i] * d[i];
  }
  return somme;

// '×' : produit vectoriel, defini uniquement pour des vecteurs de taille 3.
function produitVectoriel(g, d) {
  if (!estVecteur(g) || !estVecteur(d)) throw new Error("'×' (produit vectoriel) attend deux vecteurs");
  if (g.length !== 3 || d.length !== 3) throw new Error("'×' : le produit vectoriel n'est defini que pour des vecteurs de taille 3");
  return [g[1] * d[2] - g[2] * d[1], g[2] * d[0] - g[0] * d[2], g[0] * d[1] - g[1] * d[0]];

// '..' : produit matriciel classique (A est m x n, B doit etre n x p).
function produitMatriciel(g, d) {
  if (!estMatrice(g) || !estMatrice(d)) throw new Error("'..' (produit matriciel) attend deux matrices");
  if (g.ncol !== d.nlig) throw new Error("'..' : dimensions incompatibles (" + g.nlig + "x" + g.ncol + " et " + d.nlig + "x" + d.ncol + ")");
  let donnees = new Array(g.nlig * d.ncol);
  for (let i = 0; i < g.nlig; i++) {
    for (let j = 0; j < d.ncol; j++) {
      let s = 0;
      for (let k = 0; k < g.ncol; k++) s += g.donnees[k * g.nlig + i] * d.donnees[j * d.nlig + k];
      donnees[j * g.nlig + i] = s;
    }

  return { __type: "matrice", nlig: g.nlig, ncol: d.ncol, donnees: donnees };

// som(v) : somme des elements d'un vecteur (ou d'une matrice, elements confondus).
function sommeVecteur(v) {
  if (estMatrice(v)) v = v.donnees;
  if (!estVecteur(v)) { if (typeof v === 'number') return v; throw new Error("som(...) attend un vecteur"); }
  let s = 0;
  for (let e of v) { if (typeof e !== 'number') throw new Error("som(...) : tous les elements doivent etre numeriques"); s += e; }
  return s;
}

// moy(v) : moyenne (arithmetique) des elements d'un vecteur (ou d'une matrice, elements confondus).
function moyenneVecteur(v) {
  if (estMatrice(v)) v = v.donnees;
  if (!estVecteur(v)) { if (typeof v === 'number') return v; throw new Error("moy(...) attend un vecteur"); }
  if (v.length === 0) throw new Error("moy(...) : le vecteur est vide");
  let s = 0;
  for (let e of v) { if (typeof e !== 'number') throw new Error("moy(...) : tous les elements doivent etre numeriques"); s += e; }
  return s / v.length;

// var(v) : variance (comme en R : variance d'echantillon, divisee par n-1).
function varianceVecteur(v) {
  if (estMatrice(v)) v = v.donnees;
  if (!estVecteur(v)) throw new Error("var(...) attend un vecteur");
  if (v.length < 2) throw new Error("var(...) : il faut au moins 2 valeurs pour calculer une variance (recu " + v.length + ")");
  let m = moyenneVecteur(v);
  let s = 0;
  for (let e of v) { if (typeof e !== 'number') throw new Error("var(...) : tous les elements doivent etre numeriques"); s += (e - m) * (e - m); }

// sd(v) : ecart-type = racine carree de la variance (comme en R : ecart-type d'echantillon).
function ecartTypeVecteur(v) {
  return Math.sqrt(varianceVecteur(v));
}

// Fonction commune a max(...) et min(...) : aplatit tous les arguments (nombres, vecteurs,
// matrices confondus) puis en garde le plus grand (ou le plus petit) element, comme en R
// ou max()/min() acceptent plusieurs arguments et les combinent tous ensemble.
function agregerMinMax(valeurs, nom, plusExtreme) {
  let plat = [];
  for (let v of valeurs) {
    if (estMatrice(v)) plat.push(...v.donnees);
    else if (estVecteur(v)) plat.push(...v);
    else plat.push(v);
  }
  if (plat.length === 0) throw new Error(nom + "(...) attend au moins un argument");
  let res = plat[0];
  for (let e of plat) {
    if (typeof e !== 'number') throw new Error(nom + "(...) : tous les elements doivent etre numeriques");
    if (plusExtreme(e, res)) res = e;
  }

function maxVecteur(v) { return agregerMinMax([v], "max", (e, res) => e > res); }
function minVecteur(v) { return agregerMinMax([v], "min", (e, res) => e < res); }


// det(m) : determinant par elimination de Gauss avec pivot partiel (matrice carree requise).
function determinantMatrice(m) {
  if (!estMatrice(m)) throw new Error("det(...) attend une matrice");
  if (m.nlig !== m.ncol) throw new Error("det(...) : la matrice doit etre carree (recue : " + m.nlig + "x" + m.ncol + ")");
  let n = m.nlig, a = [];
  for (let l = 0; l < n; l++) { let ligne = []; for (let c = 0; c < n; c++) ligne.push(m.donnees[c * n + l]); a.push(ligne); }
  let det = 1;
  for (let col = 0; col < n; col++) {
    let pivot = col;
    for (let l = col + 1; l < n; l++) if (Math.abs(a[l][col]) > Math.abs(a[pivot][col])) pivot = l;
    if (Math.abs(a[pivot][col]) < 1e-12) return 0;
    if (pivot !== col) { let tmp = a[pivot]; a[pivot] = a[col]; a[col] = tmp; det = -det; }
    det *= a[col][col];
    for (let l = col + 1; l < n; l++) {
      let facteur = a[l][col] / a[col][col];
      for (let c = col; c < n; c++) a[l][c] -= facteur * a[col][c];
    }
  }
  return Math.round(det * 1e9) / 1e9;
}

// Transposee d'une matrice R x C (nlig x ncol) : renvoie une matrice C x R ou
// l'element [i][j] de la transposee vaut l'element [j][i] de l'originale.
// Le stockage interne est toujours par colonne (comme le reste du langage).
function transposerMatrice(m) {
  let R = m.nlig, C = m.ncol;
  let donnees = new Array(R * C);
  for (let j = 0; j < R; j++) {     // j : ligne d'origine (0..R-1) -> devient colonne dans la transposee
    for (let i = 0; i < C; i++) {   // i : colonne d'origine (0..C-1) -> devient ligne dans la transposee
      donnees[j * C + i] = m.donnees[i * R + j];
    }
  }
  return { __type: "matrice", nlig: C, ncol: R, donnees: donnees };
}

// nom.ajout(...) : ajoute des elements a un vecteur/une matrice EXISTANTS, sans rien ecraser.
// Pour une matrice : ajoute comme nouvelle(s) colonne(s) (coherent avec le remplissage par
// colonne par defaut) -- le nombre d'elements doit etre un multiple du nombre de lignes.
function ajouterVecteur(v, elements) {
  v.push(...elements);
  let coherent = unifierTypeVecteur(v);
  for (let i = 0; i < v.length; i++) v[i] = coherent[i];
}
// nom.ajout(...) sur une liste : chaque argument est pousse TEL QUEL (pas de fusion/
// aplatissement comme pour un vecteur), pas d'unification de type : c'est tout l'interet
// de liste() par rapport a c().
function ajouterListe(li, elements) {
  li.elements.push(...elements);
}
// nom.supri(...) sur une liste : supprime, pour chaque valeur donnee, sa PREMIERE
// occurrence trouvee (comparaison par egalite simple, comme pour un vecteur).
function supprimerListe(li, elements) {
  for (let el of elements) {
    let idx = li.elements.findIndex(x => x === el);
    if (idx === -1) {
      throw new Error(".supri(...) : la valeur " + JSON.stringify(el) + " n'a pas ete trouvee dans la liste");
    }
    li.elements.splice(idx, 1);
  }
}


// nom.supri(...) : supprime des elements d'un vecteur/une matrice EXISTANTS (inverse de .ajout()).
// Pour un vecteur : supprime, pour chaque valeur donnee, sa PREMIERE occurrence trouvee
// (v~c(2,3,2,5) ; v.supri(2,3) -> reste c(2,5)).
function supprimerVecteur(v, elements) {
  for (let el of elements) {
    let idx = v.findIndex(x => x === el);
    if (idx === -1) {
      throw new Error(".supri(...) : la valeur " + JSON.stringify(el) + " n'a pas ete trouvee dans le vecteur");
    }
    v.splice(idx, 1);
  }
}
// Pour une matrice : meme logique que .ajout(), mais en sens inverse -- les elements
// donnes (par groupe de nlig, comme pour l'ajout) doivent correspondre exactement a
// une colonne existante, qui est alors supprimee (la premiere trouvee qui correspond).
function supprimerMatrice(m, elements) {
  if (elements.length % m.nlig !== 0) {
    throw new Error(".supri(...) sur une matrice : le nombre d'elements donnes (" + elements.length + ") doit etre un multiple du nombre de lignes (" + m.nlig + "), car la suppression se fait par colonne(s) entiere(s)");
  }
  for (let i = 0; i < elements.length; i += m.nlig) {
    let bloc = elements.slice(i, i + m.nlig);
    let colTrouvee = -1;
    for (let c = 0; c < m.ncol; c++) {
      let colonne = m.donnees.slice(c * m.nlig, c * m.nlig + m.nlig);
      if (colonne.every((v, j) => v === bloc[j])) { colTrouvee = c; break; }
    }
    if (colTrouvee === -1) {
      throw new Error(".supri(...) sur une matrice : aucune colonne ne correspond exactement aux valeurs donnees (" + bloc.join(",") + ")");
    }
    m.donnees.splice(colTrouvee * m.nlig, m.nlig);
    m.ncol -= 1;
  }
}

// Agrandit une matrice existante a nligCible x ncolCible (>= dimensions actuelles), en
// remplissant les nouvelles cases avec 0. Reconstruit les donnees en respectant le
// format en colonne utilise partout ailleurs dans le langage. Utilisee pour permettre
// l'agrandissement automatique lors d'une affectation m[ligne,colonne] ~ valeur qui
// depasse les dimensions actuelles (comme si on "remplissait" au-dela du bord).
function agrandirMatrice(m, nligCible, ncolCible) {
  let nouvelles = new Array(nligCible * ncolCible).fill(0);
  for (let c = 0; c < m.ncol; c++) {
    for (let l = 0; l < m.nlig; l++) {
      nouvelles[c * nligCible + l] = m.donnees[c * m.nlig + l];
    }
  }
  m.donnees = nouvelles;
  m.nlig = nligCible;
  m.ncol = ncolCible;
}

// Calcule le plus grand indice numerique demande par un descripteur d'indice (nombre,
// vecteur d'indices, ou null pour "tout"). Renvoie 0 si l'indexation est logique (un
// vecteur de booleens) ou vide, cas ou l'agrandissement automatique n'a pas de sens
// (la taille doit deja correspondre a l'existant).
function calculerIndiceMax(idx) {
  if (idx === null) return 0;
  if (typeof idx === 'number') return idx;
  let plat = estMatrice(idx) ? idx.donnees : idx;
  if (!estVecteur(plat)) return 0;
  if (plat.length > 0 && typeof plat[0] === 'boolean') return 0;
  let mx = 0;
  for (let n of plat) if (typeof n === 'number' && n > mx) mx = n;
  return mx;
}

// v[indice] -- indices a partir de 1, comme en R.
// Tire x elements au hasard, sans remise, parmi un tableau JS plat (melange partiel de
// Fisher-Yates, sans copier tout le tableau plus d'une fois). Utilise par alea(...).
function tirerAuHasardSansRemise(tableau, x) {
  let copie = tableau.slice();
  let n = copie.length;
  for (let i = 0; i < x; i++) {
    let j = i + Math.floor(Math.random() * (n - i));
    let tmp = copie[i]; copie[i] = copie[j]; copie[j] = tmp;
  }
  return copie.slice(0, x);
}

// Tire x elements au hasard, AVEC remise (chaque tirage est independant, un meme
// element peut ressortir plusieurs fois). Utilise par ralea(...).
function tirerAuHasardAvecRemise(tableau, x) {
  let resultat = [];
  for (let i = 0; i < x; i++) resultat.push(tableau[Math.floor(Math.random() * tableau.length)]);
  return resultat;
}

function verifierIndiceEntier(v, nom) {
  if (typeof v !== 'number' || !Number.isInteger(v)) throw new Error("Indice invalide pour " + nom);
  return v;
}

// Resout un indice (nombre, vecteur d'indices, ou vecteur logique) en tableau de positions 0-based.
function resoudreIndicesVecteur(idx, tailleMax, nom) {
  if (estMatrice(idx)) idx = idx.donnees;
  if (!estVecteur(idx)) throw new Error("Indice invalide pour " + nom);
  if (idx.length > 0 && typeof idx[0] === 'boolean') {
    if (idx.length !== tailleMax) throw new Error("Indexation logique pour " + nom + " : longueur " + idx.length + " differente de " + tailleMax);
    let res = [];
    for (let i = 0; i < tailleMax; i++) if (idx[i] === true) res.push(i);
    return res;
  }
  let res = [];
  for (let n of idx) {
    verifierIndiceEntier(n, nom);
    if (n < 1 || n > tailleMax) throw new Error("Indice " + n + " hors limites pour " + nom + " (taille " + tailleMax + ")");
    res.push(n - 1);
  }
  return res;
}

// Resout un indice de dimension (ligne ou colonne) : null (tout), nombre, ou vecteur/logique.
function resoudreIndicesDim(idx, tailleMax, nom) {
  if (idx === null) { let r = []; for (let i = 0; i < tailleMax; i++) r.push(i); return r; }
  if (typeof idx === 'number') {
    verifierIndiceEntier(idx, nom);
    if (idx < 1 || idx > tailleMax) throw new Error("Indice " + idx + " hors limites pour " + nom + " (taille " + tailleMax + ")");
    return [idx - 1];
  }
  return resoudreIndicesVecteur(idx, tailleMax, nom);
}

// v[indice] -- indices a partir de 1, comme en R.
// indice peut etre : vide (tout le vecteur), un nombre (un seul element), un vecteur
// d'indices (ex: c(2,5) ou 2:4), ou un vecteur logique de meme taille (ex: v[v>3]).
function accederVecteur(v, indice, nom) {
  if (!estVecteur(v)) throw new Error(nom + " n'est pas un vecteur");
  if (indice === null) return v.slice();
  if (typeof indice === 'number') {
    verifierIndiceEntier(indice, nom);
    if (indice < 1 || indice > v.length) throw new Error("Indice " + indice + " hors limites pour " + nom + " (taille " + v.length + ")");
    return v[indice - 1];
  }
  let positions = resoudreIndicesVecteur(indice, v.length, nom);
  return positions.map(p => v[p]);
}

// Indexation a un seul crochet, valable pour un vecteur OU une matrice (traitee "a plat",
