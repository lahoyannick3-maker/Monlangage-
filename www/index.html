        let v = await evalExpr(args[0], ctxExpr);
        return nomNature(v);
    };

    // conver.nombr(var) / conver.text(var) / conver.vecteu(var) / conver.matric(var) : conversions de type.
    fonctionsBase["conver.nombr"] = fonctionsExpression["conver.nombr"] = async function(args, ctxExpr) {
        if (args.length !== 1) throw new Error("conver.nombr(...) attend exactement 1 argument");
        let v = await evalExpr(args[0], ctxExpr);
        if (typeof v === 'number') return v;
        if (typeof v === 'boolean') return v ? 1 : 0;
        if (typeof v === 'string') {
            let texte = v.trim();
            let n = Number(texte);
            if (texte === "" || isNaN(n)) throw new Error("conver.nombr(...) : impossible de convertir |" + v + "| en nombre");
            return n;
        }
        throw new Error("conver.nombr(...) attend un nombre, un texte ou un booleen (recu : " + nomNature(v) + ")");
    };
    fonctionsBase["conver.text"] = fonctionsExpression["conver.text"] = async function(args, ctxExpr) {
        if (args.length !== 1) throw new Error("conver.text(...) attend exactement 1 argument");
        let v = await evalExpr(args[0], ctxExpr);
        if (typeof v === 'string') return v;
        if (typeof v === 'number') return String(v);
        if (typeof v === 'boolean') return v ? "VRAI" : "FAUX";
        throw new Error("conver.text(...) attend un nombre, un texte ou un booleen (recu : " + nomNature(v) + ")");
    };
    fonctionsBase["conver.vecteu"] = fonctionsExpression["conver.vecteu"] = async function(args, ctxExpr) {
        if (args.length !== 1) throw new Error("conver.vecteu(...) attend exactement 1 argument");
        let v = await evalExpr(args[0], ctxExpr);
        if (estVecteur(v)) return v.slice();
        if (estMatrice(v)) return v.donnees.slice();
        return [v]; // nombre, texte ou booleen -> vecteur a 1 element
    };
    fonctionsBase["conver.matric"] = fonctionsExpression["conver.matric"] = async function(args, ctxExpr) {
        if (args.length !== 1) throw new Error("conver.matric(...) attend exactement 1 argument");
        let v = await evalExpr(args[0], ctxExpr);
        if (estMatrice(v)) return { __type: "matrice", nlig: v.nlig, ncol: v.ncol, donnees: v.donnees.slice() };
        if (estVecteur(v)) {
            if (v.length === 0) throw new Error("conver.matric(...) : impossible de convertir un vecteur vide en matrice");
            return { __type: "matrice", nlig: v.length, ncol: 1, donnees: v.slice() };
        }
        return { __type: "matrice", nlig: 1, ncol: 1, donnees: [v] };
    };

    // est.nombr(var) / est.text(var) / est.vecteu(var) / est.matric(var) : verification de type.
    fonctionsBase["est.nombr"] = fonctionsExpression["est.nombr"] = async function(args, ctxExpr) {
        if (args.length !== 1) throw new Error("est.nombr(...) attend exactement 1 argument");
        return typeof (await evalExpr(args[0], ctxExpr)) === 'number';
    };
    fonctionsBase["est.text"] = fonctionsExpression["est.text"] = async function(args, ctxExpr) {
        if (args.length !== 1) throw new Error("est.text(...) attend exactement 1 argument");
        return typeof (await evalExpr(args[0], ctxExpr)) === 'string';
    };
    fonctionsBase["est.vecteu"] = fonctionsExpression["est.vecteu"] = async function(args, ctxExpr) {
        if (args.length !== 1) throw new Error("est.vecteu(...) attend exactement 1 argument");
        return estVecteur(await evalExpr(args[0], ctxExpr));
    };
    fonctionsBase["est.matric"] = fonctionsExpression["est.matric"] = async function(args, ctxExpr) {
        if (args.length !== 1) throw new Error("est.matric(...) attend exactement 1 argument");
        return estMatrice(await evalExpr(args[0], ctxExpr));
    };
    fonctionsBase["est.liste"] = fonctionsExpression["est.liste"] = async function(args, ctxExpr) {
        if (args.length !== 1) throw new Error("est.liste(...) attend exactement 1 argument");
        return estListe(await evalExpr(args[0], ctxExpr));
    };
    fonctionsBase["est.fonction"] = fonctionsExpression["est.fonction"] = async function(args, ctxExpr) {
        if (args.length !== 1) throw new Error("est.fonction(...) attend exactement 1 argument");
        return estValeurFonction(await evalExpr(args[0], ctxExpr));
    };
    // est.instance(objet, NomClasse) : VRAI si objet est une instance de NomClasse, ou d'une
    // classe qui en herite (comme isinstance(objet, NomClasse) en Python). Le 2e argument est
    // le NOM de la classe tel quel (pas evalue comme une expression : ce n'est pas une variable).
    fonctionsBase["est.instance"] = fonctionsExpression["est.instance"] = async function(args, ctxExpr) {
        if (args.length !== 2) throw new Error("est.instance(objet, NomClasse) attend exactement 2 arguments");
        let objet = await evalExpr(args[0], ctxExpr);
        let nomClasse = args[1].trim();
        if (!Object.prototype.hasOwnProperty.call(classes, nomClasse)) throw new Error("est.instance(...) : \"" + nomClasse + "\" n'est pas une classe connue");
        if (!objet || typeof objet !== 'object' || objet.__classe === undefined) return false;
        let c = objet.__classe;
        while (c) {
            if (c === nomClasse) return true;
            c = classes[c] ? classes[c].parent : null;
        }
        return false;
    };

    // aide() : liste toutes les commandes, groupees par categorie. aide(nom_ou_symbole) : detail sur une seule.
    fonctionsBase["aide"] = async function(args, ctxExpr) {
        if (args.length === 0 || args[0].trim() === "") {
            let categories = [];
            for (let e of aideCommandes) if (!categories.includes(e.categorie)) categories.push(e.categorie);
            let lignes = ["=== Commandes de MonLangage ==="];
            for (let cat of categories) {
                lignes.push("");
                lignes.push("-- " + cat + " --");
                for (let e of aideCommandes) {
                    if (e.categorie !== cat) continue;
                    lignes.push("  " + e.syntaxe);
                    for (let d of e.description) lignes.push("    " + d);
                    if (e.exemple) lignes.push("    Exemple : " + e.exemple.split("\n").join("\n              "));
                }
            }
            lignes.push("");
            lignes.push("(aide(nom) pour le detail d'une seule commande, ex: aide(matrice) ou aide(+))");
            print(lignes.join("\n"));
            return;
        }
        let cle = args[0].trim();
        if (/^\|.*\|$/.test(cle)) cle = cle.slice(1, -1).trim();
        let entree = aideCommandes.find(e => e.noms.includes(cle));
        if (!entree) { print("Aucune aide trouver pour : " + cle); return; }
        let lignes = ["[" + entree.categorie + "]", entree.syntaxe];
        for (let d of entree.description) lignes.push(d);
        if (entree.exemple) lignes.push("Exemple : " + entree.exemple);
        print(lignes.join("\n"));
    };

    // effa() : efface toute la console (comme l'ancien bouton "Effacer Console").
    // effa(a, e, ...) : supprime ces variables de la memoire (sans toucher a l'affichage).
    fonctionsBase["effa"] = async function(args, ctxExpr) {
        if (args.length === 0 || (args.length === 1 && args[0].trim() === "")) {
            clearConsole();
            return;
        }
        let supprimes = [], inconnus = [];
        for (let a of args) {
            let nom = a.trim();
            if (!/^[a-zA-Z_]\w*$/.test(nom)) throw new Error("effa(...) : argument invalide : " + nom);
            let trouve = false;
            for (let i = scopes.length - 1; i >= 0; i--) {
                if (Object.prototype.hasOwnProperty.call(scopes[i], nom)) { delete scopes[i][nom]; trouve = true; break; }
            }
            if (trouve) supprimes.push(nom); else inconnus.push(nom);
        }
        if (supprimes.length) print((supprimes.length > 1 ? "Elements supprimer : " : "Element supprimer : ") + supprimes.join(", "));
        if (inconnus.length) print((inconnus.length > 1 ? inconnus.join(", ") + " ne sont pas stocker en memoire : ils ne peuvent pas etre effacer." : inconnus.join(", ") + " n'est pas stocker en memoire : il ne peut pas etre effacer.") , "erreur");
    };

    // voi() : liste les noms de tous les elements actuellement stockes en memoire.
    // voi(a, e, ...) : confirme pour chacun s'il est stocke ou non.
    fonctionsBase["voi"] = async function(args, ctxExpr) {
        if (args.length === 0 || (args.length === 1 && args[0].trim() === "")) {
            let noms = [];
            for (let s of scopes) {
                for (let nom of Object.keys(s)) {
                    if (nom.startsWith("__ext")) continue;
                    if (!noms.includes(nom)) noms.push(nom);
                }
            }
            if (noms.length === 0) print("Aucun element stocker pour le moment.");
            else print("Elements stocker : " + noms.join(", "));
            return;
        }
        let trouves = [], nonTrouves = [];
        for (let a of args) {
            let nom = a.trim();
            if (!/^[a-zA-Z_]\w*$/.test(nom)) throw new Error("voi(...) : argument invalide : " + nom);
            let existe = false;
            for (let i = scopes.length - 1; i >= 0; i--) {
                if (Object.prototype.hasOwnProperty.call(scopes[i], nom)) { existe = true; break; }
            }
            if (existe) trouves.push(nom); else nonTrouves.push(nom);
        }
        if (trouves.length) print("Oui, " + trouves.join(", ") + (trouves.length > 1 ? " sont stocker." : " est stocker."));
        if (nonTrouves.length) print("Non, " + nonTrouves.join(", ") + (nonTrouves.length > 1 ? " ne sont pas stocker." : " n'est pas stocker."));
    };

    // Codes couleur simplifies façon Scilab, mais en francais (une ou deux lettres),
    // pour eviter d'avoir a taper un code hexadecimal.
    let COULEURS_TRAC = {
        r: "#f85149",   // rouge
        v: "#3fb950",   // vert
        b: "#58a6ff",   // bleu
        n: "#000000",   // noir (peu visible sur fond sombre, prevoir un fond clair si besoin)
        j: "#e3b341",   // jaune
        m: "#ff5fd1",   // magenta
        c: "#39d0d8",   // cyan
        bl: "#f0f6fc"   // blanc
    };

    fonctionsBase["trac"] = async function(args, ctxExpr) {
        if (args.length < 1) throw new Error("trac(...) attend au moins un vecteur : trac(y)  ou  trac(x, y)");

        // Separe les arguments positionnels des options nommees (cle~valeur)
        let clesOptions = ["couleur", "type", "titre", "xlab", "ylab"];
        let positionnels = [], nommes = {};
        for (let a of args) {
            let m = a.trim().match(/^(\w+)\s*~\s*(.*)$/);
            if (m && clesOptions.includes(m[1])) nommes[m[1]] = m[2];
            else positionnels.push(a);
        }
        if (positionnels.length < 1) throw new Error("trac(...) attend au moins un vecteur : trac(y)  ou  trac(x, y)");

        // Lit une option comme texte : |...| litteral, sinon expression convertie en texte
        async function texteOption(cle, defaut) {
            if (!(cle in nommes)) return defaut;
            let s = nommes[cle].trim();
            if (/^\|[\s\S]*\|$/.test(s)) return s.slice(1, -1);
            verifierTexteLitteralFerme(s);
            return String(await evalExpr(s, ctxExpr));
        }

        let couleur = await texteOption("couleur", "b");
        let type = await texteOption("type", "-");
        let titre = await texteOption("titre", "");
        let xlab = await texteOption("xlab", "");
        let ylab = await texteOption("ylab", "");

        // couleur : lettre(s) façon Scilab (r, v, b, n, j, m, c, bl) ou code hexadecimal direct
        let coCode = couleur.trim().toLowerCase();
        if (Object.prototype.hasOwnProperty.call(COULEURS_TRAC, coCode)) couleur = COULEURS_TRAC[coCode];

        // style/type : "-" (trait, par defaut) ou "o" (points), comme les styles plot() de Scilab
        let tyCode = type.trim().toLowerCase();
        type = (tyCode === "o" || tyCode === "points" || tyCode === "point") ? "points" : "lignes";

        // Comme en Scilab : les points (x, y) doivent deja etre calcules avant l'appel.
        // trac(x, y)  -> trace y en fonction de x
        // trac(y)     -> trace y en fonction de sa position (1, 2, 3...)
        let premierVal = await evalExpr(positionnels[0], ctxExpr);
        if (!estVecteur(premierVal)) throw new Error("trac(...) : l'argument doit etre un vecteur (calcule au prealable, comme en Scilab)");

        let xs, ys;
        if (positionnels.length >= 2) {
            let deuxiemeVal = await evalExpr(positionnels[1], ctxExpr);
            if (!estVecteur(deuxiemeVal)) throw new Error("trac(...) : le deuxieme argument doit etre un vecteur");
            if (premierVal.length !== deuxiemeVal.length) throw new Error("trac(...) : x et y doivent avoir la meme longueur");
            xs = premierVal; ys = deuxiemeVal;
            if (!xlab) xlab = "x";
            if (!ylab) ylab = "y";
        } else {
            ys = premierVal;
            xs = [];
            for (let i = 0; i < ys.length; i++) xs.push(i + 1);
            if (!xlab) xlab = "indice";
            if (!ylab) ylab = "y";
        }
        for (let v of xs) verifierNombre(v, "trac");
        for (let v of ys) verifierNombre(v, "trac");

        dessinerCourbe(xs, ys, { couleur, type, titre, xlab, ylab, grille: false });
    };

    // grille(...) : active ou desactive la grille sur le DERNIER graphique trace avec
    // trac(...) — comme xgrid() en Scilab, ou la grille n'est pas affichee par defaut.
    // grille()      -> active la grille
    // grille(FAUX)  -> desactive la grille
    fonctionsBase["grille"] = async function(args, ctxExpr) {
        if (!dernierGraphique) throw new Error("grille(...) : aucun graphique n'a encore ete trace, utilise trac(...) avant");
        let actif = true;
        if (args.length >= 1 && args[0].trim() !== "") actif = estVrai(await evalExpr(args[0], ctxExpr));
        dernierGraphique.options.grille = actif;
        dessinerCourbe(dernierGraphique.xs, dernierGraphique.ys, dernierGraphique.options, dernierGraphique.canvas);
    };

    // Pour ajouter une future fonction native :
    // - fonctionsBase["nom"] = async (args, ctxExpr) => { ... };  -> utilisable en instruction + base.nom(...)
    // - ajouter aussi fonctionsExpression["nom"] = fonctionsBase["nom"]; si elle doit
    //   pouvoir etre utilisee a l'interieur d'une expression (ex: x ~ nom(...)).
}

/* ===================== COLORATION SYNTAXIQUE ===================== */
// Une couleur par categorie (voir aideCommandes), pour ne pas avoir une seule couleur
// unique pour toutes les commandes. Utilise a la fois pour l'affichage dans la console
// (resultats) ET pour la coloration en direct pendant la frappe (editeur + console).
let categorieCouleurs = {
  "Base": "#ff7b72",
  "Controle": "#d2a8ff",
  "Creer un vecteur/une matrice": "#7ee787",
  "Infos sur un vecteur/une matrice": "#f2cc60",
  "Acceder / modifier un element": "#ff9bce",
  "Console": "#e3b341",
  "Graphique": "#56d4dd",
  "Fonctions mathematiques": "#f2a65a",
  "Texte": "#79c0ff",
  "Sauvegarde": "#a5d6ff",
  "Constantes": "#56d4dd"
};
// Construit nom -> couleur a partir de aideCommandes (uniquement les noms "mots", pas
// les symboles comme +, -, [, ], qui restent geres a part).
let commandeCouleur = {};
for (let e of aideCommandes) {
  if (!categorieCouleurs[e.categorie]) continue;
  for (let nom of e.noms) {
    if (/^[a-zA-Z_]\w*$/.test(nom)) commandeCouleur[nom] = categorieCouleurs[e.categorie];
  }
}
// conver.nombr, est.text, existe.fichier, voir.cle, supri.cle, etc. contiennent un '.' :
// ils ne passent pas le test ci-dessus. On colore au moins le prefixe.
commandeCouleur["conver"] = categorieCouleurs["Base"];
commandeCouleur["est"] = categorieCouleurs["Base"];
commandeCouleur["existe"] = categorieCouleurs["Sauvegarde"];
commandeCouleur["voir"] = categorieCouleurs["Sauvegarde"];
commandeCouleur["supri"] = categorieCouleurs["Sauvegarde"];
let regexCommandeCouleur = Object.keys(commandeCouleur).length
  ? new RegExp('\\b(' + Object.keys(commandeCouleur).join('|') + ')\\b', 'g')
  : null;

function echapperHTML(texte) {
  return String(texte).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// Colore un morceau de CODE (pas de texte litteral |...|) : commandes reconnues par
// categorie, VRAI/FAUX, ENTI/MOD/et/ou, ~ (affectation), et les nombres (colores par
// defaut, y compris les decimaux).
function colorerCode(texte) {
  let html = echapperHTML(texte);
  html = html.replace(/~/g, '<span class="operateur">~</span>');
  if (regexCommandeCouleur) {
    html = html.replace(regexCommandeCouleur, function(match) {
      return '<span style="color:' + commandeCouleur[match] + '; font-weight:bold;">' + match + '</span>';
    });
  }
  html = html.replace(/\b(VRAI|FAUX|pasdefini)\b/g, '<span style="color:#56d4dd; font-weight:bold;">$1</span>');
  // racineN() : racine2, racine3, racine10... Le regex generique ci-dessus ne reconnait que le
  // mot exact "racine" (limite de mot \b), pas colle a des chiffres (meme souci que mod/enti).
  html = html.replace(/(?<![a-zA-Z0-9_])(racine\d+)(?=\()/g, '<span style="color:' + categorieCouleurs["Fonctions mathematiques"] + '; font-weight:bold;">$1</span>');
  // mod/enti : comme dans le tokeniseur d'expression, reconnus sans espace autour, colles a des
  // chiffres (3mod4, 3ENTI4, 3Enti4...) et sans distinction de casse. On utilise un "regard
  // arriere/avant" plutot que \b, car \b ne separe pas un chiffre d'une lettre (3 et e sont tous
  // deux consideres comme des caracteres de mot).
  html = html.replace(/(?<![a-zA-Z_])(mod|enti)(?![a-zA-Z_])/gi, '<span class="operateur">$1</span>');
  // et/ou restent des mots complets en minuscules (comme dans le tokeniseur), non colles a un chiffre.
  html = html.replace(/\b(et|ou|dan)\b/g, '<span class="operateur">$1</span>');
  // Nombres : evalues apres mod/enti pour que 3enti4 colore bien le 3 et le 4 (le mod/enti deja
  // isole dans une balise <span> cree la coupure necessaire pour que \b fonctionne).
  html = html.replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="nombre">$1</span>');
  return html;
}

// Comme colorerCode, mais isole d'abord le texte litteral |...| pour ne jamais colorer
// une commande qui apparait a l'interieur d'un texte (ex: affi(|pou est cool|) ne doit
// pas colorer "pou"). Utilisee pour la console (resultats) ET pour la coloration en
// direct de l'editeur et de la ligne de commande console.
function genererHTMLColore(texte) {
  texte = String(texte);
  let resultat = "", i = 0, n = texte.length;
  while (i < n) {
    if (texte[i] === '*' && texte[i + 1] === '*') {
      let j = i;
      while (j < n && texte[j] !== '\n') j++;
      resultat += '<span style="color:#8b949e; font-style:italic;">' + echapperHTML(texte.slice(i, j)) + '</span>';
      i = j;
    } else if (texte[i] === '|') {
      let j = i + 1;
      while (j < n && texte[j] !== '|') j++;
      let finInclus = j < n ? j + 1 : n;
      resultat += echapperHTML(texte.slice(i, finInclus));
      i = finInclus;
    } else {
      let debut = i;
      while (i < n && texte[i] !== '|' && !(texte[i] === '*' && texte[i + 1] === '*')) i++;
      resultat += colorerCode(texte.slice(debut, i));
    }
  }
  return resultat;
}

function colorerLigne(texte) { return genererHTMLColore(texte); }

function print(texte, classe = "") {
  let div = document.createElement("div");
  let classes = classe;
  if (modeConsoleCommande) classes = (classes ? classes + " " : "") + "resultatConsole";
  if (classes) div.className = classes;
  div.innerHTML = colorerLigne(texte);
  outputDiv.appendChild(div);
  outputDiv.scrollTop = outputDiv.scrollHeight;
}

// Comme print(), mais pour une VALEUR deja calculee (resultat de affi(...), resultat d'une
// expression tapee dans la console...) et non du code source : on echappe juste le HTML sans
// repasser par le colorisateur de commandes. Sinon un texte affiche comme affi(|ou|) se
// retrouvait recolore comme si "ou" etait l'operateur du langage, alors que ce n'est plus
// qu'un simple texte a ce stade (les | ont deja ete retires).
function printValeur(texte, classe = "") {
  let div = document.createElement("div");
  let classes = classe;
  if (modeConsoleCommande) classes = (classes ? classes + " " : "") + "resultatConsole";
  if (classes) div.className = classes;
  let texteStr = String(texte);
  // Un <div> totalement vide (innerHTML = "") n'a aucune hauteur de ligne et reste
  // invisible a l'ecran, contrairement a un <div> contenant un espace. On force donc une
  // espace insecable quand le texte est vide (ou quand une ligne interne, separee par un
  // saut de ligne, est vide), pour que affi(||) affiche bien une ligne visible, comme
  // affi(| |).
  texteStr = texteStr.split("\n").map(l => l === "" ? "\u00A0" : l).join("\n");
  div.innerHTML = echapperHTML(texteStr);
  outputDiv.appendChild(div);
  outputDiv.scrollTop = outputDiv.scrollHeight;
}

function printInvite() {
  let ligne = document.createElement("div");
  ligne.className = "ligneCommande";
  let invite = document.createElement("span");
  invite.className = "invite";
  invite.textContent = "# ";
  invite.contentEditable = "false";
  let input = document.createElement("span");
  input.className = "cmdInput";
  input.contentEditable = "true";
  ligne.appendChild(invite);
  ligne.appendChild(input);
  outputDiv.appendChild(ligne);
  outputDiv.scrollTop = outputDiv.scrollHeight;
  input.focus();
  let range = document.createRange();
  range.selectNodeContents(input);
  range.collapse(false);
  let sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

function clearConsole() {
  outputDiv.innerHTML = "";
}

/* ===================== GRAPHIQUE (trac) ===================== */
// Formate un nombre pour les graduations des axes (compact, lisible sur mobile).
function formaterNombreAxe(v) {
  if (v === 0) return "0";
  if (Math.abs(v) >= 1000 || Math.abs(v) < 0.01) return v.toExponential(1);
  return (Math.round(v * 100) / 100).toString();
}

// Memorise le dernier graphique trace (xs, ys, options, canvas) pour que la commande
// grille(...) puisse le redessiner avec la grille activee, comme xgrid() en Scilab.
let dernierGraphique = null;

// Dessine une courbe (xs, ys) dans un <canvas> ajoute a la console.
// options : { couleur, type: "lignes"|"points", titre, xlab, ylab, grille }
// canvasExistant (optionnel) : si fourni, redessine sur ce canvas au lieu d'en creer un
// nouveau (utilise par grille(...) pour mettre a jour le graphique déjà affiche).
function dessinerCourbe(xs, ys, options, canvasExistant) {
  options = options || {};
  let couleur = options.couleur || "#58a6ff";
  let type = (options.type || "lignes").toLowerCase();
  let titre = options.titre || "";
  let xlab = options.xlab || "";
  let ylab = options.ylab || "";
  let grille = !!options.grille;

  let canvas, largeurCSS, hauteurCSS, ratio;

  if (canvasExistant) {
    canvas = canvasExistant;
    largeurCSS = canvas._largeurCSS;
    hauteurCSS = canvas._hauteurCSS;
    ratio = canvas._ratio;
  } else {
    let conteneur = document.createElement("div");
    conteneur.style.margin = "8px 0";
    if (modeConsoleCommande) conteneur.className = "resultatConsole";

    if (titre) {
      let t = document.createElement("div");
      t.textContent = titre;
      t.style.color = "#c9d1d9";
      t.style.fontWeight = "bold";
      t.style.marginBottom = "4px";
      conteneur.appendChild(t);
    }

    largeurCSS = Math.max(200, Math.min((outputDiv.clientWidth || 360) - 24, 420));
    hauteurCSS = Math.round(largeurCSS * 0.65);
    ratio = window.devicePixelRatio || 1;

    canvas = document.createElement("canvas");
    canvas.width = Math.round(largeurCSS * ratio);
    canvas.height = Math.round(hauteurCSS * ratio);
    canvas.style.width = largeurCSS + "px";
    canvas.style.height = hauteurCSS + "px";
    canvas.style.background = "#010409";
    canvas.style.border = "1px solid #30363d";
    canvas.style.borderRadius = "4px";
    canvas.style.display = "block";
    canvas._largeurCSS = largeurCSS;
    canvas._hauteurCSS = hauteurCSS;
    canvas._ratio = ratio;
    conteneur.appendChild(canvas);

    outputDiv.appendChild(conteneur);
    outputDiv.scrollTop = outputDiv.scrollHeight;
  }

  let ctx = canvas.getContext("2d");
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.scale(ratio, ratio);

  let marge = { gauche: 44, droite: 12, haut: 10, bas: 28 };
  let largeurTrace = largeurCSS - marge.gauche - marge.droite;
  let hauteurTrace = hauteurCSS - marge.haut - marge.bas;

  // Points non-finis (division par zero -> Infini, 0/0 -> NaN, etc., comme une asymptote
  // sur x=0 pour y=1/x) : on les ignore pour calculer les bornes du repere (sinon un seul
  // Infini ferait exploser toute l'echelle et rendrait le graphique vide), et on coupera
  // la ligne a cet endroit au moment du trace, comme le font les autres langages de trace
  // (matplotlib, R, Scilab) qui laissent un "trou" au niveau de l'asymptote.
  let xsFinis = [], ysFinis = [];
  for (let i = 0; i < xs.length; i++) {
    if (Number.isFinite(xs[i]) && Number.isFinite(ys[i])) { xsFinis.push(xs[i]); ysFinis.push(ys[i]); }
  }
  if (xsFinis.length === 0) throw new Error("trac(...) : aucune valeur finie a tracer (toutes les valeurs sont infinies ou indefinies)");

  let xmin = Math.min(...xsFinis), xmax = Math.max(...xsFinis);
  let ymin = Math.min(...ysFinis), ymax = Math.max(...ysFinis);
  if (xmin === xmax) { xmin -= 1; xmax += 1; }
  if (ymin === ymax) { ymin -= 1; ymax += 1; }
  let padY = (ymax - ymin) * 0.08;
  ymin -= padY; ymax += padY;

  function px(x) { return marge.gauche + (x - xmin) / (xmax - xmin) * largeurTrace; }
  function py(y) { return marge.haut + hauteurTrace - (y - ymin) / (ymax - ymin) * hauteurTrace; }

  // Graduations (toujours affichees) + grille (seulement si active via grille(...))
  let nGrilleX = 4, nGrilleY = 4;
  ctx.fillStyle = "#6e7681";
  ctx.font = "10px monospace";
  ctx.textAlign = "center";
  for (let i = 0; i <= nGrilleX; i++) {
    let x = xmin + (xmax - xmin) * i / nGrilleX;
    let pxv = px(x);
    if (grille) {
      ctx.strokeStyle = "#21262d"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(pxv, marge.haut); ctx.lineTo(pxv, marge.haut + hauteurTrace); ctx.stroke();
    }
    ctx.fillText(formaterNombreAxe(x), pxv, hauteurCSS - marge.bas + 12);
  }
  ctx.textAlign = "right";
  for (let i = 0; i <= nGrilleY; i++) {
    let y = ymin + (ymax - ymin) * i / nGrilleY;
    let pyv = py(y);
    if (grille) {
      ctx.strokeStyle = "#21262d"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(marge.gauche, pyv); ctx.lineTo(largeurCSS - marge.droite, pyv); ctx.stroke();
    }
    ctx.fillText(formaterNombreAxe(y), marge.gauche - 4, pyv + 3);
  }
  ctx.textAlign = "left";

  // Axes x=0 / y=0 s'ils sont visibles
  ctx.strokeStyle = "#484f58";
  if (xmin <= 0 && xmax >= 0) { ctx.beginPath(); ctx.moveTo(px(0), marge.haut); ctx.lineTo(px(0), marge.haut + hauteurTrace); ctx.stroke(); }
  if (ymin <= 0 && ymax >= 0) { ctx.beginPath(); ctx.moveTo(marge.gauche, py(0)); ctx.lineTo(largeurCSS - marge.droite, py(0)); ctx.stroke(); }

  // Cadre
  ctx.strokeStyle = "#30363d";
  ctx.strokeRect(marge.gauche, marge.haut, largeurTrace, hauteurTrace);

  // Courbe
  ctx.strokeStyle = couleur;
  ctx.fillStyle = couleur;
  ctx.lineWidth = 2;
  if (type === "points") {
    for (let i = 0; i < xs.length; i++) {
      if (!Number.isFinite(xs[i]) || !Number.isFinite(ys[i])) continue;
      ctx.beginPath();
      ctx.arc(px(xs[i]), py(ys[i]), 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
  } else {
    ctx.beginPath();
    let enCours = false;
    for (let i = 0; i < xs.length; i++) {
      if (!Number.isFinite(xs[i]) || !Number.isFinite(ys[i])) { enCours = false; continue; }
      let X = px(xs[i]), Y = py(ys[i]);
      if (!enCours) { ctx.moveTo(X, Y); enCours = true; } else { ctx.lineTo(X, Y); }
    }
    ctx.stroke();
  }

  // Labels des axes
  ctx.fillStyle = "#8b949e";
  ctx.font = "11px monospace";
  if (xlab) { ctx.textAlign = "right"; ctx.fillText(xlab, largeurCSS - marge.droite, hauteurCSS - 4); ctx.textAlign = "left"; }
  if (ylab) {
    ctx.save();
    ctx.translate(11, marge.haut + 4);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText(ylab, 0, 0);
    ctx.restore();
  }

  dernierGraphique = { canvas: canvas, xs: xs, ys: ys, options: options };
}

/* ===================== DECOUPAGE DES ELEMENTS DE affi(...) ===================== */
// Chaque element est separe par une virgule (hors parentheses / hors texte litteral |...|)
function splitAffiElements(str) {
  let elems = [], i = 0, n = str.length, buffer = "", depth = 0;
  while (i < n) {
    let c = str[i];
    if (c === '|' && depth === 0 && buffer.trim() === "") {
      let k = i + 1, fin = -1;
      while (k < n) {
        if (str[k] === '|') { fin = k; break; }
        k++;
      }
      if (fin === -1) { elems.push(str.slice(i)); i = n; }
      else { elems.push(str.slice(i, fin + 1)); i = fin + 1; }
      buffer = "";
      continue;
    }
    if (c === '(') depth++;
    if (c === ')') depth--;
    if (c === ',' && depth === 0) {
      if (buffer.trim() !== "") elems.push(buffer);
      buffer = "";
      i++;
      continue;
    }
    buffer += c;
    i++;
  }
  if (buffer.trim() !== "") elems.push(buffer);
  return elems.map(s => s.trim());
}

// Decoupe une liste d'arguments separes par des virgules, en ignorant les virgules
// (et les parentheses) qui se trouvent A L'INTERIEUR d'un texte litteral |...|.
// Sans ca, un argument comme |i vaut |  ou  | (special)|  pouvait etre coupe au
// mauvais endroit (a cause d'une virgule ou d'une parenthese presente dans le texte),
// ou simplement mal repere a cause d'espaces autour du '|'.
function splitTopLevelComma(str) {
  let parts = [], depth = 0, buf = "", dansTexte = false;
  for (let ch of str) {
    if (ch === '|') { dansTexte = !dansTexte; buf += ch; continue; }
    if (!dansTexte) {
      if (ch === '(') depth++;
      if (ch === ')') depth--;
      if (ch === ',' && depth === 0) { parts.push(buf); buf = ""; continue; }
    }
    buf += ch;
  }
  parts.push(buf);
  return parts.map(p => p.trim());
}

// Analyse l'en-tete d'une boucle pou, sous l'une des deux syntaxes possibles :
//  - pou(var, debut, fin, pas)  : pas est facultatif (vaut 1 par defaut). var, debut, fin et pas
//    sont separes par des virgules de haut niveau (hors parentheses/texte), via splitTopLevelComma,
//    ce qui permet a debut/fin/pas d'etre des expressions complexes (ex: racine(x), c(1,2)).
//  - pou(var dan objet)  : var prend tour a tour chaque valeur du vecteur objet.
function analyserEnTetePou(token) {
  let interieur = token.slice(4, -1).trim(); // enleve "pou(" et le ")" final
  let parties = splitTopLevelComma(interieur);

  if (parties.length === 1) {
    let mDan = parties[0].match(/^(\w+)\s+dan\s+(.+)$/);
    if (!mDan) throw new Error("Syntaxe: pou(var, debut, fin, pas) ou pou(var dan objet)");
    return { type: 'dan', varNom: mDan[1], objetExpr: mDan[2].trim() };
  }

  if (parties.length === 3 || parties.length === 4) {
    let varNom = parties[0].trim();
    if (!/^\w+$/.test(varNom)) throw new Error("Syntaxe: pou(var, debut, fin, pas) ou pou(var dan objet)");
    let debutExpr = parties[1].trim();
    let finExpr = parties[2].trim();
    if (debutExpr === "" || finExpr === "") throw new Error("Syntaxe: pou(var, debut, fin, pas) ou pou(var dan objet)");
    let parExpr = parties.length === 4 ? parties[3].trim() : null;
    if (parExpr === "") throw new Error("Syntaxe: pou(var, debut, fin, pas) ou pou(var dan objet)");
    return { type: 'plage', varNom, debutExpr, finExpr, parExpr };
  }

  throw new Error("Syntaxe: pou(var, debut, fin, pas) ou pou(var dan objet)");
}

/* ===================== INSTRUCTIONS SIMPLES ===================== */
async function executerCommandeSimple(ligne) {
  if (ligne === "") return;

  // Affectation indexee : chemin[indice] ~ valeur  ou  chemin[ligne,colonne] ~ valeur
  // "chemin" peut etre une variable simple (v[i]~...) ou un chemin d'attributs chaine
  // (moi.compte[i]~..., a.b.c[i]~...), pour rester coherent avec la lecture qui accepte
  // deja moi.comptes[i] dans une expression.
  let mIdentCrochet = ligne.match(/^([a-zA-Z_]\w*(?:\.[a-zA-Z_]\w*)*)\[/);
  if (mIdentCrochet) {
    let chemin = mIdentCrochet[1];
    let j = mIdentCrochet[0].length, depth = 1;
    while (j < ligne.length && depth > 0) {
      if (ligne[j] === '[') depth++;
      else if (ligne[j] === ']') depth--;
      j++;
    }
    if (depth !== 0) throw new Error("Crochet fermant manquant pour l'indexation de " + chemin);
    let indicesStr = ligne.slice(mIdentCrochet[0].length, j - 1);
    let reste = ligne.slice(j).trim();
    let mTilde = reste.match(/^~\s*(.*)$/);
    if (mTilde) {
      let indices = splitTopLevelComma(indicesStr);
      let valeur = await evaluerElementBrut(mTilde[1], ctxExpr);
      let cible = resoudreCheminCible(chemin);
      if (indices.length === 1) {
        let idx = indices[0].trim() === "" ? null : await evalExpr(indices[0], ctxExpr);
        affecterUnique(cible, idx, valeur, chemin);
      } else if (indices.length === 2) {
        let l = indices[0].trim() === "" ? null : await evalExpr(indices[0], ctxExpr);
        let c = indices[1].trim() === "" ? null : await evalExpr(indices[1], ctxExpr);
        affecterMatrice(cible, l, c, valeur, chemin);
      } else {
        throw new Error("Indexation invalide pour " + chemin);
      }
      return;
    }
    // Si ce n'est pas une affectation (~), on laisse continuer : ce sera evalue
    // plus bas comme une expression normale (ex: affi(v[1]) passe par un autre chemin,
    // mais un simple "v[1]" seul en console tombera dans le bloc mode-console plus bas).
  }

  // Methodes sur variable : nom.ajout(...), nom.miniscul(), nom.majuscul(), nom.suprespac()
  // Les methodes texte peuvent etre enchainees : var.miniscul().suprespac()
  let mMethodesTexte = ligne.match(/^([a-zA-Z_]\w*(?:\.[a-zA-Z_]\w*)*)((?:\.(?:miniscul|majuscul|suprespac)\(\s*\))+)$/);
  if (mMethodesTexte) {
    let chemin = mMethodesTexte[1];
    let cible = resoudreCheminCible(chemin);
    if (typeof cible === "number") { return; } // nombre : rien a convertir, on ignore silencieusement
    if (typeof cible !== "string") {
      throw new Error(chemin + ".miniscul()/majuscul()/suprespac() attend une variable contenant du texte");
    }
    let chaine = mMethodesTexte[2];
    let methodes = [];
    let reM = /\.(miniscul|majuscul|suprespac)\(\s*\)/g, mm;
    while ((mm = reM.exec(chaine)) !== null) methodes.push(mm[1]);
    let valeur = cible;
    for (let methode of methodes) {
      if (methode === "miniscul") valeur = valeur.toLowerCase();
      else if (methode === "majuscul") valeur = valeur.toUpperCase();
      else if (methode === "suprespac") valeur = valeur.trim();
    }
    assignerCheminValeur(chemin, valeur);
    return;
  }

  // Methode sur vecteur/matrice : nom.ajout(elements)
  let mMethode = ligne.match(/^([a-zA-Z_]\w*(?:\.[a-zA-Z_]\w*)*)\.(\w+)\((.*)\)$/);
  if (mMethode && mMethode[1] !== "base" && mMethode[1] !== "conver" && mMethode[1] !== "est"
      && !Object.prototype.hasOwnProperty.call(fonctionsBase, mMethode[1] + "." + mMethode[2])) {
    let nomVar = mMethode[1], methode = mMethode[2], argsStr = mMethode[3].trim();
    let argExprs = argsStr === "" ? [] : splitTopLevelComma(argsStr);

    // parent.methode(moi, ...) : appelle la version de "methode" definie par la classe
    // PARENTE de celle qui execute actuellement (equivalent de super().methode(...) en
    // Python). "parent" n'est pas une variable : traite avant toute resolution de variable.
    if (nomVar === "parent") {
      let argsVals = [];
      for (let a of argExprs) argsVals.push(await evalExpr(a, ctxExpr));
      let classeCourante = getClasseCourante();
      let classeParenteInfo = classeCourante && classes[classeCourante] ? classes[classeCourante] : null;
      let trouve = classeParenteInfo && classeParenteInfo.parent ? trouverMethodeAvecClasse(classeParenteInfo.parent, methode) : null;
      let val = await appellerMethodeParent(methode, argsVals);
      if (doitAfficherResultatAppel(val, trouve && trouve.methode.aRetourVide)) printValeur(await formatPourAffichage(val));
      return;
    }

    // Instance de classe perso : a.methode(...) -> methode definie par l'utilisateur avec
    // "classe NomClasse { fonc methode(moi, ...) {...} }". Prioritaire sur les methodes
    // integrees ci-dessous (ajout/miniscul/majuscul/suprespac), qui ne s'appliquent qu'aux
    // vecteurs/matrices/textes, jamais aux instances de classe.
    let cibleEventuelle = resoudreCheminCible(nomVar);
    if (cibleEventuelle && typeof cibleEventuelle === 'object' && cibleEventuelle.__classe !== undefined) {
      let argsVals = [];
      for (let a of argExprs) argsVals.push(await evalExpr(a, ctxExpr));
      let trouve = trouverMethodeAvecClasse(cibleEventuelle.__classe, methode);
      let val = await appellerMethodeInstance(cibleEventuelle, methode, argsVals);
      if (doitAfficherResultatAppel(val, trouve && trouve.methode.aRetourVide)) printValeur(await formatPourAffichage(val));
      return;
    }

    if (methode === "ajout") {
      let cible = resoudreCheminCible(nomVar);
      if (estListe(cible)) {
        let elementsListe = [];
        for (let a of argExprs) elementsListe.push(await evaluerElementBrut(a, ctxExpr));
        ajouterListe(cible, elementsListe);
        return;
      }
      let elements = [];
      for (let a of argExprs) {
        let v = await evaluerElementBrut(a, ctxExpr);
        if (estVecteur(v)) elements.push(...v);
        else if (estMatrice(v)) elements.push(...v.donnees);
        else elements.push(v);
      }
      if (estVecteur(cible)) ajouterVecteur(cible, elements);
      else if (estMatrice(cible)) ajouterMatrice(cible, elements);
      else throw new Error(nomVar + " n'est pas un vecteur, une matrice ou une liste");
      return;
    }

    if (methode === "supri") {
      let cible = resoudreCheminCible(nomVar);
      if (estListe(cible)) {
        let elementsListe = [];
        for (let a of argExprs) elementsListe.push(await evaluerElementBrut(a, ctxExpr));
        supprimerListe(cible, elementsListe);
        return;
      }
      let elements = [];
      for (let a of argExprs) {
        let v = await evaluerElementBrut(a, ctxExpr);
        if (estVecteur(v)) elements.push(...v);
        else if (estMatrice(v)) elements.push(...v.donnees);
        else elements.push(v);
      }
      if (estVecteur(cible)) supprimerVecteur(cible, elements);
      else if (estMatrice(cible)) supprimerMatrice(cible, elements);
      else throw new Error(nomVar + " n'est pas un vecteur, une matrice ou une liste");
      return;
    }

    // Conversion/nettoyage du texte dans une variable.
    if (methode === "miniscul" || methode === "majuscul" || methode === "suprespac") {
      if (argExprs.length !== 0) {
        throw new Error(nomVar + "." + methode + "() n'accepte aucun argument");
      }
      let cible = resoudreCheminCible(nomVar);
      if (typeof cible === "number") { return; } // nombre : rien a convertir, on ignore silencieusement
      if (typeof cible !== "string") {
        throw new Error(nomVar + "." + methode + "() attend une variable contenant du texte");
      }
      let valeur = methode === "miniscul" ? cible.toLowerCase() : methode === "majuscul" ? cible.toUpperCase() : cible.trim();
      assignerCheminValeur(nomVar, valeur);
      return;
    }

    throw new Error("Methode inconnue : " + methode);
  }

  // Ecriture d'un attribut d'instance de classe : objet.attribut ~ valeur (sans parentheses,
  // donc distingue de l'appel de methode ci-dessus). Ex: moi.nom ~ nom (dans une classe), ou
  // a.age ~ 10 (depuis l'exterieur). Ou ecriture d'un attribut PARTAGE (statique), avec le nom
  // de la classe elle-meme au lieu d'une instance : NomClasse.attribut ~ valeur.
  let mAttribut = ligne.match(/^([a-zA-Z_]\w*)\.([a-zA-Z_]\w*)\s*~\s*(.*)$/);
  if (mAttribut) {
    let nomVar = mAttribut[1], nomAttr = mAttribut[2], valeurExpr = mAttribut[3].trim();
    let valeur;
    let elementsAttr = splitTopLevelComma(valeurExpr);
    if (elementsAttr.length > 1) {
      // Plusieurs elements separes par virgule : concatenes en un seul texte,
      // exactement comme les arguments de affi()/retour().
      let parties = [];
      for (let elem of elementsAttr) {
        let elemTrim = elem.trim();
        if (elemTrim === "saulig") {
          parties.push("\n");
        } else if (/^\|[\s\S]*\|$/.test(elemTrim)) {
          parties.push(elemTrim.slice(1, -1));
        } else {
          verifierTexteLitteralFerme(elemTrim);
          parties.push(formatValeur(await evalExpr(elemTrim, ctxExpr)));
        }
      }
      valeur = parties.join(" ").replace(/ {2,}/g, " ").replace(/ *\n */g, "\n");
    } else if (/^\|[\s\S]*\|$/.test(valeurExpr)) {
      valeur = valeurExpr.slice(1, -1);
    } else {
      verifierTexteLitteralFerme(valeurExpr);
      valeur = await evalExpr(valeurExpr, ctxExpr);
    }
    if (Object.prototype.hasOwnProperty.call(classes, nomVar)) {
      // Attribut partage (statique) : toujours ecrit directement sur la classe nommee,
      // jamais sur une classe parente (comme ClasseNommee.attribut = valeur en Python).
      classes[nomVar].statique[nomAttr] = valeur;
      return;
    }
    let cible = getVar(nomVar);
    if (!cible || typeof cible !== 'object' || cible.__classe === undefined) {
      throw new Error(nomVar + "." + nomAttr + " : " + nomVar + " n'est pas une instance de classe");
    }
    cible[nomAttr] = valeur;
    return;
  }

  // Assignation : nom ~ valeur
  let mAssign = ligne.match(/^([a-zA-Z_]\w*)\s*~\s*(.*)$/);
  if (mAssign) {
    let nom = mAssign[1], valeur = mAssign[2].trim();
    let elementsAssign = splitTopLevelComma(valeur);
    if (elementsAssign.length > 1) {
      // Plusieurs elements separes par virgule : concatenes en un seul texte,
      // exactement comme les arguments de affi()/retour() (avec |texte| et saulig).
      let parties = [];
      for (let elem of elementsAssign) {
        let elemTrim = elem.trim();
        if (elemTrim === "saulig") {
          parties.push("\n");
        } else if (/^\|[\s\S]*\|$/.test(elemTrim)) {
          parties.push(elemTrim.slice(1, -1));
        } else {
          verifierTexteLitteralFerme(elemTrim);
          parties.push(formatValeur(await evalExpr(elemTrim, ctxExpr)));
        }
      }
      setVar(nom, parties.join(" ").replace(/ {2,}/g, " ").replace(/ *\n */g, "\n"));
      return;
    }
    if (/^\|[\s\S]*\|$/.test(valeur)) {
      setVar(nom, valeur.slice(1, -1));
    } else {
      verifierTexteLitteralFerme(valeur);
      setVar(nom, await evalExpr(valeur, ctxExpr));
    }
    return;
  }

  // Appel de fonction (prioritaire, comme en Python)
let matchAppel = ligne.match(/^([a-zA-Z_][a-zA-Z0-9_.]*)\((.*)\)$/);
if (matchAppel) {
  let nom = matchAppel[1];
  if (nom === 'lettr' || nom === 'Lettr' || nom === 'pasdefini') {
    throw new Error(nom + " est une constante (comme VRAI/FAUX), pas une fonction : ecris-la sans parentheses, \"" + nom + "\" au lieu de \"" + nom + "()\"");
  }
let nomBase = null;

if (nom.startsWith("base.")) {
    nomBase = nom.substring(5); // enlève "base."
}
if (nomBase !== null) {
    let mRacineBase = nomBase.match(/^racine(\d*)$/);
    if (mRacineBase) {
      let n2 = mRacineBase[1] === "" ? 2 : parseInt(mRacineBase[1], 10);
      let argsStr = matchAppel[2].trim();
      let argExprs = argsStr === "" ? [] : splitTopLevelComma(argsStr);
      if (argExprs.length !== 1) throw new Error(nomRacine(n2) + "(...) attend exactement 1 argument");
      let val = appliquerRacineN(n2, await evalExpr(argExprs[0], ctxExpr));
      if (modeConsoleCommande && val !== undefined) printValeur(formatValeur(val));
      return;
    }
    if (!Object.prototype.hasOwnProperty.call(fonctionsBase, nomBase)) {
        throw new Error("Fonction de base inconnue : " + nomBase);
    }
    let argsStr = matchAppel[2].trim();
    let argExprs = argsStr === "" ? [] : splitTopLevelComma(argsStr);
    let val = await fonctionsBase[nomBase](argExprs, ctxExpr);
    if (modeConsoleCommande && val !== undefined) printValeur(formatValeur(val));
    return;
}
  // Si une fonction utilisateur (ou une classe, pour l'instancier) porte ce nom, ou qu'une
  // VARIABLE de ce nom contient une valeur-fonction (recue en parametre, ou stockee avec
  // f ~ nomFonction), elle masque complètement la commande intégrée.
  let varAppelDirect = chercherVariable(nom);
  let estAppelVariableFonction = varAppelDirect.trouve && estValeurFonction(varAppelDirect.valeur);
  if (Object.prototype.hasOwnProperty.call(fonctions, nom) || Object.prototype.hasOwnProperty.call(classes, nom) || varAppelDirect.trouve) {
    let argsStr = matchAppel[2].trim();
    let argExprs = argsStr === "" ? [] : splitTopLevelComma(argsStr);
    let argsVals = [];
    for (let a of argExprs) argsVals.push(await evalExpr(a.trim(), ctxExpr));
    let val = await appelerFonction(nom, argsVals);
    // Affiche automatiquement le retour d'une fonction perso appelee seule sur sa
    // ligne (ex: "nomfonction(x)"), que ce soit dans la console OU en executant
    // un script (RUN) : plus besoin d'ecrire obligatoirement affi(nomfonction(x)).
    // Si la fonction ne renvoie rien (pasdefini), on ne l'affiche que si un "retour"
    // vide figure EXPLICITEMENT dans son corps (fonctions[nom].aRetourVide, ou le corps
    // de la valeur-fonction si l'appel se fait via une variable) : sinon c'est juste une
    // procedure sans valeur de retour, et on reste silencieux.
    // (L'instanciation d'une classe renvoie toujours une instance, jamais pasdefini.)
    let aRetourVide = Object.prototype.hasOwnProperty.call(fonctions, nom)
      ? fonctions[nom].aRetourVide
      : (estAppelVariableFonction ? estRetourVideDansCorps(varAppelDirect.valeur.corps) : true);
    if (doitAfficherResultatAppel(val, aRetourVide)) printValeur(await formatPourAffichage(val));
    return;
  }

  // Racine n-ieme : racine(), racine2(), racine3(), ... racineN() (masquable par fonc racineN(...) ci-dessus)
  let mRacineAppel = nom.match(/^racine(\d*)$/);
  if (mRacineAppel) {
    let n2 = mRacineAppel[1] === "" ? 2 : parseInt(mRacineAppel[1], 10);
    let argsStr = matchAppel[2].trim();
    let argExprs = argsStr === "" ? [] : splitTopLevelComma(argsStr);
    if (argExprs.length !== 1) throw new Error(nomRacine(n2) + "(...) attend exactement 1 argument");
    let val = appliquerRacineN(n2, await evalExpr(argExprs[0], ctxExpr));
    if (modeConsoleCommande && val !== undefined) printValeur(formatValeur(val));
    return;
  }

  // Sinon seulement, on utilise la commande intégrée affi(...)
  
if (Object.prototype.hasOwnProperty.call(fonctionsBase, nom)) {
    let argsStr = matchAppel[2].trim();
    let argExprs = argsStr === "" ? [] : splitTopLevelComma(argsStr);
    let val = await fonctionsBase[nom](argExprs, ctxExpr);
    if (modeConsoleCommande && val !== undefined) printValeur(formatValeur(val));
    return;
}
}
  // Dans la console : une simple expression (ex: 3+4) est evaluee et son resultat affiche,
  // sans avoir besoin de passer par affi(...)
  if (modeConsoleCommande) {
    try {
      let val = await evalExpr(ligne, ctxExpr);
      if (val !== undefined) printValeur(formatValeur(val));
      return;
    } catch (e) {
      // pas une expression valide non plus : on retombe sur l'erreur "commande inconnue" ci-dessous
    }
  }

  if (/^sinon\s+si\(/.test(ligne)) {
    throw new Error("sinon si doit suivre directement un bloc si(...){...} ou sinon si(...){...}, sans instruction entre les deux : " + ligne);
  }
  if (/^sinon\b/.test(ligne)) {
    throw new Error("sinon doit suivre directement un bloc si(...){...} ou sinon si(...){...}, sans instruction entre les deux : " + ligne);
  }
  if (/^attrape\b/.test(ligne)) {
    throw new Error("attrape doit suivre directement un bloc essai{...}, sans instruction entre les deux : " + ligne);
  }
  if (/^[a-zA-Z_][a-zA-Z0-9_.]*\(/.test(ligne)) {
    throw new Error("Appel de fonction mal forme (parenthese fermante manquante ou en trop) : " + ligne);
  }
  throw new Error("Commande inconnue: " + ligne);
}

/* ===================== TOKENISEUR (avec numeros de ligne) ===================== */
// Retire les commentaires du code source avant tokenisation : tout ce qui suit ** jusqu'a
// la fin de la ligne est ignore, sauf a l'interieur d'un texte litteral |...| (pour pouvoir
// ecrire des ** a l'interieur d'un texte affiche sans que ce soit traite comme un commentaire).
function retirerCommentaires(code) {
  let resultat = "", i = 0, n = code.length, dansTexte = false;
  while (i < n) {
    let c = code[i];
    if (c === '|') { dansTexte = !dansTexte; resultat += c; i++; continue; }
    if (!dansTexte && c === '*' && code[i + 1] === '*') {
      while (i < n && code[i] !== '\n') i++;
      continue; // le '\n' (s'il existe) sera traite au prochain tour de boucle
    }
    resultat += c;
    i++;
  }
  return resultat;
}

function parser(code) {
  code = retirerCommentaires(code);
  let tokens = [], buffer = "", ligne = 1, ligneDebutBuffer = 1;
  for (let i = 0; i < code.length; i++) {
    let c = code[i];
    if (c === '{' || c === '}' || c === '\n') {
      if (buffer.trim() !== "") tokens.push({ texte: buffer.trim(), ligne: ligneDebutBuffer });
      if (c !== '\n') tokens.push({ texte: c, ligne: ligne });
      buffer = "";
      if (c === '\n') ligne++;
      ligneDebutBuffer = ligne;
    } else {
      if (buffer === "") ligneDebutBuffer = ligne;
      buffer += c;
    }
  }
  if (buffer.trim() !== "") tokens.push({ texte: buffer.trim(), ligne: ligneDebutBuffer });
  return tokens;
}

function trouverFinBloc(tokens, debut, ligneErreur) {
  let niveau = 1, i = debut;
  while (niveau > 0 && i < tokens.length) {
    if (tokens[i].texte === "{") niveau++;
    if (tokens[i].texte === "}") niveau--;
    i++;
  }
  if (niveau !== 0) throw new ErreurLangage("Accolade fermante manquante", ligneErreur);
  return i;
}

/* ===================== EXECUTION ===================== */
// Retourne { index, signal } ; signal = {type:'retour', valeur} si un "retour(...)" a ete rencontre
async function executerTokens(tokens, debut = 0, fin = tokens.length) {
  let index = debut;
  while (index < fin) {
    await respirer();
    let tokObj = tokens[index];
    let token = tokObj.texte;
    let ligneActuelle = tokObj.ligne;
    ligneExpressionCourante = ligneActuelle;

    if (token === "}") return { index: index + 1, signal: null };
    if (token === "{") { index++; continue; }

    try {
      if (token.startsWith('fonc ')) {
        // Fonction IMBRIQUEE (declaree a l'interieur d'un si/pou/tanqer/essai/autre fonc) :
        // preRegistrerFonctions() ne la voit jamais au demarrage, car des qu'elle rencontre
        // "fonc r(x){...}" au niveau superieur elle saute d'un bloc tout le CORPS de r pour
        // continuer son scan -- elle ne descend donc jamais dans un fonc imbrique a
        // l'interieur. Avant ce correctif, on arrivait ici en supposant a tort que la
        // fonction etait deja enregistree, et on se contentait de sauter le bloc : la
        // fonction n'existait donc nulle part, et l'appel qui suivait echouait avec
        // "Fonction inconnue". On l'enregistre donc ici, au moment reel ou l'execution
        // atteint cette ligne (elle devient alors utilisable, comme une fonction globale
        // normale, y compris apres ce point dans le script).
        let mFoncImbrique = token.match(/^fonc\s+(\w+)\(([^)]*)\)$/);
        if (!mFoncImbrique) throw new ErreurLangage("Declaration de fonction mal formee : " + token, ligneActuelle);
        let nomFoncImbrique = mFoncImbrique[1];
        let paramsFoncImbrique = analyserListeParametres(mFoncImbrique[2], "fonc " + nomFoncImbrique + "(...)", ligneActuelle);
        if (!tokens[index+1] || tokens[index+1].texte !== "{") throw new ErreurLangage("Manque { apres la definition de fonction " + nomFoncImbrique, ligneActuelle);
        let finBloc = trouverFinBloc(tokens, index + 2, ligneActuelle);
        let corpsFoncImbrique = tokens.slice(index + 2, finBloc - 1);
        fonctions[nomFoncImbrique] = { params: paramsFoncImbrique, corps: corpsFoncImbrique, aRetourVide: estRetourVideDansCorps(corpsFoncImbrique) };
        index = finBloc;
        continue;
      }

      if (token.startsWith('classe ')) {
        // deja pre-enregistree (voir preRegistrerClasses) : on saute simplement le bloc
        let finBloc = trouverFinBloc(tokens, index + 2, ligneActuelle);
        index = finBloc;
        continue;
      }

      if (token.startsWith('si(') && token.endsWith(')')) {
        let condition = token.slice(3, -1);
        if (!tokens[index+1] || tokens[index+1].texte !== "{") throw new Error("Manque { apres si");
        let finBloc = trouverFinBloc(tokens, index + 2, ligneActuelle);
        let dejaExecute = false;

        if (estVrai(await evalExpr(condition, ctxExpr))) {
          let res = await executerTokens(tokens, index + 2, finBloc - 1);
          if (res.signal) return res;
          dejaExecute = true;
        }

        // Enchaine sur d'eventuels "sinon si(...)" (comme "else if" en R), puis un
        // eventuel "sinon{...}" final. Un seul bloc au total est execute.
        // (sision(...) est une fonction a part, pas une structure de bloc : voir plus bas.)
        let curseur = finBloc;
        while (tokens[curseur]) {
          let texteSuivant = tokens[curseur].texte;
          let mSinonSi = texteSuivant.match(/^sinon\s+si\((.*)\)$/);
          if (mSinonSi) {
            if (!tokens[curseur+1] || tokens[curseur+1].texte !== "{") throw new Error("Manque { apres sinon si");
            let finBlocSi = trouverFinBloc(tokens, curseur + 2, ligneActuelle);
            if (!dejaExecute && estVrai(await evalExpr(mSinonSi[1], ctxExpr))) {
              let res = await executerTokens(tokens, curseur + 2, finBlocSi - 1);
              if (res.signal) return res;
              dejaExecute = true;
            }
            curseur = finBlocSi;
            continue;
          }
          if (texteSuivant === "sinon") {
            if (!tokens[curseur+1] || tokens[curseur+1].texte !== "{") throw new Error("Manque { apres sinon");
            let finBlocSinon = trouverFinBloc(tokens, curseur + 2, ligneActuelle);
            if (!dejaExecute) {
              let res = await executerTokens(tokens, curseur + 2, finBlocSinon - 1);
              if (res.signal) return res;
            }
            curseur = finBlocSinon;
          }
          break;
        }
        index = curseur;
        continue;
      }

      // essai{...} attrape(msg){...} : intercepte une erreur levee dans le bloc essai (ex:
      // ecrire.fichier(...) avec ecra~FAUX sur un fichier existant) sans planter tout le
      // script. Comme sinon apres si, attrape doit suivre IMMEDIATEMENT le "}" de essai (pas
      // d'instruction entre les deux). "attrape(msg){...}" recupere le message d'erreur (texte)
      // dans la variable msg ; "attrape{...}" (sans parametre) ignore le message. Le bloc
      // attrape n'est execute QUE si une erreur a ete levee ; sinon il est simplement saute.
      // ExecutionInterrompue (retour force a l'editeur pendant l'execution) n'est JAMAIS
      // interceptee ici : elle doit toujours remonter jusqu'en haut, essai/attrape ne doit
      // pas pouvoir empecher l'utilisateur d'arreter un script.
      if (token === 'essai') {
        if (!tokens[index+1] || tokens[index+1].texte !== "{") throw new Error("Manque { apres essai");
        let finBlocEssai = trouverFinBloc(tokens, index + 2, ligneActuelle);

        let curseurAttrape = finBlocEssai;
        let tokAttrape = tokens[curseurAttrape];
        let mAttrape = tokAttrape ? tokAttrape.texte.match(/^attrape(?:\(\s*([a-zA-Z_][a-zA-Z0-9_]*)\s*\))?$/) : null;
        if (!mAttrape) throw new Error("essai{...} doit etre suivi directement de attrape{...} ou attrape(msg){...}, sans instruction entre les deux");
        if (!tokens[curseurAttrape+1] || tokens[curseurAttrape+1].texte !== "{") throw new Error("Manque { apres attrape");
        let finBlocAttrape = trouverFinBloc(tokens, curseurAttrape + 2, ligneActuelle);
        let nomVarErreur = mAttrape[1] || null;

        let messageErreur = null, resEssai = null;
        try {
          resEssai = await executerTokens(tokens, index + 2, finBlocEssai - 1);
        } catch (e) {
          if (e instanceof ExecutionInterrompue) throw e;
          messageErreur = e.message;
        }

        if (messageErreur === null) {
          // Pas d'erreur : le bloc attrape est saute integralement.
          if (resEssai && resEssai.signal) return resEssai;
          index = finBlocAttrape;
          continue;
        }

        if (nomVarErreur) setVar(nomVarErreur, messageErreur);
        let resAttrape = await executerTokens(tokens, curseurAttrape + 2, finBlocAttrape - 1);
        if (resAttrape.signal) return resAttrape;
        index = finBlocAttrape;
        continue;
      }

      if (token === 'stop') {
        return { index: index + 1, signal: { type: 'stop' } };
      }

      if (token === 'continu') {
        return { index: index + 1, signal: { type: 'continu' } };
      }

      if (token.startsWith('pou(') && token.endsWith(')')) {
        let entete = analyserEnTetePou(token);
        if (!tokens[index+1] || tokens[index+1].texte !== "{") throw new Error("Manque { apres pou");
        let finBloc = trouverFinBloc(tokens, index + 2, ligneActuelle);

        if (entete.type === 'dan') {
          let objetVal = await evalExpr(entete.objetExpr, ctxExpr);
          if (!estVecteur(objetVal)) throw new Error("pou(var dan objet) : objet doit etre un vecteur");
          for (let val of objetVal) {
            await respirer();
            setVar(entete.varNom, val);
            let res = await executerTokens(tokens, index + 2, finBloc - 1);
            if (res.signal) {
              if (res.signal.type === 'stop') break;
              if (res.signal.type === 'continu') continue;
              return res;
            }
          }
        } else {
          let debutVal = await evalExpr(entete.debutExpr, ctxExpr);
          let finVal = await evalExpr(entete.finExpr, ctxExpr);
          let pasVal = entete.parExpr === null ? 1 : await evalExpr(entete.parExpr, ctxExpr);
          if (typeof pasVal !== 'number' || isNaN(pasVal)) throw new Error("pou(...) : le pas doit etre un nombre");
          if (pasVal === 0) throw new Error("pou(...) : le pas ne peut pas valoir 0 (boucle infinie)");
          for (let val = debutVal; (pasVal > 0 ? val <= finVal : val >= finVal); val += pasVal) {
            await respirer();
            setVar(entete.varNom, val);
            let res = await executerTokens(tokens, index + 2, finBloc - 1);
            if (res.signal) {
              if (res.signal.type === 'stop') break;
              if (res.signal.type === 'continu') continue;
              return res;
            }
          }
        }
        index = finBloc;
        continue;
      }

      // tanqer(condition){...} classique, ou tanqer VRAI{...} / tanqer V{...} sans parentheses
      // (raccourci pour une boucle infinie, comme "while True" en Python), sans avoir besoin
      // d'ecrire une condition bidon toujours vraie (ex: tanqer(i==1){...}).
      let mTanqerBoucleInfinie = /^tanqer\s+(VRAI|V)$/.test(token);
      if ((token.startsWith('tanqer(') && token.endsWith(')')) || mTanqerBoucleInfinie) {
        let condition = mTanqerBoucleInfinie ? null : token.slice(7, -1);
        if (!tokens[index+1] || tokens[index+1].texte !== "{") throw new Error("Manque { apres tanqer");
        let finBloc = trouverFinBloc(tokens, index + 2, ligneActuelle);
        while (mTanqerBoucleInfinie || estVrai(await evalExpr(condition, ctxExpr))) {
          await respirer();
          let res = await executerTokens(tokens, index + 2, finBloc - 1);
          if (res.signal) {
            if (res.signal.type === 'stop') break;
            if (res.signal.type === 'continu') continue;
            return res;
          }
        }
        index = finBloc;
        continue;
      }

      if (token === 'retour' || /^retour[\s(]/.test(token)) {
        let reste = token.slice(6).trim(); // tout ce qui suit "retour"
        // Si l'expression est entierement entre parentheses (retour(...)), on les retire ;
        // "retour x*x" et "retour(x*x)" sont tous les deux acceptes.
        if (/^\(.*\)$/.test(reste)) reste = reste.slice(1, -1).trim();
        let valeur;
        if (reste === "") {
          valeur = undefined;
        } else {
          let elementsRetour = splitTopLevelComma(reste);
          if (elementsRetour.length === 1) {
            // Un seul element : comportement inchange, on garde le type reel (nombre,
            // vecteur, matrice, instance...), pas de conversion en texte.
            valeur = await evalExpr(reste, ctxExpr);
          } else {
            // Plusieurs elements separes par virgule : concatenes en un seul texte,
            // exactement comme les arguments de affi()/entr() (avec |texte| et saulig).
            let parties = [];
            for (let elem of elementsRetour) {
              let elemTrim = elem.trim();
              if (elemTrim === "saulig") {
                parties.push("\n");
              } else if (/^\|[\s\S]*\|$/.test(elemTrim)) {
                parties.push(elemTrim.slice(1, -1));
              } else {
                verifierTexteLitteralFerme(elemTrim);
                parties.push(formatValeur(await evalExpr(elemTrim, ctxExpr)));
              }
            }
            valeur = parties.join(" ").replace(/ {2,}/g, " ").replace(/ *\n */g, "\n");
          }
        }
        return { index: index + 1, signal: { type: 'retour', valeur: valeur } };
      }

      await executerCommandeSimple(token);
      index++;
    } catch (e) {
      if (e instanceof ErreurLangage) throw e;
      throw new ErreurLangage(e.message, ligneActuelle);
    }
  }
  return { index: index, signal: null };
}

/* ===================== SAUVEGARDE / OUVERTURE ===================== */
function sauvegarderCode() {
  mettreAJourOngletDepuisEditeur();
  let onglet = trouverOnglet(ongletActifId);
  if (onglet) localStorage.setItem('monlangage_code', onglet.contenu);
}

/* ===================== NAVIGATEUR DE FICHIERS INTEGRE ===================== */
// Remplace les selecteurs systeme Android : navigation dans les dossiers du
// stockage, dans le style de l'app, pour Enregistrer (choisir nom + emplacement)
// et Ouvrir (choisir un fichier existant).
let navFichiersChemin = null;
let navFichiersMode = null; // "enregistrer" | "ouvrir"
let navFichiersRacine = "/storage/emulated/0";
let navFichiersOnValide = null;
// Callback appele UNIQUEMENT si l'utilisateur annule (bouton ANNULER), jamais apres une
// validation reussie -- permet a un appelant comme ecrire.fichier()/lire.fichier() (des
// promesses) de rejeter proprement au lieu de rester bloque indefiniment.
let navFichiersOnAnnule = null;
// Extension ajoutee automatiquement au nom de fichier en mode "enregistrer" (".mlg" pour
// les scripts, mais ecrire.fichier() par exemple utilise ".mld") -- affichee a cote du
// champ de saisie du nom.
let navFichiersExtension = ".mlg";

function ouvrirNavigateurFichiers(mode, options) {
  options = options || {};
  if (!(window.MonLangage && typeof window.MonLangage.listerDossier === "function")) {
    alert("Le navigateur de fichiers integre necessite l'app native (rebuild requis).");
    if (options.onAnnule) options.onAnnule();
    return;
  }
  if (typeof window.MonLangage.permissionStockageAccordee === "function" &&
      !window.MonLangage.permissionStockageAccordee()) {
    alert("MonLangage a besoin de l'acces au stockage pour " +
      (mode === "enregistrer" ? "enregistrer" : "ouvrir") + " des fichiers.\n\n" +
      "Sur l'ecran qui va s'ouvrir, active \"Autoriser l'acces a tous les fichiers\", " +
      "puis reviens dans l'app et reessaie.");
    if (typeof window.MonLangage.demanderPermissionStockage === "function") {
      window.MonLangage.demanderPermissionStockage();
    }
    if (options.onAnnule) options.onAnnule();
    return;
  }

  navFichiersMode = mode;
  navFichiersOnValide = options.onValide || null;
  navFichiersOnAnnule = options.onAnnule || null;
  navFichiersExtension = options.extension || ".mlg";
  navFichiersRacine = (typeof window.MonLangage.dossierRacine === "function")
    ? (window.MonLangage.dossierRacine() || navFichiersRacine) : navFichiersRacine;

  modalFichiersNomLigne.classList.toggle("visible", mode === "enregistrer");
  modalFichiersNom.value = options.nomDefaut || "";
  modalFichiersExtension.textContent = navFichiersExtension;
  modalFichiersValider.style.display = mode === "enregistrer" ? "" : "none";
  modalFichiersValider.textContent = "ENREGISTRER";

  chargerDossierNavigateur(navFichiersRacine);
  modalFichiers.classList.add("ouvert");
}

function fermerNavigateurFichiers() {
  modalFichiers.classList.remove("ouvert");
  navFichiersOnValide = null;
  navFichiersOnAnnule = null;
}

function chargerDossierNavigateur(chemin) {
  navFichiersChemin = chemin;
  modalFichiersChemin.textContent = chemin;

  let elements = [];
  try { elements = JSON.parse(window.MonLangage.listerDossier(chemin) || "[]"); } catch (_) { elements = []; }

  modalFichiersListe.innerHTML = "";

  let visibles = elements.filter(el => navFichiersMode === "ouvrir" || el.dossier);
  if (visibles.length === 0) {
    let vide = document.createElement("div");
    vide.className = "modalFichiersVide";
    vide.textContent = "Dossier vide";
    modalFichiersListe.appendChild(vide);
    return;
  }

  visibles.forEach(el => {
    let ligne = document.createElement("div");
    ligne.className = "modalFichiersLigne";

    let icone = document.createElement("span");
    icone.className = "icone";
    icone.textContent = el.dossier ? "📁" : "📄";

    let nom = document.createElement("span");
    nom.className = "nom";
    nom.textContent = el.nom;

    ligne.appendChild(icone);
    ligne.appendChild(nom);

    ligne.addEventListener("click", () => {
      let cheminEnfant = chemin.replace(/\/+$/, "") + "/" + el.nom;
      if (el.dossier) {
        chargerDossierNavigateur(cheminEnfant);
      } else {
        validerNavigateurFichiers(cheminEnfant);
      }
    });

    modalFichiersListe.appendChild(ligne);
  });
}

function validerNavigateurFichiers(cheminComplet) {
  let cb = navFichiersOnValide;
  fermerNavigateurFichiers();
  if (cb) cb(cheminComplet);
}

modalFichiersRetour.addEventListener("click", () => {
  if (!navFichiersChemin || navFichiersChemin === navFichiersRacine) return;
  let parent = navFichiersChemin.replace(/\/[^\/]+\/?$/, "");
  if (!parent || parent.length < navFichiersRacine.length) parent = navFichiersRacine;
  chargerDossierNavigateur(parent);
});

modalFichiersAnnuler.addEventListener("click", () => {
  let cbAnnule = navFichiersOnAnnule;
  fermerNavigateurFichiers();
  if (cbAnnule) cbAnnule();
});

modalFichiersValider.addEventListener("click", () => {
  if (navFichiersMode !== "enregistrer") return;
  let ext = navFichiersExtension || "";
  let regexExt = new RegExp(ext.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "$", "i");
  let nom = (modalFichiersNom.value || "").trim().replace(regexExt, "");
  if (!nom) { alert("Entre un nom de fichier."); return; }
  let cheminComplet = navFichiersChemin.replace(/\/+$/, "") + "/" + nom + ext;
  validerNavigateurFichiers(cheminComplet);
});

function ouvrirFichierMlg(fichier) {
  if (!fichier) return;
  let lecteur = new FileReader();
  lecteur.onload = () => {
    chargerFichierDansNouvelOnglet(lecteur.result, fichier.name);
  };
  lecteur.onerror = () => alert("Impossible de lire ce fichier.");
  lecteur.readAsText(fichier);
}

/* ===================== BOUTON RETOUR MATERIEL ANDROID ===================== */
// Ordre de priorite : on referme d'abord ce qui est ouvert par-dessus l'editeur
// (navigateur de fichiers, menu Ouvrir, console), et on ne quitte VRAIMENT l'app
// que si on est deja sur l'ecran de l'editeur sans aucune fenetre active.
if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
  window.Capacitor.Plugins.App.addListener("backButton", () => {
    if (modalFichiers.classList.contains("ouvert")) {
      fermerNavigateurFichiers();
      return;
    }
    if (menuOuvrir.classList.contains("ouvert")) {
      menuOuvrir.classList.remove("ouvert");
      return;
    }
    if (ecranConsole.classList.contains("actif")) {
      quitterConsole();
      return;
    }
    // Vraiment dans l'editeur, aucune fenetre active : on quitte l'app.
    window.Capacitor.Plugins.App.exitApp();
  });
}

/*
 * Appelee par MainActivity.java quand un fichier est choisi avec le selecteur
 * Android ou quand un .mlg est ouvert depuis le gestionnaire de fichiers.
 * Chaque ouverture cree un nouvel onglet : aucun onglet existant n'est ecrase.
 */
window.chargerFichierExterne = function(texte, nom) {
  chargerFichierDansNouvelOnglet(texte, nom || "sans titre");
};

function majNumeros() {
  let n = codeArea.value.split('\n').length;
  let html = "";
  for (let i = 1; i <= n; i++) html += i + (i < n ? "\n" : "");
  numeros.textContent = html;
}

// Coloration syntaxique en direct dans l'editeur : recalcule la couche coloree
// (derriere le textarea, dont le texte est rendu transparent) a chaque frappe.
function majSurbrillance() {
  // Une ligne totalement vide (rien entre deux "\n", ou apres le tout dernier "\n") ne
  // contient aucun caractere : certains moteurs de rendu mobiles ne lui attribuent alors
  // aucune hauteur de ligne dans ce <div>, alors que le textarea, lui, affiche toujours
  // une ligne pour chaque retour a la ligne (y compris le tout dernier, meme vide). Ce
  // manque de hauteur decalait tout le reste du calque colore d'une ligne par rapport au
  // textarea et a la colonne des numeros, precisement au niveau d'une ligne vide. On force
  // donc chaque ligne vide a contenir un caractere invisible (espace de largeur nulle),
  // qui donne une vraie hauteur de ligne sans rien changer visuellement.
  let valeurProtegee = codeArea.value.split('\n').map(l => l === "" ? "\u200B" : l).join('\n');
  codeHighlight.innerHTML = genererHTMLColore(valeurProtegee);
}

// Resynchronise la colonne des numeros de ligne et le calque de coloration sur le
// defilement du textarea. Appelee au 'scroll', mais AUSSI apres chaque frappe et apres
// un redimensionnement (voir plus bas) : le defilement automatique du curseur (quand on
// tape en bas de l'ecran, ou quand le clavier virtuel s'ouvre/se ferme) deplace parfois le
// scroll du textarea SANS declencher l'evenement 'scroll' du navigateur, ce qui pouvait
// decaler durablement la colonne des numeros par rapport au code (voir aussi
// requestAnimationFrame ci-dessous, pour rattraper un ajustement de scroll survenant
// apres coup, au frame suivant).
function synchroniserScrollEditeur() {
  numeros.scrollTop = codeArea.scrollTop;
  codeHighlight.scrollTop = codeArea.scrollTop;
  codeHighlight.scrollLeft = codeArea.scrollLeft;
}

codeArea.addEventListener('input', () => {
  majNumeros(); majSurbrillance(); sauvegarderCode();
  synchroniserScrollEditeur();
  requestAnimationFrame(synchroniserScrollEditeur);
});
codeArea.addEventListener('scroll', synchroniserScrollEditeur);
codeArea.addEventListener('click', () => requestAnimationFrame(synchroniserScrollEditeur));
codeArea.addEventListener('keyup', () => requestAnimationFrame(synchroniserScrollEditeur));
// Le clavier virtuel qui s'ouvre/se ferme redimensionne la zone visible et peut deplacer
// le scroll du textarea sans evenement 'scroll' associe.
window.addEventListener('resize', () => requestAnimationFrame(synchroniserScrollEditeur));

// Sur mobile, un defilement au doigt continue par inertie (momentum) bien apres le
// relachement du doigt, et l'evenement 'scroll' du navigateur ne se declenche pas assez
// souvent pour suivre ce mouvement en continu : la colonne des numeros prenait du retard
// et restait durablement decalee une fois l'inertie stabilisee. On resynchronise donc a
// CHAQUE frame d'affichage (requestAnimationFrame) pendant tout le defilement tactile, et
// on prolonge cette boucle un court instant apres le relachement du doigt pour couvrir
// l'inertie residuelle.
let synchroContinueActive = false;
let arretSynchroContinueMinuteur = null;
function boucleSynchroContinue() {
  synchroniserScrollEditeur();
  if (synchroContinueActive) requestAnimationFrame(boucleSynchroContinue);
}
function demarrerSynchroContinue() {
  if (arretSynchroContinueMinuteur) { clearTimeout(arretSynchroContinueMinuteur); arretSynchroContinueMinuteur = null; }
  if (!synchroContinueActive) { synchroContinueActive = true; boucleSynchroContinue(); }
}
function arreterSynchroContinueApresDelai(delaiMs = 600) {
  if (arretSynchroContinueMinuteur) clearTimeout(arretSynchroContinueMinuteur);
  arretSynchroContinueMinuteur = setTimeout(() => { synchroContinueActive = false; synchroniserScrollEditeur(); }, delaiMs);
}
codeArea.addEventListener('touchstart', demarrerSynchroContinue, { passive: true });
codeArea.addEventListener('touchmove', demarrerSynchroContinue, { passive: true });
codeArea.addEventListener('touchend', () => arreterSynchroContinueApresDelai(), { passive: true });
codeArea.addEventListener('touchcancel', () => arreterSynchroContinueApresDelai(), { passive: true });

/* ===================== LANCEMENT DU SCRIPT ===================== */
async function runScript() {
  scopes = [{}];
fonctions = {};
enregistrerFonctionsBase();
  afficherConsole();
  print("=== EXECUTION ===");
  btnRun.disabled = true;
  demandeArret = false;
  executionEnCours = true;
  demarrerIndicateurAttente();
  try {
    let script = codeArea.value;
    let tokens = parser(script);
    preRegistrerFonctions(tokens);
    await preRegistrerClasses(tokens);
    await executerTokens(tokens);
    print("=== FIN ===");
  } catch (e) {
    if (e instanceof ExecutionInterrompue) print("=== EXECUTION ARRETEE ===", "erreur");
    else if (e instanceof ErreurLangage) print("Erreur ligne " + e.ligne + ": " + e.message, "erreur");
    else print("Erreur: " + e.message, "erreur");
  }
  arreterIndicateurAttente();
  executionEnCours = false;
  demandeArret = false;
  printInvite();
  btnRun.disabled = false;
}

// Sur mobile, toucher la poignee du curseur ferme le clavier sans declencher
// de blur() : le champ reste "actif" cote DOM mais visuellement inerte, et un
// simple focus() ne fait alors plus rien (deja l'element actif). Un tap
// n'importe ou dans la console force donc un cycle blur+focus pour rouvrir
// le clavier, sauf si du texte est en cours de selection (copier/coller).
outputDiv.addEventListener("click", function(e) {
  let sel = window.getSelection();
  if (sel && sel.toString().length > 0) return;
  let saisies = outputDiv.querySelectorAll(".cmdInput, .entrInput");
  let derniereSaisie = saisies.length ? saisies[saisies.length - 1] : null;
  if (!derniereSaisie) return;
  if (document.activeElement === derniereSaisie) derniereSaisie.blur();
  focaliserSaisieConsole();
});

outputDiv.addEventListener("keydown", async function(e) {
  let target = e.target;
  if (target.className !== "cmdInput") return;
  if (e.key === "Enter" && !enTrainDeTaper) {
    e.preventDefault();
    enTrainDeTaper = true;
    let cmd = target.innerText;
    target.contentEditable = "false";
    if (cmd.trim() !== "") {
      modeConsoleCommande = true;
      demandeArret = false;
      executionEnCours = true;
      demarrerIndicateurAttente();
      try {
      enregistrerFonctionsBase();
        let tokensCmd = parser(cmd);
        preRegistrerFonctions(tokensCmd);
        await executerTokens(tokensCmd);
      } catch (e) {
        if (e instanceof ExecutionInterrompue) print("=== EXECUTION ARRETEE ===", "erreur");
        else if (e instanceof ErreurLangage) print("Erreur ligne " + e.ligne + ": " + e.message, "erreur");
        else print("Erreur: " + e.message, "erreur");
      } finally {
        arreterIndicateurAttente();
        modeConsoleCommande = false;
        executionEnCours = false;
        demandeArret = false;
      }
    }
    printInvite();
    enTrainDeTaper = false;
  }
});

/* ===================== COLORATION EN DIRECT DE LA LIGNE DE COMMANDE CONSOLE ===================== */
// Position du curseur exprimee en nombre de caracteres depuis le debut de l'element.
function obtenirDecalageCurseur(element) {
  let sel = window.getSelection();
  if (!sel.rangeCount) return 0;
  let plage = sel.getRangeAt(0);
  let plageAvant = plage.cloneRange();
  plageAvant.selectNodeContents(element);
  plageAvant.setEnd(plage.endContainer, plage.endOffset);
  return plageAvant.toString().length;
}
// Replace le curseur au decalage (en caracteres) donne, en parcourant les noeuds texte.
function definirDecalageCurseur(element, decalage) {
  let sel = window.getSelection();
  let plage = document.createRange();
  let compte = 0, trouve = false;
  (function parcourir(noeud) {
    if (trouve) return;
    if (noeud.nodeType === 3) {
      let suivant = compte + noeud.textContent.length;
      if (decalage <= suivant) {
        plage.setStart(noeud, decalage - compte);
        plage.collapse(true);
        trouve = true;
        return;
      }
      compte = suivant;
    } else {
      for (let enfant of noeud.childNodes) { parcourir(enfant); if (trouve) return; }
    }
  })(element);
  if (!trouve) { plage.selectNodeContents(element); plage.collapse(false); }
  sel.removeAllRanges();
  sel.addRange(plage);
}
outputDiv.addEventListener("input", function(e) {
  let target = e.target;
  if (target.className !== "cmdInput") return;
  let texte = target.innerText;
  let decalage = obtenirDecalageCurseur(target);
  target.innerHTML = genererHTMLColore(texte);
  definirDecalageCurseur(target, decalage);
});


btnRun.addEventListener("click", runScript);

/* ===================== INITIALISATION ===================== */
initialiserOnglets();
clearConsole();
printInvite();
</script>
