      "Chaque methode doit prendre moi comme premier parametre (comme self en Python).",
      "Instanciation : a ~ NomClasse(arguments). Attribut : moi.nom ~ valeur (ecriture), a.nom (lecture). Methode : a.methode(...).",
      "herite NomParent (facultatif) fait heriter de toutes les methodes de NomParent, voir herite."
    ], exemple: "classe Animal {\n    fonc init(moi, nom){ moi.nom ~ nom }\n    fonc parler(moi){ affi(moi.nom, |fait un bruit.|) }\n}\na ~ Animal(|Rex|)\na.parler()" },
  { noms: ["attribut partage"], categorie: "Controle", syntaxe: "classe NomClasse { attribut ~ valeur ... }  puis  NomClasse.attribut", description: [
      "Un attribut declare directement dans le corps de la classe (hors de toute methode) est PARTAGE par toutes les instances : une seule valeur pour toute la classe, pas une copie par instance.",
      "S'initialise une seule fois, au demarrage du script (pas a chaque instanciation).",
      "Se lit et se modifie avec NomClasse.attribut (le nom de la CLASSE, pas moi ni une instance) : NomClasse.attribut ~ nouvelleValeur.",
      "Utile pour un compteur global, un reglage ou une valeur par defaut commune a toutes les instances."
    ], exemple: "classe Voiture {\n    compteurVentes ~ 0\n    fonc init(moi, modele){\n        moi.modele ~ modele\n        Voiture.compteurVentes ~ Voiture.compteurVentes + 1\n    }\n}\nv1 ~ Voiture(|Clio|)\nv2 ~ Voiture(|208|)\naffi(Voiture.compteurVentes)   ->   2" },
  { noms: ["herite"], categorie: "Controle", syntaxe: "classe Enfant herite Parent { ... }", description: [
      "Fait heriter une classe d'une autre (comme class Enfant(Parent): en Python).",
      "La classe enfant recoit automatiquement toutes les methodes de la classe parente (y compris init).",
      "Une methode redefinie dans l'enfant remplace celle du parent (elle est prioritaire).",
      "Si l'enfant ne redefinit pas une methode, celle du parent est utilisee automatiquement."
    ], exemple: "classe Animal {\n    fonc init(moi, nom){ moi.nom ~ nom }\n    fonc parler(moi){ affi(moi.nom, |fait un bruit.|) }\n}\nclasse Chien herite Animal {\n    fonc parler(moi){ affi(moi.nom, |aboie.|) }\n}\nc ~ Chien(|Rex|)\nc.parler()   ->   Rex aboie." },
  { noms: ["parent"], categorie: "Controle", syntaxe: "parent.methode(moi, ...)", description: [
      "Appelle la version d'une methode definie par la classe PARENTE (equivalent de super().methode(...) en Python).",
      "Utilisable uniquement a l'interieur d'une methode d'une classe qui herite d'une autre (herite).",
      "moi doit toujours etre passe en premier argument, comme pour n'importe quel appel de methode.",
      "Utile pour garder le comportement du parent tout en ajoutant quelque chose en plus, au lieu de tout reecrire."
    ], exemple: "classe Animal {\n    fonc parler(moi){ affi(moi.nom, |fait un bruit.|) }\n}\nclasse Chien herite Animal {\n    fonc parler(moi){\n        parent.parler(moi)\n        affi(|(en particulier : aboie)|)\n    }\n}" },
  { noms: ["moi"], categorie: "Controle", syntaxe: "moi", description: [
      "A l'interieur d'une methode de classe, designe l'instance elle-meme (comme self en Python).",
      "Doit etre le premier parametre de chaque fonc declaree dans une classe.",
      "moi.attribut lit ou (avec ~) ecrit un attribut de l'instance courante."
    ], exemple: "classe Compteur {\n    fonc init(moi){ moi.n ~ 0 }\n    fonc plus1(moi){ moi.n ~ moi.n + 1 }\n}" },


  { noms: ["c"], categorie: "Creer un vecteur/une matrice", syntaxe: "c(a, b, c, ...)", description: [
      "Construit un vecteur a partir des valeurs donnees.",
      "Si on lui donne un vecteur ou une matrice en argument, il en reprend tous les elements.",
      "Unifie tout vers un seul type (texte > nombre > booleen) : pas de melange de types, contrairement a liste()."
    ], exemple: "c(1,2,3)          ->   [1] 1 2 3\nc(|a|,|b|)        ->   [1] \"a\" \"b\"" },
  { noms: ["liste"], categorie: "Creer un vecteur/une matrice", syntaxe: "liste(a, b, c, ...)", description: [
      "Construit une liste a partir des valeurs donnees, accessible par indice comme un vecteur (maliste[i]).",
      "Contrairement a c(), ne fusionne pas les vecteurs/matrices/listes donnes en argument et n'unifie PAS les types : chaque element garde son type d'origine (nombre, texte, booleen, vecteur, instance...).",
      "Ecriture indexee possible : maliste[i]~valeur (ou moi.maliste[i]~valeur pour un attribut).",
      "maliste.ajout(...) et maliste.supri(...) fonctionnent comme sur un vecteur, sans fusion ni unification."
    ], exemple: "l ~ liste(1, |bonjour|, VRAI, c(1,2,3))\naffi(l[1])   ->   1\naffi(l[2])   ->   bonjour\nl[1] ~ |change|" },
  { noms: ["seq"], categorie: "Creer un vecteur/une matrice", syntaxe: "seq(debut, fin, pas)", description: [
      "Construit une suite de nombres, de debut a fin.",
      "pas est facultatif : +1 par defaut (ou -1 si fin est plus petit que debut)."
    ], exemple: "seq(1,10,2)   ->   [1] 1 3 5 7 9" },
  { noms: ["rep"], categorie: "Creer un vecteur/une matrice", syntaxe: "rep(elements, nombre)", description: [
      "Repete des elements a la suite, nombre fois.",
      "elements peut etre une seule valeur ou un vecteur entier."
    ], exemple: "rep(c(1,2),3)   ->   [1] 1 2 1 2 1 2" },
  { noms: ["alea"], categorie: "Creer un vecteur/une matrice", syntaxe: "alea(var, x)  ou  alea(debut, fin, x)", description: [
      "alea(var, x) : choisit x elements au hasard, sans remise, parmi un vecteur ou une matrice.",
      "alea(debut, fin, x) : choisit x nombres entiers au hasard, sans remise, dans l'intervalle [debut, fin] (bornes incluses).",
      "Renvoie toujours un vecteur, meme pour x~1.",
      "x ne peut pas depasser le nombre d'elements disponibles (pas de remise = jamais deux fois la meme valeur)."
    ], exemple: "alea(1,49,6)         ->   6 numeros distincts entre 1 et 49\nalea(c(10,20,30),2)  ->   2 valeurs distinctes parmi le vecteur" },
  { noms: ["ralea"], categorie: "Creer un vecteur/une matrice", syntaxe: "ralea(var, x)  ou  ralea(debut, fin, x)", description: [
      "Comme alea(...), mais AVEC remise : un meme element/nombre peut sortir plusieurs fois.",
      "x peut donc depasser le nombre d'elements disponibles (contrairement a alea())."
    ], exemple: "ralea(1,6,10)          ->   10 lancers de de a 6 faces (repetitions possibles)\nralea(c(|pile|,|face|),5)  ->   5 tirages a pile ou face" },
  { noms: [":"], categorie: "Creer un vecteur/une matrice", syntaxe: "debut:fin", description: [
      "Raccourci rapide pour creer une suite de nombres entiers, avec un pas de 1.",
      "Si fin est plus petit que debut, compte a l'envers (pas de -1)."
    ], exemple: "1:5   ->   [1] 1 2 3 4 5\n5:1   ->   [1] 5 4 3 2 1" },
  { noms: ["lettr"], categorie: "Creer un vecteur/une matrice", syntaxe: "lettr", description: [
      "Identifiant constant (sans parentheses, comme VRAI/FAUX) qui vaut un vecteur contenant les 26 lettres de l'alphabet, en minuscule, de \"a\" a \"z\"."
    ], exemple: "lettr   ->   [1] \"a\" \"b\" \"c\" ... \"z\"\nx ~ lettr\npou(l dan lettr){ affi(l) }" },
  { noms: ["Lettr"], categorie: "Creer un vecteur/une matrice", syntaxe: "Lettr", description: [
      "Identifiant constant (sans parentheses, comme VRAI/FAUX) qui vaut un vecteur contenant les 26 lettres de l'alphabet, en majuscule, de \"A\" a \"Z\"."
    ], exemple: "Lettr   ->   [1] \"A\" \"B\" \"C\" ... \"Z\"" },
  { noms: ["matrice"], categorie: "Creer un vecteur/une matrice", syntaxe: "matrice(elements, nlig~..., ncol~..., parlig~VRAI ou FAUX)", description: [
      "Construit une matrice a partir d'une liste d'elements.",
      "nlig et ncol : un seul des deux suffit, l'autre est calculer automatiquement.",
      "parlig~VRAI remplit ligne par ligne. Par defaut (parlig~FAUX), le remplissage se fait colonne par colonne."
    ], exemple: "matrice(1:6, nlig~2, ncol~3)" },

  { noms: ["trans"], categorie: "Creer un vecteur/une matrice", syntaxe: "trans(m)", description: [
      "Renvoie la transposee d'une matrice : les lignes deviennent des colonnes et inversement.",
      "Une matrice nlig x ncol devient une matrice ncol x nlig."
    ], exemple: "m ~ matrice(1:6, nlig~2, ncol~3)\ntrans(m)   ->   une matrice 3x2" },

  { noms: ["lon"], categorie: "Infos sur un vecteur/une matrice", syntaxe: "lon(v)", description: [
      "Renvoie le nombre d'elements d'un vecteur ou d'une matrice.",
      "Renvoie 1 pour une simple valeur (pas un vecteur)."
    ], exemple: "lon(c(1,2,3))   ->   3" },
  { noms: ["dim"], categorie: "Infos sur un vecteur/une matrice", syntaxe: "dim(m)", description: [
      "Renvoie les dimensions d'une matrice.",
      "Le resultat est un vecteur c(nombre de lignes, nombre de colonnes)."
    ], exemple: "dim(matrice(1:6, nlig~2))   ->   [1] 2 3" },
  { noms: ["som"], categorie: "Infos sur un vecteur/une matrice", syntaxe: "som(v)", description: [
      "Additionne tous les elements d'un vecteur et renvoie le resultat."
    ], exemple: "som(c(1,2,3))   ->   6" },
  { noms: ["moy"], categorie: "Infos sur un vecteur/une matrice", syntaxe: "moy(v)", description: [
      "Renvoie la moyenne des elements d'un vecteur (ou d'une matrice, elements confondus)."
    ], exemple: "moy(c(1,2,3))   ->   2" },
  { noms: ["var"], categorie: "Infos sur un vecteur/une matrice", syntaxe: "var(v)", description: [
      "Renvoie la variance d'echantillon (divisee par n-1, comme en R) des elements d'un vecteur.",
      "Il faut au moins 2 valeurs."
    ], exemple: "var(c(2,4,4,4,5,5,7,9))   ->   4.571428..." },
  { noms: ["sd"], categorie: "Infos sur un vecteur/une matrice", syntaxe: "sd(v)", description: [
      "Renvoie l'ecart-type d'echantillon (racine carree de var(v), comme en R) des elements d'un vecteur."
    ], exemple: "sd(c(2,4,4,4,5,5,7,9))   ->   2.138..." },
  { noms: ["max"], categorie: "Infos sur un vecteur/une matrice", syntaxe: "max(v)  /  max(a, b, ...)", description: [
      "Renvoie le plus grand element, parmi un ou plusieurs arguments (nombres, vecteurs et/ou matrices confondus)."
    ], exemple: "max(c(3,7,2))   ->   7\nmax(3, 7, c(1,9))   ->   9" },
  { noms: ["min"], categorie: "Infos sur un vecteur/une matrice", syntaxe: "min(v)  /  min(a, b, ...)", description: [
      "Renvoie le plus petit element, parmi un ou plusieurs arguments (nombres, vecteurs et/ou matrices confondus)."
    ], exemple: "min(c(3,7,2))   ->   2" },
  { noms: ["suchaq"], categorie: "Infos sur un vecteur/une matrice", syntaxe: "suchaq(matrice, marge, fonction)", description: [
      "Comme apply() en R : applique 'fonction' a chaque ligne (marge~1) ou chaque colonne (marge~2) d'une matrice.",
      "'fonction' : som, moy, var, sd, max, min (sans parentheses), ou n'importe quelle valeur-fonction -- nom d'une fonction definie avec fonc, variable qui en contient une, fonction anonyme fonc(x){...}.",
      "Renvoie un vecteur (un resultat par ligne/colonne) si 'fonction' renvoie un nombre.",
      "Renvoie une matrice si 'fonction' renvoie un vecteur (une colonne de resultat par ligne/colonne d'origine)."
    ], exemple: "m ~ matrice(1:6, nlig~2, ncol~3)\nsuchaq(m, 1, som)   ->   somme de chaque ligne\nsuchaq(m, 2, moy)   ->   moyenne de chaque colonne" },
  { noms: ["det"], categorie: "Infos sur un vecteur/une matrice", syntaxe: "det(m)", description: [
      "Calcule le determinant d'une matrice.",
      "La matrice doit etre carree (autant de lignes que de colonnes)."
    ], exemple: "det(matrice(c(2,0,0,3), nlig~2, ncol~2))   ->   6" },
  { noms: ["trace"], categorie: "Infos sur un vecteur/une matrice", syntaxe: "trace(m)", description: [
      "Calcule la trace d'une matrice : la somme des elements de sa diagonale.",
      "La matrice doit etre carree (autant de lignes que de colonnes)."
    ], exemple: "trace(matrice(c(2,0,0,3), nlig~2, ncol~2))   ->   5" },

  { noms: ["[", "]"], categorie: "Acceder / modifier un element", syntaxe: "v[i]  /  m[ligne,colonne]", description: [
      "Lit un ou plusieurs elements d'un vecteur (v[i]) ou d'une matrice (m[ligne,colonne]).",
      "Les indices commencent a 1 (pas a 0).",
      "Un indice laisse vide signifie 'tout' : m[,2] = toute la colonne 2, m[3,] = toute la ligne 3.",
      "L'indice peut aussi etre un vecteur d'indices (c(2,5) ou 2:4) pour en selectionner plusieurs a la fois.",
      "L'indice peut etre un vecteur logique (issu d'une comparaison) pour selectionner selon une condition.",
      "Peut aussi servir a modifier : v[2:4] ~ c(0,0,0), B[,4] ~ c(0,0,0), B[B>15] ~ 0, etc.",
      "Agrandissement automatique : v[8] ~ x ou B[5,5] ~ x avec un indice au-dela de la taille actuelle etend le vecteur/la matrice, les nouvelles cases etant remplies de 0."
    ], exemple: "v[2]         ->   2e element\nv[2:4]       ->   du 2e au 4e element\nv[c(2,5)]    ->   le 2e et le 5e element\nv[v>3]       ->   les elements superieurs a 3\nB[2:4,]      ->   les lignes 2 a 4, toutes les colonnes\nB[,2:5]      ->   toutes les lignes, les colonnes 2 a 5\nB[B==5]      ->   tous les elements de B qui valent 5\nB[B>15] ~ 0  ->   remplace par 0 tous les elements > 15\nv[7] ~ 9     ->   agrandit v a 7 elements (0 pour les cases vides) puis met 9 en 7e position" },
  { noms: ["ajout"], categorie: "Acceder / modifier un element", syntaxe: "nom.ajout(elements)", description: [
      "Ajoute de nouveaux elements a un vecteur ou une matrice qui existe deja, sans supprimer ce qu'il contenait.",
      "Pour une matrice, les elements sont ajoutes comme nouvelle(s) colonne(s)."
    ], exemple: "v.ajout(4,5)\nm.ajout(9,9)" },
  { noms: ["supri"], categorie: "Acceder / modifier un element", syntaxe: "nom.supri(elements)", description: [
      "Supprime des elements d'un vecteur ou d'une matrice qui existe deja (inverse de .ajout()).",
      "Pour un vecteur : supprime, pour chaque valeur donnee, sa premiere occurrence trouvee.",
      "Pour une matrice : les elements donnes (par groupe de nlig, comme pour .ajout()) doivent correspondre exactement a une colonne existante, qui est alors supprimee."
    ], exemple: "v~c(2,3,2,5)\nv.supri(2,3)     ->   reste c(2,5)\nv~c(|rea|,|r|,|e|)\nv.supri(|rea|)   ->   reste c(|r|,|e|)\nv.supri(v[1])    ->   supprime la valeur en 1ere position" },

  { noms: ["+"], categorie: "Operateurs", syntaxe: "a + b", description: [
      "Additionne deux nombres, deux vecteurs (element par element) ou deux matrices (element par element, memes dimensions).",
      "Un nombre seul est ajoute a chaque element si on l'additionne avec un vecteur ou une matrice."
    ], exemple: "c(1,2,3) + c(10,20,30)   ->   [1] 11 22 33" },
  { noms: ["-"], categorie: "Operateurs", syntaxe: "a - b", description: [
      "Soustrait deux nombres, deux vecteurs ou deux matrices, meme principe que +."
    ], exemple: "c(10,20,30) - c(1,2,3)   ->   [1] 9 18 27" },
  { noms: ["*"], categorie: "Operateurs", syntaxe: "a * b", description: [
      "Multiplie deux nombres.",
      "Ne fonctionne pas encore sur les vecteurs/matrices (utilise . , × ou .. pour ceux-la)."
    ], exemple: "3 * 4   ->   12" },
  { noms: ["/"], categorie: "Operateurs", syntaxe: "a / b", description: [
      "Divise deux nombres."
    ], exemple: "10 / 4   ->   2.5" },
  { noms: ["%"], categorie: "Operateurs", syntaxe: "a % b", description: [
      "Renvoie le reste de la division entiere de a par b."
    ], exemple: "7 % 2   ->   1" },
  { noms: ["."], categorie: "Operateurs", syntaxe: "v1 . v2", description: [
      "Calcule le produit scalaire entre deux vecteurs de meme taille.",
      "Multiplie les elements un par un puis additionne le tout : le resultat est un seul nombre."
    ], exemple: "c(1,2,3) . c(4,5,6)   ->   32" },
  { noms: ["×"], categorie: "Operateurs", syntaxe: "v1 × v2", description: [
      "Calcule le produit vectoriel entre deux vecteurs.",
      "Fonctionne uniquement pour des vecteurs de taille 3 (comme en geometrie dans l'espace)."
    ], exemple: "c(1,0,0) × c(0,1,0)   ->   [1] 0 0 1" },
  { noms: [".."], categorie: "Operateurs", syntaxe: "m1 .. m2", description: [
      "Multiplie deux matrices selon les regles du produit matriciel (pas element par element).",
      "Le nombre de colonnes de m1 doit etre egal au nombre de lignes de m2."
    ], exemple: "m1 .. m2" },
  { noms: ["^"], categorie: "Operateurs", syntaxe: "a ^ b", description: [
      "Puissance : a a la puissance b.",
      "Fonctionne aussi element par element sur les vecteurs et les matrices, avec recyclage comme + et -."
    ], exemple: "2 ^ 3   ->   8\nc(1,2,3) ^ 2   ->   [1] 1 4 9" },

  { noms: ["ENTI"], categorie: "Operateurs", syntaxe: "a ENTI b", description: [
      "Division entiere : divise a par b et ne garde que la partie entiere (arrondi vers le bas).",
      "Fonctionne aussi element par element sur les vecteurs et les matrices."
    ], exemple: "7 ENTI 2   ->   3\nc(7,9,11) ENTI 2   ->   [1] 3 4 5" },
  { noms: ["MOD"], categorie: "Operateurs", syntaxe: "a MOD b", description: [
      "Renvoie le reste de la division entiere de a par b (equivalent a %).",
      "Fonctionne aussi element par element sur les vecteurs et les matrices."
    ], exemple: "7 MOD 2   ->   1\nc(7,9,11) MOD 2   ->   [1] 1 1 1" },
  { noms: ["dan"], categorie: "Operateurs", syntaxe: "var1 dan var2", description: [
      "Teste si var1 se trouve dans var2.",
      "Si var2 est un vecteur ou une matrice : renvoie un vecteur/une matrice de VRAI/FAUX, un par position (comme %in% en R), pour reperer a quelle(s) position(s) var1 se trouve.",
      "Si var2 est une suite de caracteres (texte) : renvoie un simple VRAI/FAUX selon que var1 apparait comme sous-chaine dans var2.",
      "var1 doit etre une valeur simple (pas un vecteur/une matrice).",
      "Utilise dans si(...), VRAI si var1 se trouve a au moins une position."
    ], exemple: "2 dan c(2,3,4)   ->   [1] VRAI FAUX FAUX\n|mot| dan |un mot|   ->   VRAI" },

  { noms: ["==", "!=", "<", ">", "<=", ">="], categorie: "Operateurs", syntaxe: "a == b  /  a != b  /  a < b  /  a > b  /  a <= b  /  a >= b", description: [
      "Compare deux valeurs et renvoie VRAI ou FAUX.",
      "== egalite, != difference, < strictement inferieur, > strictement superieur, <= inferieur ou egal, >= superieur ou egal.",
      "Fonctionne aussi element par element sur les vecteurs et les matrices (renvoie alors un vecteur/une matrice de VRAI/FAUX), avec recyclage comme + et -."
    ], exemple: "3 == 3   ->   VRAI\nc(1,2,3) > 2   ->   [1] FAUX FAUX VRAI" },
  { noms: ["et", "ou", "non"], categorie: "Operateurs", syntaxe: "condition1 et condition2  /  condition1 ou condition2  /  non condition", description: [
      "Combine ou inverse des conditions booleennes.",
      "et : VRAI seulement si les deux conditions sont vraies.",
      "ou : VRAI si au moins une des deux conditions est vraie.",
      "non : inverse une condition (VRAI devient FAUX et inversement). S'applique a toute la",
      "comparaison qui suit : non x>5 equivaut a non(x>5), pas a (non x)>5.",
      "et/ou sont COURT-CIRCUITES (comme en Python/JS/C) : la partie droite n'est evaluee que",
      "si elle est necessaire pour determiner le resultat. Utile pour se proteger d'une erreur :",
      "x!=0 et 10/x>2 ne divise jamais par zero, meme si x vaut 0, car et s'arrete des que",
      "x!=0 est FAUX sans jamais evaluer 10/x.",
      "Utilises typiquement dans si(...), tanqer(...), sision(...)."
    ], exemple: "si(x>0 et x<10){ affi(|entre 0 et 10|) }\nsi(jour==|samedi| ou jour==|dimanche|){ affi(|weekend|) }\nsi(non estVide){ affi(|il y a des elements|) }\nsi(x!=0 et 10/x>2){ affi(|sans risque de division par zero|) }" },

  { noms: ["sin"], categorie: "Fonctions mathematiques", syntaxe: "sin(x)", description: [
      "Sinus de x (x en radians).",
      "Fonctionne aussi element par element si x est un vecteur ou une matrice."
    ], exemple: "sin(0)   ->   0\nsin(c(0, 1.5708))   ->   [1] 0 1" },
  { noms: ["cos"], categorie: "Fonctions mathematiques", syntaxe: "cos(x)", description: [
      "Cosinus de x (x en radians).",
      "Fonctionne aussi element par element si x est un vecteur ou une matrice."
    ], exemple: "cos(0)   ->   1" },
  { noms: ["exp"], categorie: "Fonctions mathematiques", syntaxe: "exp(x)", description: [
      "Exponentielle de x (e a la puissance x).",
      "Fonctionne aussi element par element si x est un vecteur ou une matrice."
    ], exemple: "exp(0)   ->   1\nexp(1)   ->   2.718..." },
  { noms: ["ln"], categorie: "Fonctions mathematiques", syntaxe: "ln(x)", description: [
      "Logarithme neperien (base e) de x. x doit etre strictement positif.",
      "Fonctionne aussi element par element si x est un vecteur ou une matrice."
    ], exemple: "ln(1)   ->   0\nln(exp(1))   ->   1" },
  { noms: ["pusan"], categorie: "Fonctions mathematiques", syntaxe: "pusan(a,b)", description: [
      "Calcule a a la puissance b (equivalent a a^b, en version fonction).",
      "b peut etre negatif, rationnel/decimal, etc. Utile quand a ou b sont eux-memes des expressions ou resultats de fonctions.",
      "Fonctionne aussi element par element si a ou b est un vecteur ou une matrice (memes regles que l'operateur ^)."
    ], exemple: "pusan(2,3)     ->   8\npusan(2,-1)    ->   0.5\npusan(9,0.5)   ->   3" },
  { noms: ["racine"], categorie: "Fonctions mathematiques", syntaxe: "racine(x)  ou  racineN(x)", description: [
      "racine(x) calcule la racine carree de x (equivalent a racine2(x)).",
      "racineN(x), avec N un nombre (racine3, racine4, racine10, ...), calcule la racine N-ieme de x.",
      "Fonctionne aussi element par element sur un vecteur ou une matrice.",
      "Une racine d'indice impair est definie pour un nombre negatif (ex: racine3(-8) = -2) ; une racine d'indice pair non."
    ], exemple: "racine(9)     ->   3\nracine3(8)    ->   2\nracine3(-8)   ->   -2" },

  { noms: ["VRAI", "FAUX"], categorie: "Constantes", syntaxe: "VRAI / FAUX", description: [
      "Les deux seules valeurs booleennes (vrai / faux) du langage.",
      "Utiles dans les conditions (si, tanqer) et pour le parametre parlig de matrice()."
    ], exemple: "si(3>2){ affi(VRAI) }" },

  { noms: ["pasdefini"], categorie: "Constantes", syntaxe: "pasdefini", description: [
      "La valeur \"pas definie\" du langage (comme VRAI/FAUX, mais pour l'absence de valeur).",
      "C'est ce que renvoie un retour sans valeur (ou l'absence de retour) dans une fonction perso.",
      "Utilisable dans une comparaison : si(x == pasdefini){ ... }."
    ], exemple: "fonc f(){ retour }\nf()   ->   pasdefini" },

  { noms: ["DIVISION_ZERO", "FICHIER_INTROUVABLE", "FICHIER_DEJA_EXISTANT", "FICHIER_INVALIDE",
      "CLE_INTROUVABLE", "VARIABLE_INCONNUE", "FONCTION_INCONNUE", "ATTRIBUT_INCONNU",
      "INDEX_HORS_LIMITE", "TYPE_INVALIDE", "RECURSION_MAX", "PERMISSION_REFUSEE",
      "INDISPONIBLE_HORS_APP", "SYNTAXE"], categorie: "Constantes",
    syntaxe: "DIVISION_ZERO / FICHIER_INTROUVABLE / ... (voir description)", description: [
      "Les codes d'erreur du langage (comme VRAI/FAUX) : s'ecrivent sans guillemets |...|.",
      "Utilises avec essai{...} attrape(msg, code){...} pour reagir differemment selon la cause d'une erreur interceptee, sans comparer le texte du message.",
      "Chaque constante vaut son propre nom en texte : code==DIVISION_ZERO compare deux textes identiques.",
      "Combinables avec l'operateur ou : si(code==FICHIER_INTROUVABLE ou code==CLE_INTROUVABLE){ ... }.",
      "SYNTAXE est le code generique recu pour toute erreur non couverte par les 13 autres (syntaxe, mauvais nombre/type d'argument...)."
    ], exemple: "essai { x ~ 10 / 0 }\nattrape(msg, code) {\n    si(code == DIVISION_ZERO){ affi(|Division par zero evitee|) }\n}" },

  { noms: ["saulig"], categorie: "Constantes", syntaxe: "affi(..., saulig, ...)  /  ecrire.cle(cle, ..., saulig, ...)  /  c(..., saulig, ...)", description: [
      "Saut de ligne : un texte contenant un seul caractere retour a la ligne.",
      "Dans affi()/entr(), insere un retour a la ligne a cet endroit dans le message affiche/demande.",
      "Utilisable aussi comme valeur ordinaire partout ou une valeur brute est attendue : ecrire.cle(...), ecrire.fichier(...), ajout.cle(...), ajout.fichier(...), c(...), liste(...), matrice(...).",
      "Doit toujours apparaitre SEUL comme argument (jamais colle a l'interieur d'un |texte|, sinon ce n'est plus reconnu -- ce serait alors juste le mot 'saulig' litteral).",
      "Pour une ligne vide toute seule dans affi(), on peut aussi ecrire affi(||) ou affi( | |)."
    ], exemple: "affi(|Programme de calcul|, saulig, |----------|)\necrire.cle(|notes|, |Titre|, saulig, |Sous-titre|)   ** liste() : \"Titre\", \"\\n\", \"Sous-titre\" **" },

  { noms: ["conver.ms.ms", "conver.ms.seconde", "conver.ms.minute", "conver.ms.heure", "conver.ms.jour", "conver.seconde.ms", "conver.seconde.seconde", "conver.seconde.minute", "conver.seconde.heure", "conver.seconde.jour", "conver.minute.ms", "conver.minute.seconde", "conver.minute.minute", "conver.minute.heure", "conver.minute.jour", "conver.heure.ms", "conver.heure.seconde", "conver.heure.minute", "conver.heure.heure", "conver.heure.jour", "conver.jour.ms", "conver.jour.seconde", "conver.jour.minute", "conver.jour.heure", "conver.jour.jour", "conver.octet.octet", "conver.octet.Ko", "conver.octet.Mo", "conver.octet.Go", "conver.octet.Tera", "conver.Ko.octet", "conver.Ko.Ko", "conver.Ko.Mo", "conver.Ko.Go", "conver.Ko.Tera", "conver.Mo.octet", "conver.Mo.Ko", "conver.Mo.Mo", "conver.Mo.Go", "conver.Mo.Tera", "conver.Go.octet", "conver.Go.Ko", "conver.Go.Mo", "conver.Go.Go", "conver.Go.Tera", "conver.Tera.octet", "conver.Tera.Ko", "conver.Tera.Mo", "conver.Tera.Go", "conver.Tera.Tera"], categorie: "Base", syntaxe: "conver.source.cible(valeur)", description: [
      "Convertit une valeur d'une unite vers une autre avec la forme generale conver.source.cible(valeur).",
      "Temps : ms, seconde, minute, heure, jour. La seconde est l'unite de reference : conver.minute.seconde(5) -> 300 ; conver.ms.seconde(500) -> 0.5 ; conver.jour.heure(1) -> 24.",
      "Tailles : octet, Ko, Mo, Go, Tera. Les conversions sont binaires : 1 Ko = 1024 octets, 1 Mo = 1024 Ko, 1 Go = 1024 Mo, 1 Tera = 1024 Go.",
      "Les conversions peuvent aussi etre faites dans l'autre sens : conver.seconde.heure(3600) -> 1 ; conver.seconde.ms(1) -> 1000 ; conver.Mo.Ko(1) -> 1024.",
      "La valeur doit etre un nombre positif ou nul. Le resultat peut etre fractionnaire (pas d'arrondi, meme quand ca ne tombe pas juste, ex: conver.ms.jour(...))."
    ], exemple: "conver.minute.seconde(5)  ->  300\nconver.heure.seconde(2)    ->  7200\nconver.ms.seconde(500)     ->  0.5\nconver.seconde.heure(3600)  ->  1\nconver.jour.heure(1)       ->  24\nconver.octet.Ko(1024)      ->  1\nconver.Mo.Ko(1)            ->  1024" },
  { noms: ["conver.ms.date", "conver.date.ms"], categorie: "Base", syntaxe: "conver.ms.date(valeur)  /  conver.date.ms(texte)", description: [
      "conver.ms.date(valeur) : convertit un horodatage brut en millisecondes (epoch, ex: celui renvoye par temps()) en date/heure lisible, meme format que date() : \"JJ/MM/AAAA HH:MM:SS\". La valeur doit etre un nombre positif ou nul.",
      "conver.date.ms(texte) : l'inverse -- convertit un texte \"JJ/MM/AAAA HH:MM:SS\" en horodatage brut en millisecondes. Format STRICT : erreur directe si le texte n'est pas exactement dans ce format ou si la date n'existe pas dans le calendrier (ex: 31/02/2026), sans tentative de correction."
    ], exemple: "conver.ms.date(0)  ->  |01/01/1970 01:00:00|\nconver.date.ms(|01/01/1970 01:00:00|)  ->  0" },
  { noms: ["texte"], categorie: "Texte", syntaxe: "texte(a, b, ...)", description: [
      "Concatene plusieurs parties en UN SEUL texte, exactement comme les arguments de affi()/entr()/~ (avec |texte| et saulig pour un saut de ligne).",
      "Contrairement a affi(), ne s'affiche pas : renvoie le texte concatene comme une valeur, utilisable dans une expression.",
      "Utile pour construire un texte a passer en UN SEUL argument a ecrire.cle(...), ecrire.fichier(...) ou ajout.cle(...) -- qui, eux, rangent chaque argument separe par une virgule comme un element distinct d'une liste() plutot que de les coller ensemble."
    ], exemple: "ligne ~ texte(|+ Depot: |, montant, | F|, saulig)\necrire.fichier(|/sdcard/historique.mld|, h + ligne)" },

  { noms: ["miniscul", "majuscul", "suprespac"], categorie: "Texte", syntaxe: "var.miniscul()  /  var.majuscul()  /  var.suprespac()", description: [
      "miniscul() convertit le texte contenu dans var en minuscules.",
      "majuscul() convertit le texte contenu dans var en majuscules.",
      "suprespac() supprime les espaces au debut et a la fin du texte.",
      "Les parentheses peuvent contenir un espace : var.miniscul( ), var.majuscul( ) ou var.suprespac( ).",
      "Les commandes peuvent etre enchainees dans l'ordre : var.miniscul().suprespac() ou var.majuscul().suprespac()."
    ], exemple: "nom~|  BONJOUR  |\nnom.miniscul().suprespac()\naffi(nom)   ->   bonjour" },

  { noms: ["effa"], categorie: "Console", syntaxe: "effa()  ou  effa(nom1, nom2, ...)", description: [
      "effa() : sert a effacer les choses ecrites dans la console.",
      "effa(nom1, nom2, ...) : sert a effacer seulement en memoire nom1, nom2, ... s'ils existent en memoire."
    ], exemple: "effa()        ->   efface toute la console\neffa(a, e)    ->   supprime les variables a et e" },
  { noms: ["voi"], categorie: "Console", syntaxe: "voi()  ou  voi(nom1, nom2, ...)", description: [
      "voi() : sert a voir les noms de tout ce qui est actuellement stocker en memoire.",
      "voi(nom1, nom2, ...) : sert a voir si nom1, nom2, ... sont stocker en memoire."
    ], exemple: "voi()         ->   liste tous les elements stocker\nvoi(a, e)     ->   Oui, a et e sont stocker." },
  { noms: ["temps"], categorie: "Console", syntaxe: "temps()", description: [
      "Renvoie le nombre de millisecondes ecoulees depuis une origine fixe (comme Date.now() en JS).",
      "N'a de sens que par difference entre deux appels : sert a chronometrer une portion de code (ex: une boucle)."
    ], exemple: "t1~temps()\npou(i,1,1000,1){ x~i*i }\nt2~temps()\naffi(t2-t1, |ms|)" },

  { noms: ["date"], categorie: "Console", syntaxe: "date()", description: [
      "Renvoie la date et l'heure ACTUELLES, lisibles, sous forme de texte \"JJ/MM/AAAA HH:MM:SS\".",
      "Contrairement a temps() (millisecondes brutes, utile seulement par difference entre deux",
      "appels), date() donne une date/heure directement lisible et affichable."
    ], exemple: "affi(|Execute le |, date())   ->   Execute le 13/09/2026 10:08:32" },

  { noms: ["datejour"], categorie: "Console", syntaxe: "datejour()", description: [
      "Renvoie uniquement la DATE actuelle (sans l'heure), sous forme de texte \"JJ/MM/AAAA\"."
    ], exemple: "affi(datejour())   ->   13/09/2026" },

  { noms: ["heure"], categorie: "Console", syntaxe: "heure()", description: [
      "Renvoie uniquement l'HEURE actuelle (sans la date), sous forme de texte \"HH:MM:SS\"."
    ], exemple: "affi(heure())   ->   10:08:32" },

  { noms: ["date.annee", "date.mois", "date.jour", "date.jourSemaine", "date.heure", "date.minute", "date.seconde"],
    categorie: "Console", syntaxe: "date.annee()  /  date.mois()  /  date.jour()  /  date.jourSemaine()  /  date.heure()  /  date.minute()  /  date.seconde()", description: [
      "Composants NUMERIQUES de la date/heure actuelle, pour faire des calculs et des",
      "comparaisons -- contrairement a date()/datejour()/heure(), qui sont du texte pense pour",
      "l'affichage seulement.",
      "date.jourSemaine() : 1=lundi, 2=mardi, ..., 7=dimanche (norme francaise/ISO)."
    ], exemple: "si(date.jourSemaine()==1){ affi(|C'est lundi|) }\nsi(date.heure()>=18){ affi(|Soiree|) }" },

  { noms: ["attendre"], categorie: "Controle", syntaxe: "attendre(secondes)", description: [
      "Suspend l'execution du script pendant le nombre de secondes donne (peut etre",
      "fractionnaire, ex: attendre(0.5) pour une demi-seconde), sans bloquer l'appli et sans",
      "consommer le processeur pendant l'attente.",
      "Interrompable par le bouton Stop meme pendant une longue attente."
    ], exemple: "affi(|Debut|)\nattendre(2)\naffi(|2 secondes plus tard|)" },

  { noms: ["secondesJusquaProchain"], categorie: "Controle", syntaxe: "secondesJusquaProchain(jourSemaine, heure, minute)", description: [
      "Calcule le nombre de secondes a attendre avant la PROCHAINE occurrence du jour de",
      "semaine (1=lundi..7=dimanche) et de l'heure:minute donnes. Si le moment cible est deja",
      "passe (ou en cours) aujourd'hui, calcule jusqu'a la semaine suivante.",
      "Concu pour etre combine avec attendre() : declenche une action exactement une fois par",
      "occurrence, sans boucle active ni drapeau de deduplication.",
      "Limite : ne fonctionne que pendant que le script tourne activement (voir planifier()",
      "pour un rappel fiable meme app fermee)."
    ], exemple: "tanqer(VRAI){\n    attendre(secondesJusquaProchain(1, 9, 0))\n    affi(|Lundi 9h : debut de semaine|)\n}" },

  { noms: ["planifier", "annuler.planifier", "planifier.liste", "annuler.planifier.parMessage", "annuler.tout.planifier"], categorie: "Controle", syntaxe: "planifier(jourSemaine, heure, minute, message)  /  annuler.planifier(jourSemaine, heure, minute)  /  planifier.liste()  /  annuler.planifier.parMessage(texte)  /  annuler.tout.planifier()", description: [
      "Programme une VRAIE alarme systeme Android pour la prochaine occurrence du jour de",
      "semaine (1=lundi..7=dimanche) et de l'heure:minute donnes, qui affichera \"message\" en",
      "notification a ce moment-la -- MEME SI L'APP EST FERMEE, et meme apres un redemarrage",
      "du telephone. Se re-programme automatiquement chaque semaine.",
      "Contrairement a attendre()/secondesJusquaProchain(), planifier() NE BLOQUE PAS : le",
      "script continue immediatement apres, et peut meme se terminer -- l'alarme vit dans le",
      "systeme, pas dans le script.",
      "Appeler planifier() une 2e fois sur le meme jour/heure/minute remplace le message.",
      "annuler.planifier(jourSemaine, heure, minute) annule une alarme programmee sur ce",
      "creneau, et renvoie VRAI si elle existait vraiment (FAUX si le creneau donne n'etait",
      "pas programme -- rien n'est alors annule).",
      "planifier.liste() renvoie toutes les alarmes actuellement programmees, sous forme de",
      "liste de liste(jourSemaine, heure, minute, message) -- pratique pour retrouver un",
      "creneau exact avant de l'annuler, sans avoir a le connaitre par coeur.",
      "annuler.planifier.parMessage(texte) annule directement toutes les alarmes dont le",
      "message est exactement \"texte\" (il peut y en avoir plusieurs, sur des creneaux",
      "differents) -- renvoie le nombre d'alarmes annulees.",
      "annuler.tout.planifier() annule d'un coup TOUTES les alarmes programmees -- renvoie",
      "le nombre d'alarmes annulees.",
      "Necessite l'app native (indisponible dans l'apercu Chrome) et demande les permissions",
      "notifications + alarme exacte au premier appel si besoin (a accorder puis relancer)."
    ], exemple: "planifier(1, 9, 0, |Lundi 9h : debut de semaine|)\naffi(|Alarme programmee, je continue mon travail|)\n\npou(a dan planifier.liste()){\n    affi(a[0], |/|, a[1], |:|, a[2], | - |, a[3])\n}\n\nn~annuler.planifier.parMessage(|Reunion|)\naffi(n, | alarme(s) annulee(s)|)" },

  { noms: ["arreter.service.arriere"], categorie: "Controle", syntaxe: "arreter.service.arriere()", description: [
      "Arrete le service qui execute les scripts en arriere-plan (celui lance automatiquement a l'ouverture de l'app, utilise par le bouton FOND).",
      "Appelee dans un script lance via FOND (donc en train de tourner DANS le service) : ne fait que demander l'arret. Le script continue normalement jusqu'a sa fin naturelle -- le service s'arrete SEULEMENT APRES, une fois le resultat publie. Si le script plante avant cette ligne, le service reste actif.",
      "Appelee depuis l'editeur (script lance localement avec RUN, pas via FOND) : arrete le service immediatement.",
      "Ne prend aucun argument, ne renvoie rien d'utile."
    ], exemple: "** dans un script envoye au service (bouton FOND) :\naffi(|traitement termine|)\narreter.service.arriere()\n** le service s'arrete juste apres avoir publie ce resultat" },
  { noms: ["envoyer.notif"], categorie: "Controle", syntaxe: "envoyer.notif(...)", description: [
      "Affiche immediatement une notification systeme Android contenant le message donne.",
      "Comme affi(), plusieurs elements separes par une virgule (,) peuvent etre combines dans le message.",
      "La notification reste visible meme apres la fin du script et peut etre touchee pour",
      "rouvrir MonLangage.",
      "Renvoie VRAI si Android accepte la notification, FAUX sinon.",
      "Necessite l'application native et, sur Android 13+, l'autorisation d'afficher des",
      "notifications (demandee automatiquement au premier appel si besoin)."
    ], exemple: "envoyer.notif(|Nouveau message recu|)\nenvoyer.notif(|Score :|, score, |points|)" },

  { noms: ["connexion.disponible", "type.connexion"], categorie: "Controle", syntaxe: "connexion.disponible()  /  type.connexion()", description: [
      "connexion.disponible() : VRAI si une connexion internet (wifi ou data mobile) est",
      "active MAINTENANT, FAUX sinon. Ne surveille rien en arriere-plan -- a verifier dans",
      "une boucle (tanqer/attendre) si tu veux reagir a un changement de connexion.",
      "type.connexion() : \"wifi\", \"mobile\", \"ethernet\", \"autre\" ou \"aucune\".",
      "Necessite l'app native, aucune permission a accorder."
    ], exemple: "tanqer VRAI{\n    si(connexion.disponible()){\n        affi(|Connecte en |, type.connexion())\n        stop\n    }\n    attendre(5)\n}" },

  { noms: ["niveau.batterie", "batterie.encharge"], categorie: "Controle", syntaxe: "niveau.batterie()  /  batterie.encharge()", description: [
      "niveau.batterie() : pourcentage de batterie restant, de 0 a 100.",
      "batterie.encharge() : VRAI si le telephone est en train de charger (cable ou sans",
      "fil) ou deja completement charge.",
      "Necessite l'app native, aucune permission a accorder."
    ], exemple: "si(niveau.batterie() < 20 et non batterie.encharge()){\n    affi(|Pense a charger le telephone|)\n}" },

  { noms: ["dossier.liste"], categorie: "Sauvegarde", syntaxe: "dossier.liste()  ou  dossier.liste(dossier)", description: [
      "Liste les NOMS de TOUS les fichiers d'un dossier (contrairement a voir.fichier(), pas",
      "seulement les .mld). Sans argument, utilise le dossier racine du stockage de",
      "l'appareil. Utile pour detecter l'apparition d'un nouveau fichier, en comparant deux",
      "appels successifs a intervalle regulier (tanqer/attendre).",
      "Necessite l'app native et la permission de stockage (comme voir.fichier())."
    ], exemple: "avant ~ dossier.liste(|/sdcard/Download|)\ntanqer VRAI{\n    attendre(10)\n    maintenant ~ dossier.liste(|/sdcard/Download|)\n    pou(f dan maintenant){\n        si(non (f dan avant)){ affi(|Nouveau fichier : |, f) }\n    }\n    avant ~ maintenant\n}" },

  { noms: ["sms.recus", "envoyer.sms"], categorie: "Controle", syntaxe: "sms.recus(depuisSecondes)  /  envoyer.sms(numero, message)", description: [
      "sms.recus(depuisSecondes) : liste des SMS recus au cours des \"depuisSecondes\"",
      "dernieres secondes, chacun en liste(numero, message, dateHeure) -- dateHeure deja",
      "lisible (\"JJ/MM/AAAA HH:MM:SS\", meme format que date()), le plus recent en premier.",
      "liste() vide si aucun. Ne surveille rien en arriere-plan -- a verifier dans une",
      "boucle (tanqer/attendre) si tu veux reagir a un SMS recu.",
      "envoyer.sms(numero, message[, sim]) : envoie un SMS et attend la confirmation reelle (jusqu'a 15s) que le message est bien parti -- renvoie VRAI seulement si le systeme confirme l'envoi, FAUX sinon (echec ou delai depasse). sim est optionnel : 1 ou 2 pour choisir directement la SIM (demande la permission d'etat telephone au besoin) ; sans sim, utilise la SIM par defaut du telephone. Les messages longs sont automatiquement",
      "decoupes en plusieurs parties, recus comme un seul message chez le destinataire).",
      "Necessite l'app native et les permissions de lecture/envoi de SMS -- les demande",
      "automatiquement si besoin (a accorder puis relancer le script). Android peut",
      "demander une confirmation supplementaire si trop de SMS partent d'un coup vers trop",
      "de destinataires differents en peu de temps (protection systeme anti-spam)."
    ], exemple: "pou(msg dan sms.recus(60)){\n    si(msg[1] == |stop|){\n        envoyer.sms(msg[0], |Bien recu, arret confirme.|)\n    }\n}" },

  { noms: ["ouvrir.whatsapp", "messenger.ouvrir"], categorie: "Controle", syntaxe: "ouvrir.whatsapp()  /  ouvrir.whatsapp(numero, message)  /  messenger.ouvrir(destinataire, message)", description: [
      "ouvrir.whatsapp() ouvre simplement WhatsApp. ouvrir.whatsapp(numero, message) ouvre la conversation avec le numero et pre-remplit le message. messenger.ouvrir(destinataire, message) ouvre Messenger avec le texte pre-rempli.",
      "rempli dans le champ de saisie. IMPORTANT : Android n'autorise pas une app tierce a",
      "appuyer sur Envoyer a la place de l'utilisateur dans une autre app -- contrairement a",
      "envoyer.sms(), c'est donc un RACCOURCI (l'app s'ouvre pretes a envoyer), pas un envoi",
      "automatique complet.",
      "ouvrir.whatsapp : destinataire = numero de telephone avec indicatif pays (ex:",
      "33612345678, sans le 0 initial).",
      "messenger.ouvrir : destinataire = NOM D'UTILISATEUR Facebook (pas un numero -- Messenger",
      "n'identifie pas les gens par numero comme WhatsApp).",
      "Necessite l'app native et une connexion internet (verifiable avant avec",
      "connexion.disponible())."
    ], exemple: "si(connexion.disponible()){\n    ouvrir.whatsapp(|33612345678|, |Salut !|)\n} sinon {\n    envoyer.sms(|33612345678|, |Salut !|)\n}" },

  { noms: ["partager.fichier"], categorie: "Sauvegarde", syntaxe: "partager.fichier(chemin)", description: [
      "Ouvre le selecteur de partage standard Android (Bluetooth, email, Drive, n'importe",
      "quelle app acceptant un fichier) pour ce fichier -- PAS specifique a une messagerie,",
      "c'est le meme selecteur \"Partager\" que dans n'importe quelle app Android.",
      "Erreur si le fichier n'existe pas a ce chemin (verifiable avant avec",
      "existe.fichier(...)).",
      "Necessite l'app native et la permission de stockage."
    ], exemple: "partager.fichier(|/sdcard/Download/rapport.pdf|)" },

  { noms: ["taille.fichier"], categorie: "Sauvegarde", syntaxe: "taille.fichier(chemin)", description: [
      "Taille du fichier en OCTETS. Erreur si le fichier n'existe pas a ce chemin",
      "(verifiable avant avec existe.fichier(...)).",
      "Necessite l'app native et la permission de stockage."
    ], exemple: "affi(taille.fichier(|/sdcard/Download/rapport.pdf|) / 1000, | Ko|)" },

  { noms: ["trac"], categorie: "Graphique", syntaxe: "trac(x, y, ...)  ou  trac(y, ...)", description: [
      "Trace une courbe dans la console, sous forme d'image (canvas) — comme plot(x,y) en Scilab.",
      "Les points doivent d'abord etre calcules (avec une boucle pou, ou une expression vectorielle comme y~x*x), puis on appelle trac.",
      "trac(x, y) : trace le vecteur y en fonction du vecteur x (memes longueurs).",
      "trac(y) : trace le vecteur y en fonction de sa position (1, 2, 3...).",
      "Par defaut, la grille n'est pas affichee (comme en Scilab) : utilise grille() pour l'activer.",
      "Options facultatives (a la suite, dans n'importe quel ordre) : couleur~|...|, type~|...|, titre~|...|, xlab~|...|, ylab~|...|.",
      "couleur (comme en Scilab, mais en francais) : r=rouge, v=vert, b=bleu (par defaut), n=noir, j=jaune, m=magenta, c=cyan, bl=blanc. On peut aussi mettre un code hexadecimal, ex: couleur~|#ff00aa|.",
      "type : |-| pour un trait continu (par defaut), |o| pour des points."
    ], exemple: "x ~ seq(-5,5,0.1)\ny ~ x*x\ntrac(x, y, couleur~|r|, type~|-|, titre~|Ma courbe|)" },

  { noms: ["grille"], categorie: "Graphique", syntaxe: "grille()  ou  grille(FAUX)", description: [
      "Active ou desactive la grille sur le dernier graphique trace avec trac(...) — comme xgrid() en Scilab.",
      "grille() : active la grille (par defaut, elle n'est pas affichee).",
      "grille(FAUX) : desactive la grille.",
      "Doit etre appelee apres trac(...)."
    ], exemple: "x ~ seq(-5,5,0.1)\ny ~ x*x\ntrac(x, y)\ngrille()" },

  { noms: ["import"], categorie: "Modules", syntaxe: "import(module)  ou  import(module, sunom~alias)  ou  import(|chemin.mlg|)", description: [
      "Charge un fichier .mlg comme module : ses fonctions/classes/variables de premier niveau deviennent accessibles via module.nom (module.fonction(), module.Classe(), module.variable).",
      "module identifiant nu (sans extension) : cherche module.mlg dans le meme dossier que le script courant.",
      "|chemin.mlg| (texte litteral) : chemin explicite, absolu si commence par /, sinon relatif au dossier du script.",
      "sunom~alias (optionnel) : accede au module sous un autre nom que celui par defaut (utile en cas de conflit).",
      "Un module ne peut pas lui-meme importer un autre module (limitation actuelle).",
